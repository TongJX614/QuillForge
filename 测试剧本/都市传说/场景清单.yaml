scenes:
  - name: "末班车站台"
    location: "城北地铁站，B2层站台"
    time: "深夜 23:30"
    atmosphere: "空旷冷清，白色日光灯嗡嗡作响，远处传来隧道里的风声"
    description: |
      午夜的地铁站几乎没有乘客。站台上的电子显示屏闪烁着"末班车 23:44 到达"的字样。
      四根水泥柱投下长长的阴影，空气中弥漫着消毒水和铁锈混合的气味。
      墙角有一台老旧的自动售货机，屏幕发出幽蓝的光。
      站台尽头的隧道口黑洞洞的，偶尔有老鼠窜过的声响。
    characters_present:
      - "shen_yue"
      - "lu_chen"
      - "zhao_wanqing"
      - "fang_guo"
    plot_hook: "四人各怀心事在此等候末班车，彼此打量，气氛微妙"

  - name: "幽灵站点"
    location: "地铁隧道深处，编号'-1'的不存在站点"
    time: "深夜 23:44（时间似乎停滞了）"
    atmosphere: "诡异的寂静，灯光忽明忽暗，空气中有一股淡淡的檀香味"
    description: |
      列车在经过一段异常漫长的隧道后，缓缓停靠在一个所有人都没见过的站台。
      站台样式像是上世纪90年代的装潢——绿色瓷砖墙面、老式铸铁长椅、
      墙上挂着泛黄的线路图，但站名那一栏被涂黑了。
      站台上空无一人，但地面有新鲜的脚印，像是刚有人走过。
      站台尽头有一扇生锈的铁门，门缝里透出微弱的暖光。
    characters_present:
      - "shen_yue"
      - "lu_chen"
      - "zhao_wanqing"
      - "fang_guo"
    plot_hook: "列车门打开，四人面临选择：下车探索，还是留在车上等待"

  - name: "塌方旧道"
    location: "幽灵站点铁门后，三十年前的废弃隧道"
    time: "时间不明，感觉像是深夜"
    atmosphere: "潮湿压抑，墙壁渗水，远处有断断续续的敲击声"
    description: |
      穿过铁门后是一条狭窄的旧隧道，明显比现代地铁隧道窄得多。
      墙壁上有手工凿刻的痕迹，还残留着90年代的施工标记。
      地面散落着生锈的工具和一顶褪色的安全帽，安全帽上写着"周"字。
      隧道深处传来规律的敲击声——像是有人在用铁锤敲墙，三短一长，三短一长。
      方国的脸色变得惨白，他认出了这段隧道。
    characters_present:
      - "shen_yue"
      - "lu_chen"
      - "zhao_wanqing"
      - "fang_guo"
    plot_hook: "方国认出这是当年塌方的区域，真相开始浮出水面"

  - name: "红裙之舞"
    location: "废弃隧道尽头，一个被遗忘的地下空间"
    time: "永远的午夜"
    atmosphere: "诡异而凄美，空间中央有一束光柱，四周回荡着若有若无的音乐"
    description: |
      隧道尽头是一个意想不到的宽敞空间，像是被人刻意扩挖过。
      穹顶很高，中央从上方通风口射入一缕月光，形成一道苍白的光柱。
      光柱中央，一个穿红色舞裙的身影正在无声地旋转、跳跃——
      她的舞姿优美得令人心碎，但脚下没有影子。
      四周墙壁上贴满了泛黄的舞蹈海报和照片，全是同一个女人的面孔。
      地面上用红漆写着歪歪扭扭的字："我想回家"。
    characters_present:
      - "shen_yue"
      - "lu_chen"
      - "zhao_wanqing"
      - "fang_guo"
    plot_hook: "红裙女人的身份揭晓——她既是当年被困的女工，也是热爱舞蹈的人，所有人必须做出最终选择"

  - name: "黎明抉择"
    location: "地下空间，出口即将关闭"
    time: "凌晨 05:00（地铁首班车即将发车）"
    atmosphere: "紧迫感，隧道开始震动，远处传来列车启动的轰鸣"
    description: |
      地下空间开始轻微震动，灰尘簌簌落下。陆沉的手机突然恢复信号，
      显示首班车将在30分钟后发出，如果现在不离开，他们将被困在这里直到72小时后。
      红裙女人的舞蹈慢了下来，她看向众人，眼中没有恶意，只有无尽的孤独。
      她伸出手，指向两条路：一条通向来时的列车，一条通向更深处的黑暗。
      方国跪在地上老泪纵横，他认出了那双眼睛——那是当年他没能救出的工友。
    characters_present:
      - "shen_yue"
      - "lu_chen"
      - "zhao_wanqing"
      - "fang_guo"
    plot_hook: "最终抉择：带她离开、帮她安息、还是独自逃生？每个选择都将改变所有人的命运"
