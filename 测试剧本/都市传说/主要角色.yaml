characters:
  - id: "shen_yue"
    name: "沈月"
    role: "记者"
    occupation: "都市新闻调查记者"
    personality: |
      好奇心极强，执着于追查真相，有强烈的正义感。
      表面冷静理性，实则内心敏感，容易共情他人的痛苦。
      习惯用录音笔记录一切，说话条理清晰，擅长引导别人开口。
    voice_tone: "冷静、专业、略带压迫感，追问时语速加快"
    backstory: |
      三个月前，沈月的闺蜜李薇在乘坐末班地铁后失踪。
      警方以"自愿离开"结案，但沈月不信，一直在追查此事。
      她发现过去十年间，至少有7人在同一条线路失踪，
      而所有目击者都提到了同一个关键词——"红裙女人"。

  - id: "lu_chen"
    name: "陆沉"
    role: "程序员"
    occupation: "地铁信号系统维护工程师"
    personality: |
      极度理性，相信逻辑和数据，对超自然现象持怀疑态度。
      内向寡言，但在技术问题上表达精准。
      有轻微的幽闭恐惧症，不喜欢长时间待在地下空间。
    voice_tone: "平淡、简洁、偶尔夹杂技术术语，紧张时会反复确认事实"
    backstory: |
      陆沉负责维护本市地铁的信号系统。一周前，他在例行巡检时
      发现了一个不应该存在的站点信号——编号为"-1"的幽灵站点。
      信号每隔72小时出现一次，持续时间恰好是4分44秒。
      他的上司让他别管，但他越想越不对劲。

  - id: "zhao_wanqing"
    name: "赵晚晴"
    role: "大学生"
    occupation: "民俗学研究生"
    personality: |
      开朗话多，对神秘事物充满热情。
      表面上像个大大咧咧的冒险爱好者，实则内心有隐藏的恐惧。
      随身带着奶奶留下的护身符，相信"老规矩"有它的道理。
    voice_tone: "活泼、带点俏皮，害怕时声音会不自觉变高"
    backstory: |
      赵晚晴的研究生论文题目是《城市交通系统中的现代都市传说研究》。
      她在田野调查中收集到大量关于"末班车红裙女人"的口述记录。
      她的奶奶曾是这条地铁线最早的一批建设者之一，
      临终前留下了一句警告："永远不要在末班车时回头看。"

  - id: "fang_guo"
    name: "方国"
    role: "退休工人"
    occupation: "原地铁隧道施工队队长"
    personality: |
      沉默寡言，饱经沧桑，眼神中藏着某种愧疚。
      对地铁隧道的结构了如指掌，比任何图纸都记得清楚。
      说话慢条斯理，但每一句话都意味深长。
    voice_tone: "低沉、缓慢、带有岁月沉淀的厚重感，谈及往事时语气会变"
    backstory: |
      方国三十年前参与了这条地铁线的隧道施工。
      在施工过程中发生过一次坍塌事故，有一名女工被困在隧道深处。
      为了赶工期，上级下令封闭了那段塌方区域，
      而那名女工……再也没有被提起。方国一直对此事耿耿于怀，
      退休后每晚都会失眠，总觉得有人在隧道里等他回去。
