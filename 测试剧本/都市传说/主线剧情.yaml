main_plot:
  title: "消失的末班车"
  theme: "被遗忘的人、未赎的罪、都市传说背后的真相"
  core_conflict: |
    三十年前，地铁施工队为了赶工期，将一名被困女工永远封在了隧道里。
    她的怨念化作了都市传说中的"红裙女人"，每隔一段时间就会"邀请"乘客下车。
    四位主角各怀秘密登上末班车，必须直面过去、做出选择，才能打破这个循环。

  stages:
    - name: "陌路同车"
      description: |
        四位互不相识的人因各自原因在深夜搭乘末班地铁。
        列车启动后，他们逐渐发现车上的异常——乘客比平时更少，
        灯光闪烁的频率像是某种摩斯密码，窗外隧道壁上的广告变成了90年代的样式。
      key_events:
        - "四人自我介绍，各自暴露此行的目的"
        - "赵晚晴提到红裙女人的传说，气氛开始紧张"
        - "陆沉注意到列车信号系统出现异常数据"
        - "方国沉默不语，但眼神越来越不安"
      emotional_arc: "平静→好奇→隐隐不安"

    - name: "幽灵站台"
      description: |
        列车在正常站间行驶时间远超预期后，停靠在一个不存在于任何线路图上的站点。
        车厢广播发出刺耳的电流声，随后一个女声温柔地说："终点站到了，请下车。"
        但窗外的站牌上，站名被涂黑，只有一行小字："你一直在找我。"
      key_events:
        - "列车停靠幽灵站点，车门自动打开"
        - "沈月发现站台上有闺蜜李薇遗失的发卡"
        - "陆沉确认信号系统显示的站点编号为-1"
        - "赵晚晴的护身符开始发烫"
        - "方国喃喃自语：'这里……我去过。'"
      emotional_arc: "不安→震惊→恐惧与好奇交织"

    - name: "真相之墙"
      description: |
        四人穿过铁门进入废弃隧道，在塌方区域发现了一面被水泥封死的墙。
        墙面上有指甲抓过的痕迹，以及用暗红色字迹写下的日记片段。
        方国终于崩溃，讲述了三十年前的那场事故——
        被困的女工名叫周小燕，她是施工队里唯一的女性，也是一个业余舞者。
      key_events:
        - "发现安全帽和施工工具，确认这是90年代的塌方现场"
        - "沈月在墙上发现了周小燕用碎石刻下的日记"
        - "方国痛哭忏悔：'我们听到她在喊，但上面说不能停……'"
        - "赵晚晴意识到奶奶临终遗言的真正含义"
        - "陆沉无法用理性解释眼前的一切，信仰开始动摇"
      emotional_arc: "紧张→震撼→悲痛→愤怒"

    - name: "红裙独舞"
      description: |
        隧道深处传来音乐声，四人来到那个被遗忘的地下空间。
        周小燕的幻影——红裙女人——正在月光中起舞。
        她并非恶灵，而是一个被困了三十年、只想回家跳舞的灵魂。
        她的舞蹈中带着怨恨，也带着哀求。
      key_events:
        - "红裙女人现身，用舞蹈重演她被困的经过"
        - "沈月在墙上找到了李薇留下的信息——她还活着，但被困在'另一层'"
        - "赵晚晴发现墙壁上的符咒与奶奶教她的一模一样"
        - "陆沉发现这个空间有独立的电磁场，可以解释信号异常"
        - "方国跪地请求周小燕的原谅"
      emotional_arc: "恐惧→怜悯→理解→决心"

    - name: "破晓抉择"
      description: |
        隧道开始震动，黎明将至，出口即将关闭。
        周小燕停止舞蹈，望向四人，等待他们做出最终选择。
        每个选择都将导向不同的结局，也将揭示每个角色内心深处的真实面目。
      key_events:
        - "时间紧迫，必须在首班车发车前离开"
        - "红裙女人给出三条路的选择"
        - "四人必须达成共识，还是各自为战？"
        - "最终选择将决定周小燕、李薇以及四人自身的命运"
      emotional_arc: "紧迫→挣扎→抉择→释然或遗憾"

  endings:
    - name: "救赎结局"
      condition: "四人选择帮助周小燕安息"
      description: |
        方国亲口道歉并承诺公开真相，赵晚晴用奶奶教的仪式为周小燕超度，
        沈月记录下完整的故事准备发表，陆沉修复了信号系统消除幽灵站点。
        周小燕微笑着化作光芒消散，李薇从'另一层'被释放。
        四人走出地铁站时，天边已经泛白。

    - name: "真相结局"
      condition: "沈月坚持追查真相"
      description: |
        沈月选择留在地下空间收集证据，其他人先离开。
        她成功找到了周小燕被困的全部证据和李薇的位置，
        但代价是自己也开始听到隧道里的敲击声……
        三个月后，一篇震惊全国的调查报道发表，
        地铁公司被迫公开了三十年前的事故档案。

    - name: "逃离结局"
      condition: "选择独自逃生"
      description: |
        恐惧战胜了良知，四人争先恐后跑回列车。
        列车重新启动，将他们带回了正常世界。
        但从此以后，每到深夜11:44，他们都会不约而同地
        听到远处传来的音乐声，和一个女人轻声说："你们答应过会回来的。"
        幽灵站台的信号，72小时后将再次出现。
