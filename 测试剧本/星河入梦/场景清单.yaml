scenes:
  - name: "暴雨屋檐"
    location: "云溪天文台，一楼入口门廊"
    time: "盛夏午后 15:30（暴雨）"
    atmosphere: "雨声如鼓，天空灰暗，老式屋檐下雨水成帘，空气中混合着泥土和青草的气息"
    description: |
      云溪天文台坐落在小镇边缘的一座矮丘上，是一栋建于上世纪八十年代的白色圆顶建筑。
      门口的台阶上长满了青苔，两棵老槐树像伞一样撑在门廊两侧。
      门廊很窄，只够两三个人并排站立，墙上的漆皮已经剥落，
      露出下面红色的砖墙，门框上方有一块褪色的木牌写着"云溪天文台 1985"。
      暴雨将整个天空染成铅灰色，雨水顺着屋檐倾泻而下，形成一道水帘。
      门廊角落里靠着一把旧伞，伞面上缝着歪歪扭扭的星星图案——
      那是林奶奶生前亲手缝制的，伞柄上缠着一圈胶布，已经用了二十多年。
    characters_present:
      - "shen_xinghe"
      - "gu_qingmeng"
    plot_hook: "暴雨将清梦困在天文台屋檐下，星河递出外婆的旧伞，两人的故事就此开始"

  - name: "圆顶之下"
    location: "云溪天文台，主观测室"
    time: "夜晚 20:00"
    atmosphere: "圆顶缓缓打开，星光洒入，老式望远镜静静矗立，空气中有机油和旧木头的气味"
    description: |
      主观测室是天文台的心脏——一个直径十二米的圆形房间，
      头顶是可开合的金属圆顶，打开时能看到整片夜空。
      房间中央是一台1985年产的折射式望远镜，虽然老旧但保养得很好，
      镜身上贴满了孩子们画的星星贴纸，都是历年来参观的小访客留下的。
      四周的墙上挂着历代馆长和工作人员的照片，
      最显眼的位置挂着林奶奶的照片——她站在望远镜旁，笑得像孩子。
      角落里有一张旧书桌，桌上放着星河的值班日志、一台老式收音机、
      和一杯已经凉掉的茶。
    characters_present:
      - "shen_xinghe"
      - "gu_qingmeng"
    plot_hook: "星河第一次通过望远镜给清梦看土星环，她在那一刻被星空和这个人同时打动"

  - name: "天台星图"
    location: "云溪天文台，楼顶天台"
    time: "深夜 22:30"
    atmosphere: "夏夜微风，满天繁星，远处是云溪镇零星的灯火，虫鸣声此起彼伏"
    description: |
      天文台的天台是整座建筑最浪漫的地方——
      四周没有遮挡，三百六十度全是开阔的天空。
      地面铺着一层防水的旧地毯，上面放着两个躺椅和一张矮桌，
      矮桌上有星河手绘的星图、一盒彩色铅笔和清梦的画具。
      夏夜的风从远处的山丘吹来，带着稻田和栀子花的香气。
      头顶的银河横跨天际，像是有人用颜料泼洒在黑色画布上。
      天台的栏杆上挂着一串小灯，是赵莹莹去年挂上去的，
      暖黄色的光在夜风中轻轻晃动，像是地上的星星。
    characters_present:
      - "shen_xinghe"
      - "gu_qingmeng"
    plot_hook: "星河教清梦绘制星图，两人在星空下度过了无数个夜晚，感情在不知不觉中升温"

  - name: "旧时光咖啡馆"
    location: "云溪镇老街，'旧时光'咖啡馆"
    time: "下午 14:00"
    atmosphere: "温暖慵懒，咖啡香气弥漫，墙上挂着老照片，角落的音响放着轻柔的爵士乐"
    description: |
      "旧时光"是云溪老街上唯一一间像样的咖啡馆，
      老板是个从大城市回来的文艺青年，把一间老宅改造成了温馨的小店。
      店里不大，只有六张桌子，每张桌子上放着一盆多肉植物。
      墙上挂满了云溪的老照片和游客留下的明信片。
      靠窗的位置最抢手，可以看到老街上来来往往的行人。
      这里是赵莹莹最常来的地方，也是她策划"拯救天文台"活动的"指挥部"。
      清梦常在这里和赵莹莹碰头，讨论宣传方案，
      偶尔也会在这里偷偷画星河——趁他去洗手间的时候。
    characters_present:
      - "gu_qingmeng"
      - "zhao_yingying"
      - "lu_mingyu"
    plot_hook: "赵莹莹在咖啡馆策划宣传活动，陆明宇偶遇清梦，旧情与新故事交织"

  - name: "月光天台"
    location: "云溪天文台，楼顶天台（月圆之夜）"
    time: "深夜 23:00"
    atmosphere: "月光如水银般倾泻，天空只剩几颗最亮的星，安静得只听见彼此的呼吸和心跳"
    description: |
      满月之夜的天台与往常不同——
      月亮太亮了，星星们都被月光"淹没"，只剩下几颗最执拗的亮星。
      银白色的月光铺满了整个天台，把一切都镀上了一层柔光。
      清梦的画本被月光照亮，翻开着，正是那幅《星河入梦》——
      画中的女孩站在星空下仰望，眼睛里映着整条银河。
      望远镜静静地指向月亮的方向，
      矮桌上的星图被晚风吹动了几页，停在了"英仙座"那一页。
      栏杆上的小灯在月光下显得多余，但没有人去关。
      这个夜晚，空气里有一种不同于以往的紧张——是心跳的声音。
    characters_present:
      - "shen_xinghe"
      - "gu_qingmeng"
    plot_hook: "月光下的告白——星河用'双星系统'的比喻向清梦表达心意，全剧最甜蜜的时刻"

  - name: "雨中对峙"
    location: "云溪天文台，一楼入口门廊（第二次下雨）"
    time: "傍晚 18:00（阵雨）"
    atmosphere: "与初遇时相似的暴雨，但气氛截然不同——压抑、紧张、空气中充满未说出口的话"
    description: |
      距离天文台关闭还有五天，又一场暴雨降临云溪。
      和第一次相遇时几乎一样的场景——屋檐下、雨帘前、两个人。
      但此刻的清梦不再是被雨淋湿的路人，她的眼眶是红的；
      星河也不再是递伞的陌生人，他的手在微微发抖。
      门廊角落那把旧伞还靠在那里，星星花纹已经被雨水浸透了。
      雨声掩盖了他们的争吵，但也掩盖不了彼此眼中 hurt 的表情。
      这是两个人第一次、也是唯一一次正面冲突。
    characters_present:
      - "shen_xinghe"
      - "gu_qingmeng"
    plot_hook: "两人的第一次争吵，各自的心结被揭开，也为后续的和解与成长埋下伏笔"

  - name: "外婆的房间"
    location: "云溪天文台，二楼林奶奶的旧办公室"
    time: "夜晚 21:00"
    atmosphere: "怀旧、温暖、带着淡淡的檀木和旧书的气味，像是时间在这里停住了"
    description: |
      林奶奶的办公室在天文台二楼，自从她离开后就没有人动过。
      房间里有一张老式红木书桌，桌上放着一台已经过时的电脑、
      一摞泛黄的天文观测记录本、和一个相框——
      照片里是年轻的林奶奶站在天文台门口，笑得灿烂。
      书架上摆满了天文相关的书籍，有几本的扉页上写着"赠给未来的天文学家"。
      书桌的抽屉里放着那封留给星河的信，
      信封上用毛笔工工整整地写着："等你准备好的时候再打开。"
      墙上挂着一幅手绘的星图，上面用红笔标注了林奶奶最喜爱的几颗星，
      旁边写着："每一颗星都在发光，即使我们看不见，它也在那里。"
    characters_present:
      - "shen_xinghe"
    plot_hook: "星河在外婆的房间里打开了那封信，信中的话成为他做出最终决定的关键"

  - name: "星空夜会场"
    location: "云溪天文台，全馆（主观测室 + 天台 + 门廊）"
    time: "夜晚 19:00 - 次日凌晨 02:00"
    atmosphere: "热闹而温馨，人潮涌动，孩子们的惊叹声与虫鸣交织，满天星光为这场告别作证"
    description: |
      "最后一场星空夜"是整个故事的终章场景。
      天文台被装饰得焕然一新——赵莹莹带着学生们挂满了手工星星灯笼，
      从门廊一路延伸到主观测室，像一条光之走廊。
      主观测室外的空地上搭起了几顶帐篷，
      有人带着毯子席地而坐，有人在用便携望远镜观察星空。
      清梦的星空插画被放大印制成海报，贴满了天文台的每一面墙。
      那幅《星河入梦》被挂在最显眼的位置——入口处，
      每个走进来的人都会第一眼看到它。
      午夜时分，流星雨如约而至，
      数百人同时仰望天空，发出整齐的惊叹。
      在这片星光与欢呼声中，所有的故事都迎来了答案。
    characters_present:
      - "shen_xinghe"
      - "gu_qingmeng"
      - "lu_mingyu"
      - "zhao_yingying"
    plot_hook: "星空夜大获成功，星河在人群中向清梦做出承诺，所有角色的故事线在此收束"
