main_plot:
  title: "星河入梦"
  theme: "治愈、重逢、重新出发、爱是最好的答案"
  core_conflict: |
    云溪天文台因经费不足即将在三十天后关闭。
    沈星河在这里守护着外婆的遗愿，却无法面对自己的失败；
    顾清梦逃回老家，用笑容掩饰内心的创伤。
    两个各自带着伤痕的年轻人在天文台相遇，
    在拯救天文台的过程中慢慢靠近彼此，
    也在星光下重新找到了直面人生的勇气。

  stages:
    - name: "暴雨相遇"
      description: |
        盛夏的云溪，一场毫无预兆的暴雨倾盆而下。
        顾清梦在回家的路上被大雨困在了天文台的屋檐下，
        浑身湿透，画具淋了一地。
        天文台里唯一值班的沈星河递给她一把外婆留下的旧伞，
        两人在雨声中第一次正式交谈。
        她随口说了一句"这伞的星星花纹挺好看的"，
        他愣了一下，说"这是我外婆亲手缝的"。
      key_events:
        - "暴雨中，顾清梦狼狈地躲进天文台屋檐"
        - "沈星河递出外婆的旧伞，两人第一次对话"
        - "清梦得知天文台即将关闭的消息，感到震惊和惋惜"
        - "赵莹莹赶来送伞，与清梦意外重逢，得知她回了云溪"
        - "星河在日志里写下：'今天有人夸外婆缝的星星好看。'"
      emotional_arc: "狼狈→意外→温暖→好奇"

    - name: "星空之约"
      description: |
        清梦开始频繁来天文台"蹭空调画画"，
        实际上是被这里的安静氛围和那个安静的人所吸引。
        她提出用插画帮天文台做宣传，星河犹豫后答应。
        两人开始了为期一个月的"合作"——
        他教她认星星，她为天文台画一系列星空插画。
        赵莹莹看在眼里，乐在心里，开始悄悄助攻。
      key_events:
        - "清梦带着画具来到天文台，说要'用画报恩'"
        - "星河第一次通过望远镜给清梦看土星环，她惊叹到说不出话"
        - "赵莹莹发现清梦在偷偷画星河的侧脸，拍照存证"
        - "陆明宇来天文台送药，重逢清梦，旧情暗涌"
        - "清梦在公众号发的第一张星空插画意外获得大量转发"
      emotional_arc: "轻松→靠近→心动萌芽→暗流初现"

    - name: "星图与秘密"
      description: |
        两人的关系在日复一日的相处中迅速升温。
        星河开始教清梦绘制星图，两人在天文台的圆顶下度过了无数个夜晚。
        但与此同时，各自的"伤疤"也开始隐隐作痛——
        星河偶然看到清梦手机上前男友发来的消息，
        清梦则发现了星河休学回家的真正原因。
        陆明宇终于向星河坦白了自己对清梦的感情，
        两个从小一起长大的好朋友之间出现了微妙的裂痕。
      key_events:
        - "星空下，星河第一次给清梦讲起外婆的故事，眼眶泛红"
        - "清梦画了一幅《星河入梦》——一个女孩站在星空下仰望，星河倒映在她的眼中"
        - "星河发现清梦深夜独自在天台哭泣，默默坐在她身旁一言不发"
        - "陆明宇约星河喝酒，说出了'我喜欢了她好多年'"
        - "赵莹莹发起的'拯救天文台'话题突然被一位大V转发，热度暴涨"
      emotional_arc: "甜蜜→心疼→纠结→希望"

    - name: "月光下的告白"
      description: |
        距离天文台关闭只剩十天，"最后一场星空夜"活动进入紧张筹备。
        星河和清梦的关系已经暧昧到所有人都看得出来的地步，
        但谁都没有迈出那一步。
        一个月圆之夜，两人在天文台天台调试设备，
        月光洒在清梦的画本上，翻到了那幅《星河入梦》。
        星河看着画中那双映着星河的眼睛，终于鼓起勇气。
      key_events:
        - "星河在调试望远镜时，第一次主动邀清梦一起看英仙座流星雨"
        - "清梦差点从天台梯子摔下来，星河一把抓住她的手——两人四目相对，心跳如鼓"
        - "陆明宇看到星河和清梦在一起的画面，沉默许久，转身离开"
        - "赵莹莹安慰陆明宇：'有些人是用来放下的，你会遇到更好的。'"
        - "月光下，星河对清梦说：'你知道吗，在天文学里，双星系统会互相环绕，永远不会分开。我觉得……你就像我的另一颗星。'"
        - "清梦红了眼眶，笑着说：'这是我听过的最理科生的告白。'"
      emotional_arc: "暧昧→紧张→心动→甜蜜爆发"

    - name: "风暴将至"
      description: |
        告白后的甜蜜很快被现实击碎。
        星河收到导师的电话——对方愿意归还论文署名，条件是回校继续研究。
        清梦的前男友突然出现在云溪，说要"挽回"她。
        天文台的关闭日期也在逼近，压力从四面八方涌来。
        两人开始因为各自的纠结而疏远——
        星河不确定自己该留下还是回去，清梦不确定自己是否值得被爱。
      key_events:
        - "星河接到导师电话，陷入回校还是留下的两难"
        - "清梦前男友突然出现，清梦情绪崩溃，独自躲回房间"
        - "两人因为各自的烦恼发生第一次争吵，星河说'你总是逃避'，清梦说'你还不是一样'"
        - "陆明宇出面赶走清梦前男友，对他说'她不需要你来挽回'"
        - "星河打开外婆留给他的那封信，信上写着：'星河，不要因为怕黑就闭上眼睛。星星一直都在，你要学会抬头看。'"
      emotional_arc: "甜蜜→撕裂→崩溃→顿悟"

    - name: "最后一场星空夜"
      description: |
        天文台的最后一个开放日终于到来。
        赵莹莹策划的"最后一场星空夜"活动意外走红，
        数百人从各地赶来，只为在这座老旧的天文台里最后看一次星空。
        星河和清梦在各自的纠结中选择了先放下自己——
        因为今晚，天文台才是最重要的。
      key_events:
        - "星空夜活动大获成功，天文台圆顶下挤满了仰望星空的人"
        - "星河最后一次作为讲解员，为大家讲述每一颗星星的故事"
        - "清梦把《星河入梦》的原画挂在了天文台的入口处，旁边写着：'送给每一个在这里抬头仰望的人'"
        - "星河在人群中找到了清梦，拉着她的手走到望远镜前：'我说过，双星不会分开。我不走了。'"
        - "清梦握着他的手，眼泪落在目镜上：'那我也不逃了。'"
        - "陆明宇在人群中微笑着鼓掌，赵莹莹在旁边偷偷拍下了这一幕"
      emotional_arc: "紧张→感动→释然→圆满"

  endings:
    - name: "星河长明"
      condition: "星河选择留下，清梦选择面对"
      description: |
        半年后，云溪天文台因为星空夜活动的影响力获得了民间基金会的资助，
        不仅没有关闭，还进行了翻新扩建。
        星河回到学校完成了论文答辩，拿到了学位，
        然后毅然回到了云溪，成为天文台的正式馆长。
        清梦以云溪为灵感创作的绘本《星河入梦》出版，
        登上了畅销书排行榜。
        天文台的入口处永远挂着那幅画——
        一个女孩站在星空下仰望，星河倒映在她的眼中。
        画的右下角有一行小字：
        "你在看星星的时候，星星也在看你。"
        某个晴朗的夜晚，两人在天文台的天台上并肩而坐，
        星河指着天空说："看，那颗最亮的星，我给它取了名字。"
        清梦问："叫什么？"
        他看着她，笑了："清梦。"

    - name: "各奔星辰"
      condition: "星河选择回校，清梦选择离开云溪"
      description: |
        星河回到了大学，重新投入研究；清梦去了另一座城市重新开始。
        两人没有分手，但开始了漫长的异地。
        每天晚上，他们会各自打开天文台的直播摄像头，
        看着同一片星空，隔着屏幕聊天到深夜。
        一年后的某天，清梦收到一个包裹——
        里面是一台小型望远镜，镜片上贴着一张纸条：
        "我在你的城市也能看到星星。——星河"
        清梦抱着望远镜笑了，买了一张去他城市的车票。

    - name: "星光永驻"
      condition: "天文台最终关闭，但精神延续"
      description: |
        天文台没能保住，在最后一个夜晚关闭了大门。
        但清梦把在天文台的日子画成了一本绘本，
        绘本出版后大受欢迎，让更多人知道了云溪天文台的故事。
        三年后，一群曾被天文台改变人生的年轻人，
        众筹在云溪的山顶建起了一座新的天文台。
        开幕那天，星河作为首任馆长站在门口迎接访客，
        清梦在旁边的咖啡厅里画着新绘本。
        新天文台的铭牌上写着：
        "献给所有在黑暗中抬头寻找光的人。——林奶奶与所有仰望星空的孩子"
