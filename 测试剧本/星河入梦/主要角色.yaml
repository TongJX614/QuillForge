characters:
  - id: "shen_xinghe"
    name: "沈星河"
    role: "天文台实习讲解员 / 男主角"
    occupation: "云溪天文台实习讲解员，天文学专业在读研究生（休学中）"
    personality: |
      性格内敛温柔，说话慢条斯理，喜欢用天文知识来比喻生活中的小事。
      表面上是个"无趣"的理科生，但内心有着极细腻的感受力。
      不擅长拒绝别人，常常默默承担不属于自己的工作。
      对星空有着近乎执念的热爱，但最近半年刻意回避看星星。
      笑容很淡，但一旦真正开心起来，眼睛会亮得像星星。
    voice_tone: "平静、温和、带有书卷气，讲起天文知识时会变得滔滔不绝，紧张时会下意识推眼镜"
    backstory: |
      沈星河从小在云溪长大，外婆是天文台的老馆长。
      他从小跟着外婆在天文台长大，对每一颗星星都如数家珍。
      半年前，他精心准备的天文研究论文被导师窃取署名，
      学术圈的冷漠与不公让他心灰意冷，选择休学回到云溪。
      外婆去世后，天文台因经费不足即将关闭，
      他觉得自己辜负了外婆的期望，却始终不愿离开这里。
      他给自己定了一个期限——"天文台关门的最后一天，我就走。"

  - id: "gu_qingmeng"
    name: "顾清梦"
    role: "自由插画师 / 女主角"
    occupation: "自由插画师，曾在一线城市知名设计公司工作"
    personality: |
      性格洒脱外向，笑起来像夏天的风，能瞬间拉近与任何人的距离。
      行动力极强，想到什么就去做，有点莽撞但充满感染力。
      习惯用画画来表达情绪，开心的时候画暖色，难过的时候画冷色。
      看似大大咧咧，其实对别人的情绪变化极其敏感。
      害怕被"可怜"，所以从不在人前展示脆弱的一面。
    voice_tone: "明快、爽朗、带着笑意，认真的时候会放低声音，感动时会故意转移话题掩饰情绪"
    backstory: |
      顾清梦是土生土长的云溪人，高中毕业后去了大城市追梦。
      在设计公司拼命工作三年，终于办了自己的第一场个人画展，
      却在展览当天收到了相恋四年的男友劈腿闺蜜的消息。
      双重打击下，她辞去工作，带着画具狼狈地逃回了老家。
      她告诉自己只是"暂时回来休息一下"，
      但其实内心深处已经对未来失去了方向。
      回到云溪的第三天，一场暴雨把她困在了天文台的屋檐下——
      然后她遇见了那个递给她一把旧伞的男生。

  - id: "lu_mingyu"
    name: "陆明宇"
    role: "青梅竹马 / 男二号"
    occupation: "云溪镇卫生所全科医生"
    personality: |
      阳光开朗，热心肠，是镇上所有人都认识的"好人缘"代表。
      做事靠谱，对朋友仗义，但感情上有些迟钝。
      从小和沈星河一起长大，是少数能让星河打开心扉的朋友。
      暗恋了顾清梦整个高中时期，但从没表白过。
    voice_tone: "热情、随和、带点调侃，认真起来语气会变得异常坚定"
    backstory: |
      陆明宇高中时是班上的体育委员，成绩一般但人缘极好。
      他默默喜欢了顾清梦三年，直到毕业也没敢开口。
      后来顾清梦去了大城市，他留在云溪读了医学院，
      毕业后回到镇卫生所当了一名全科医生。
      他以为自己早已放下了那段感情，
      但当顾清梦重新出现在云溪的时候，他的心跳还是漏了一拍。
      随着故事推进，他渐渐意识到——
      有些喜欢是青春的执念，而真正的爱情是此刻的心动。

  - id: "zhao_yingying"
    name: "赵莹莹"
    role: "闺蜜 / 女二号"
    occupation: "云溪小学美术老师，兼职运营天文台公众号"
    personality: |
      大大咧咧，嘴上不饶人，但对朋友极其忠诚。
      是顾清梦从小到大的闺蜜，也是唯一敢当面骂她的人。
      热衷于"撮合"别人，自封"云溪第一红娘"。
      看似什么都不在乎，其实对天文台有着深厚的感情——
      她小时候在这里第一次通过望远镜看到了土星环。
    voice_tone: "直爽、快言快语、偶尔毒舌，但关心人时会变得絮絮叨叨像老妈子"
    backstory: |
      赵莹莹大学学的美术教育，毕业后回到云溪教小学生画画。
      她自愿帮天文台运营公众号和社交媒体，
      虽然粉丝只有几百人，但她坚持每周更新。
      她是第一个知道天文台要关闭消息的人，
      也是她偷偷在社交平台上发起了"拯救天文台"的话题，
      虽然反响不大，但她从未放弃。
      她觉得天文台是云溪的灵魂，不能被遗忘。

  - id: "waipo_lin"
    name: "林奶奶（外婆）"
    role: "精神引路人 / 已故角色（回忆中出现）"
    occupation: "云溪天文台前任馆长（已退休）"
    personality: |
      睿智慈祥，说话慢悠悠的，每句话都像是藏着人生哲理。
      对星星有着孩童般的好奇心，八十岁了还会趴在望远镜前惊叹。
      从不强迫任何人做任何事，但总能用温柔的方式让人自己想通。
      她是沈星河生命中最重要的人，也是整个故事的灵魂人物。
    voice_tone: "苍老而温暖，像冬日的炉火，每句话都带着笑意"
    backstory: |
      林奶奶在云溪天文台工作了四十年，从讲解员一路做到馆长。
      她把一生都献给了这座小城的天文事业，
      最骄傲的事是让无数孩子通过天文台的望远镜第一次看到了星空。
      她在一年半前安详离世，留给沈星河一封没有拆开的信，
      信封上写着："等你准备好的时候再打开。"
      这封信在故事中成为一个重要的情感线索。
