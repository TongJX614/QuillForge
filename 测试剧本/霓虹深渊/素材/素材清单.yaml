# 素材清单
# 定义剧本所需的视觉、音频和互动素材

assets:
  # ============================================================
  # 视觉素材
  # ============================================================
  visual:
    - type: "角色立绘"
      description: "四个主要角色的立绘，包含多种表情和姿态"
      dimensions: "800x1200"
      style: "赛博朋克风格，霓虹灯光效果，金属质感，细节丰富"
      format: "PNG（透明背景）"
      quantity: "每个角色6个变体"
      characters:
        - name: "陆沉"
          variants: 6
          expressions: 4
          outfits: 2
          notes: "右臂军用义体、深蓝虹膜、左脸疤痕是标志性特征"
        - name: "零"
          variants: 6
          expressions: 3
          outfits: 1
          notes: "银白光芒流动体，人形轮廓随情绪变化"
        - name: "赵锦程"
          variants: 6
          expressions: 4
          outfits: 2
          notes: "90%义体化，深紫色义眼，黑色长款大衣"
        - name: "苏夜"
          variants: 6
          expressions: 4
          outfits: 2
          notes: "深渊集团制服、黑色马尾、疲惫但锐利的眼神"

    - type: "场景背景"
      description: "4个主要场景的背景图"
      dimensions: "1920x1080"
      style: "赛博朋克风格，霓虹灯与阴影交织，雨水与金属的质感"
      format: "PNG"
      scenes:
        - name: "陆沉的地下诊所"
          mood: "压抑、潮湿、霓虹灯光透过百叶窗"
          details: "十几平米空间，义体诊断台，神经接口检测仪，窗外酸雨和霓虹广告"
        - name: "深渊网络·数据废墟层"
          mood: "超现实、冰冷、数据构成的荒原"
          details: "破碎代码构成的建筑残骸，数据流如河流，意识碎片化作荧光漂浮"
        - name: "深渊塔·升神计划核心"
          mood: "恐怖、压迫、科技与灵魂交融"
          details: "巨大球形空间，内壁灵匣矩阵，中央融合装置散发幽蓝光芒"
        - name: "结局场景"
          mood: "根据结局不同而变化"
          details: "独行：雨中霓虹独行；救赎：诊所灵匣微光；共生：彩虹霓虹天空"

    - type: "UI元素"
      description: "游戏界面元素"
      dimensions: "多种尺寸"
      style: "赛博朋克科技感，霓虹色系，故障美学"
      format: "PNG/SVG"
      items:
        - "选择按钮（普通/悬停/选中状态，霓虹边框）"
        - "对话框背景（半透明毛玻璃+霓虹描边）"
        - "神经接口连接状态UI"
        - "灵魂数据流可视化"
        - "义体系统状态面板"
        - "深渊网络导航界面"
        - "关系值显示条（霓虹色渐变）"

    - type: "插图"
      description: "关键剧情节点的插图"
      dimensions: "1920x1080"
      style: "电影感、赛博朋克美学、戏剧性构图"
      format: "PNG"
      count: 5
      items:
        - "陆沉在诊所中发现加密数据"
        - "深渊网络中苏夜的加密影像出现"
        - "母亲的灵魂碎片在数据流中闪烁"
        - "陆沉与赵锦程在融合装置前对峙"
        - "结局画面（三个结局各一）"

  # ============================================================
  # 音频素材
  # ============================================================
  audio:
    - type: "背景音乐"
      description: "场景背景音乐，营造氛围"
      tracks:
        - name: "主题曲 - 霓虹深渊"
          mood: "压抑、冷硬、史诗感"
          instruments: "暗黑合成器、工业节拍、失真吉他"
          tempo: "中速偏慢"
          duration: "3-5分钟"

        - name: "场景1 - 暗巷"
          mood: "潮湿、压抑、危险"
          instruments: "低频合成器、雨声采样、远处霓虹嗡鸣"
          tempo: "慢"
          duration: "贯穿整个场景"

        - name: "场景2 - 潜行"
          mood: "超现实、冰冷、紧张"
          instruments: "数据流音效、回声合成器、脉冲节拍"
          tempo: "渐快"
          duration: "贯穿整个场景"

        - name: "场景3 - 深渊"
          mood: "恐怖、压迫、宏大"
          instruments: "工业管弦乐、灵魂低语采样、重低音"
          tempo: "渐强至爆发"
          duration: "贯穿整个场景"

        - name: "结局A - 独行"
          mood: "孤独、冷硬、雨夜"
          instruments: "钢琴独奏、雨声、远处城市噪音"
          tempo: "慢"
          duration: "2-3分钟"

        - name: "结局B - 救赎"
          mood: "温暖中带着遗憾"
          instruments: "原声吉他、钢琴、弦乐"
          tempo: "中速"
          duration: "2-3分钟"

        - name: "结局C - 共生"
          mood: "超越、宏大、希望"
          instruments: "全编制管弦乐、电子合成器、合唱团"
          tempo: "渐强至高潮"
          duration: "3-4分钟"

    - type: "音效"
      description: "场景音效和UI音效"
      effects:
        - name: "义体启动音"
          duration: "2秒"
          description: "陆沉义体系统启动时的金属嗡鸣"

        - name: "神经接口连接音"
          duration: "3秒"
          description: "潜入深渊网络时的电子共鸣音"

        - name: "灵魂数据流音"
          duration: "循环"
          description: "灵匣中灵魂数据流动的空灵音效"

        - name: "选择按钮点击音"
          duration: "0.5秒"
          description: "玩家做出选择时的金属确认音"

        - name: "加密通讯音"
          duration: "2秒"
          description: "零或苏夜发来加密消息时的电子振动音"

        - name: "融合装置运转音"
          duration: "循环"
          description: "升神计划核心装置的低频共鸣"

        - name: "摇篮曲片段"
          duration: "15秒"
          description: "母亲唱的摇篮曲，从义体中传来，断断续续"

  # ============================================================
  # 互动素材
  # ============================================================
  interactive:
    - type: "选择系统"
      description: "玩家做出选择的交互界面"
      features:
        - "多选项展示（2-3个选项）"
        - "霓虹边框悬停效果"
        - "选择确认故障动画"
        - "倒计时选择（部分高压场景）"
        - "隐藏选项解锁提示（灵魂共鸣特效）"

    - type: "对话系统"
      description: "角色对话展示系统"
      features:
        - "打字机效果逐字显示"
        - "角色语音口型同步（可选）"
        - "对话历史回顾"
        - "角色表情切换"
        - "加密通讯特殊显示效果（乱码解密动画）"

    - type: "潜行系统"
      description: "scene_02专用的深渊网络潜行交互"
      features:
        - "数据流可视化导航"
        - "灵魂碎片收集与查看"
        - "神经接口负载仪表"
        - "潜行深度控制"

    - type: "关系系统"
      description: "角色关系值显示"
      features:
        - "霓虹色关系值变化提示"
        - "关系状态描述"
        - "灵魂共鸣度显示"
        - "关键关系节点通知"

    - type: "成就系统"
      description: "结局达成记录"
      features:
        - "结局解锁通知（故障美学动画）"
        - "完成度统计"
        - "隐藏成就（需要特定条件）"
        - "灵魂图谱：收集到的所有灵魂碎片记录"
