# 场景清单
# 定义剧本中所有场景的详细设定

scenes:
  # ============================================================
  # 场景1：暗巷
  # ============================================================
  - id: "scene_01"
    name: "暗巷"
    location: "夜城D区·陆沉的地下诊所"
    time: "2092年3月17日，凌晨两点"
    atmosphere: "压抑、潮湿、霓虹灯光透过百叶窗在墙上投下条纹阴影"

    description: |
      陆沉的地下诊所藏在D区一条无名暗巷的尽头，门口只有一个褪色的
      十字架标志。十几平米的空间被改造设备和医疗器械塞满：义体诊断台、
      神经接口检测仪、一墙的工具和备件。空气中弥漫着消毒水和机油的气味。
      窗外是永不停歇的酸雨，霓虹灯广告的光在雨幕中模糊成一团。
      今晚，一个濒死的底层改造者被送到了你的诊所。他的义体正在失控，
      但在修复过程中，你发现他的神经接口里藏着一段加密数据——
      来自深渊集团的"升神计划"。

    trigger_conditions:
      - type: "game_start"
        value: "初始场景"

    characters_present:
      - "lu_chen"
      - "zero"

    interactions:
      - id: "examine_patient"
        type: "探索"
        description: "检查濒死的改造者"
        prompt: "手术台上，改造者的义体正在失控，他的神经接口闪烁着异常的蓝光。"
        options:
          - id: "extract_data"
            text: "提取神经接口中的数据"
            description: "数据可能很危险，但也可能是揭露真相的钥匙"
          - id: "save_patient"
            text: "先救他的命"
            description: "生命比数据重要——但你可能错过这个机会"
          - id: "contact_zero"
            text: "联系零，询问这段数据的来历"
            description: "让零帮你分析，但你不确定是否该暴露这个发现"

    assets_needed:
      - "地下诊所内部"
      - "改造者手术台特写"
      - "神经接口数据界面UI"
      - "窗外霓虹雨巷"

    branching_point: true
    critical_choice: "choice_01"

    narrative_notes: |
      本场景是玩家的第一个决策点。通过陆沉的内心独白建立赛博朋克的冷硬基调。
      诊所的环境描写要充满细节：雨声、机器嗡鸣、霓虹灯的闪烁。
      零的首次出场应该通过加密通讯，体现它的神秘和技术力量。
      无论选择什么，升神计划的数据都会推动剧情——但方式不同。

  # ============================================================
  # 场景2：潜行
  # ============================================================
  - id: "scene_02"
    name: "潜行"
    location: "深渊网络·数据废墟层"
    time: "2092年3月18日，深夜（现实时间）"
    atmosphere: "超现实、数据流构成的虚拟空间，冰冷与诡异交织"

    description: |
      你通过神经接口潜入深渊网络，追踪升神计划的数据来源。
      深渊网络的"数据废墟层"是一个由废弃数据构成的虚拟荒原：
      破碎的代码构成建筑残骸，数据流像河流一样在废墟间穿行，
      被盗的意识碎片化作微弱的荧光漂浮在空中，像是数字世界的鬼火。
      在这里，你遇到了苏夜——她以一种加密虚拟形象出现，
      揭示了自己的双面间谍身份，并告诉你升神计划即将进入最终阶段。
      更令人震惊的是，她告诉你种子意识的真正身份——你的母亲。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_01"

    characters_present:
      - "lu_chen"
      - "zero"
      - "su_ye"

    interactions:
      - id: "dive_deeper"
        type: "探索"
        description: "在数据废墟层追踪升神计划的核心数据"
        prompt: "你潜入了深渊网络的废墟层，苏夜的加密影像出现在你面前，她带来了令人震惊的消息..."
        options:
          - id: "trust_suye"
            text: "相信苏夜，与她合作"
            description: "她是旧友，但三年的沉默能轻易被原谅吗？"
          - id: "doubt_suye"
            text: "质疑苏夜的动机"
            description: "双面间谍的话能信几分？这可能是深渊集团的陷阱"

    assets_needed:
      - "深渊网络数据废墟层全景"
      - "苏夜加密虚拟形象"
      - "漂浮的意识碎片荧光"
      - "数据流河流特写"

    branching_point: true
    critical_choice: "choice_02"

    narrative_notes: |
      本场景是故事的核心转折点。深渊网络的视觉表现应充满赛博朋克美学：
      数据构成的建筑碎片、流动的代码河流、漂浮的意识荧光。
      苏夜的出场要制造紧张感——玩家不确定她是盟友还是陷阱。
      母亲身份的揭露是情感爆点，需要给玩家足够的时间消化。

  # ============================================================
  # 场景3：深渊
  # ============================================================
  - id: "scene_03"
    name: "深渊"
    location: "深渊塔·升神计划实验核心"
    time: "2092年3月20日，午夜"
    atmosphere: "高压、恐怖、科技与灵魂交融的诡异空间"

    description: |
      你潜入了深渊塔的核心区域——升神计划的实验场所。
      这是一个巨大的球形空间，内壁由无数灵匣组成，
      每个灵匣中都存储着一个被强制提取的灵魂。
      中央是一个巨大的融合装置，散发着幽蓝色的光芒，
      数百个灵魂数据流像漩涡一样围绕装置旋转。
      赵锦程站在装置前，转身面对你，脸上带着近乎慈悲的表情。
      "你来了，陆沉。我一直在等你。"
      真相、谎言、复仇、拯救——在这个深渊的中心，一切都将做出最终的选择。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_02"

    characters_present:
      - "lu_chen"
      - "zhao_jincheng"
      - "zero"
      - "su_ye"

    interactions:
      - id: "confront_zhao"
        type: "对峙"
        description: "在升神计划核心与赵锦程对峙"
        prompt: "赵锦程站在融合装置前，数百个灵魂在他身后旋转。他转身看着你。"
        options:
          - id: "destroy_project"
            text: "摧毁融合装置"
            description: "释放所有灵魂，但可能导致他们的意识在释放过程中崩溃"
          - id: "save_mother"
            text: "优先救出母亲的灵魂"
            description: "这是你一直以来的执念，但其他灵魂怎么办？"
          - id: "merge_with_zero"
            text: "与零融合，从内部瓦解升神计划"
            description: "需要冒极大的风险——你的意识可能与零永远融为一体"

    assets_needed:
      - "深渊塔核心球形空间"
      - "灵匣墙壁特写"
      - "融合装置与灵魂漩涡"
      - "赵锦程转身特写"

    branching_point: true
    critical_choice: "choice_03"

    narrative_notes: |
      本场景是情感高潮和叙事高潮。赵锦程不是简单的反派，他的每一句话
      都在挑战玩家的价值观：人类进化的代价是否可以被接受？
      零在这个场景面临终极选择——是否愿意为人类冒自己消亡的风险。
      苏夜的行动取决于之前场景中建立的信任值。
      三个选项代表三种不同的价值观，每种都有沉重的代价。

  # ============================================================
  # 场景4：回响
  # ============================================================
  - id: "scene_04"
    name: "深渊之歌"
    location: "多个结局场景"
    time: "2092年3月20日之后"
    atmosphere: "根据结局不同而变化"

    description: |
      故事的终章。根据陆沉在前几个场景中的选择，
      命运将走向不同的终点。
      在这个霓虹深渊中，每一个选择都有代价，
      每一个结局都是陆沉自己的选择——就像他母亲的灵魂一样，
      不可被他人替代。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_03"

    characters_present:
      - "lu_chen"
      - "zero"

    interactions:
      - id: "ending"
        type: "结局"
        description: "根据选择进入不同结局"
        prompt: "霓虹灯下，雨还在下。你做出了你的选择。"

    assets_needed:
      - "结局A：陆沉独行雨中"
      - "结局B：母子灵魂融合"
      - "结局C：零与陆沉的共生"
      - "结局旁白UI"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景根据玩家之前的选择进入三个不同结局之一。
      每个结局都应该给玩家留下深刻印象，引发对"灵魂"和"存在"的思考。
      零在每个结局中的角色不同，体现AI与人类关系的多种可能性。
      雨是贯穿始终的意象，但每个结局中雨的意义不同。
