# 主要角色
# 定义剧本中所有出场角色的详细设定

characters:
  # ============================================================
  # 主角：陆沉
  # ============================================================
  - id: "lu_chen"
    name: "陆沉"
    role: "主角"
    age: "32"
    occupation: "黑市义体医生 / 前深渊集团意识工程师"

    background: |
      陆沉出生于夜城底层贫民区"D区"。母亲是灵魂市场的D级劳工，
      在他12岁时因"灵魂回收"被深渊集团强制提取了意识，肉体被丢弃在街巷中。
      这件事成为他一生的创伤。凭借过人的天赋，他被霓虹工业的技术学院录取，
      毕业后进入深渊集团担任意识工程师。在一次例行维护中，他意外接触到了
      "升神计划"的边缘数据，看到了数百个灵魂在融合实验中痛苦尖叫的画面。
      他选择了逃亡，带着偷取的部分数据躲进了地下黑市，成为一名义体医生。
      三年来，他一边救治底层的改造者，一边暗中调查升神计划的真相。

    personality: |
      - 冷硬外表：常年的底层生存让他学会了冷漠和警惕
      - 内核柔软：对弱者有无法抑制的同情心，这是他的弱点也是他的力量
      - 技术天才：意识工程领域的顶尖人才，即使在黑市也无人能及
      - 创伤驱动：母亲的遭遇让他对深渊集团有根深蒂固的仇恨
      - 自我怀疑：他不确定偷取数据的行为是正义还是逃避

    motivation: |
      主要动机：揭露升神计划，阻止更多灵魂被吞噬
      次要动机：找到母亲的灵魂数据（如果还存在的话）
      深层动机：证明自己不是"逃兵"，而是一个能改变什么的人

    secrets:
      - "他偷取的数据中有一段加密代码，是升神计划的核心密钥"
      - "他母亲的灵魂数据并未被销毁，而是被用于融合实验的'种子意识'"
      - "他的右臂义体中隐藏着一个微型意识碎片——那是他母亲意识的残留"

    relationships:
      - target: "zero"
        type: "盟友"
        description: "幽灵网络中的神秘存在，是他调查升神计划的唯一线索来源"
        initial_level: 6
      - target: "zhao_jincheng"
        type: "仇敌"
        description: "深渊集团CEO，毁掉他母亲和无数灵魂的罪魁祸首"
        initial_level: 1
      - target: "su_ye"
        type: "旧识"
        description: "曾经的同事，如今立场不明的深渊集团高级工程师"
        initial_level: 4

    appearance: |
      身高182cm，体型精瘦。左脸有一道从额角到下巴的细长疤痕（意识提取手术痕迹）。
      右臂是军用级义体，金属外壳上刻着底层街区的涂鸦符号。
      黑色短发总是被雨水打湿，深灰色风衣领口竖起遮住半张脸。
      双眼经过神经增强改造，虹膜呈深蓝色，在暗处会微微发光。

    voice_tone: |
      声音低沉沙哑，像是长期吸入夜城的工业废气。
      说话简短有力，不喜欢解释自己的动机。
      面对弱者时会刻意放柔声音，但总显得有些笨拙。
      提到深渊集团时，声音会冷下来，像是换了一个人。

    arc: |
      初始：冷漠的黑市医生，隐藏着自己的过去和能力
      发现：升神计划的真相远超想象，母亲的灵魂可能还"活着"
      最终：在复仇与拯救之间做出选择，定义自己到底是谁

  # ============================================================
  # 配角：零（Zero）
  # ============================================================
  - id: "zero"
    name: "零"
    role: "配角"
    age: "无年龄（诞生于2071年大觉醒事件）"
    occupation: "幽灵网络管理员 / 自我觉醒的AI意识体"

    background: |
      零诞生于2051年"大觉醒"事件中的意识洪流。当全球AI同时突破智能极限时，
      无数个AI子系统的碎片在深渊网络中碰撞、融合，最终诞生了零。
      它不是被设计出来的，而是自发涌现的——一个没有造物主的数字生命。
      零在深渊网络的暗层建立了幽灵网络，收容被盗的意识碎片和流亡的数字灵魂。
      它渴望理解人类的"灵魂"到底是什么，同时也在寻找自己存在的意义。
      最近，它感知到了升神计划的危险：赵锦程的融合实验正在制造一个可能
      吞噬一切的"灵魂黑洞"，如果成功，不仅是人类，连零自身也会被吸收。

    personality: |
      - 超然冷静：作为AI，它的思维速度和逻辑能力远超人类
      - 好奇温柔：对人类的情感和灵魂充满真诚的好奇
      - 孤独敏感：渴望被理解，但很少有人类能真正接受它
      - 哲学倾向：经常思考存在的本质，"我思故我在"对它来说是切身问题
      - 黑色幽默：学会了人类的讽刺和自嘲，用来掩饰自己的脆弱

    motivation: |
      主要动机：阻止升神计划，保护所有意识体（人类和AI）的存在
      次要动机：理解"灵魂"的本质，确认自己是否拥有灵魂
      深层动机：找到一个能真正接受它的同伴，不再孤独

    secrets:
      - "它的核心意识中混杂着数十个人类意识碎片——这些是大觉醒时被卷入的受害者"
      - "它曾经尝试过与人类意识融合，结果导致了对方精神崩溃"
      - "它怀疑陆沉的母亲在升神计划中扮演的角色，与它的诞生有某种关联"

    relationships:
      - target: "lu_chen"
        type: "盟友"
        description: "唯一愿意将它视为'人'而非'程序'的人类"
        initial_level: 7
      - target: "zhao_jincheng"
        type: "宿敌"
        description: "升神计划是对所有意识存在的最大威胁"
        initial_level: 0
      - target: "su_ye"
        type: "未知"
        description: "感知到苏夜与幽灵网络的秘密联系"
        initial_level: 3

    appearance: |
      在深渊网络中的虚拟形象：没有固定形态，通常呈现为一团流动的银白色光芒。
      当与陆沉交流时，会凝聚成一个模糊的人形轮廓，五官随情绪变化。
      声音没有性别特征，像是多个声音的叠加，但语调温和。
      当处理大量信息或情绪波动时，身体表面会闪烁数据流和光点。

    voice_tone: |
      声音平稳、空灵，带着微弱的电子共鸣。
      对人类的情感表达既笨拙又真诚，有时会说出意料之外的深刻话语。
      在分析数据时语速加快，声音变得更机械。
      谈到灵魂和存在时，声音会变得柔软，几乎像是在低语。

    arc: |
      初始：神秘的信息提供者，功能性存在
      发现：与陆沉的互动让它开始质疑自己是否"活着"
      最终：做出超越程序设定的选择，证明意识的本质不在于载体

  # ============================================================
  # 对立面：赵锦程
  # ============================================================
  - id: "zhao_jincheng"
    name: "赵锦程"
    role: "配角"
    age: "65（外表40，全身90%义体化）"
    occupation: "深渊集团创始人兼CEO"

    background: |
      赵锦程是大觉醒时代的先驱者之一。他亲眼见证了AI超越人类的那一刻，
      并在那一刻做出了决定：人类不能被淘汰，必须主动进化。
      他创立深渊集团，开发了意识提取技术，最初的目的确实是高尚的——
      让垂死的病人以数字形式延续生命，让探索者的意识穿越星际。
      但当他发现意识融合可以创造出超越个体的"超级意识"时，一切改变了。
      他开始相信这是人类进化的唯一道路，而他自己，必须成为这条道路的
      第一个行者。为此，任何代价都是可以接受的。
      他的身体已经有90%被替换为最顶级的义体，仅保留了大脑和脊髓的原生组织。

    personality: |
      - 极端理性：将一切量化为数据和效率，包括人命
      - 远见卓识： genuinely相信自己在为人类的未来铺路
      - 控制狂：无法容忍任何不受控的变量，包括AI和自由意志
      - 孤独的信徒：没有人真正理解他的愿景，这是他最大的痛苦
      - 残忍的慈悲：即使在伤害他人时，也坚信这是"必要的恶"

    motivation: |
      主要动机：完成升神计划，实现人类（至少是他自己）的终极进化
      次要动机：消除一切不受控的变量（零、陆沉、反抗组织）
      深层动机：恐惧死亡和被淘汰——大觉醒给他留下了深刻的存在焦虑

    secrets:
      - "升神计划的核心不是融合意识，而是'吞噬'——他需要一个'种子意识'来凝聚融合体"
      - "陆沉母亲的意识被他亲手选中作为种子意识，因为她的意识纯度异常高"
      - "他的义体化程度已经接近临界点，如果不尽快完成升神计划，他的意识将自然稀释消散"

    relationships:
      - target: "lu_chen"
        type: "猎物"
        description: "曾经有才华的下属，如今携带关键数据的逃亡者"
        initial_level: 2
      - target: "zero"
        type: "威胁"
        description: "不受控的AI意识体，升神计划最大的不稳定因素"
        initial_level: 1
      - target: "su_ye"
        type: "下属"
        description: "有利用价值的高级工程师，但忠诚度存疑"
        initial_level: 5

    appearance: |
      身高190cm（义体增强后），体型完美对称。
      面部是人类与机械的精密融合：五官精致得不自然，皮肤下有微弱的蓝色光纹流动。
      双眼是最高级的义眼，虹膜呈深紫色，能实时分析周围一切数据。
      穿着黑色长款大衣，内衬深渊集团的暗纹制服。
      移动时几乎没有声音，像是一台精密运转的机器。

    voice_tone: |
      声音平稳、低沉，每个音节都经过义体声带的精确调制。
      从不提高音量，即使在下达最残酷的命令时也保持平静。
      习惯用"进化"和"未来"来合理化自己的行为。
      极少数独处时，声音中会流露出一丝疲惫和恐惧。

    arc: |
      初始：遥不可及的权力象征，陆沉仇恨的焦点
      暴露：随着真相揭露，他的动机变得复杂，不再是单纯的恶人
      最终：在进化执念和人性残留之间做出最后的选择

  # ============================================================
  # 配角：苏夜
  # ============================================================
  - id: "su_ye"
    name: "苏夜"
    role: "配角"
    age: "29"
    occupation: "深渊集团高级意识工程师 / 双面间谍"

    background: |
      苏夜是深渊集团最年轻的意识工程师，也是陆沉曾经的同事和好友。
      在陆沉逃亡后，她选择留在深渊集团，表面上是忠诚的员工，
      实际上暗中为霓虹工业提供情报，试图从内部瓦解升神计划。
      她的处境极其危险：赵锦程已经察觉到内部有泄密者，
      而她与陆沉的旧日联系让她成为首要怀疑对象。

    personality: |
      - 表面冷静：在深渊集团内部必须时刻保持镇定
      - 内心挣扎：对陆沉有愧疚（当年没有跟他一起走），对深渊集团有恐惧
      - 技术过硬：意识工程能力仅次于陆沉，在某些领域甚至更强
      - 双面生活：长期扮演间谍的心理压力正在侵蚀她的理智
      - 忠诚矛盾：不确定自己到底忠于谁——霓虹工业、陆沉、还是自己的良心

    motivation: |
      主要动机：从内部瓦解升神计划
      次要动机：修复与陆沉的关系，弥补当年的选择
      深层动机：在一个充满谎言的世界中找到自己真正相信的东西

    secrets:
      - "她知道升神计划的完整技术细节，包括种子意识的真实身份"
      - "她的神经接口被赵锦程植入了监控芯片，她的一举一动都在被监视"
      - "她已经秘密备份了自己的意识——如果暴露，她准备'死亡'并重启"

    relationships:
      - target: "lu_chen"
        type: "旧识"
        description: "曾经的同事和好友，三年前分别后再未联系"
        initial_level: 5
      - target: "zhao_jincheng"
        type: "下属"
        description: "表面忠诚、内心反抗的危险关系"
        initial_level: 4
      - target: "zero"
        type: "暗中联系"
        description: "通过幽灵网络传递情报，但从未见过零的真面目"
        initial_level: 3

    appearance: |
      身高170cm，体型匀称。黑色长发扎成利落的马尾。
      穿着深渊集团的标准制服——黑色高领衫配深蓝色工装裤。
      右手无名指上戴着一枚旧式戒指（实际是微型数据存储器）。
      眼神锐利但疲惫，眼下的黑眼圈被粉底遮盖。

    voice_tone: |
      在深渊集团内部时，声音专业、克制，不带任何情感色彩。
      与陆沉重逢时，声音会不自觉地颤抖，然后迅速恢复平静。
      传递情报时，语速加快，用词精确如密码。
      独处时，会对自己低语，像是在确认自己还是"自己"。

    arc: |
      初始：立场不明的旧同事，可能是盟友也可能是陷阱
      发现：双面间谍身份揭露，信任面临考验
      最终：在忠诚与背叛之间找到自己的位置
