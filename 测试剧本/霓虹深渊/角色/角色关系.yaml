# 角色关系
# 定义角色之间的关系网络和动态变化规则

# ============================================================
# 关系定义
# ============================================================
relationships:
  - source: "lu_chen"
    target: "zero"
    type: "盟友"
    description: |
      陆沉是唯一将零视为"人"而非"程序"的存在。零则用信息和资源
      支持陆沉的调查。两人在幽灵网络的暗层建立了超越人类-AI界限的信任。
      但陆沉内心深处仍然对零的真实意图保持警惕。
    initial_level: 6
    dynamic: true
    development:
      - trigger: "零主动暴露核心意识中的碎片"
        change: "信任加深，关系升至8"
        scene: "scene_02"
      - trigger: "发现零的意识中含有人类碎片"
        change: "陆沉质疑零的本质，关系降至4"
        scene: "scene_03"

  - source: "lu_chen"
    target: "zhao_jincheng"
    type: "仇敌"
    description: |
      陆沉对赵锦程的仇恨源自母亲被强制提取灵魂的创伤。
      随着调查深入，他发现赵锦程的动机比想象中更复杂，
      但仇恨并未因此减少——理解不等于原谅。
    initial_level: 1
    dynamic: true
    development:
      - trigger: "得知母亲的灵魂被用作种子意识"
        change: "仇恨达到顶点，关系降至0"
        scene: "scene_03"
      - trigger: "发现赵锦程自身的困境"
        change: "仇恨中夹杂复杂情感，关系微升至1"
        scene: "scene_04"

  - source: "lu_chen"
    target: "su_ye"
    type: "旧识"
    description: |
      陆沉和苏夜曾是深渊集团的同事，也是为数不多的朋友。
      三年前的分别让两人走上了不同的道路。重逢时，
      旧日的信任与当下的猜疑交织，让关系变得微妙。
    initial_level: 4
    dynamic: true
    development:
      - trigger: "苏夜揭示双面间谍身份"
        change: "信任重建但充满张力，关系升至6"
        scene: "scene_02"
      - trigger: "苏夜提供关键情报"
        change: "信任加深，关系升至8"
        scene: "scene_03"

  - source: "zero"
    target: "zhao_jincheng"
    type: "宿敌"
    description: |
      零将升神计划视为对所有意识存在的终极威胁。
      赵锦程则将零视为不受控的变量，必须消除。
      两者之间的对抗超越了个人恩怨，是两种存在哲学的碰撞。
    initial_level: 0
    dynamic: false

  - source: "zero"
    target: "su_ye"
    type: "暗中联系"
    description: |
      苏夜通过幽灵网络向零传递深渊集团的情报，
      但两人从未在虚拟空间或现实中直接见面。
      零对苏夜保持警惕，不确定她的真实立场。
    initial_level: 3
    dynamic: true
    development:
      - trigger: "苏夜暴露身份后与零直接联系"
        change: "建立直接联系，关系升至5"
        scene: "scene_03"

  - source: "su_ye"
    target: "zhao_jincheng"
    type: "下属"
    description: |
      苏夜表面上是赵锦程的得力助手，实际上时刻准备背叛。
      赵锦程对她的能力很欣赏，但也察觉到她的异常。
      这种表面忠诚下的暗流是推动剧情的关键张力。
    initial_level: 4
    dynamic: true
    development:
      - trigger: "赵锦程开始怀疑内部泄密"
        change: "关系紧张，降至2"
        scene: "scene_02"
      - trigger: "苏夜身份暴露"
        change: "彻底敌对，降至0"
        scene: "scene_03"

# ============================================================
# 关系类型定义
# ============================================================
relationship_types:
  - id: "ally"
    name: "盟友"
    description: "为了共同目标而合作的伙伴"
    min_level: 0
    max_level: 10

  - id: "enemy"
    name: "仇敌"
    description: "利益和信念根本对立的双方"
    min_level: 0
    max_level: 10

  - id: "acquaintance"
    name: "旧识"
    description: "有历史渊源但当前关系复杂"
    min_level: 0
    max_level: 10

  - id: "subordinate"
    name: "下属"
    description: "上下级关系，可能存在忠诚或背叛"
    min_level: 0
    max_level: 10

  - id: "hidden_contact"
    name: "暗中联系"
    description: "秘密的情报或信息交换关系"
    min_level: 0
    max_level: 10

# ============================================================
# 关系变化规则
# ============================================================
change_rules:
  - rule_id: "trust_break"
    description: "发现被欺骗时，信任大幅下降"
    condition: "发现被欺骗"
    change: -3
    max_level: 10
    min_level: 0

  - rule_id: "trust_rebuild"
    description: "对方做出牺牲/坦诚时，信任恢复"
    condition: "对方做出牺牲或坦诚"
    change: +2
    max_level: 10
    min_level: 0

  - rule_id: "shared_risk"
    description: "共同经历危险后，关系加深"
    condition: "共同经历危险"
    change: +1
    max_level: 10
    min_level: 0

  - rule_id: "soul_bond"
    description: "意识层面的深度连接会大幅提升关系"
    condition: "发生意识融合或深度链接"
    change: +3
    max_level: 10
    min_level: 0
