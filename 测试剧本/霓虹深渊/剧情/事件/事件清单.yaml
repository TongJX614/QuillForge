# 事件清单
# 定义影响剧情流程但不分岔的普通事件

events:
  # ============================================================
  # 事件1：义体排异
  # ============================================================
  - id: "event_01"
    name: "义体排异"
    type: "随机"
    description: "陆沉的军用义体在高压环境下出现短暂的排异反应"

    trigger_conditions:
      - type: "随机触发"
        value: "进入scene_02时"
        probability: 0.7

    location: "深渊网络"
    time: "scene_02进行中"
    characters_involved:
      - "lu_chen"

    content: |
      你的右臂义体突然发出一阵刺耳的警报声，金属外壳下的接口处渗出微量冷却液。
      排异反应——在深渊网络中长时间潜行会导致神经接口过载，
      进而引发义体系统的不稳定。
      更令人不安的是，在排异的瞬间，你感觉到右臂深处有一阵微弱的温度变化，
      像是某个被深藏的意识碎片在试图苏醒。
      "陆沉，你的神经负载已经接近临界值，"零的声音传来，"建议降低潜行深度。"

    choices:
      - id: "suppress_reaction"
        text: "压制排异反应，继续潜行"
        consequences: "你强行维持潜行状态，但义体损伤加重"
      - id: "check_arm"
        text: "检查右臂中的异常"
        consequences: "你发现义体中确实存在一个微弱的意识碎片——来自你的母亲"

    rewards:
      - type: "线索"
        value: "义体中隐藏的意识碎片可能是母亲的残留"

    repeatable: false
    cooldown: 0

  # ============================================================
  # 事件2：幽灵低语
  # ============================================================
  - id: "event_02"
    name: "幽灵低语"
    type: "探索"
    description: "在数据废墟层中听到被困灵魂的碎片化低语"

    trigger_conditions:
      - type: "场景触发"
        value: "在scene_02中探索特定区域"

    location: "深渊网络·数据废墟层"
    time: "scene_02进行中"
    characters_involved:
      - "lu_chen"
      - "zero"

    content: |
      你走进一片由损坏代码构成的废墟，突然听到无数微弱的声音叠加在一起：
      "救救我们...好痛...不要融合..."
      "我记得阳光...我记得风...我记得我的名字..."
      "327号...328号...编号取代了名字..."
      零沉默了一会儿，然后说："这些是升神计划受害者的灵魂碎片。
      他们的意识被从身体中提取后，就一直在深渊网络的边缘漂流。"
      你握紧了拳头。这些不是数据——这些是人。

    choices:
      - id: "record_fragments"
        text: "记录这些灵魂碎片的位置"
        consequences: "你保存了碎片坐标，也许将来能回来救他们"
      - id: "promise_rescue"
        text: "对他们说：'我会回来救你们的'"
        consequences: "你不知道自己能否兑现这个承诺，但你需要说出来"

    rewards:
      - type: "证据"
        value: "升神计划受害者的灵魂碎片坐标记录"

    repeatable: false
    cooldown: 0

  # ============================================================
  # 事件3：苏夜的警告
  # ============================================================
  - id: "event_03"
    name: "苏夜的警告"
    type: "日常"
    description: "苏夜在重逢前通过加密频道发出警告"

    trigger_conditions:
      - type: "场景触发"
        value: "进入scene_02前"

    location: "陆沉的地下诊所"
    time: "scene_02开始前"
    characters_involved:
      - "lu_chen"
      - "su_ye"

    content: |
      你的加密通讯器突然震动了一下。屏幕上出现一段被层层加密的消息，
      解密后只有短短一行字：
      "别来。他们在等你。——S.Y."
      S.Y.——苏夜。三年了，这是她第一次联系你。
      紧接着第二条消息传来：
      "但如果你一定要来...午夜零点，废墟层第七节点。我在那里等你。"
      "不要相信任何看起来太美好的东西。"

    choices:
      - id: "analyze_message"
        text: "分析消息的加密层，确认是否真是苏夜"
        consequences: "你确认消息来源是苏夜的深渊集团内部终端"
      - id: "trust_message"
        text: "直接相信消息，按时前往"
        consequences: "你选择相信旧友，但内心仍有疑虑"

    rewards:
      - type: "信息"
        value: "苏夜仍然活着，且在深渊集团内部保持活跃"

    repeatable: false
    cooldown: 0

  # ============================================================
  # 事件4：母亲的歌
  # ============================================================
  - id: "event_04"
    name: "母亲的歌"
    type: "日常"
    description: "在潜行过程中，义体中传来一段熟悉的旋律"

    trigger_conditions:
      - type: "随机触发"
        value: "在scene_02潜行深入时"
        probability: 0.5

    location: "深渊网络"
    time: "scene_02进行中"
    characters_involved:
      - "lu_chen"

    content: |
      在深渊网络的寂静中，你的右臂义体突然发出一阵微弱的振动。
      不是警报，不是故障——是一段旋律。
      一首摇篮曲。你母亲常唱的摇篮曲。
      你已经二十年没有听到过这首歌了。
      旋律断断续续，像是从很远很远的地方传来，
      但每一个音符都清晰地在你脑海中回响。
      你的眼眶一热。这不是数据错误。
      这是她。她还在。

    choices:
      - id: "listen_song"
        text: "闭上眼睛，静静地听完"
        consequences: "你让自己在这一刻做回那个孩子，听完母亲的歌"
      - id: "suppress_emotion"
        text: "压下情绪，继续任务"
        consequences: "你关闭了义体的音频输出，但旋律似乎还在心底回响"

    rewards:
      - type: "情感"
        value: "确认母亲的灵魂碎片确实存在于你的义体中"

    repeatable: false
    cooldown: 0
