# 关键选择
# 定义影响世界线和结局的关键抉择点

choices:
  # ============================================================
  # 选择1：数据处理方式
  # ============================================================
  - id: "choice_01"
    scene_id: "scene_01"
    prompt: "手术台上，改造者的义体正在失控，他的神经接口闪烁着异常的蓝光。你怎么处理？"
    description: "面对可能是深渊集团最高机密的数据，你的第一反应是什么？"

    options:
      - id: "extract_data"
        text: "提取神经接口中的数据"
        description: "数据可能很危险，但也可能是揭露真相的钥匙"
        consequences:
          immediate: "你小心翼翼地提取了数据，改造者在过程中失去了生命体征"
          delayed: "你获得了升神计划的部分数据，但改造者的死让你内心不安"
          stats_changes:
            ruthlessness: +2
            curiosity: +1
        personality_impact: "展现你冷静果断、任务优先的一面"
        relationship_changes: []
        leads_to_ending: null

      - id: "save_patient"
        text: "先救他的命"
        description: "生命比数据重要——但你可能错过这个机会"
        consequences:
          immediate: "你全力抢救改造者，稳定了他的义体系统"
          delayed: "改造者醒来后告诉你一些关于升神计划的碎片信息，但不完整"
          stats_changes:
            compassion: +2
            humanity: +1
        personality_impact: "展现你内心柔软、重视生命的一面"
        relationship_changes:
          - character: "zero"
            change: +1
            reason: "零对你的选择表示理解"
        leads_to_ending: null

      - id: "contact_zero"
        text: "联系零，询问这段数据的来历"
        description: "让零帮你分析，但你不确定是否该暴露这个发现"
        consequences:
          immediate: "零迅速分析了数据，告诉你这是升神计划的核心密钥片段"
          delayed: "零对这段数据产生了异常的共鸣，你们的关系因此加深"
          stats_changes:
            intelligence: +2
            trust: +1
        personality_impact: "展现你善于借助盟友力量的一面"
        relationship_changes:
          - character: "zero"
            change: +2
            reason: "零感激你对它的信任"
        leads_to_ending: "ending_03"

  # ============================================================
  # 选择2：苏夜的信任
  # ============================================================
  - id: "choice_02"
    scene_id: "scene_02"
    prompt: "苏夜的加密影像出现在你面前，她告诉你她是双面间谍，带来了关于升神计划的真相。你相信她吗？"
    description: "三年未联系的旧友突然揭示惊人身份，信任还是怀疑？"

    options:
      - id: "trust_suye"
        text: "相信苏夜，与她合作"
        description: "她是旧友，但三年的沉默能轻易被原谅吗？"
        consequences:
          immediate: "苏夜松了一口气，将升神计划的完整技术细节交给你"
          delayed: "你获得关键情报，但苏夜因泄密被赵锦程怀疑"
          stats_changes:
            trust: +3
            courage: +1
        personality_impact: "展现你愿意信任、敢于冒险的一面"
        relationship_changes:
          - character: "su_ye"
            change: +3
            reason: "苏夜被你的信任感动"
        leads_to_ending: "ending_02"

      - id: "doubt_suye"
        text: "质疑苏夜的动机"
        description: "双面间谍的话能信几分？这可能是深渊集团的陷阱"
        consequences:
          immediate: "苏夜的表情变得复杂，她理解你的怀疑但无法证明自己的清白"
          delayed: "你依靠自己和零的能力行动，情报有限但保全了苏夜的安全"
          stats_changes:
            caution: +2
            self_preservation: +1
        personality_impact: "展现你冷静、不轻易被情感左右的一面"
        relationship_changes:
          - character: "su_ye"
            change: -2
            reason: "苏夜感到失望，但理解你的谨慎"
        leads_to_ending: "ending_01"

  # ============================================================
  # 选择3：最终抉择
  # ============================================================
  - id: "choice_03"
    scene_id: "scene_03"
    prompt: "赵锦程站在融合装置前，数百个灵魂在他身后旋转。他转身看着你：'你来了，陆沉。你打算怎么做？'你怎么选择？"
    description: "在深渊的核心，面对灵魂收割者和被困的灵魂们，你的选择将决定一切"

    options:
      - id: "destroy_project"
        text: "摧毁融合装置"
        description: "释放所有灵魂，但可能导致他们的意识在释放过程中崩溃"
        consequences:
          immediate: "你引爆EMP装置，融合装置过载崩溃，灵魂数据四散"
          delayed: "大部分灵魂崩溃消散，赵锦程的义体系统瘫痪，但母亲的灵魂也找不到了"
          stats_changes:
            ruthlessness: +3
            vengeance: +2
        personality_impact: "展现你宁可摧毁一切也不妥协的复仇意志"
        relationship_changes:
          - character: "zhao_jincheng"
            change: -5
            reason: "赵锦程的毕生心血被你摧毁"
        leads_to_ending: "ending_01"

      - id: "save_mother"
        text: "优先救出母亲的灵魂"
        description: "这是你一直以来的执念，但其他灵魂怎么办？"
        consequences:
          immediate: "你打开种子意识的灵匣，母亲的灵魂涌入你的神经接口"
          delayed: "融合装置失去核心后崩溃，其他灵魂部分得救部分消散"
          stats_changes:
            love: +3
            selfishness: +1
        personality_impact: "展现你最深层的执念——为了母亲可以放弃一切"
        relationship_changes:
          - character: "zero"
            change: -1
            reason: "零理解你的选择，但为其他灵魂感到惋惜"
        leads_to_ending: "ending_02"

      - id: "merge_with_zero"
        text: "与零融合，从内部瓦解升神计划"
        description: "需要冒极大的风险——你的意识可能与零永远融为一体"
        consequences:
          immediate: "你向零敞开神经接口，两个意识开始融合"
          delayed: "你和零以共生体从内部解构融合装置，安全释放所有灵魂"
          stats_changes:
            sacrifice: +3
            transcendence: +3
        personality_impact: "展现你愿意超越自我、为所有人牺牲的终极勇气"
        relationship_changes:
          - character: "zero"
            change: +5
            reason: "零与你融为一体，你们的信任达到了极致"
        leads_to_ending: "ending_03"
        unlock_conditions:
          - "在scene_01选择contact_zero"
          - "在scene_02选择trust_suye"
