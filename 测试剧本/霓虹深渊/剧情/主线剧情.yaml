# 主线剧情
# 定义故事的主要脉络

main_plot:
  # ============================================================
  # 剧情概要
  # ============================================================
  summary: |
    2092年，黑市义体医生陆沉在一次看似普通的救治中，从一个濒死改造者的
    神经接口里发现了来自深渊集团"升神计划"的加密数据。在AI盟友"零"的
    帮助下，他追踪数据来源，潜入深渊网络，与曾经的同事苏夜重逢——她揭示
    了一个令陆沉崩溃的真相：升神计划的核心"种子意识"，竟是他以为早已
    被销毁的母亲的灵魂。面对灵魂收割者赵锦程和即将完成的升神计划，
    陆沉必须在复仇、拯救和自我牺牲之间做出最终选择。

  themes:
    - "灵魂的定义 — 当意识可以被提取、融合、数字化，'灵魂'还存在吗？"
    - "进化的代价 — 人类的进步是否可以建立在牺牲弱者的基础上？"
    - "存在的边界 — AI拥有意识吗？数字化的灵魂还是原来的灵魂吗？"

  core_conflict: |
    陆沉的核心冲突是：复仇 vs 拯救。
    摧毁升神计划意味着复仇，但可能导致数百个灵魂在过程中崩溃；
    拯救母亲的灵魂是他的执念，但需要放弃其他灵魂；
    与零融合可能拯救所有人，但代价是失去自己——他还是他吗？
    这个冲突在场景3（深渊）达到顶点。

  # ============================================================
  # 剧情阶段
  # ============================================================
  stages:
    # 第一阶段：发现
    - stage_id: "stage_01"
      name: "发现"
      description: "一个濒死的改造者带来的连锁反应"
      scenes:
        - "scene_01"
      key_events:
        - "陆沉救治底层改造者"
        - "发现神经接口中的升神计划数据"
        - "零首次联系陆沉"
        - "决定深入调查"
      emotional_arc: "冷漠 → 好奇 → 震动"

    # 第二阶段：潜行
    - stage_id: "stage_02"
      name: "潜行"
      description: "深渊网络中的真相与重逢"
      scenes:
        - "scene_02"
      key_events:
        - "陆沉潜入深渊网络"
        - "苏夜揭示双面间谍身份"
        - "发现种子意识是母亲的灵魂"
        - "升神计划进入倒计时"
      emotional_arc: "紧张 → 震惊 → 崩溃"

    # 第三阶段：深渊
    - stage_id: "stage_03"
      name: "深渊"
      description: "在深渊核心面对一切的终极对峙"
      scenes:
        - "scene_03"
      key_events:
        - "陆沉潜入深渊塔核心"
        - "与赵锦程正面对峙"
        - "了解升神计划的完整真相"
        - "做出最终选择"
      emotional_arc: "坚定 → 动摇 → 抉择"

    # 第四阶段：回响
    - stage_id: "stage_04"
      name: "深渊之歌"
      description: "选择的代价与余响"
      scenes:
        - "scene_04"
      key_events:
        - "根据选择进入不同结局"
        - "每个结局的代价与收获"
        - "故事主题的最终呈现"
      emotional_arc: "释然/悲痛/超越（取决于结局）"

  # ============================================================
  # 剧情节拍
  # ============================================================
  beats:
    - beat_id: "beat_01"
      name: "暗巷来客"
      description: "一个濒死的改造者被送到陆沉的诊所"
      scene: "scene_01"
      purpose: "建立赛博朋克世界观，展现陆沉的冷硬与内核柔软"

    - beat_id: "beat_02"
      name: "加密数据"
      description: "在修复义体的过程中发现升神计划的加密数据"
      scene: "scene_01"
      purpose: "制造悬念，暗示更大的阴谋"

    - beat_id: "beat_03"
      name: "幽灵来信"
      description: "零通过加密通讯联系陆沉，提供初步情报"
      scene: "scene_01"
      purpose: "引入零的角色，建立盟友关系"

    - beat_id: "beat_04"
      name: "数据废墟"
      description: "陆沉潜入深渊网络，在废弃数据构成的荒原中探索"
      scene: "scene_02"
      purpose: "展现深渊网络的视觉奇观，加深世界观沉浸感"

    - beat_id: "beat_05"
      name: "旧友重逢"
      description: "苏夜以加密形象出现，揭示双面间谍身份"
      scene: "scene_02"
      purpose: "制造信任危机，增加叙事张力"

    - beat_id: "beat_06"
      name: "种子意识"
      description: "苏夜揭示种子意识的真正身份是陆沉的母亲"
      scene: "scene_02"
      purpose: "故事核心情感爆点，打破主角和玩家的认知"

    - beat_id: "beat_07"
      name: "深渊之门"
      description: "陆沉潜入深渊塔，面对升神计划的核心"
      scene: "scene_03"
      purpose: "建立最终对峙的压迫感"

    - beat_id: "beat_08"
      name: "灵魂收割者"
      description: "与赵锦程的正面对峙和哲学辩论"
      scene: "scene_03"
      purpose: "挑战玩家的价值观，让选择变得真正困难"

    - beat_id: "beat_09"
      name: "最终选择"
      description: "陆沉做出决定，命运走向终点"
      scene: "scene_03"
      purpose: "玩家代入感的最高点"

    - beat_id: "beat_10"
      name: "深渊之歌"
      description: "结局呈现，选择的代价在霓虹灯下显现"
      scene: "scene_04"
      purpose: "主题升华，留下思考空间"

  # ============================================================
  # 剧情钩子
  # ============================================================
  hooks:
    - hook_id: "hook_01"
      type: "悬念钩子"
      description: "濒死改造者体内的加密数据，来自深渊集团的最高机密"
      scene: "scene_01"

    - hook_id: "hook_02"
      type: "情感钩子"
      description: "母亲的灵魂没有消失，而是被用作了最残酷实验的核心"
      scene: "scene_02"

    - hook_id: "hook_03"
      type: "道德钩子"
      description: "赵锦程的愿景并非完全邪恶，人类进化的代价到底是什么？"
      scene: "scene_03"

    - hook_id: "hook_04"
      type: "存在钩子"
      description: "与AI融合后，你还是你吗？灵魂的本质是什么？"
      scene: "scene_03"

    - hook_id: "hook_05"
      type: "结局钩子"
      description: "每个选择都有代价，没有完美结局——就像真正的人生"
      scene: "scene_04"
