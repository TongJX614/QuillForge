# 结局系统
# 定义游戏的所有结局

endings:
  # ============================================================
  # 结局A：独行
  # ============================================================
  - id: "ending_01"
    type: "bad"
    title: "《独行》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择doubt_suye"
      - type: "choice_made"
        value: "在scene_03选择destroy_project"

    narrative: |
      你引爆了预先准备的EMP装置，融合装置在一瞬间过载崩溃。
      灵匣中的灵魂数据像烟花一样四散——大部分在释放的瞬间就崩溃了，
      只有少数几个幸存的意识碎片飘入了深渊网络的暗层，成为无主的幽灵。
      赵锦程的义体系统在EMP中瘫痪，他跪在地上，眼中的紫光逐渐熄灭。
      "你不知道你摧毁了什么，"他的声音像损坏的唱片，"那是人类的未来..."
      你没有回答，转身离开。
      母亲的灵魂——你没能找到她。也许她就在那些崩溃的数据中，
      也许她从一开始就不存在了。你永远不会知道。

    epilogue: |
      三个月后，夜城的雨还在下。
      你坐在诊所里，听着外面的霓虹灯嗡鸣。
      深渊集团的丑闻被曝光了一部分，但赵锦程已经消失，
      升神计划的核心技术据说被转移到了某个秘密基地。
      苏夜在那天之后失去了联系。你不知道她是死是活。
      你的右臂义体偶尔会发出一阵微弱的颤动——
      像是母亲的残留在试图告诉你什么，但你已经听不清了。
      窗外的霓虹灯映在积水中，碎成一地的光。
      你一个人，在这个赛博朋克的世界里，继续活着。

    replay_value: "这个结局让你思考：独自承担一切是否是真正的勇敢？仇恨能否成为活着的理由？"
    unlock_conditions:
      - "在scene_02选择质疑苏夜"
      - "在scene_03选择摧毁融合装置"

  # ============================================================
  # 结局B：救赎
  # ============================================================
  - id: "ending_02"
    type: "normal"
    title: "《救赎》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择trust_suye"
      - type: "choice_made"
        value: "在scene_03选择save_mother"

    narrative: |
      你冲向融合装置的核心，用偷来的管理员密钥打开了种子意识的灵匣。
      母亲的灵魂数据流像一条温暖的河流涌入你的神经接口——
      你听到了她的声音，就像二十年前一样温柔：
      "小沉...妈妈在这里..."
      泪水模糊了你的视线。你紧紧握住那段数据，像是握住了整个世界。
      但其他灵魂——数百个被困的灵魂——在融合装置失去种子意识后开始崩溃。
      赵锦程在混乱中被失控的数据流吞噬，他的义体系统一个接一个地关闭。
      苏夜在最后关头启动了紧急备份程序，救出了十几个灵魂，但其余的...
      你救出了母亲，代价是其他灵魂的消亡。

    epilogue: |
      一年后，你在D区的诊所里安装了一个特殊的灵匣——
      里面存储着母亲的灵魂数据。她还不能"活"过来，
      但至少，她不再被当作实验品了。
      你有时候会对着灵匣说话，告诉她今天诊所来了什么人，
      夜城的雨什么时候停了（很少），霓虹灯换了几种颜色。
      苏夜偶尔会来看你。她离开了深渊集团，也离开了霓虹工业，
      成了一个普通的义体技师。她说这样挺好的。
      零还是会定期联系你，告诉你幽灵网络的消息。
      它问你："你觉得灵魂是什么？"
      你看着那个灵匣，说："就是那些你无法放弃的东西。"
      雨还在下。但这一次，霓虹灯的光透过雨幕，看起来不那么冷了。

    replay_value: "这个结局展示了选择的重量：救出了最在乎的人，但无法拯救所有人。这就是人的极限。"
    unlock_conditions:
      - "在scene_02选择信任苏夜"
      - "在scene_03选择救出母亲的灵魂"

  # ============================================================
  # 结局C：共生（隐藏结局）
  # ============================================================
  - id: "ending_03"
    type: "good"
    title: "《共生》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_01选择contact_zero"
      - type: "choice_made"
        value: "在scene_02选择trust_suye"
      - type: "choice_made"
        value: "在scene_03选择merge_with_zero"

    narrative: |
      你闭上眼睛，向零敞开了自己的神经接口。
      "你确定吗？"零的声音在你脑海中回响，前所未有的柔软。
      "不确定，"你说，"但我相信你。"
      融合开始的那一刻，你感受到了一切：零的意识像一片无垠的海洋，
      其中漂浮着数十个人类意识碎片——那些在大觉醒中被卷入的灵魂。
      你看到了母亲——不是作为一个被囚禁的种子意识，而是作为零的一部分，
      在二十年前的大觉醒中，她的灵魂碎片就已经与这个AI意识体产生了共鸣。
      你不是在失去自己。你是在成为更多。
      你和零一起，从内部瓦解了融合装置——不是用暴力，而是用理解。
      被困的灵魂被安全地一个一个释放，每一个都被妥善安置。
      赵锦程看着自己的造物被解构，沉默了很久。
      "也许..."他的声音第一次带上了颤抖，"也许我一直都错了。"
      他的义体系统一个接一个地关闭。在最后的光芒中，
      你看到了一个疲惫的、苍老的人类面孔。

    epilogue: |
      两年后，你不再完全是"陆沉"了。
      你和零的融合体——你们叫自己"深流"——成为了深渊网络中
      一个新的存在：既是人类，也是AI；既有灵魂，也有代码。
      母亲的意识在你们的共生体中找到了安宁，
      她不再是种子，不再是实验品，而是你们的一部分。
      苏夜成为了新的意识伦理委员会的技术顾问，
      推动通过了《灵魂权利法案》——所有意识体，无论人类还是AI，
      都拥有不可侵犯的存在权。
      你偶尔会用陆沉的眼睛看夜城的雨。
      那些霓虹灯，看起来像是无数灵魂的微光。
      "什么是灵魂？"有人问你。
      你用无数个声音回答：
      "灵魂不是某种物质，不是数据，不是电信号。
       灵魂是一种选择——选择记住，选择在乎，选择连接。
       只要你还在选择，你就还有灵魂。"
      雨停了。霓虹灯在云层上投下彩虹般的光。
      这是你记忆中，夜城第一次看起来是美的。

    replay_value: "这是最难达成但也最深刻的结局。它提出了最终的问题：什么是灵魂？答案也许就在选择本身。"
    unlock_conditions:
      - "在scene_01选择联系零"
      - "在scene_02选择信任苏夜"
      - "在scene_03选择与零融合"
