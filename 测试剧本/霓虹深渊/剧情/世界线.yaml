# 世界线设定
# 定义多线叙事的分支逻辑

world_lines:
  # ============================================================
  # 主线世界线
  # ============================================================
  - id: "main_line"
    name: "主线"
    description: "陆沉发现数据并追踪到深渊塔的基础路线"

    path:
      - scene_id: "scene_01"
        sequence: 1
        description: "陆沉救治改造者，发现升神计划数据"
      - scene_id: "scene_02"
        sequence: 2
        description: "潜入深渊网络，与苏夜重逢"
      - scene_id: "scene_03"
        sequence: 3
        description: "潜入深渊塔核心，与赵锦程对峙"
      - scene_id: "scene_04"
        sequence: 4
        description: "走向结局"

    key_choices:
      - "choice_01"
      - "choice_02"
      - "choice_03"

    end_ending: "ending_02"

  # ============================================================
  # 分支世界线A：复仇线
  # ============================================================
  - id: "branch_line_a"
    name: "复仇线"
    description: "陆沉选择信任苏夜，获取完整情报后直捣深渊"

    origin_scene: "scene_02"
    conditions:
      - type: "choice_made"
        value: "在scene_02选择trust_suye"

    path:
      - scene_id: "scene_02"
        sequence: 2
        description: "陆沉信任苏夜，获得升神计划完整技术细节"
      - scene_id: "scene_03"
        sequence: 3
        description: "携带完整情报潜入深渊塔，准备摧毁一切"
      - scene_id: "scene_04"
        sequence: 4
        description: "走向结局"

    consequences: "陆沉获得完整情报，但苏夜因此暴露，面临生死危机"

    end_ending: "ending_03"

  # ============================================================
  # 分支世界线B：独行线
  # ============================================================
  - id: "branch_line_b"
    name: "独行线"
    description: "陆沉不信任苏夜，独自行动"

    origin_scene: "scene_02"
    conditions:
      - type: "choice_made"
        value: "在scene_02选择doubt_suye"

    path:
      - scene_id: "scene_02"
        sequence: 2
        description: "陆沉质疑苏夜，依靠零和自己的情报独自行动"
      - scene_id: "scene_03"
        sequence: 3
        description: "情报不完整的情况下潜入深渊塔"
      - scene_id: "scene_04"
        sequence: 4
        description: "走向结局"

    consequences: "陆沉保全了苏夜的安全，但失去了关键情报，选择受限"

    end_ending: "ending_01"

  # ============================================================
  # 汇聚点
  # ============================================================
convergence_points:
    - scene_id: "scene_03"
      description: "无论选择哪条线，陆沉都会到达深渊塔核心"
      required_conditions:
        - "完成scene_02"

    - scene_id: "scene_04"
      description: "所有路线最终走向结局"
      required_conditions:
        - "完成scene_03"

  # ============================================================
  # 世界线规则
  # ============================================================
rules:
  - rule_id: "rule_01"
    name: "信任规则"
    description: "玩家在scene_02的选择决定进入复仇线还是独行线"
    condition: "在scene_02做出选择"
    effect: "进入对应的分支世界线"

  - rule_id: "rule_02"
    name: "情报规则"
    description: "复仇线获得完整情报，解锁更多选择；独行线情报有限"
    condition: "分支选择完成"
    effect: "scene_03的可用选项不同"

  - rule_id: "rule_03"
    name: "隐藏结局规则"
    description: "要进入隐藏结局，需要在多个场景中做出特定选择"
    condition: "在scene_01选择contact_zero，且在scene_02选择trust_suye，且在scene_03选择merge_with_zero"
    effect: "解锁隐藏结局'共生'"
