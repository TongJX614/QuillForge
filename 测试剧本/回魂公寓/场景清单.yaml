scenes:
  - name: "迷雾降临"
    location: "幸福里公寓，一楼大厅"
    time: "深夜 23:00"
    atmosphere: "昏黄的灯光，老式吊灯发出电流声，大门外白雾弥漫如同虚无"
    description: |
      幸福里公寓的一楼大厅保留着九十年代的装修风格——
      水磨石地面、米黄色瓷砖墙面、一台已经坏掉的信箱柜。
      前台桌上积满灰尘，墙上挂着一幅褪色的"幸福里欢迎您"标语。
      电梯是老式铁闸门款，运行时会发出令人牙酸的金属摩擦声。
      大门外，浓密的白雾从傍晚开始弥漫，现在已经完全看不见外面的街道。
      大厅角落有一台老式挂钟，指针永远停在零点差一分。
    characters_present:
      - "jiang_lin"
      - "su_wen"
      - "liu_jun"
      - "chen_amao"
      - "xiao_he"
    plot_hook: "五人各自因不同原因聚集在大厅，发现大门无法打开，手机信号全无"

  - name: "血字走廊"
    location: "幸福里公寓，三楼走廊"
    time: "次日深夜 23:30"
    atmosphere: "走廊灯忽明忽灭，墙壁渗出暗红液体，空气中弥漫铁锈和旧报纸的气味"
    description: |
      三楼走廊是公寓里最长的过道，两侧各有六扇门。
      白天看起来只是普通的老旧楼道，但入夜后，墙壁上开始渗出暗红色液体，
      液体缓缓流动，像是有一只看不见的手在墙面上写字。
      文字内容是当年住户的投诉信片段——"物业从不管事""走廊灯坏了一个月""
      六楼的王先生说要举报管理员，后来就再没见他了……"
      走廊尽头306室的门虚掩着，门缝里透出幽绿色的光。
    characters_present:
      - "jiang_lin"
      - "su_wen"
      - "liu_jun"
      - "xiao_he"
    plot_hook: "墙壁上的血字拼凑出当年的线索，所有人开始怀疑彼此来此的真正原因"

  - name: "地下室"
    location: "幸福里公寓，地下配电房"
    time: "第三天凌晨 01:00"
    atmosphere: "黑暗、潮湿、闷热，只有手电筒的光柱切割浓稠的空气"
    description: |
      地下室入口被一扇焊接封死的铁门挡住，铁门上的焊点已经生锈。
      强行打开后，里面是一个废弃的配电房，墙上布满蛛网般的老旧线路。
      地面上散落着焚烧过的文件碎片，依稀可辨"幸福里物业""维修基金"等字样。
      角落有一台老式保险柜，门半开着，里面空空如也——
      只有一个被烧得只剩一半的笔记本，记录着江德明的私人账目。
      配电房最深处有一面新砌的墙，和周围的老旧墙面格格不入，
      墙面上有一道细长的裂缝，裂缝里透出微弱的冷风。
    characters_present:
      - "liu_jun"
      - "jiang_lin"
    plot_hook: "刘军发现关键物证，江林开始意识到父亲的秘密可能比他想象的更黑暗"

  - name: "七楼之家"
    location: "幸福里公寓，不存在的七楼——701室"
    time: "第三天后，时间不定"
    atmosphere: "诡异而温馨——完全正常的家居环境，但桌上摆着五副碗筷，饭菜冒着热气却无人食用"
    description: |
      幸福里公寓只有六层，但小何在楼梯间迷路后，
      发现自己站在了一扇贴着"福"字的防盗门前，门牌号：701。
      推门而入，是一间布置温馨的三居室——客厅里有老式电视机、
      墙上挂着全家福照片（一家五口，笑容灿烂）、
      餐桌上摆着五菜一汤，米饭盛好了，筷子整齐地放在碗旁。
      一切都像是一家人正要吃晚饭的样子，但房间里空无一人。
      最里面那间房的门虚掩着，门把手上挂着一个布偶——
      是一只手缝的小兔子，耳朵缺了一只。
      小何的手机在这时突然亮了，订单状态变为："已送达，请确认。"
    characters_present:
      - "xiao_he"
    plot_hook: "小何独自在701室的经历成为整个故事最具冲击力的场景之一"

  - name: "第十三层"
    location: "幸福里公寓，不存在的第十三层"
    time: "午夜 00:00（时间停滞）"
    atmosphere: "空间扭曲，走廊无限延伸，空气中混合煤气味、焦糊味和若有若无的哭声"
    description: |
      电梯门打开，五人走出电梯，发现自己身处一个与公寓结构相同但氛围截然不同的楼层。
      走廊的墙壁上贴满了1994年的报纸和日历，所有日期都停在11月17日。
      头顶的灯管发出惨白的光，时不时闪烁，每次闪烁后走廊似乎变得更长。
      601室——王家的门——敞开着，门框上有被利器劈砍的痕迹。
      屋内保持着案发当晚的状态：家具倾倒、玻璃碎裂、
      客厅墙上有一个巨大的焦黑人形轮廓。
      最令人窒息的是，空气中回荡着低沉的敲击声——
      像是有人在用消防斧劈门，一下，两下，三下……永不停歇地重复。
    characters_present:
      - "jiang_lin"
      - "su_wen"
      - "liu_jun"
      - "chen_amao"
      - "xiao_he"
    plot_hook: "五人亲历惨案回放，每个人被迫面对自己与案件的关联，真相无法再被回避"

  - name: "亡者客厅"
    location: "第十三层深处，王家客厅的'另一面'"
    time: "永恒的午夜"
    atmosphere: "寂静而庄严，像是某种审判庭——五把空椅子围成一圈，中央放着五副碗筷和一只缺耳朵的布偶兔"
    description: |
      穿过十三层走廊的最深处，是一个不应该存在的开阔空间。
      它的布局像是一间放大了数十倍的客厅——
      地面上铺着九十年代常见的红色地毯，
      五把老式木椅围成一圈，每把椅子背后的墙上挂着一面镜子，
      但镜子里映出的不是站在面前的人，而是三十年前的那个夜晚。
      圆圈中央的地板上放着一个托盘，里面有五副碗筷、
      那只缺了耳朵的布偶兔、和一盘已经发霉的饺子——
      那是王家最后一顿没来得及吃完的晚饭。
      王家五口的灵体在椅子上若隐若现，
      他们的目光平静地注视着面前的五个人，等待着。
    characters_present:
      - "jiang_lin"
      - "su_wen"
      - "liu_jun"
      - "chen_amao"
      - "xiao_he"
    plot_hook: "最终对峙——王家要求真相，五人必须做出选择：承认、否认还是逃离"

  - name: "雾散之门"
    location: "幸福里公寓，一楼大厅（变化后）"
    time: "凌晨 05:30（日出将至）"
    atmosphere: "浓雾从门缝退去，第一缕晨光透过玻璃照入大厅，挂钟的指针开始走动"
    description: |
      随着真相被说出，公寓开始发生变化。
      墙面上的血字和红色液体渐渐褪去，露出下面斑驳但普通的墙面。
      走廊里回荡的铁链声和哭声渐渐平息，取而代之的是远处传来的鸟鸣。
      一楼大厅那扇始终无法打开的大门，锁芯发出一声清脆的"咔嗒"。
      门外的浓雾如潮水般退去，露出了久违的街道、路灯和远处城市的轮廓。
      挂钟的指针从零点差一分走到了六点整，发出一声悠远的钟鸣。
      大厅前台桌上的灰尘中，不知何时多了一张纸条：
      "谢谢你们，让我们终于可以走了。——王家"
    characters_present:
      - "jiang_lin"
      - "su_wen"
      - "liu_jun"
      - "chen_amao"
      - "xiao_he"
    plot_hook: "封印解除，五个人带着各自的秘密和伤疤走出公寓，迎接新的一天"
