characters:
  - id: "jiang_lin"
    name: "江林"
    role: "灵异博主"
    occupation: "自媒体恐怖内容创作者"
    personality: |
      胆子极大，为了流量可以不顾一切，表面上玩世不恭。
      实际上是个坚定的唯物主义者，认为所有灵异现象都有科学解释。
      随身携带运动相机，习惯用直播来掩饰内心的恐惧。
      说话爱开玩笑，越紧张越爱贫嘴。
    voice_tone: "轻浮、戏谑，恐惧时反而变得沉默寡言"
    backstory: |
      江林为了拍摄"全国十大凶宅"系列视频，特意来到幸福里公寓。
      他的频道最近掉粉严重，急需一个爆款视频来挽回人气。
      他不知道的是，他的父亲江德明三十年前曾是这栋楼的物业管理员，
      在那场灭门惨案后突然辞职搬走，从此再未提起过这栋楼。

  - id: "su_wen"
    name: "苏雯"
    role: "心理咨询师"
    occupation: "临床心理咨询师，擅长催眠与创伤治疗"
    personality: |
      温柔知性，善于倾听，总能察觉到别人忽略的情绪变化。
      极度理性，习惯用心理学理论解释一切反常现象。
      有严重的失眠症，长期服用安眠药，分不清梦境与现实的边界。
    voice_tone: "平缓、温柔、带有分析性的停顿，紧张时会无意识使用心理学术语"
    backstory: |
      苏雯接到一位住在幸福里的老年患者的视频求助，
      对方声称"死去的家人都回来了"，随后信号中断，再无回应。
      苏雯担心患者安全，连夜赶来。她不知道的是，
      这位老人正是三十年前灭门惨案中唯一的幸存者——
      也是她从未见过面的外婆。

  - id: "liu_jun"
    name: "刘军"
    role: "刑警"
    occupation: "市刑侦支队副队长"
    personality: |
      经验丰富，直觉敏锐，办案风格强硬果断。
      极度务实，对任何"装神弄鬼"的说法嗤之以鼻。
      但最近半年，他频繁做同一个噩梦——一栋老旧的公寓楼里，
      有人在墙壁后面呼救。
    voice_tone: "干脆利落、命令式口吻，遇到无法解释的事情时语气会变软"
    backstory: |
      刘军半年前接手了一桩离奇失踪案——一名拆迁评估员
      在进入幸福里公寓后人间蒸发，监控显示他走进了大楼，
      但从未出来。上级以"证据不足"搁置了此案，
      但刘军不愿放弃，独自前来调查。

  - id: "chen_amao"
    name: "陈阿婆"
    role: "老住户"
    occupation: "幸福里公寓402室住户，独居老人"
    personality: |
      表面上是个慈祥唠叨的独居老太，热情好客。
      但她的记忆时断时续，有时会突然说出令人毛骨悚然的话。
      她对楼里的每个角落都了如指掌，似乎知道很多但又不愿多说。
      总在深夜对着空无一人的房间说话，仿佛在和谁对话。
    voice_tone: "苍老、絮叨、偶尔突然变得尖锐或低沉，让人不寒而栗"
    backstory: |
      陈阿婆在幸福里住了四十多年，是资格最老的住户。
      三十年前的灭门惨案中，她的丈夫和儿子都在遇害者之列。
      她声称自己"看到了凶手"，但始终拒绝指认任何人。
      案件最终以"意外火灾"结案，但她知道真相远非如此。
      她一直在等——等一个能帮她"把事情说清楚"的机会。

  - id: "xiao_he"
    name: "小何"
    role: "外卖员"
    occupation: "外卖配送员，兼职跑腿"
    personality: |
      胆小怕事，性格内向，但心地善良，见不得别人受苦。
      方向感极差，容易迷路，在公寓里经常走错楼层。
      对电子设备不太在行，手机经常出故障。
      是所有人中最"普通"的一个，也因此最容易被忽略。
    voice_tone: "紧张、结巴、声线偏高，害怕时会不停念叨'没事的没事的'"
    backstory: |
      小何只是来幸福里送一份外卖的——收件地址是"701室"，
      但幸福里公寓只有六层。他在楼道里转了几圈后发现自己出不去了。
      更诡异的是，他手机上的订单始终显示"等待配送"，
      而701室的客户不断发来同一条消息："快一点，我饿了很久了。"
