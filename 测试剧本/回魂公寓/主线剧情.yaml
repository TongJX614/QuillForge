main_plot:
  title: "回魂公寓"
  theme: "被掩盖的罪行、代际创伤、恐惧与救赎"
  core_conflict: |
    三十年前，幸福里公寓发生了一起灭门惨案，六楼住户王家一家五口惨遭杀害。
    凶手是当时的物业管理员江德明——因王家举报他贪污维修基金而心生怨恨。
    江德明作案后纵火毁证，案件被定性为"燃气爆炸引发的火灾"。
    而物业经理方国强为了保住自己的职位，帮助江德明掩盖了真相。
    三十年后，公寓面临拆迁，封印在墙壁中的冤魂开始苏醒，
    将所有与当年事件有关的人"邀请"回来，要求一个公道。

  stages:
    - name: "困兽之楼"
      description: |
        浓雾封锁公寓，五人各自发现异常后在一楼大厅汇合。
        大门无法打开，手机信号全无，窗外是一片虚无的白色迷雾。
        陈阿婆表现得异常平静，仿佛早就在等待这一天。
      key_events:
        - "江林进入公寓拍摄视频，发现楼道结构与实际楼层不符"
        - "苏雯在四楼找到陈阿婆的房间，但房间里的全家福让她震惊"
        - "刘军以警察身份要求所有人集中，开始逐一排查"
        - "小何的外卖订单不断刷新，'701室'的地址无法取消"
        - "午夜零点，电梯按钮上多出了'13'层，灯光全部熄灭"
      emotional_arc: "困惑→警觉→第一次恐慌"

    - name: "墙壁之语"
      description: |
        第二天夜里，公寓开始出现更诡异的现象。
        墙壁上渗出暗红色的液体，组成歪歪扭扭的文字——
        内容是当年住户的日记片段，记录着对物业的投诉和恐惧。
        每面墙都在"说话"，拼凑出一个被刻意掩埋的故事。
      key_events:
        - "江林在三楼走廊发现墙上出现血字：'管理员有备用钥匙'"
        - "苏雯尝试给陈阿婆做催眠，阿婆在催眠中用年轻男人的声音说话"
        - "刘军在地下室发现被封死的配电房，里面有焚烧过的文件残片"
        - "小何终于爬到'七楼'，发现那是一间完全正常的住家，桌上摆着五副碗筷"
        - "墙壁上的文字开始指向同一个人——'江德明'"
      emotional_arc: "恐惧→好奇→真相碎片开始拼凑"

    - name: "第十三层"
      description: |
        午夜再次降临，电梯自动到达第十三层。
        这一层不在建筑图纸上，空间却比整栋楼都大——
        它重现了三十年前惨案发生当晚的场景：
        走廊里弥漫煤气味，王家门口有被暴力破坏的痕迹，
        地上散落着全家福碎片和一个孩子紧紧抱着的布偶。
      key_events:
        - "五人被迫进入第十三层，亲历惨案的'回放'"
        - "江林在场景中看到一个穿物业制服的男人——正是他父亲年轻时的模样"
        - "苏雯发现'患者'就是陈阿婆本人，而陈阿婆是她的外婆"
        - "刘军找到了当年被隐藏的案件关键证据——一把带血的消防斧"
        - "小何在701室门口看到了一个五六岁的小女孩，她微笑着说：'外卖到了吗？我好饿。'"
        - "陈阿婆突然清醒，开始完整讲述那一夜的经过"
      emotional_arc: "震惊→崩溃→被迫面对真相"

    - name: "亡者审判"
      description: |
        王家五口的怨灵在第十三层现身。
        他们并非面目狰狞的厉鬼，而是保持死亡时模样的普通人——
        父亲护着母亲，母亲抱着最小的孩子，
        大儿子和大女儿手牵着手，眼中没有愤怒，只有无尽的悲伤。
        他们不求复仇，只求真相被说出来——让活着的人承认发生过什么。
      key_events:
        - "王家怨灵现身，公寓开始剧烈震动"
        - "江林必须面对父亲的罪行，做出选择：承认还是继续逃避"
        - "苏雯与外婆陈阿婆相认，两人在泪水中解开了三代人的心结"
        - "刘军意识到自己半年前的噩梦就是王家在求救"
        - "小何发现自己并非偶然来到——他送外卖的收件人，正是三十年前那个饿着肚子死去的小女孩"
        - "公寓墙壁开始碎裂，露出当年被封在墙体中的遗骸"
      emotional_arc: "恐惧→怜悯→愤怒→决心"

    - name: "雾散天明"
      description: |
        黎明将至，浓雾开始收缩，留给他们的时间不多了。
        如果真相不能在日出前被完整说出，公寓将重新封印，
        而所有在场的人将代替王家成为新的"住户"，永远困在这里。
      key_events:
        - "江林通过直播频道向外界公开了全部真相，承认父亲的罪行"
        - "刘军以刑警身份正式重新立案，在公寓内完成了现场取证"
        - "苏雯用心理学技术帮助陈阿婆处理了三十年未愈的创伤"
        - "小何把那份外卖轻轻放在了小女孩的灵前——'对不起，来晚了'"
        - "陈阿婆拿出了保存三十年的关键证物——当年她偷偷录下的江德明认罪录音"
        - "王家五口的灵体在真相大白后化为白光，公寓的封印解除"
      emotional_arc: "紧迫→牺牲→释然→新生"

  endings:
    - name: "真相大白"
      condition: "五人选择公开全部真相"
      description: |
        浓雾散去，阳光照进幸福里公寓。
        江林的直播意外被数十万人观看，引发社会关注。
        刘军凭证据重新立案，江德明（已去世）和方国强的罪行被公之于众。
        苏雯带着陈阿婆离开，开始了真正的治疗与和解。
        小何送完了人生中最重要的一单外卖。
        三个月后，幸福里公寓被拆除，原址建起了一座纪念花园。
        花园的铭牌上写着六个名字——王家五口，和一个被记住的小女孩。

    - name: "沉默的代价"
      condition: "江林拒绝承认父亲的罪行"
      description: |
        江林无法接受父亲是杀人犯的事实，选择沉默。
        公寓的封印重新合拢，浓雾再次弥漫。
        刘军、苏雯、小何和陈阿婆被困在了第十三层。
        江林独自走出公寓大门，但从此以后——
        每到午夜零点，他都会听到墙壁里传来小女孩的声音：
        "叔叔，外卖到了吗？"
        而他的直播频道里，永远多了一个无法删除的观众。

    - name: "永居之客"
      condition: "无人在天亮前说出真相"
      description: |
        天亮了，但没有人有勇气面对真相。
        公寓恢复了平静，看起来一切正常。
        五个人各自回到"自己的房间"，开始了日复一日的循环生活。
        他们成为了幸福里的"新住户"，
        在走廊里偶尔擦肩而过，彼此似曾相识却叫不出名字。
        而三十年后，又将有一批新的人走进这栋楼……
