scenes:
  - name: "最后的盘点"
    location: "锦辉百货，一楼大厅"
    time: "夜晚 22:00"
    atmosphere: "商场已打烊，日光灯管嗡嗡作响，空荡的大厅回荡着脚步声，卷帘门拉下一半"
    description: |
      锦辉百货一楼大厅是全商场的门面——大理石地面已经磨损发暗，
      中央的环形服务台积着薄灰，头顶的巨型水晶吊灯有一半灯泡已经坏了。
      化妆品柜台的商品已清走大半，只剩些试用装和过期香水。
      正对大门的电子屏上滚动着"感谢二十三年，锦辉与您再见"的告别标语。
      扶梯已经停运，只有消防楼梯和一台老式货梯还能使用。
      商场里安静得能听到自己的呼吸声，偶尔传来管道里水流的声音，像有人在低语。
    characters_present:
      - "lin_yue"
      - "zhang_jie"
      - "chen_gang"
      - "zhou_yu"
    plot_hook: "四人各自开始夜间工作，张姐分配任务时发现清货清单上多了一行：'三楼模特，勿动——赵'"

  - name: "模特的目光"
    location: "锦辉百货，三楼女装区"
    time: "夜晚 23:15"
    atmosphere: "服装区灯光昏暗，假人模特排列在过道两侧，玻璃橱窗反射出扭曲的人影"
    description: |
      三楼女装区是商场里最诡异的地方——即使是白天。
      十二个假人模特穿着最后一季的衣服，以各种姿态陈列在过道两侧和橱窗里。
      它们的面部是光滑的白色石膏，没有五官，但每个人都觉得它们在"看"你。
      其中一个模特格外引人注目——它穿着一条红色连衣裙，
      双手交叠在身前，姿态像极了正在祈祷的人。其他模特都朝向过道，
      只有它面朝墙壁，仿佛在回避什么。
      林悦走近时发现，这个模特的石膏表面隐约透出一种不正常的灰白色——
      像是骨骼的颜色。
    characters_present:
      - "lin_yue"
      - "zhang_jie"
      - "zhou_yu"
    plot_hook: "林悦发现红裙模特的手指似乎在微微颤动，张姐的脸色瞬间变得惨白"

  - name: "监控室的真相"
    location: "锦辉百货，地下一层安保监控室"
    time: "深夜 23:45"
    atmosphere: "狭小密闭的房间，十几个监控屏幕泛着蓝光，空调嗡嗡作响，空气中有股陈旧的烟味"
    description: |
      监控室在地下一层，需要从货梯旁的消防楼梯下去。
      房间不大，一张桌子、一把转椅、一面墙的监控屏幕。
      十六个摄像头覆盖商场主要区域，但三楼女装区的3号摄像头
      一周前开始出现异常——画面偶尔会出现雪花噪点，
      像是有什么东西在干扰信号。
      陈刚调出了一周前的录像备份，当着所有人的面回放了那段画面：
      凌晨三点零七分，三楼女装区的所有模特同时缓缓转过了头。
      画面清晰，没有故障痕迹。时间戳精确到秒。
      录像的最后几帧，红裙模特——唯一面朝墙壁的那个——
      它的头没有转向摄像头，而是转向了旁边的另一个模特。
      像是在低声说着什么。
    characters_present:
      - "chen_gang"
      - "lin_yue"
      - "zhou_yu"
      - "zhang_jie"
    plot_hook: "录像铁证如山，周宇的直播间已经涌入了上千观众，而张姐终于说出了五年前保安的故事"

  - name: "赵锦辉的秘密"
    location: "锦辉百货，四楼办公区——创始人办公室"
    time: "凌晨 00:30"
    atmosphere: "办公室保存完好，红木书桌上一尘不染，书架上摆满了人体解剖学和民俗丧葬类书籍"
    description: |
      四楼办公区早已停用，走廊里只有应急灯发出惨白的光。
      赵锦辉的办公室在最里面，门上挂着"董事长室"的铜牌，依然锃亮。
      推门进去，一切像是主人随时会回来——茶杯里有半杯凉茶，
      桌上放着一本翻开的笔记本，笔搁在笔槽里。
      笔记本上密密麻麻记录着日期、姓名和简短的描述：
      "1号——王德发，装修工，坠亡，1998.3.17"
      "2号——李秀英，清洁工，心梗，2003.8.2"
      "3号——……"
      一直记到"7号"。每一条记录后面都附着一句话："已安置，状态良好。"
      书架的暗格里藏着一本手工装订的册子，封面写着四个字——"留魂手记"。
      里面详细记载了赵锦辉如何用骨灰混合石膏制作"魂器"的全过程，
      以及一段令人毛骨悚然的结论："他们还在，他们能听见，他们不想走。"
    characters_present:
      - "zhou_yu"
      - "lin_yue"
      - "zhang_jie"
      - "zhao_jin_hui"
    plot_hook: "赵锦辉突然出现在办公室门口，平静地承认了一切，并说出了令人绝望的事实"

  - name: "模特的游行"
    location: "锦辉百货，三楼至一楼的扶梯区域"
    time: "凌晨 01:30"
    atmosphere: "停电，只有手机手电筒的光柱在黑暗中摇晃，扶梯上传来沉重的脚步声"
    description: |
      凌晨一点半，整栋商场突然断电。应急灯亮起，发出暗红色的微光。
      三楼传来沉闷的撞击声——像是石膏砸在瓷砖地面上。
      然后是一声、两声、三声……有节奏的脚步声，沉重而僵硬，
      像是不会弯曲的膝盖在一级一级走下扶梯。
      手机手电筒照向扶梯口，七个假人模特排成一列，
      以完全相同的姿态——双手交叠在身前，头颅微微低垂——
      缓缓从三楼走下来。它们的关节处发出石膏摩擦的刺耳声响，
      每走一步，身体表面就裂开一道细缝，露出里面灰白色的……不是石膏。
      红裙模特走在最后面，它没有低头，而是直直地望着前方的五个人。
      它的石膏面孔上，慢慢浮现出了五官的轮廓——那是一张年轻女人的脸。
    characters_present:
      - "lin_yue"
      - "zhang_jie"
      - "chen_gang"
      - "zhou_yu"
      - "zhao_jin_hui"
    plot_hook: "模特们包围了一楼大厅，赵锦辉跪在它们面前哭喊'不要走'，局势彻底失控"

  - name: "留魂之术"
    location: "锦辉百货，一楼大厅（封锁状态）"
    time: "凌晨 03:00"
    atmosphere: "大厅所有出口被模特封锁，空气冰冷刺骨，水晶吊灯开始自己亮起"
    description: |
      七个模特在一楼大厅围成了一个圆圈，将五个人困在中央。
      它们不再移动，只是静静地站着，面部的石膏裂缝越来越大，
      露出的不是空心——而是一层薄薄的、像是皮肤一样的东西。
      赵锦辉跪在地上，浑身发抖，口中反复念叨：
      "别走……我给你们建了家……你们答应过不走的……"
      红裙模特的嘴唇开始蠕动，发出了一个女人的声音——
      不是活人的声音，更像是从石膏深处传来的共鸣：
      "我们从来就没有答应过。是你不让我们走。"
      大厅的温度骤降，水晶吊灯全部亮起，光芒刺目，
      每个模特的裂缝中开始渗出暗灰色的粉末——那是骨灰。
    characters_present:
      - "lin_yue"
      - "zhang_jie"
      - "chen_gang"
      - "zhou_yu"
      - "zhao_jin_hui"
    plot_hook: "七个灵魂道出了各自的故事，林悦发现自己被赵锦辉选中的真正原因"

  - name: "破晓"
    location: "锦辉百货，一楼大厅→商场正门"
    time: "凌晨 05:30"
    atmosphere: "东方微明，第一缕灰白的光透过玻璃幕墙照入大厅，模特的石膏外壳开始碎裂"
    description: |
      经过漫长的对峙、忏悔与抉择，天光终于从东面的玻璃幕墙透入。
      灰白色的晨光照在七个模特身上，它们的石膏外壳开始从裂缝处大片剥落，
      像蝉蜕一样碎裂在地面上，露出里面——什么都没有。
      没有骨骼，没有血肉，只有一团淡淡的光雾从碎裂的石膏中升起。
      七团光雾在空中盘旋了片刻，像是在做最后的告别，
      然后缓缓飘向商场大门的方向。
      大门的玻璃在没有任何外力的情况下无声地碎裂了，
      光雾飘出门外，消散在黎明前的天空里。
      大厅地面上只留下七堆碎裂的石膏和七件空荡荡的衣服。
      赵锦辉趴在地上，老泪纵横，手里紧紧攥着那条红色连衣裙——
      那是他第一个"留住"的人穿的衣服。
      商场的广播系统突然自己启动了，播放出一首老歌——
      是锦辉百货开业那年最流行的曲子。
    characters_present:
      - "lin_yue"
      - "zhang_jie"
      - "chen_gang"
      - "zhou_yu"
      - "zhao_jin_hui"
    plot_hook: "灵魂散去，商场恢复平静，但每个人都被永远改变了——问题是，他们能否带着这个秘密走出去"
