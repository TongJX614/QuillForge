characters:
  - id: "lin_yue"
    name: "林悦"
    role: "新入职售货员"
    occupation: "锦辉百货一楼化妆品柜台售货员，入职仅三个月"
    personality: |
      性格敏感内向，从小就声称能"看到别人看不到的东西"，被家人当作想象力丰富。
      胆小但好奇心强，越是害怕越忍不住去看。
      刚入职不久，对商场的历史和传说知之甚少，但直觉总是异常敏锐。
      习惯咬指甲，紧张时会不自觉地哼一首小时候外婆教的童谣。
    voice_tone: "轻声细语、犹豫不决，害怕时声音会颤抖但语速反而变慢"
    backstory: |
      林悦三个月前刚大学毕业，找不到合适的工作，偶然看到锦辉百货的招聘广告。
      面试时，已经退休的老创始人赵锦辉亲自见了她，盯着她看了很久，说了一句：
      "你的眼睛很干净，它们会喜欢你的。"当时她以为老人糊涂了。
      入职后她总觉得三楼女装区的假人模特在盯着她看，
      有好几次晚班结束后，她发现模特的姿势和白天不一样。
      她告诉自己那只是错觉——直到今晚。

  - id: "zhang_jie"
    name: "张姐"
    role: "楼层主管"
    occupation: "锦辉百货二楼服装区楼层主管，工龄十二年"
    personality: |
      精明能干，泼辣直爽，典型的刀子嘴豆腐心。
      在商场干了十二年，对每个角落、每条通道都了如指掌。
      表面上不信鬼神，但从不加夜班后独自去地下一层。
      知道商场里很多"不该知道的事"，但一直选择沉默。
    voice_tone: "嗓门大、语速快、带点方言味，紧张时会反复念叨'没事没事'"
    backstory: |
      张姐是锦辉百货资格最老的员工之一。十二年前刚来时，
      赵锦辉曾单独叮嘱她："三楼的模特不要随便挪动，更不能扔。"
      她一直以为是老板的怪癖。直到五年前，一个夜班保安不信邪，
      把三楼一个模特搬到了仓库——第二天那个保安就辞职了，
      临走时脸色苍白，只说了一句："它们晚上会走路。"
      从那以后，张姐再也不碰三楼的模特，也从不跟别人提起这件事。
      但今晚的清货清单上写着：三楼全部模特，统一清运。

  - id: "chen_gang"
    name: "陈刚"
    role: "夜班保安"
    occupation: "锦辉百货安保部夜班保安，退伍军人"
    personality: |
      沉默寡言，行事果断，遇事习惯用理性分析。
      极度务实，对任何超自然说法嗤之以鼻，认为一切都有合理解释。
      但在面对真正无法解释的事情时，会比任何人都恐惧——
      因为他的世界观里没有留给"鬼"的位置。
      随身携带手电筒和对讲机，巡逻时步调永远一致。
    voice_tone: "简短、低沉、命令式口吻，紧张时会不自觉地握紧手电筒"
    backstory: |
      陈刚退伍后来锦辉百货当了三年保安。他选择这份工作的原因很简单——
      夜班清闲，工资还行。三年里他巡逻了上千个夜晚，从未遇到过异常。
      但一周前，他在监控室里看到了不可能的事：凌晨三点的监控画面中，
      三楼女装区的所有模特同时转过了头，面向摄像头。
      他反复回放了二十遍，排除了故障和恶作剧的可能。
      他没有告诉任何人，但在巡逻记录上写了四个字："设备异常。"

  - id: "zhou_yu"
    name: "周宇"
    role: "探灵博主"
    occupation: "自媒体探灵博主，兼职商场拆迁评估记录员"
    personality: |
      外向张扬，嘴上没把门，胆子大得近乎鲁莽。
      以"科学打假"为旗号做过很多探灵视频，实际上从没真遇到过灵异事件。
      嗅觉敏锐，擅长捕捉细节，一旦闻到"故事"的味道就穷追不舍。
      嘴硬心软，真正遇到危险时会本能地保护身边的人。
    voice_tone: "语速快、爱开玩笑、喜欢用网络梗，真正害怕时会突然安静下来"
    backstory: |
      周宇听说锦辉百货要拆除，以"记录城市记忆"的名义申请进入拍摄。
      实际上他早就调查过这栋楼的背景——二十三年间，
      锦辉百货共发生过七起非正常死亡事件（电梯事故、坠楼、猝死等），
      但没有一具遗体被正常安葬，全部由赵锦辉"代为处理后事"。
      他怀疑这背后有不可告人的秘密，打算在拆除前做最后一期视频。
      他的直播间有两万多粉丝，今晚他打算做一次深夜直播。

  - id: "zhao_jin_hui"
    name: "赵锦辉"
    role: "创始人"
    occupation: "锦辉百货创始人兼原董事长，已退休，七十三岁"
    personality: |
      外表慈祥温和，说话慢条斯理，像个普通的退休老人。
      但眼神深处藏着某种执念和疯狂，尤其谈到"他们"时语气会变得虔诚。
      对商场有近乎病态的感情，将其视为自己的"作品"和"家"。
      真心相信自己做的是好事——让死者"留在"他们最后活着的地方。
    voice_tone: "缓慢、平和、带着老年人特有的慈祥，但偶尔会突然变得激动"
    backstory: |
      赵锦辉二十四年前创建了锦辉百货。开业第一年，
      一名装修工人从四楼坠亡。赵锦辉出于愧疚（或许还有别的什么），
      没有通知家属，而是将工人的骨灰秘密混入了一个定制的石膏模特中。
      从那以后，每一个在商场中死去的人——无论是事故、疾病还是意外——
      赵锦辉都会用同样的方式"留住"他们。二十三年来共七个"模特"。
      他坚信这些灵魂在商场里过得很安宁，而拆除意味着他们将"无家可归"。
      今晚，他以"最后巡视"的名义回到了商场，带着一个谁都不知道的计划。
