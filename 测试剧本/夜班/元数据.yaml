title: "夜班"
genre: "恐怖 / 都市怪谈"
synopsis: |
  永安市"锦辉百货"——一座营业了二十三年的老牌商场，因经营不善即将拆除。
  闭店前的最后一个夜班，五名员工留守商场进行清货盘点。

  午夜过后，三楼女装区的假人模特开始移动。
  起初只是姿势的微调，然后是头颅的转动，最后——它们开始走动。

  没有人知道的是，锦辉百货的创始人赵锦辉有一个不为人知的癖好：
  他相信人死后灵魂不灭，二十三年来，他秘密地将每一位在商场中意外死亡者的骨灰
  混入定制假人模特的石膏中，让他们以"模特"的形态继续"活"在商场里。

  如今商场即将拆除，这些困在石膏躯壳中二十三年的灵魂感知到了毁灭的临近，
  它们变得躁动、愤怒、绝望——它们不想再被困住了。

  五个人必须在天亮前弄清楚这些"模特"想要什么，
  否则，它们会找到新的"容器"——用活人的血肉取代石膏。
