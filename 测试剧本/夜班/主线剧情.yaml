main_plot:
  title: "夜班"
  theme: "执念与放手、生者与死者的边界、被囚禁的自由"
  core_conflict: |
    二十三年前，锦辉百货创始人赵锦辉在一次装修事故后，
    出于愧疚和一种近乎疯狂的执念，将死者的骨灰混入石膏制成假人模特，
    以此"留住"他们的灵魂。此后每当商场有人意外死亡，他都以同样方式处理。
    二十三年间，共有七个灵魂被囚禁在石膏躯壳中，以"模特"的形态困在商场里。

    如今商场即将拆除，七个灵魂感知到了毁灭——如果石膏被碾碎，
    它们的灵魂也将灰飞烟灭。恐惧和愤怒让它们开始躁动、觉醒。

    最后一个夜班的五个人，必须在天亮前弄清楚这些灵魂真正想要什么：
    是逃离？是复仇？还是仅仅想被承认、被记住？
    而赵锦辉——这个"创造"了它们的人——也有自己的计划：
    他要用最后的时间，把灵魂转移到新的"容器"中。

  stages:
    - name: "最后的营业"
      description: |
        闭店前最后一夜，四个留守的员工在一楼大厅集合，准备清货盘点。
        张姐分发任务时脸色古怪——清货清单上多了一行手写字：
        "三楼模特，勿动。——赵"
        没有人知道这是谁加的，张姐含糊其辞地让大家先干别的。
        周宇架起设备开始直播，以"最后的锦辉"为噱头吸引观众。
        一切看起来只是一个普通的夜班——直到林悦在三楼发现异常。
      key_events:
        - "张姐分配盘点任务，发现清单上被人手写添加了'三楼模特，勿动'的备注"
        - "周宇开启直播，带着观众'云逛'即将拆除的老商场，气氛轻松"
        - "陈刚例行巡逻，在对讲机里提醒大家不要去地下一层（管道漏水）"
        - "林悦被派去三楼清点库存，独自走进女装区时感觉被无数目光注视"
        - "赵锦辉没有出现在约定时间，张姐说'老板说了今晚来，但没说几点'"
      emotional_arc: "平静→微妙的不安→好奇"

    - name: "凝视"
      description: |
        林悦在三楼女装区清点库存时，注意到了那个穿红裙的模特。
        它面朝墙壁，姿态像在祈祷，与周围所有朝向过道的模特格格不入。
        当她走近时，模特的手指——她发誓——微微颤动了一下。
        她叫来张姐和周宇，张姐看到红裙模特后脸色煞白，
        转身就走，低声说："不要碰它，不要碰任何一个。"
        周宇的直播间里，弹幕突然炸了——观众说看到模特动了一下。
      key_events:
        - "林悦发现红裙模特的石膏表面颜色异常，像骨骼的灰白色"
        - "红裙模特的手指在林悦注视下微微颤动，但再看时又静止了"
        - "张姐赶来后态度异常坚决：'不要碰，不要管，下楼'"
        - "周宇的直播弹幕涌入大量'它动了！''假人动了！'的消息"
        - "陈刚通过对讲机报告：监控室里3号摄像头的画面出现了严重干扰"
      emotional_arc: "好奇→不安→第一次恐惧"

    - name: "不可解释的证据"
      description: |
        四人聚集在地下一层监控室，陈刚调出一周前的监控录像。
        画面显示凌晨三点零七分，三楼女装区的所有模特同时缓缓转头。
        没有外力、没有震动、没有故障——它们就是自己转了头。
        周宇的直播间涌入了上千人，有人说是特效，有人说是闹鬼。
        张姐终于松口，讲述了五年前那个保安的故事，
        以及赵锦辉十二年前对她说的叮嘱："三楼的模特不要随便挪动，更不能扔。"
        就在这时，对讲机里传来赵锦辉苍老的声音："我在四楼等你们。"
      key_events:
        - "陈刚播放一周前的监控录像，所有人亲眼目睹模特自行转头"
        - "录像中红裙模特的头转向另一个模特，像是在'说话'"
        - "张姐终于道出十二年来守着的秘密和五年前保安的遭遇"
        - "周宇调查发现：锦辉百货二十三年间有七起非正常死亡，遗体均由赵锦辉处理"
        - "对讲机突然传来赵锦辉的声音，邀请所有人上四楼——他的办公室"
      emotional_arc: "震惊→恐惧→真相碎片开始拼凑"

    - name: "留魂手记"
      description: |
        四人上到四楼，发现赵锦辉已经坐在办公室里等着他们。
        桌上摊开着一本手工装订的册子——"留魂手记"。
        赵锦辉平静地讲述了一切：二十三年前装修工坠亡，他出于愧疚用骨灰制成第一个模特。
        此后每一个死在商场里的人，他都"留"了下来。
        他真心相信这是善举——"我没有杀任何人，他们死了，我只是……没让他们走。"
        但当被问到为什么要把灵魂留在商场时，他的回答令人脊背发凉：
        "因为它们答应过陪我的。商场在，它们就在。商场要是没了……"
        他没有说完这句话，但所有人看到了他桌上放着的一张图纸——
        那是七个新型模特的制作图，尺寸是真人比例。
        图纸旁边的备注写着："容器备选。"
      key_events:
        - "赵锦辉主动展示'留魂手记'，承认用骨灰制作模特的全过程"
        - "他展示了七条记录：七个死者、七个模特、二十三年的'陪伴'"
        - "赵锦辉道出真正目的：商场拆除前，他要把灵魂转移到'新容器'中带走"
        - "林悦在笔记本最后一页看到自己的名字和一行字：'眼睛很干净，适合作为8号'"
        - "周宇的直播镜头对准了一切，在线观众已经超过两万"
      emotional_arc: "震惊→愤怒→毛骨悚然"

    - name: "模特之夜"
      description: |
        凌晨一点半，整栋商场突然断电。黑暗中，三楼传来沉重的脚步声。
        七个假人模特排成一列，从扶梯上缓缓走下——
        它们的关节发出石膏摩擦的刺耳声响，每走一步身体就裂开一道缝。
        红裙模特走在最后，它的石膏面孔上浮现出了一张年轻女人的五官。
        模特们来到一楼大厅，围成一个圈，将五个人困在中央。
        赵锦辉跪在地上，哭喊着让它们"别走"，但模特们没有看他。
        红裙模特开口说话了——声音从石膏深处传来，像一个被窒息的女人：
        "我们从来就没有答应过。是你不让我们走。"
        七个灵魂，一个接一个，讲述了自己被困在石膏中的二十三年。
      key_events:
        - "商场突然断电，七个模特从三楼自行走下，包围一楼大厅"
        - "红裙模特（2号李秀英）面孔浮现五官，第一个开口说话"
        - "赵锦辉崩溃跪地，哀求灵魂们留下，但被厉声拒绝"
        - "七个灵魂轮流讲述自己被困的经历：'我能听见、能看见，但动不了、说不出'"
        - "林悦发现自己之所以能'看到'，是因为赵锦辉在她入职时就在她身上做了标记"
        - "陈刚第一次面对完全超出理性认知的事物，握紧手电筒浑身发抖"
      emotional_arc: "恐惧→震惊→怜悯→愤怒"

    - name: "灵魂的诉求"
      description: |
        七个灵魂并没有伤害任何人。它们围成的圈子不是囚笼，而是一个"法庭"。
        它们的要求很简单：让赵锦辉亲口承认——是他囚禁了它们。
        不是出于爱，不是出于善念，而是出于占有欲和控制欲。
        "你说是为了我们好，但你问过我们吗？"
        "二十三年来我看着人来人往，我想出去，但我动不了。"
        "你把我的骨灰混进石膏，让我变成了你货架上的商品。"
        赵锦辉在灵魂面前终于卸下了所有伪装，承认了自己的自私。
        但灵魂们说，光是承认不够——它们需要有人"打开门"，让它们在商场拆除前离开。
        而"打开门"的方式是：有人必须亲手打碎所有七个模特。
        赵锦辉做不到。他跪在地上说："我打不下去……它们是我的家人……"
        于是灵魂们转向了其他四个人。
      key_events:
        - "七个灵魂表明立场：不伤害活人，只要求被释放"
        - "灵魂控诉赵锦辉二十三年来以'爱'的名义囚禁它们"
        - "赵锦辉在铁一般的控诉前崩溃，承认了自己的自私和偏执"
        - "灵魂们揭示'打开门'的方式：亲手打碎全部七个石膏模特"
        - "赵锦辉无法下手，灵魂们将选择权交给林悦、张姐、陈刚和周宇"
        - "林悦发现红裙模特——李秀英——正是赵锦辉的第一个'作品'，也是被困最久的灵魂"
      emotional_arc: "怜悯→决心→道德困境"

    - name: "放手"
      description: |
        黎明将至，时间所剩无几。如果天亮前灵魂不被释放，
        商场拆除时它们将随石膏一起灰飞烟灭——永远消失，连灵魂都不剩。
        四个人做出了决定。
        林悦走向红裙模特，举起消防斧，眼泪夺眶而出。
        李秀英的石膏面孔上浮现出一个微笑："谢谢你，小姑娘。"
        第一斧落下，石膏碎裂，一团温暖的光雾升起。
        张姐、陈刚、周宇相继动手，每一斧下去都像是在打碎一座牢笼。
        七团光雾在大厅中盘旋，汇聚，然后飘向大门。
        玻璃门无声碎裂，光雾消散在黎明的天空中。
        赵锦辉趴在地上，抱着那条红色连衣裙，泣不成声。
        商场广播自己响了起来，播放着二十三年前开业时的歌曲。
        晨光涌入大厅，照在地上的七堆碎石膏和七件空衣服上。
        一切结束了。
      key_events:
        - "林悦第一个举起消防斧，在李秀英的微笑中打碎了第一个模特"
        - "四人轮流打碎全部七个模特，每一团光雾升起时都带着一声轻轻的叹息"
        - "赵锦辉始终无法动手，最终由林悦打碎了最后一个——那是最年轻的灵魂"
        - "七团光雾汇聚后飘出大门，消散在黎明中——二十三年的囚禁终于结束"
        - "商场广播自动播放开业那年的歌曲，像是灵魂们最后的告别"
        - "周宇的直播在最后一刻信号中断——但两万人已经看到了一切"
      emotional_arc: "紧迫→牺牲→释然→余韵"

  endings:
    - name: "各归各位"
      condition: "四人选择打碎模特，释放灵魂"
      description: |
        晨光中，五个人走出锦辉百货的大门。
        赵锦辉被随后赶到的警察带走——周宇的直播已经提供了完整的证据。
        二十三年来七起非正常死亡的案件被重新调查，赵锦辉以侮辱尸体罪被起诉。
        张姐辞了职，说再也不想看到任何假人。
        陈刚写了辞职信，但改行去了一家养老院当护工——"至少他们能自己走出去。"
        周宇的直播录像在网上疯传，但他主动删除了原片，只留下一句话：
        "有些故事不该被消费。"
        林悦回到了锦辉百货的拆除现场。她站在废墟前，看到阳光照在空地上，
        那里什么都没有——干干净净的，像是什么都没有发生过。
        但她知道，有七个人终于可以安息了。
        三个月后，锦辉百货原址开始建设一座社区公园。
        施工时，工人们在地下发现了一块奠基石，上面刻着七个名字——
        那是赵锦辉在建商场时为工人刻下的。这一次，名字被保留了下来。

    - name: "新的容器"
      condition: "赵锦辉成功阻止众人打碎模特"
      description: |
        赵锦辉拼死护住了模特，用身体挡在它们面前。
        "你们不能打碎它们！它们会消失的！"
        天亮了，商场拆除工程如期开始。
        推土机的铲斗砸向三楼外墙时，整栋楼传来一声尖锐的哀号——
        不是人的声音，也不是机器的声音，是石膏碎裂时从内部释放的共鸣。
        七个模特在拆除中化为齑粉，灵魂随石膏一起湮灭。
        赵锦辉站在围挡外，看着一切被碾碎，面无表情。
        但从那天起，每个路过拆除工地的人都会感到一阵莫名的寒意。
        工地的工人说，晚上收工后，废墟里会传来脚步声——
        沉重的、僵硬的、不会弯曲膝盖的脚步声。
        赵锦辉在家中开始制作新的模特。这一次，他不需要骨灰。
        他说："它们自己会找到回来的路。"

    - name: "第八号"
      condition: "林悦选择留下陪伴灵魂"
      description: |
        林悦放下了消防斧，走到红裙模特面前，轻轻握住了它石膏的手。
        "我不打。它们在这里太久了，至少……至少让一个人陪陪它们。"
        赵锦辉的眼中闪过疯狂的光："你愿意？你真的愿意？"
        张姐和陈刚拼命拉她走，但林悦没有动。
        天亮时，商场大门打开了，四个人冲了出去。
        但林悦没有出来。
        拆除工程被迫推迟了一天。当工人进入商场时，
        一楼大厅里整整齐齐地站着八个模特——
        七个旧的，和一个新的。
        新的那个穿着林悦入职时穿的白色衬衫，双手交叠在身前，
        头颅微微低垂，石膏面孔上没有五官。
        但如果你仔细看，会发现它的嘴角——微微上翘着。
        像是心甘情愿留下的微笑。
