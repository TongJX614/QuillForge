</head>
<body>

<div class="container" id="app"></div>

<script>
const API = '';
let sessionId = null;
let chosenIndex = -1;
let currentScript = null;
const app = document.getElementById('app');

// ─── 页面入口：读取 URL 参数 + sessionStorage ───
const _params = new URLSearchParams(location.search);
const _sid = _params.get('sid');
const _mode = _params.get('mode');
const _ctx = JSON.parse(sessionStorage.getItem('game_ctx') || '{}');

// ─── VN 引擎状态 ───
let vnState = { queue: [], idx: 0, charPositions: {}, choices: [], sessionState: '', meta: {}, progress: 0 };
let typewriterTimer = null;
let typewriterDone = true;
let vnTypewriterCharIdx = 0;
let vnTypewriterLine = null;
let vnTypewriterText = '';
let vnStreamDone = true;
let vnStreamStarted = false;
let vnNarrationStreaming = false;
let vnNarrationIdx = -1;
let vnIsEnding = false;
let vnEndingData = null;
let vnEndingScrollActive = false;
let vnEndingScrollTimer = null;
let vnEndingScrollDone = false;
let vnPopupActive = false;
let vnPopupTypewriterTimer = null;
let vnPopupTypewriterDone = true;
let vnWaiting = false;
let vnWaitingTimer = null; // 等待超时兜底，防止断流后永久卡在“后续内容生成中...”
let vnErrorMode = false;    // 错误模式：生成失败后禁止推进，点击返回首页
let vnPopupShownThisScene = false;
let vnAutoPlay = false;
let vnAutoPlayTimer = null;
let vnLineStartTime = 0; // 每行开始显示的时间戳，用于强制1秒最小停留

// TTS
let vnTtsEnabled = true;
let vnAudioQueue = [];
let vnCurrentAudio = null;
let vnAudioLock = false;
let vnCurrentAudioLineIdx = -1; // 当前播放音频对应的行索引

// 美术素材
let vnAssets = { characters: {}, scenes: {}, enabled: false };

// ─── 素材门控：背景/立绘未到位时阻塞剧情推进 ───
let _bgGateResolve = null;   // 当前等待背景加载的 resolve
let _charGateResolve = null; // 当前等待立绘加载的 resolve
let _charGateName = null;    // 正在等待的角色名
let _vnAssetGateActive = false; // 素材门控进行中，禁止用户推进

function showAssetGate() {
  _vnAssetGateActive = true;
  const el = document.getElementById('vnAssetGate');
  if (el) el.classList.remove('hidden');
}
function hideAssetGate() {
  _vnAssetGateActive = false;
  const el = document.getElementById('vnAssetGate');
  if (el) el.classList.add('hidden');
}

function waitForBackground(meta) {
  // 如果背景 URL 已存在，直接通过
  if (!meta || (!meta.scene_id && !meta.scene_name)) return Promise.resolve();
  const url = vnAssets.scenes[meta.scene_id] || vnAssets.scenes[meta.scene_name];
  if (url) return Promise.resolve();
  // 否则阻塞，等 asset_bg_ready 事件解除（超时 20s 自动放行）
  return new Promise(resolve => {
    _bgGateResolve = resolve;
    setTimeout(() => { if (_bgGateResolve === resolve) { _bgGateResolve = null; resolve(); } }, 20000);
  });
}

function waitForCharacterSprite(name) {
  if (!name) return Promise.resolve();
  const url = vnAssets.characters[name];
  if (url) return Promise.resolve();
  // 阻塞，等 asset_char_ready 事件解除（超时 15s 自动放行）
  return new Promise(resolve => {
    _charGateResolve = resolve;
    _charGateName = name;
    setTimeout(() => { if (_charGateName === name) { _charGateResolve = null; _charGateName = null; resolve(); } }, 15000);
  });
}

function releaseBgGate(sceneId, sceneName) {
  if (_bgGateResolve) { const r = _bgGateResolve; _bgGateResolve = null; r(); }
}

function releaseCharGate(charName) {
  if (_charGateResolve && _charGateName === charName) {
    const r = _charGateResolve; _charGateResolve = null; _charGateName = null; r();
  }
}

// 文字生成流缓冲
let _textEventBuffer = [];
let _textProcessing = false;
let _textStreamDone = false;
let _textStreamError = null;

// 立绘位置
const VN_POS_POOL = ['left', 'right'];
let vnCharPos = {};
let vnSpeakerRecency = [];

// 实时管线专用状态
let realtimeSessionId = null;
let realtimeStorySeed = null;
let realtimeMode = false;

// ─── 渲染 VN 舞台（空对话框 + 加载提示）───
function renderVNStage(progress = 0, sceneInfo = '生成中...') {
  app.innerHTML = `
    <div class="vn-stage" id="vnStage">
      <div class="vn-progress" id="vnProgress" style="width:${progress*100}%"></div>
      <div class="vn-bg vn-bg-shift" id="vnBg"></div>
      <div class="vn-asset-gate hidden" id="vnAssetGate">
        <div class="vn-gate-quill"></div>
        <div class="vn-gate-text">画面加载中</div>
        <div class="vn-gate-bar"></div>
      </div>
      <div class="vn-scene-info" id="vnSceneInfo">${sceneInfo}</div>
      <div class="vn-top-bar">
        <button id="vnVoiceBtn" class="active">声音:开</button>
        <button id="vnAutoBtn">自动</button>
        <button id="vnHistBtn">历史</button>
        <button id="vnHomeBtn">退出</button>
      </div>
      <div class="vn-sprites" id="vnSprites"></div>
      <div class="vn-dialogue-box" id="vnDialogueBox" style="visibility:hidden">
        <div id="vnSpeaker"></div>
        <div class="vn-text" id="vnText"><div class="vn-streaming-hint"><div class="spinner"></div><span id="vnStageMsg">正在连接...</span></div></div>
        <div class="vn-emotion" id="vnEmotion"></div>
        <div class="vn-advance-hint" id="vnHint" style="display:none">点击继续 ▶</div>
      </div>
      <div class="vn-choices-overlay" id="vnChoices" style="display:none"></div>
      <div class="vn-narration-popup" id="vnNarrationPopup" style="display:none">
        <div class="vn-narration-card">
          <div class="vn-narration-text" id="vnNarrationText"></div>
          <div class="vn-narration-hint" id="vnPopupHint">点击继续 ▶</div>
        </div>
      </div>
    </div>
    <div class="history-panel" id="historyPanel"></div>`;

  document.getElementById('vnDialogueBox').addEventListener('click', vnAdvance);
  document.addEventListener('keydown', vnKeyHandler);
  document.getElementById('vnVoiceBtn').addEventListener('click', vnToggleVoice);
  vnSyncVoiceBtn();
  document.getElementById('vnHistBtn').addEventListener('click', toggleHistory);
  document.getElementById('vnAutoBtn').addEventListener('click', vnToggleAutoPlay);
  vnSyncAutoBtn();
  document.getElementById('vnHomeBtn').addEventListener('click', () => {
    document.removeEventListener('keydown', vnKeyHandler);
    location.href = '/';
  });
}

// ─── 美术素材预生成（剧本管线）───
async function pregenerateAssets(assetsUrl) {
  vnAssets = { characters: {}, scenes: {}, enabled: false };
  const scriptTitle = (currentScript && currentScript.title) ? currentScript.title : '剧本';
  let particlesHTML = '';
  for (let i = 0; i < 25; i++) {
    const size = 2 + Math.random() * 3;
    const left = Math.random() * 100;
    const dur = 8 + Math.random() * 14;
    const delay = Math.random() * 20;
    const op = 0.2 + Math.random() * 0.5;
    const xDrift = (Math.random() - 0.5) * 80;
    particlesHTML += `<span class="particle" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:-${delay}s;--p-op:${op};--p-x:${xDrift}px"></span>`;
  }
  app.innerHTML = `
    <div class="vn-stage" id="assetStage">
      <div class="vn-bg" style="background:radial-gradient(ellipse at 50% 30%,#2e2820 0%,#1e1a14 50%,#141210 100%)"></div>
      <div class="particles-container">${particlesHTML}</div>
      <div class="asset-title-area">
        <div class="asset-script-name">${escapeHtml(scriptTitle)}</div>
        <div class="asset-script-subtitle">即将开始</div>
      </div>
      <div class="asset-progress-area" id="assetProgressArea" style="display:none">
        <div class="asset-progress-bar"><div class="asset-progress-fill" id="assetFill"></div></div>
        <div class="asset-progress-msg" id="assetMsg">准备中...</div>
      </div>
      <div class="asset-enter-hint" id="assetEnterHint" style="display:none">点击任意处进入</div>
      <div class="asset-click-overlay" id="assetClickOverlay"></div>
    </div>`;
  const fillEl = () => document.getElementById('assetFill');
  const msgEl = () => document.getElementById('assetMsg');
  const progressAreaEl = () => document.getElementById('assetProgressArea');
  const enterHintEl = () => document.getElementById('assetEnterHint');
  const overlayEl = () => document.getElementById('assetClickOverlay');
  function showEnterHint() {
    if (progressAreaEl()) progressAreaEl().style.display = 'none';
    if (enterHintEl()) enterHintEl().style.display = 'block';
    if (overlayEl()) overlayEl().classList.add('active');
  }
  let _hasProgress = false;
  let resolveReady;
  const readyPromise = new Promise(r => { resolveReady = r; });
  let readyResolved = false;
  const mySessionId = sessionId;
  overlayEl()?.addEventListener('click', () => { if (!readyResolved) { readyResolved = true; resolveReady(); } });
  try {
    const res = await fetch(assetsUrl || `/api/session/${sessionId}/assets-stream`);
    if (!res.ok) { showEnterHint(); return; }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const readLoop = async () => {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let evt;
          try { evt = JSON.parse(line.slice(6)); } catch(e) { continue; }
          if (evt.event === 'assets_meta') {
            if (evt.enabled && evt.total && evt.total > 0) {
              _hasProgress = true;
              if (progressAreaEl()) progressAreaEl().style.display = 'block';
            }
            if (msgEl()) msgEl().textContent = evt.message || '正在生成美术素材';
          } else if (evt.event === 'asset_progress') {
            if (!_hasProgress) { _hasProgress = true; if (progressAreaEl()) progressAreaEl().style.display = 'block'; }
            const pct = evt.total ? Math.round((evt.done / evt.total) * 100) : 0;
            if (fillEl()) fillEl().style.width = pct + '%';
            if (msgEl()) msgEl().textContent = `正在绘制「${evt.name}」（${evt.done}/${evt.total}）`;
          } else if (evt.event === 'assets_ready') {
            vnAssets = { characters: evt.characters || {}, scenes: evt.scenes || {}, enabled: !!evt.enabled };
            if (fillEl()) fillEl().style.width = '100%';
            showEnterHint();
          } else if (evt.event === 'asset_bg_ready') {
            if (evt.url && sessionId === mySessionId) {
              if (evt.scene_id) vnAssets.scenes[evt.scene_id] = evt.url;
              if (evt.scene_name && evt.scene_name !== evt.scene_id) vnAssets.scenes[evt.scene_name] = evt.url;
              vnApplyBackground(vnState.meta);
              releaseBgGate(evt.scene_id, evt.scene_name);
            }
          } else if (evt.event === 'asset_char_ready') {
            if (evt.url && sessionId === mySessionId) {
              vnAssets.characters[evt.char_name] = evt.url;
              releaseCharGate(evt.char_name);
              // 角色已在舞台上（有位置但无 DOM）→ 补建立绘
              const spritesEl = document.getElementById('vnSprites');
              if (spritesEl && evt.char_name in vnCharPos && !spritesEl.querySelector(`[data-char="${evt.char_name}"]`)) {
                const div = document.createElement('div');
                div.className = `vn-sprite pos-${vnCharPos[evt.char_name]} dimmed`;
                div.dataset.char = evt.char_name;
                div.innerHTML = `<img class="sprite-img" src="${evt.url}" alt="${evt.char_name}"><div class="sprite-label">${evt.char_name}</div>`;
                spritesEl.appendChild(div);
              }
            }
          } else if (evt.event === 'assets_done') {
            if (sessionId === mySessionId) vnAssets = { characters: evt.characters || {}, scenes: evt.scenes || {}, enabled: !!evt.enabled };
          }
        }
      }
    };
    const bgReadPromise = readLoop().then(() => { if (!readyResolved) showEnterHint(); });
    const safetyTimer = setTimeout(() => { if (!readyResolved) showEnterHint(); }, 120000);
    await readyPromise;
    clearTimeout(safetyTimer);
  } catch(e) {
    vnAssets = { characters: {}, scenes: {}, enabled: false };
    showEnterHint();
  }
}

function vnApplyBackground(meta) {
  const bgEl = document.getElementById('vnBg');
  if (!bgEl || !meta || (!meta.scene_id && !meta.scene_name)) return Promise.resolve();
  const url = vnAssets.scenes[meta.scene_id] || vnAssets.scenes[meta.scene_name];
  if (!url) return Promise.resolve();
  // 预加载完成后再设置背景，返回 Promise 等待图片真正加载完成
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { bgEl.style.backgroundImage = `url(${url})`; resolve(); };
    img.onerror = () => { resolve(); }; // 加载失败也放行，不能一直卡住
    img.src = url;
  });
}

function vnResetSprites() { vnCharPos = {}; vnSpeakerRecency = []; }

function vnSyncSprites(speaker) {
  const spritesEl = document.getElementById('vnSprites');
  if (!spritesEl || !speaker) return;
  vnSpeakerRecency = vnSpeakerRecency.filter(n => n !== speaker);
  vnSpeakerRecency.push(speaker);
  if (!(speaker in vnCharPos)) {
    let freePos = VN_POS_POOL.find(p => !Object.values(vnCharPos).includes(p));
    if (!freePos) {
      const evict = vnSpeakerRecency.filter(n => n !== speaker && (n in vnCharPos))[0];
      freePos = vnCharPos[evict];
      delete vnCharPos[evict];
      const oldEl = spritesEl.querySelector(`[data-char="${evict}"]`);
      if (oldEl) oldEl.remove();
    }
    vnCharPos[speaker] = freePos;
  }
  Object.keys(vnCharPos).forEach(name => {
    if (!spritesEl.querySelector(`[data-char="${name}"]`)) {
      const imgUrl = vnAssets.characters[name];
      // 没有图片 URL 时不创建占位体，等 Phase 2 热更新后自动补上
      if (!imgUrl) return;
      const div = document.createElement('div');
      div.className = `vn-sprite pos-${vnCharPos[name]} dimmed hidden`;
      div.dataset.char = name;
      div.innerHTML = `<img class="sprite-img" src="${imgUrl}" alt="${name}"><div class="sprite-label">${name}</div>`;
      spritesEl.appendChild(div);
      void div.offsetHeight;
    }
  });
  document.querySelectorAll('.vn-sprite').forEach(s => {
    const name = s.dataset.char;
    if (name in vnCharPos) {
      s.classList.remove('hidden');
      if (name === speaker) { s.classList.add('active'); s.classList.remove('dimmed'); }
      else { s.classList.add('dimmed'); s.classList.remove('active'); }
    } else { s.classList.add('hidden'); s.classList.remove('active'); }
  });
}

// ─── 剧本管线：文字生成流（后台缓冲 + 实时处理）───
async function startTextStreamBackground() {
  try {
    const res = await fetch(`/api/session/${sessionId}/generate-stream`, { method: 'POST' });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || `HTTP ${res.status}`); }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) { _textStreamDone = true; break; }
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const evt = JSON.parse(line.slice(6));
            if (_textProcessing) handleStreamEvent(evt);
            else _textEventBuffer.push(evt);
          } catch(e) {}
        }
      }
    }
  } catch(e) { _textStreamError = e; }
}

// ─── 剧本管线：流式生成入口 ───
async function generateSceneStream(textStreamPromise) {
  chosenIndex = -1;
  vnStreamDone = false;
  vnStreamStarted = false;
  vnState = { queue: [], idx: -1, charPositions: {}, choices: [], sessionState: '', meta: {}, progress: 0 };
  vnNarrationStreaming = false;
  vnNarrationIdx = -1;
  vnIsEnding = false;
  vnEndingData = null;
  vnPopupActive = false;
  vnWaiting = false;
  vnErrorMode = false;
  clearTimeout(vnWaitingTimer); vnWaitingTimer = null;
  vnPopupShownThisScene = false;
  clearInterval(vnPopupTypewriterTimer);
  vnResetSprites();
  vnStopAudio();
  vnAudioQueue = [];
  renderVNStage(0);

  try {
    if (textStreamPromise) {
      if (_textStreamError) throw _textStreamError;
      _textProcessing = true;
      while (_textEventBuffer.length > 0) handleStreamEvent(_textEventBuffer.shift());
      await textStreamPromise;
      if (_textStreamError) throw _textStreamError;
    } else {
      const res = await fetch(`/api/session/${sessionId}/generate-stream`, { method: 'POST' });
      if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || `HTTP ${res.status}`); }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) { try { handleStreamEvent(JSON.parse(line.slice(6))); } catch(e) {} }
        }
      }
    }
  } catch(e) {
    vnEnterErrorMode(`生成失败: ${e.message}`);
  }
}

function handleStreamEvent(evt) {
  const type = evt.event;
  const stageMsgEl = document.getElementById('vnStageMsg');
  const textEl = document.getElementById('vnText');
  const hintEl = document.getElementById('vnHint');
  switch(type) {
    case 'stage':
      if (stageMsgEl) stageMsgEl.textContent = evt.message || '生成中...';
      break;
    case 'narration_start':
      vnNarrationStreaming = true;
      vnNarrationIdx = -1;
      break;
    case 'narration_delta':
      if (vnNarrationIdx < 0) {
        vnState.queue.push({ type: 'narration', speaker: '', text: '', emotion: '', streaming: true });
        vnNarrationIdx = vnState.queue.length - 1;
        if (vnWaiting) vnResumeFromWaiting();
        else vnTryStartDisplay();
      }
      vnState.queue[vnNarrationIdx].text += (evt.delta || '');
      if (vnPopupActive && vnPopupTypewriterDone && vnNarrationIdx >= 0) {
        const ptEl = document.getElementById('vnNarrationText');
        if (ptEl) { ptEl.textContent = vnState.queue[vnNarrationIdx].text; ptEl.scrollTop = ptEl.scrollHeight; }
      }
      break;
    case 'narration':
      if (vnNarrationStreaming && vnNarrationIdx >= 0 && vnState.queue[vnNarrationIdx]) {
        const nItem = vnState.queue[vnNarrationIdx];
        nItem.text = evt.text;
        nItem.streaming = false;
        if (vnState.idx === vnNarrationIdx && vnPopupActive) {
          const ptEl = document.getElementById('vnNarrationText');
          if (ptEl) { ptEl.textContent = evt.text; ptEl.scrollTop = ptEl.scrollHeight; }
        }
        if (vnState.idx === vnNarrationIdx && typewriterDone && !vnPopupActive) {
          const tEl = document.getElementById('vnText');
          if (tEl) { tEl.textContent = evt.text; tEl.scrollTop = tEl.scrollHeight; }
        }
      } else {
        vnState.queue.push({ type: 'narration', speaker: '', text: evt.text, emotion: '', streaming: false });
        if (vnWaiting) vnResumeFromWaiting();
        else vnTryStartDisplay();
      }
      vnNarrationStreaming = false;
      vnNarrationIdx = -1;
      vnRefreshHint();
      break;
    case 'dialogue':
      vnState.queue.push({ type: 'dialogue', speaker: evt.speaker, text: evt.text, emotion: evt.emotion || '' });
      if (vnWaiting) vnResumeFromWaiting();
      else vnTryStartDisplay();
      vnRefreshHint();
      break;
    case 'action':
      vnState.queue.push({ type: 'action', speaker: evt.subject || '', text: evt.text, emotion: '' });
      if (vnWaiting) vnResumeFromWaiting();
      else vnTryStartDisplay();
      vnRefreshHint();
      break;
    case 'tts':
      if (vnTtsEnabled && evt.url) {
        vnAudioQueue.push({ speaker: evt.speaker || '', url: evt.url, lineIdx: evt.lineIdx !== undefined ? evt.lineIdx : vnState.queue.length - 1 });
        vnTryPlayAudio();
      }
      break;
    case 'choices':
      vnState.choices = evt.choices || [];
      break;
    case 'retry':
      vnState.queue = []; vnState.idx = -1; vnStreamStarted = false;
      vnNarrationStreaming = false; vnNarrationIdx = -1; vnWaiting = false; vnPopupShownThisScene = false;
      clearInterval(typewriterTimer);
      const _retryPopup = document.getElementById('vnNarrationPopup');
      if (_retryPopup) _retryPopup.style.display = 'none';
      const _retryDbox = document.getElementById('vnDialogueBox');
      if (_retryDbox) _retryDbox.style.visibility = 'visible';
      vnPopupActive = false; vnPopupTypewriterDone = true;
      clearInterval(vnPopupTypewriterTimer);
      vnStopAudio(); vnAudioQueue = [];
      if (textEl) textEl.innerHTML = `<div class="vn-streaming-hint"><div class="spinner"></div><span id="vnStageMsg">重试中...</span></div>`;
      if (hintEl) hintEl.style.display = 'none';
      break;
    case 'meta':
      vnState.meta = evt.scene_meta || {};
      vnState.sessionState = evt.session_state || '';
      vnState.progress = evt.progress || 0;
      if (evt.available_choices && evt.available_choices.length > 0) vnState.choices = evt.available_choices;
      const infoEl = document.getElementById('vnSceneInfo');
      const m = vnState.meta;
      if (infoEl) infoEl.textContent = `${m.scene_name || ''} ${m.location ? '· ' + m.location : ''} （场景 ${m.scene_index||'?'}/${m.total_scenes||'?'}）`;
      const bar = document.getElementById('vnProgress');
      if (bar) bar.style.width = `${(vnState.progress || 0) * 100}%`;
      vnApplyBackground(m);
      break;
    case 'done':
      vnStreamDone = true;
      vnWaiting = false;
      vnRefreshHint();
      break;
    case 'error':
      vnStreamDone = true;
      vnEnterErrorMode(evt.message || '生成失败');
      break;
  }
}

async function vnTryStartDisplay() {
  if (!vnStreamStarted && vnState.queue.length > 0) {
    vnStreamStarted = true;
    const speakerEl = document.getElementById('vnSpeaker');
    if (speakerEl) speakerEl.innerHTML = '';
    // 等待背景素材到位后再开始显示（显示加载遮罩）
    showAssetGate();
    await waitForBackground(vnState.meta);
    await vnApplyBackground(vnState.meta);
    hideAssetGate();
    vnShowLine(0);
  }
}

function vnKeyHandler(e) {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); vnAdvance(); }
}

// ─── 打字机效果 ───
async function vnShowLine(idx) {
  vnLineStartTime = Date.now();
  const { queue } = vnState;
  if (idx >= queue.length) {
    if (vnIsEnding) { vnShowEndingFinal(); return; }
    if (vnStreamDone) vnShowChoices(); else vnShowWaiting();
    return;
  }
  vnState.idx = idx;
  const line = queue[idx];
  // 每个场景的第一行：等待背景素材到位
  if (idx === 0) {
    const meta = vnState.meta;
    const bgReady = meta && (vnAssets.scenes[meta.scene_id] || vnAssets.scenes[meta.scene_name]);
    if (!bgReady) showAssetGate();
    await waitForBackground(meta);
    await vnApplyBackground(meta);
    hideAssetGate();
  }
  // 对话行：等待该角色立绘到位后再显示（不显示全屏遮罩，仅锁定推进）
  if (line.type === 'dialogue' && line.speaker) {
    _vnAssetGateActive = true;
    await waitForCharacterSprite(line.speaker);
    _vnAssetGateActive = false;
  }
  if (idx === 0 && line.type === 'narration' && !vnPopupShownThisScene && document.getElementById('vnNarrationPopup')) {
    vnShowNarrationPopup(line); return;
  }
  // 非旁白弹窗路径：确保对话框可见
  const _dboxVis = document.getElementById('vnDialogueBox');
  if (_dboxVis) _dboxVis.style.visibility = 'visible';
  const speakerEl = document.getElementById('vnSpeaker');
  const textEl = document.getElementById('vnText');
  const emotionEl = document.getElementById('vnEmotion');
  const hintEl = document.getElementById('vnHint');
  if (line.type === 'narration') {
    speakerEl.innerHTML = '';
    document.querySelectorAll('.vn-sprite').forEach(s => { s.classList.add('dimmed'); s.classList.remove('active'); });
  } else if (line.type === 'action') {
    speakerEl.innerHTML = '';
    document.querySelectorAll('.vn-sprite').forEach(s => { s.classList.add('dimmed'); s.classList.remove('active'); });
  } else {
    speakerEl.innerHTML = `<span class="vn-speaker-name">${escapeHtml(line.speaker)}</span>`;
    vnSyncSprites(line.speaker);
  }
  const _dbox = document.getElementById('vnDialogueBox');
  if (_dbox) {
    _dbox.classList.remove('speaker-left', 'speaker-right');
    if (line.type === 'dialogue') {
      const _pos = vnCharPos[line.speaker];
      if (_pos === 'left') _dbox.classList.add('speaker-left');
      else if (_pos === 'right') _dbox.classList.add('speaker-right');
    }
  }
  textEl.classList.toggle('vn-action-text', line.type === 'action');
  emotionEl.textContent = line.emotion ? `〔${line.emotion}〕` : '';
  if (hintEl) { hintEl.style.display = 'block'; hintEl.textContent = '点击继续 ▶'; hintEl.classList.remove('waiting'); }
  // 只停止非当前行的音频，避免误杀已正确开始的当前行 TTS
  if (vnCurrentAudioLineIdx !== idx) vnStopAudio();
  vnAudioQueue = vnAudioQueue.filter(a => a.lineIdx >= idx);
  setTimeout(() => vnTryPlayAudio(), 50);
  const typewriterSpeed = vnTtsEnabled ? 1 : 2;
  const typewriterInterval = vnTtsEnabled ? 50 : 30;
  typewriterDone = false;
  vnTypewriterCharIdx = 0;
  vnTypewriterLine = line;
  vnTypewriterText = line.text;
  let charIdx = 0;
  textEl.textContent = '';
  clearInterval(typewriterTimer);
  function _typewriterTick(speed, interval) {
    clearInterval(typewriterTimer);
    typewriterTimer = setInterval(() => {
      const fullText = vnTypewriterLine.text;
      charIdx += speed;
      vnTypewriterCharIdx = charIdx;
      if (charIdx > fullText.length) charIdx = fullText.length;
      textEl.textContent = fullText.slice(0, charIdx);
      textEl.scrollTop = textEl.scrollHeight;
      if (charIdx >= fullText.length) {
        if (vnTypewriterLine.streaming) return;
        clearInterval(typewriterTimer);
        textEl.textContent = fullText;
        typewriterDone = true;
        vnRefreshHint();
      }
    }, interval);
  }
  _typewriterTick(typewriterSpeed, typewriterInterval);
}

function vnSyncTypewriterToAudio(duration) {
  if (typewriterDone || !vnTypewriterLine) return;
  const fullText = vnTypewriterLine.text;
  if (!fullText || fullText.length === 0) return;
  const remaining = fullText.length - vnTypewriterCharIdx;
  if (remaining <= 0) return;
  const elapsed = vnTypewriterLine._audioStartTime ? (performance.now() - vnTypewriterLine._audioStartTime) / 1000 : 0;
  const remainingAudio = Math.max(0.5, duration - elapsed);
  const newInterval = Math.max(20, Math.min(300, (remainingAudio * 1000 * 0.9) / remaining));
  _typewriterTickAgain(1, newInterval);
}

function _typewriterTickAgain(speed, interval) {
  const textEl = document.getElementById('vnText');
  if (!textEl) return;
  clearInterval(typewriterTimer);
  let charIdx = vnTypewriterCharIdx;
  typewriterTimer = setInterval(() => {
    const fullText = vnTypewriterLine ? vnTypewriterLine.text : '';
    charIdx += speed;
    vnTypewriterCharIdx = charIdx;
    if (charIdx > fullText.length) charIdx = fullText.length;
    textEl.textContent = fullText.slice(0, charIdx);
    textEl.scrollTop = textEl.scrollHeight;
    if (charIdx >= fullText.length) {
      if (vnTypewriterLine && vnTypewriterLine.streaming) return;
      clearInterval(typewriterTimer);
      textEl.textContent = fullText;
      typewriterDone = true;
      vnRefreshHint();
    }
  }, interval);
}

function vnShowWaiting() {
  vnWaiting = true;
  const textEl = document.getElementById('vnText');
  const hintEl = document.getElementById('vnHint');
  if (textEl) textEl.innerHTML = `<div class="vn-streaming-hint"><div class="spinner"></div><span>后续内容生成中...</span></div>`;
  if (hintEl) { hintEl.style.display = 'block'; hintEl.textContent = '后续内容生成中...'; hintEl.classList.add('waiting'); }
  // 超时兜底：120s 无新内容则判定断流，进入错误模式避免永久卡死
  clearTimeout(vnWaitingTimer);
  vnWaitingTimer = setTimeout(() => {
    if (!vnWaiting) return;
    vnEnterErrorMode('等待超时：长时间未收到新内容，连接可能已中断');
  }, 120000);
}

// ─── 错误模式：生成失败/断流，禁止推进，点击对话框返回首页 ───
function vnEnterErrorMode(message) {
  vnErrorMode = true;
  vnWaiting = false;
  clearTimeout(vnWaitingTimer); vnWaitingTimer = null;
  clearInterval(typewriterTimer);
  const popup = document.getElementById('vnNarrationPopup');
  if (popup) popup.style.display = 'none';
  vnPopupActive = false;
  const dbox = document.getElementById('vnDialogueBox');
  if (dbox) {
    // 必须先移除 vnAdvance 监听器，否则 addEventListener 注册的回调
    // 会先于 onclick 触发，导致点击后推进剧情而非返回首页
    dbox.removeEventListener('click', vnAdvance);
    dbox.style.visibility = 'visible';
    dbox.onclick = () => location.href = '/';
  }
  const textEl = document.getElementById('vnText');
  if (textEl) textEl.innerHTML = `<span style="color:var(--danger)">${message}</span>`;
  const hintEl = document.getElementById('vnHint');
  if (hintEl) { hintEl.style.display = 'block'; hintEl.textContent = '点击返回首页'; hintEl.classList.remove('waiting'); }
}

function vnResumeFromWaiting() {
  vnWaiting = false;
  clearTimeout(vnWaitingTimer); vnWaitingTimer = null;
  const hintEl = document.getElementById('vnHint');
  if (hintEl) hintEl.classList.remove('waiting');
  if (vnState.idx < vnState.queue.length - 1) vnShowLine(vnState.idx + 1);
}

function vnShowNarrationPopup(line) {
  vnLineStartTime = Date.now();
  vnPopupActive = true;
  vnPopupShownThisScene = true;
  vnPopupTypewriterDone = false;
  const popup = document.getElementById('vnNarrationPopup');
  const textEl = document.getElementById('vnNarrationText');
  if (!popup || !textEl) { vnPopupActive = false; return; }
  popup.style.display = 'flex';
  popup.onclick = vnAdvance;
  const dbox = document.getElementById('vnDialogueBox');
  if (dbox) dbox.style.visibility = 'hidden';
  let charIdx = 0;
  textEl.textContent = '';
  clearInterval(vnPopupTypewriterTimer);
  vnPopupTypewriterTimer = setInterval(() => {
    const fullText = line.text;
    charIdx += 2;
    if (charIdx > fullText.length) charIdx = fullText.length;
    textEl.textContent = fullText.slice(0, charIdx);
    textEl.scrollTop = textEl.scrollHeight;
    if (charIdx >= fullText.length) {
      if (line.streaming) return;
      clearInterval(vnPopupTypewriterTimer);
      textEl.textContent = fullText;
      vnPopupTypewriterDone = true;
      vnRefreshHint();
    }
  }, 30);
  vnRefreshHint();
}

function vnRefreshHint() {
  const twDone = vnPopupActive ? vnPopupTypewriterDone : typewriterDone;
  const atEnd = twDone && !vnStreamDone && vnState.idx >= vnState.queue.length - 1;
  const hintId = vnPopupActive ? 'vnPopupHint' : 'vnHint';
  const h = document.getElementById(hintId);
  if (h) {
    if (atEnd) {
      h.textContent = '后续内容生成中...'; h.classList.add('waiting');
    } else {
      h.textContent = '点击继续 ▶'; h.classList.remove('waiting');
    }
  }
  vnScheduleAutoAdvance();
}

// ─── 自动播放 ───
function vnSyncAutoBtn() {
  const btn = document.getElementById('vnAutoBtn');
  if (btn) { btn.textContent = vnAutoPlay ? '自动:开' : '自动'; btn.classList.toggle('active', vnAutoPlay); }
}
function vnToggleAutoPlay() {
  vnAutoPlay = !vnAutoPlay;
  vnSyncAutoBtn();
  if (vnAutoPlay) vnScheduleAutoAdvance(); else clearTimeout(vnAutoPlayTimer);
}
function vnScheduleAutoAdvance() {
  clearTimeout(vnAutoPlayTimer);
  if (!vnAutoPlay) return;
  const twDone = vnPopupActive ? vnPopupTypewriterDone : typewriterDone;
  if (!twDone) return;
  const { idx, queue } = vnState;
  if (idx >= queue.length - 1 && !vnStreamDone) return;
  if (vnTtsEnabled && vnCurrentAudio) return;
  const len = (queue[idx] && queue[idx].text) ? queue[idx].text.length : 0;
  const delay = Math.min(6000, 700 + len * 45);
  const elapsed = Date.now() - vnLineStartTime;
  const finalDelay = Math.max(delay, 1000 - elapsed);
  vnAutoPlayTimer = setTimeout(() => vnAdvance(), finalDelay);
}

// ─── TTS 语音播放 ───
function vnSyncVoiceBtn() {
  const btn = document.getElementById('vnVoiceBtn');
  if (btn) { btn.textContent = vnTtsEnabled ? '声音:开' : '声音:关'; btn.classList.toggle('active', vnTtsEnabled); }
}
function vnToggleVoice() {
  vnTtsEnabled = !vnTtsEnabled;
  vnSyncVoiceBtn();
  if (!vnTtsEnabled) {
    if (vnCurrentAudio) { vnCurrentAudio.pause(); vnCurrentAudio = null; }
    vnAudioLock = false;
  } else { vnTryPlayAudio(); }
}
function vnTryPlayAudio() {
  if (vnAudioLock || vnCurrentAudio) return;
  if (!vnTtsEnabled) return;
  const itemIdx = vnAudioQueue.findIndex(a => a.lineIdx === vnState.idx);
  if (itemIdx < 0) return;
  const item = vnAudioQueue[itemIdx];
  vnAudioQueue.splice(itemIdx, 1);
  vnAudioLock = true;
  vnCurrentAudioLineIdx = item.lineIdx;
  const audio = new Audio(item.url);
  vnCurrentAudio = audio;
  audio.addEventListener('loadedmetadata', () => {
    if (vnTypewriterLine && !typewriterDone) {
      vnTypewriterLine._audioStartTime = performance.now();
      vnSyncTypewriterToAudio(audio.duration);
    }
  });
  audio.onended = () => { vnCurrentAudio = null; vnAudioLock = false; vnCurrentAudioLineIdx = -1; vnTryPlayAudio(); if (vnAutoPlay) vnScheduleAutoAdvance(); };
  audio.onerror = () => { vnCurrentAudio = null; vnAudioLock = false; vnCurrentAudioLineIdx = -1; vnTryPlayAudio(); };
  audio.play().catch(() => { vnCurrentAudio = null; vnAudioLock = false; vnCurrentAudioLineIdx = -1; });
}
function vnStopAudio() {
  if (vnCurrentAudio) { vnCurrentAudio.pause(); vnCurrentAudio = null; }
  vnAudioLock = false;
  vnCurrentAudioLineIdx = -1;
}

function vnAdvance() {
  // 错误模式下点击 = 返回首页（键盘 Space/Enter 也走此函数）
  if (vnErrorMode) { location.href = '/'; return; }
  clearTimeout(vnAutoPlayTimer);
  vnStopAudio();
  // 素材门控进行中，禁止用户推进
  if (_vnAssetGateActive) return;
  if (vnWaiting) {
    return;
  }
  if (vnEndingScrollActive) {
    if (!vnEndingScrollDone) {
      clearInterval(vnEndingScrollTimer);
      const textEl = document.getElementById('vnEndingScrollText');
      const scroll = document.getElementById('vnEndingScroll');
      if (textEl) textEl.textContent = vnState.queue.map(l => l.text).join('\n\n');
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
      vnEndingScrollDone = true;
      return;
    }
    const scroll = document.getElementById('vnEndingScroll');
    if (scroll) scroll.style.display = 'none';
    vnEndingScrollActive = false;
    vnShowEndingFinal();
    return;
  }
  if (vnPopupActive) {
    const line = vnState.queue[vnState.idx];
    if (!vnPopupTypewriterDone) {
      clearInterval(vnPopupTypewriterTimer);
      const ptEl = document.getElementById('vnNarrationText');
      if (ptEl && line) { ptEl.textContent = line.text; ptEl.scrollTop = ptEl.scrollHeight; }
      vnPopupTypewriterDone = true;
      vnRefreshHint();
      return;
    }
    if (line && line.streaming) return; // 旁白仍在流式接收中，禁止关闭弹窗
    if (Date.now() - vnLineStartTime < 1000) return; // 强制1秒最小停留
    if (!vnStreamDone && vnState.idx >= vnState.queue.length - 1) {
      // 弹窗内显示“后续内容生成中”，点击忽略
      return;
    }
    const popup = document.getElementById('vnNarrationPopup');
    if (popup) popup.style.display = 'none';
    const dbox = document.getElementById('vnDialogueBox');
    if (dbox) dbox.style.visibility = 'visible';
    vnPopupActive = false;
    const { idx, queue } = vnState;
    if (idx < queue.length - 1) vnShowLine(idx + 1);
    else if (vnStreamDone) vnShowChoices(); else vnShowWaiting();
    return;
  }
  if (!typewriterDone) {
    clearInterval(typewriterTimer);
    const textEl = document.getElementById('vnText');
    const line = vnState.queue[vnState.idx];
    if (textEl && line) { textEl.textContent = line.text; textEl.scrollTop = textEl.scrollHeight; }
    if (line) line.streaming = false;
    typewriterDone = true;
    return;
  }
  if (Date.now() - vnLineStartTime < 1000) return; // 强制1秒最小停留
  if (!vnStreamDone && vnState.idx >= vnState.queue.length - 1) {
    // 已读完所有到达内容，流未结束：等待
    vnShowWaiting();
    return;
  }
  const { idx, queue } = vnState;
  if (idx < queue.length - 1) vnShowLine(idx + 1);
  else if (vnStreamDone) { if (vnIsEnding) { vnShowEndingFinal(); return; } vnShowChoices(); }
}

function vnShowChoices() {
  const { choices, sessionState } = vnState;
  const box = document.getElementById('vnDialogueBox');
  const overlay = document.getElementById('vnChoices');
  document.removeEventListener('keydown', vnKeyHandler);
  if (sessionState === 'generated' && choices.length > 0 && chosenIndex < 0) {
    box.style.opacity = '0'; box.style.pointerEvents = 'none';
    overlay.style.display = 'flex';
    overlay.innerHTML = `<div class="choices-label">做出你的选择</div>${choices.map((c, i) => `<button class="choice-btn" data-idx="${i}"><div>${escapeHtml(c.text)}</div><div class="effect">${escapeHtml(c.effect || c.description || c.hint || '')}</div></button>`).join('')}`;
    overlay.addEventListener('click', e => {
      const btn = e.target.closest('.choice-btn');
      if (!btn) return;
      const idx = parseInt(btn.dataset.idx);
      const text = choices[idx]?.text || '';
      overlay.querySelectorAll('.choice-btn').forEach((b, i) => { if (i === idx) b.classList.add('selected'); b.style.pointerEvents = 'none'; });
      if (realtimeMode) realtimeChooseInVN(idx); else makeChoice(idx, text);
    });
  } else if (chosenIndex >= 0) {
    box.style.opacity = '0'; box.style.pointerEvents = 'none';
    overlay.style.display = 'flex';
    overlay.innerHTML = `<div class="waiting-msg" style="margin-bottom:16px">选择已确认</div><button class="btn btn-primary" id="vnNextBtn">继续下一段 →</button>`;
    document.getElementById('vnNextBtn').addEventListener('click', () => {
      document.removeEventListener('keydown', vnKeyHandler);
      if (realtimeMode) {} else generateSceneStream();
    });
  } else {
    box.style.opacity = '0'; box.style.pointerEvents = 'none';
    overlay.style.display = 'flex';
    overlay.innerHTML = `<button class="btn btn-primary" id="vnNextBtn2">继续下一段 →</button>`;
    document.getElementById('vnNextBtn2').addEventListener('click', () => {
      document.removeEventListener('keydown', vnKeyHandler);
      if (realtimeMode) {} else generateSceneStream();
    });
  }
}

async function makeChoice(index, text) {
  if (chosenIndex >= 0) return;
  chosenIndex = index;
  document.querySelectorAll('.choice-btn').forEach((btn,i) => { if(i===index) btn.classList.add('selected'); btn.style.pointerEvents = 'none'; });
  try {
    const res = await api(`/api/session/${sessionId}/choose`, { method:'POST', body: JSON.stringify({choice_text:text, choice_index:index}) });
    if (res.session_state === 'finished') { setTimeout(() => renderEnd(res), 500); }
    else { chosenIndex = -1; await generateSceneStream(); }
  } catch(e) { alert('Error: '+e.message); chosenIndex = -1; }
}

function renderEnd(state) {
  document.removeEventListener('keydown', vnKeyHandler);
  clearInterval(typewriterTimer);
  const ending = state.ending || {};
  const matched = ending.matched_ending || {};
  const typeLabel = {bad: '坏结局', normal: '普通结局', good: '好结局', true: '真结局'};
  const typeColor = {bad: '#c5544d', normal: '#c89968', good: '#6b9e7a', true: '#c5a265'};
  const eType = matched.type || '';
  const eColor = typeColor[eType] || '#c5a265';
  const endQueue = [];
  if (matched.narrative) endQueue.push({ type: 'narration', speaker: '', text: matched.narrative, emotion: '', streaming: false });
  if (matched.epilogue) endQueue.push({ type: 'narration', speaker: '', text: '【尾声】\n' + matched.epilogue, emotion: '', streaming: false });
  if (endQueue.length === 0) endQueue.push({ type: 'narration', speaker: '', text: '你已走完这条世界线的全部场景。', emotion: '', streaming: false });
  vnIsEnding = true;
  vnEndingData = { matched, eType, eColor, typeLabel };
  chosenIndex = -1;
  vnState = { queue: endQueue, idx: -1, charPositions: {}, choices: [], sessionState: 'finished', meta: {}, progress: 1 };
  vnStreamDone = true; vnStreamStarted = true; typewriterDone = true;
  vnResetSprites(); vnStopAudio(); vnAudioQueue = [];
  app.innerHTML = `
    <div class="vn-stage" id="vnStage">
      <div class="vn-progress" id="vnProgress" style="width:100%"></div>
      <div class="vn-bg" id="vnBg" style="background:radial-gradient(ellipse at center,#2a241a 0%,#181410 100%)"></div>
      <div class="vn-scene-info">故事结束</div>
      <div class="vn-top-bar"><button id="vnHomeBtn">退出</button></div>
      <div class="vn-sprites" id="vnSprites"></div>
      <div class="vn-dialogue-box" id="vnDialogueBox" style="opacity:0;pointer-events:none"><div id="vnSpeaker"></div><div class="vn-text" id="vnText"></div><div class="vn-emotion" id="vnEmotion"></div><div class="vn-advance-hint" id="vnHint" style="display:none">点击继续 ▶</div></div>
      <div class="vn-ending-scroll" id="vnEndingScroll" style="display:none"><div class="vn-ending-scroll-text" id="vnEndingScrollText"></div><div class="vn-ending-scroll-hint" id="vnEndingScrollHint">点击继续 ▶</div></div>
      <div class="vn-ending-overlay" id="vnEndingOverlay"><div class="ending-type" style="color:${eColor};border-color:${eColor}">${typeLabel[eType] || '结局'}</div><div class="ending-title">${escapeHtml(matched.title || '故事结束')}</div><div class="ending-hint">点击继续</div></div>
      <div class="vn-choices-overlay" id="vnChoices" style="display:none"></div>
    </div>`;
  document.getElementById('vnEndingOverlay').addEventListener('click', () => {
    const ov = document.getElementById('vnEndingOverlay');
    ov.style.opacity = '0';
    setTimeout(() => { ov.style.display = 'none'; }, 500);
    document.addEventListener('keydown', vnKeyHandler);
    vnStartEndingScroll();
  });
  document.getElementById('vnHomeBtn').addEventListener('click', () => { document.removeEventListener('keydown', vnKeyHandler); vnIsEnding = false; location.href = '/'; });
}

function vnStartEndingScroll() {
  vnLineStartTime = Date.now();
  vnEndingScrollActive = true;
  vnEndingScrollDone = false;
  const scroll = document.getElementById('vnEndingScroll');
  const textEl = document.getElementById('vnEndingScrollText');
  const hint = document.getElementById('vnEndingScrollHint');
  if (!scroll || !textEl) { vnEndingScrollActive = false; vnShowEndingFinal(); return; }
  const fullText = vnState.queue.map(l => l.text).join('\n\n');
  scroll.style.display = 'block';
  scroll.scrollTop = 0;
  scroll.onclick = vnAdvance;
  if (hint) { hint.textContent = '点击继续 ▶'; hint.classList.remove('waiting'); }
  let charIdx = 0;
  textEl.textContent = '';
  clearInterval(vnEndingScrollTimer);
  vnEndingScrollTimer = setInterval(() => {
    charIdx += 2;
    if (charIdx > fullText.length) charIdx = fullText.length;
    textEl.textContent = fullText.slice(0, charIdx);
    scroll.scrollTop = scroll.scrollHeight;
    if (charIdx >= fullText.length) { clearInterval(vnEndingScrollTimer); vnEndingScrollDone = true; }
  }, 30);
}

function vnShowEndingFinal() {
  // 实时管线中 vnEndingData 可能尚未就绪（等待 story_complete 事件），显示保存中状态
  if (!vnEndingData) {
    const box = document.getElementById('vnDialogueBox');
    const overlay = document.getElementById('vnChoices');
    if (box) { box.style.opacity = '0'; box.style.pointerEvents = 'none'; }
    if (overlay) {
      overlay.style.display = 'flex';
      overlay.innerHTML = `<div class="waiting-msg">正在保存剧本...</div>`;
    }
    return;
  }
  const { matched, eColor, typeLabel, eType } = vnEndingData;
  const box = document.getElementById('vnDialogueBox');
  const overlay = document.getElementById('vnChoices');
  document.removeEventListener('keydown', vnKeyHandler);
  if (box) { box.style.opacity = '0'; box.style.pointerEvents = 'none'; }
  if (overlay) {
    overlay.style.display = 'flex';
    overlay.innerHTML = `<div class="ending-final-card" style="border-color:${eColor}"><div class="ending-type" style="color:${eColor};border-color:${eColor}">${(typeLabel && typeLabel[eType]) || '结局'}</div><div class="ending-title-sm">${escapeHtml((matched && matched.title) || '故事结束')}</div>${matched && matched.replay_value ? `<div class="ending-replay">💭 ${escapeHtml(matched.replay_value)}</div>` : ''}</div><button class="btn btn-primary" id="endHomeBtn" style="margin-top:8px">返回首页</button>`;
    document.getElementById('endHomeBtn').addEventListener('click', () => { vnIsEnding = false; location.href = '/'; });
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadHistory() {
  const p = document.getElementById('historyPanel');
  if(!p) return;
  try {
    const d = await api(`/api/session/${sessionId}/history`);
    const list = d.history || [];
    if (!list.length) { p.innerHTML = '<p style="color:var(--muted)">暂无历史</p>'; return; }
    p.innerHTML = list.map((h, i) => {
      const narr = h.narration ? `<div class="history-narration">${escapeHtml(h.narration)}</div>` : '';
      const dlg = (h.dialogues || []).map(x => `<div class="history-dialogue"><span class="history-speaker">${escapeHtml(x.speaker || '')}</span>${escapeHtml(x.text || '')}</div>`).join('');
      return `<div class="history-entry"><div class="history-scene">场景 ${i+1}: ${escapeHtml(h.scene_name || '')}</div>${narr}${dlg}<div class="history-choice">▸ 选择: ${escapeHtml(h.player_choice || '')}</div></div>`;
    }).join('');
  } catch(e) { p.innerHTML = e.message; }
}

function toggleHistory() {
  const p = document.getElementById('historyPanel');
  if(p){p.classList.toggle('show'); if(p.classList.contains('show')) loadHistory();}
}

async function api(path, opts={}) {
  const res = await fetch(API+path, {headers:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${res.status}`);}
  return res.json();
}

// ─── 实时管线 → VN 引擎适配 ───
function renderRealtimeSceneInVN(scene, sceneIdx, ttsEvents, bgEvents) {
  const queue = [];
  if (scene.narration) queue.push({type:'narration', speaker:'', text:scene.narration, emotion:''});
  for (const d of (scene.dialogues||[])) {
    if (d.type === 'action') queue.push({type:'action', speaker:d.subject||'', text:d.text, emotion:''});
    else queue.push({type:'dialogue', speaker:d.speaker||'', text:d.text, emotion:d.emotion||''});
  }
  if (queue.length === 0) queue.push({type:'narration', speaker:'', text:'……', emotion:''});
  const totalScenes = (realtimeStorySeed && realtimeStorySeed.estimated_scenes) || 0;
  vnState = {
    queue, idx:-1, charPositions:{},
    choices: scene.is_ending ? [] : (scene.choices||[]),
    sessionState: scene.is_ending ? 'finished' : 'generated',
    meta: { scene_name: scene.scene_name||'', location: scene.location||'', scene_id: scene.scene_id||'', scene_index: (scene.scene_index!==undefined?scene.scene_index+1:sceneIdx+1), total_scenes: totalScenes },
    progress: totalScenes ? (sceneIdx+1)/totalScenes : 0
  };
  vnStreamDone = true; vnStreamStarted = false;
  vnNarrationStreaming = false; vnNarrationIdx = -1;
  vnIsEnding = !!scene.is_ending; vnEndingData = null;
  vnPopupActive = false; vnWaiting = false; vnErrorMode = false; vnPopupShownThisScene = false;
  clearTimeout(vnWaitingTimer); vnWaitingTimer = null;
  clearInterval(vnPopupTypewriterTimer);
  vnResetSprites(); vnStopAudio(); vnAudioQueue = [];
  // 处理背景图热更新
  if (bgEvents && bgEvents.length) {
    for (const evt of bgEvents) {
      if (evt.url) {
        if (evt.scene_id) vnAssets.scenes[evt.scene_id] = evt.url;
        if (evt.scene_name && evt.scene_name !== evt.scene_id) vnAssets.scenes[evt.scene_name] = evt.url;
      }
    }
  }
  // 处理 TTS 事件 → 填充音频队列
  if (ttsEvents && ttsEvents.length) {
    for (const t of ttsEvents) {
      if (t.url) vnAudioQueue.push({ speaker: t.speaker||'', url: t.url, lineIdx: t.lineIdx });
    }
  }
  renderVNStage(vnState.progress, `${vnState.meta.scene_name} ${vnState.meta.location?'· '+vnState.meta.location:''}`);
  vnApplyBackground(vnState.meta);
  vnTryStartDisplay();
}

async function realtimeChooseInVN(choiceIndex) {
  if (!realtimeSessionId) return;
  // 在选项覆盖层上显示可见的加载状态
  const overlay = document.getElementById('vnChoices');
  if (overlay) {
    overlay.innerHTML = `<div class="vn-streaming-hint" style="gap:12px;font-size:15px"><div class="spinner" style="width:20px;height:20px"></div><span id="rtLoadingMsg">正在生成下一场景...</span></div>`;
  }
  document.querySelectorAll('.choice-btn').forEach(btn => { btn.disabled = true; btn.style.opacity = '0.5'; });
  let sceneRendered = false;
  let streamingStarted = false; // 是否已进入流式渲染模式
  try {
    const abortCtrl = new AbortController();
    let noDataTimer = setTimeout(() => abortCtrl.abort(), 95000); // 95s 无数据则中止
    const res = await fetch(`/api/realtime/${realtimeSessionId}/choose`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({choice_index: choiceIndex}),
      signal: abortCtrl.signal,
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || 'HTTP ' + res.status); }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let nextScene = null;
    let storyComplete = null;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      clearTimeout(noDataTimer); noDataTimer = setTimeout(() => abortCtrl.abort(), 95000);
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const evt = JSON.parse(line.slice(6));
            if (evt.type === 'progress') {
              const el = document.getElementById('rtLoadingMsg');
              if (el) el.textContent = evt.message || '生成中...';

            } else if (evt.type === 'scene_start') {
              // ── 流式渲染：初始化 VN 场景 ──
              document.removeEventListener('keydown', vnKeyHandler);
              streamingStarted = true;
              const seed = realtimeStorySeed || {};
              const totalScenes = seed.estimated_scenes || 0;
              const sceneIdx = evt.scene_index !== undefined ? evt.scene_index : 0;
              vnState = {
                queue: [], idx: -1, charPositions: {},
                choices: [],
                sessionState: 'generating',
                meta: { scene_name: evt.scene_name||'', location: evt.location||'', time: evt.time||'', scene_id: '', scene_index: sceneIdx+1, total_scenes: totalScenes },
                progress: totalScenes ? (sceneIdx+1)/totalScenes : 0
              };
              vnStreamDone = false; vnStreamStarted = false;
              vnNarrationStreaming = true; vnNarrationIdx = -1;
              vnIsEnding = false; vnEndingData = null;
              vnPopupActive = false; vnWaiting = false; vnErrorMode = false; vnPopupShownThisScene = false;
              clearTimeout(vnWaitingTimer); vnWaitingTimer = null;
              clearInterval(vnPopupTypewriterTimer);
              vnResetSprites(); vnStopAudio(); vnAudioQueue = [];
              renderVNStage(vnState.progress, `${vnState.meta.scene_name} ${vnState.meta.location?'\u00b7 '+vnState.meta.location:''}`);
              vnApplyBackground(vnState.meta);
              sceneRendered = true;

            } else if (evt.type === 'narration_delta') {
              // ── 流式渲染：旁白增量到达，逐段显示 ──
              if (vnNarrationIdx < 0) {
                // 第一个 delta：创建流式旁白队列项
                vnState.queue.push({type:'narration', speaker:'', text:'', emotion:'', streaming: true});
                vnNarrationIdx = vnState.queue.length - 1;
                vnNarrationStreaming = true;
                if (!vnStreamStarted) {
                  vnStreamStarted = true;
                  vnShowLine(0);
                } else if (vnWaiting) {
                  vnResumeFromWaiting();
                }
              }
              // 追加增量文本
              vnState.queue[vnNarrationIdx].text += (evt.delta || '');
              // 实时更新显示
              if (vnState.idx === vnNarrationIdx) {
                if (vnPopupActive) {
                  const ptEl = document.getElementById('vnNarrationText');
                  if (ptEl) { ptEl.textContent = vnState.queue[vnNarrationIdx].text; ptEl.scrollTop = ptEl.scrollHeight; }
                } else if (!typewriterDone) {
                  // 打字机进行中，更新目标文本
                  const tEl = document.getElementById('vnText');
                  if (tEl) { tEl.textContent = vnState.queue[vnNarrationIdx].text; tEl.scrollTop = tEl.scrollHeight; }
                }
              }

            } else if (evt.type === 'narration') {
              // ── 旁白完整文本到达，标记流式结束 ──
              if (vnNarrationIdx >= 0 && vnState.queue[vnNarrationIdx]) {
                const nItem = vnState.queue[vnNarrationIdx];
                nItem.text = evt.text || nItem.text;
                nItem.streaming = false;
                if (vnState.idx === vnNarrationIdx) {
                  if (vnPopupActive) {
                    const ptEl = document.getElementById('vnNarrationText');
                    if (ptEl) { ptEl.textContent = nItem.text; ptEl.scrollTop = ptEl.scrollHeight; }
                  } else {
                    const tEl = document.getElementById('vnText');
                    if (tEl) { tEl.textContent = nItem.text; tEl.scrollTop = tEl.scrollHeight; }
                  }
                }
              }
              vnNarrationStreaming = false;
              vnNarrationIdx = -1;
              vnRefreshHint();

            } else if (evt.type === 'dialogue') {
              // ── 流式渲染：对话逐条到达 ──
              const d = evt.item || {};
              let item;
              if (d.type === 'action') item = {type:'action', speaker:d.subject||'', text:d.text||'', emotion:''};
              else item = {type:'dialogue', speaker:d.speaker||'', text:d.text||'', emotion:d.emotion||''};
              vnState.queue.push(item);
              if (!vnStreamStarted) {
                vnStreamStarted = true;
                vnShowLine(0);
              } else if (vnWaiting) {
                vnResumeFromWaiting();
              } else {
                vnRefreshHint();
              }

            } else if (evt.type === 'scene_end') {
              // ── 流式渲染：场景完成，设置选项 ──
              nextScene = evt;
              vnStreamDone = true;
              vnNarrationStreaming = false;
              const isEnding = evt.is_ending || false;
              vnState.choices = isEnding ? [] : (evt.choices || []);
              vnState.sessionState = isEnding ? 'finished' : 'generated';
              vnState.meta.scene_id = evt.scene_id || '';
              vnIsEnding = isEnding;
              // 如果用户正在等待，恢复
              if (vnWaiting) { vnResumeFromWaiting(); }
              // 如果用户已读完所有队列内容，显示选项
              if (vnState.idx >= vnState.queue.length - 1 && typewriterDone && !vnPopupActive) {
                if (vnIsEnding) vnShowEndingFinal(); else vnShowChoices();
              }
              vnRefreshHint();

            } else if (evt.type === 'scene') {
              // ── 预生成缓存命中：一次性渲染完整场景 ──
              nextScene = evt;
              const seed = realtimeStorySeed || {};
              evt.scene_index = evt.scene_index !== undefined ? evt.scene_index : 0;
              if (seed.estimated_scenes) evt._totalScenes = seed.estimated_scenes;
              renderRealtimeSceneInVN(evt, evt.scene_index || 0, [], []);
              sceneRendered = true;
              streamingStarted = true;

            } else if (evt.type === 'story_complete') {
              storyComplete = evt;
            } else if (evt.type === 'error') {
              throw new Error(evt.message || '生成失败');
            } else if (evt.event === 'tts') {
              if (evt.url) {
                vnAudioQueue.push({ speaker: evt.speaker||'', url: evt.url, lineIdx: evt.lineIdx });
                if (vnState.idx === evt.lineIdx) vnTryPlayAudio();
              }
            } else if (evt.event === 'asset_bg_ready') {
              if (evt.url) {
                if (evt.scene_id) vnAssets.scenes[evt.scene_id] = evt.url;
                if (evt.scene_name && evt.scene_name !== evt.scene_id) vnAssets.scenes[evt.scene_name] = evt.url;
                if (sceneRendered) vnApplyBackground(vnState.meta);
                releaseBgGate(evt.scene_id, evt.scene_name);
              }
            } else if (evt.event === 'asset_char_ready') {
              if (evt.url && evt.char_name) {
                vnAssets.characters[evt.char_name] = evt.url;
                releaseCharGate(evt.char_name);
                // 角色已在舞台上→补建立绘
                const spritesEl = document.getElementById('vnSprites');
                if (spritesEl && evt.char_name in vnCharPos && !spritesEl.querySelector(`[data-char="${evt.char_name}"]`)) {
                  const div = document.createElement('div');
                  div.className = `vn-sprite pos-${vnCharPos[evt.char_name]} dimmed`;
                  div.dataset.char = evt.char_name;
                  div.innerHTML = `<img class="sprite-img" src="${evt.url}" alt="${evt.char_name}"><div class="sprite-label">${evt.char_name}</div>`;
                  spritesEl.appendChild(div);
                }
              }
            }
          } catch(pe) { if (pe.message && !pe.message.includes('JSON')) throw pe; }
        }
      }
    }
    // 流结束后的收尾
    if (storyComplete && nextScene) {
      if (sceneRendered && vnState.queue.length > 0) {
        // 场景已在渲染中，仅准备结局数据，等用户读完自然触发结局
        vnPrepareEndingData(storyComplete);
      } else {
        renderRealtimeEndingInVN(storyComplete, nextScene);
      }
    }
  } catch(e) {
    const msg = (e.name === 'AbortError') ? '请求超时，请重试' : e.message;
    // 在选项覆盖层上显示错误与操作按钮（不再用 alert 阻塞）
    const errOverlay = document.getElementById('vnChoices');
    if (errOverlay) {
      // 仅当场景尚未开始渲染时才提供重试（后端失败会回滚状态，重试安全）
      const retryBtn = sceneRendered ? ''
        : `<button class="btn btn-primary" onclick="realtimeChooseInVN(${choiceIndex})">重试</button>`;
      errOverlay.innerHTML = `<div class="waiting-msg" style="border-color:var(--danger);color:var(--danger)">生成失败：${msg}</div>
        <div style="display:flex;gap:10px;margin-top:12px;justify-content:center">
          <button class="btn btn-primary" onclick="location.href='/'">返回首页</button>${retryBtn}
        </div>`;
    }
  }
}

// 实时结局 → 复用 VN 结局渲染
function vnPrepareEndingData(completeData) {
  // 仅设置 vnEndingData，不替换 DOM，等用户读完场景后由 vnShowEndingFinal 触发结局
  const seed = realtimeStorySeed || {};
  const endingTypes = {'good': {'label': '好结局', 'color': '#6b9e7a'}, 'normal': {'label': '普通结局', 'color': '#c89968'}, 'bad': {'label': '坏结局', 'color': '#c5544d'}};
  const ending = endingTypes[completeData.ending_type] || endingTypes['normal'];
  vnEndingData = {
    matched: { title: seed.title || '故事结束', replay_value: '' },
    eType: completeData.ending_type || 'normal',
    eColor: ending.color,
    typeLabel: {'good':'好结局','normal':'普通结局','bad':'坏结局'}
  };
  // 如果用户已读完正在等待结局，立即触发
  if (vnState.idx >= vnState.queue.length - 1 && typewriterDone && !vnPopupActive) {
    vnShowEndingFinal();
  }
}

function renderRealtimeEndingInVN(completeData, lastScene) {
  const seed = realtimeStorySeed || {};
  const endingTypes = {'good': {'label': '好结局', 'color': '#6b9e7a'}, 'normal': {'label': '普通结局', 'color': '#c89968'}, 'bad': {'label': '坏结局', 'color': '#c5544d'}};
  const ending = endingTypes[completeData.ending_type] || endingTypes['normal'];
  const endQueue = [];
  if (lastScene && lastScene.narration) endQueue.push({type:'narration', speaker:'', text:lastScene.narration, emotion:'', streaming:false});
  if (endQueue.length === 0) endQueue.push({type:'narration', speaker:'', text:'你已走完这个故事。', emotion:'', streaming:false});
  vnIsEnding = true;
  vnEndingData = { matched: {title: seed.title || '故事结束', replay_value: ''}, eType: completeData.ending_type || 'normal', eColor: ending.color, typeLabel: {'good':'好结局','normal':'普通结局','bad':'坏结局'} };
  chosenIndex = -1;
  vnState = {queue: endQueue, idx:-1, charPositions:{}, choices:[], sessionState:'finished', meta:{}, progress:1};
  vnStreamDone = true; vnStreamStarted = true; typewriterDone = true;
  vnResetSprites(); vnStopAudio(); vnAudioQueue = [];
  const eColor = ending.color;
  const eType = completeData.ending_type || 'normal';
  const typeLabel = {'good':'好结局','normal':'普通结局','bad':'坏结局'};
  app.innerHTML = `
    <div class="vn-stage" id="vnStage">
      <div class="vn-progress" id="vnProgress" style="width:100%"></div>
      <div class="vn-bg" id="vnBg" style="background:radial-gradient(ellipse at center,#2a241a 0%,#181410 100%)"></div>
      <div class="vn-scene-info">故事结束</div>
      <div class="vn-top-bar"><button id="vnHomeBtn">退出</button></div>
      <div class="vn-sprites" id="vnSprites"></div>
      <div class="vn-dialogue-box" id="vnDialogueBox" style="opacity:0;pointer-events:none"><div id="vnSpeaker"></div><div class="vn-text" id="vnText"></div><div class="vn-emotion" id="vnEmotion"></div><div class="vn-advance-hint" id="vnHint" style="display:none">点击继续 ▶</div></div>
      <div class="vn-ending-scroll" id="vnEndingScroll" style="display:none"><div class="vn-ending-scroll-text" id="vnEndingScrollText"></div><div class="vn-ending-scroll-hint" id="vnEndingScrollHint">点击继续 ▶</div></div>
      <div class="vn-ending-overlay" id="vnEndingOverlay"><div class="ending-type" style="color:${eColor};border-color:${eColor}">${typeLabel[eType] || '结局'}</div><div class="ending-title">${escapeHtml(seed.title || '故事结束')}</div><div class="ending-hint">点击继续</div></div>
      <div class="vn-choices-overlay" id="vnChoices" style="display:none"></div>
    </div>`;
  document.getElementById('vnEndingOverlay').addEventListener('click', () => {
    const ov = document.getElementById('vnEndingOverlay');
    ov.style.opacity = '0';
    setTimeout(() => { ov.style.display = 'none'; }, 500);
    document.addEventListener('keydown', vnKeyHandler);
    vnStartEndingScroll();
  });
  document.getElementById('vnHomeBtn').addEventListener('click', () => { document.removeEventListener('keydown', vnKeyHandler); vnIsEnding = false; location.href = '/'; });
}

// ─── 页面初始化 ───
async function init() {
  // 检测浏览器刷新：刷新会丢失前端运行态，直接提示返回首页
  const navEntry = performance.getEntriesByType('navigation')[0];
  if (navEntry && navEntry.type === 'reload') {
    app.innerHTML = '<div class="end-screen"><h2>页面已刷新</h2><p>游戏进度无法恢复，请返回首页重新开始。</p><button class="btn btn-primary" onclick="location.href=\'/\'">返回首页</button></div>';
    return;
  }

  if (_mode === 'script') {
    currentScript = _ctx.script || null;
    sessionId = _sid;
    if (!sessionId || !currentScript) {
      app.innerHTML = '<div class="end-screen"><h2>参数缺失</h2><p>无法获取会话信息，请从首页重新进入。</p><button class="btn btn-primary" onclick="location.href=\'/\'">返回首页</button></div>';
      return;
    }
    // 并行启动文字生成流（后台缓冲，等用户点击进入后才渲染）
    _textEventBuffer = [];
    _textProcessing = false;
    _textStreamDone = false;
    _textStreamError = null;
    const textStreamPromise = startTextStreamBackground();
    // 显示标题页（等图片 + 等用户点击进入）
    await pregenerateAssets();
    // 用户已点击进入，渲染游戏 UI 并回放缓冲 + 继续实时流
    await generateSceneStream(textStreamPromise);
  } else if (_mode === 'realtime') {
    realtimeMode = true;
    realtimeSessionId = _sid;
    sessionId = _sid;  // 兼容 pregenerateAssets 中的 sessionId 引用
    realtimeStorySeed = _ctx.seed || null;
    currentScript = { title: (realtimeStorySeed && realtimeStorySeed.title) ? realtimeStorySeed.title : 'AI生成剧本' };
    const firstScene = _ctx.firstScene || null;
    const ttsEvents = _ctx.ttsEvents || [];
    const bgEvents = _ctx.bgEvents || [];
    if (!realtimeSessionId || !firstScene) {
      app.innerHTML = '<div class="end-screen"><h2>参数缺失</h2><p>无法获取实时生成会话信息，请从首页重新进入。</p><button class="btn btn-primary" onclick="location.href=\'/\'">返回首页</button></div>';
      return;
    }
    // 预生成角色立绘 + 场景背景图（与上传管线一致的体验）
    await pregenerateAssets(`/api/realtime/${_sid}/assets-stream`);
    // 用户已点击进入，渲染游戏 UI 并处理首场景的 TTS/背景图
    renderRealtimeSceneInVN(firstScene, 0, ttsEvents, bgEvents);
  } else {
    app.innerHTML = '<div class="end-screen"><h2>无效的访问方式</h2><p>请从首页选择剧本或输入AI生成描述后进入。</p><button class="btn btn-primary" onclick="location.href=\'/\'">返回首页</button></div>';
  }
}

init();
