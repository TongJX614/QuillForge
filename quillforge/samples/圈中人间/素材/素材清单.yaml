  - type: 角色立绘
    characters:
    - name: 周小满
    - name: 老周
    - name: 春桃
    - name: 花妞
  - type: 场景背景
    scenes:
    - name: 一觉醒来四条腿
      mood: 晨雾未散的猪圈，泥地湿冷，空气里混着饲料酸味和玉米秸秆的干涩气，脚步声与哼叫声此起彼伏，荒诞中透着日常的烟火气。
      details: 北方农村清晨的养猪场，薄雾低垂，泥土地上排列着几间砖砌猪圈，木栏杆上挂着霜，食槽边散落干草和玉米秸秆，远处灰蓝色天光下一排光秃秃的杨树，棚顶石棉瓦滴着露水，地面湿漉漉反着微光。
    - name: 一声哼叫惊了娘
      mood: 清冷晨光里混着饲料酸气和霜化的湿意，一头猪的异常惊叫搅动了整个院子的平静，人声、桶响、猪哼交织成一片将信将疑的躁动。
      details: 北方农村清晨的养猪场棚内，铁栏杆分隔的猪圈，湿泥地上散着干草和半截砖头，食槽边结着薄霜，棚顶缝隙透进清冷白光，远处晾着玉米的架子轮廓模糊。
