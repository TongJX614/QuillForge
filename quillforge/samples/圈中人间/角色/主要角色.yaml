characters:
- id: char_01
  name: 周小满
  role: 主角
  species: 猪
  gender: male
  age: 24
  occupation: 原为城市白领，现为养猪场里的猪
  appearance: 一头粉白色杂交肉猪，体型中等偏瘦，脊背上一撮深灰色鬃毛，左耳有缺口，尾巴短而卷，眼睛黑白分明，眼神总透着不属于猪的困惑与机警。
  personality: 嘴碎心软、爱吐槽但重感情、适应力强却总想维持体面
  voice_tone: 内心独白密集，习惯用反问句，口头禅是“不是，等会儿——”，用人类逻辑分析猪圈规则，说话时鼻子爱拱地。
  motivation: 想弄清楚自己为什么变成猪，并找到变回去的办法。
  background: 周小满大学毕业后在城里做策划，春节回老家帮忙喂猪，一觉醒来发现自己成了父亲猪圈里的一头猪。
  arc: 从拼命想逃离猪圈，到真正理解父亲和这片土地，最终选择以猪的身份守护家人。
- id: char_02
  name: 老周
  role: 配角
  species: human
  gender: male
  age: 58
  occupation: 养猪场场主
  appearance: 身高一米七左右，黑瘦精干，花白寸头，脸上沟壑纵横，常穿洗得发白的蓝布工装和绿色胶鞋，右手虎口有烫疤，腰间总别着一串猪圈钥匙。
  personality: 沉默寡言、认死理、刀子嘴豆腐心
  voice_tone: 话少，爱用“嗯”“行”“吃了没”开头，训人时一句接一句不带标点，喝点酒后才会絮叨往事。
  motivation: 守住父亲留下的养猪场，把日子过踏实。
  background: 养了三十年猪，供儿子读完大学，却始终觉得儿子看不起自己这行。
  arc: 从对“怪猪”起疑到察觉真相，最终学会开口表达对儿子的骄傲与不舍。
- id: char_03
  name: 春桃
  role: 配角
  species: human
  gender: female
  age: 55
  occupation: 老周的妻子，养猪场帮工
  appearance: 圆脸微胖，烫着短卷发，爱穿大花棉袄罩衫和黑布鞋，手腕戴一只银镯子，围裙口袋里常年装着花生糖。
  personality: 热心肠、爱唠叨、直觉惊人地准
  voice_tone: 语速快，爱用“哎哟喂”起头，一句话里能塞三个亲戚的称呼，夸人损人都不带喘气。
  motivation: 让家里热热闹闹，儿子早点成家。
  background: 嫁给老周后一起经营猪场，是村里红白喜事都请去帮忙的“总调度”。
  arc: 从把怪猪当普通猪喂，到第一个看出“这猪不对劲”，成为连接人与猪的关键。
- id: char_04
  name: 花妞
  role: 配角
  species: 猪
  gender: female
  age: 3
  occupation: 养猪场里资历最老的母猪
  appearance: 黑白花斑母猪，体型肥硕，肚子快贴地，右耳挂蓝色耳标，鼻子粉嫩湿润，眼睛眯成一条缝，吃食时屁股一扭一扭。
  personality: 淡定通透、爱吃如命、自带大姐大气场
  voice_tone: 慢悠悠，爱用“急啥”开头，每句话结尾常带“哼”，能用哼哼声表达完整鄙视链。
  motivation: 吃饱、睡好、别让新来的瘦猪抢食。
  background: 在猪圈里生过五窝崽，见惯猪来猪走，是圈中“百事通”。
  arc: 从对新来的怪猪不屑一顾，到成为周小满在猪圈里的第一个“导师”和盟友。
