scenes:
- id: scene_01
  name: 一觉醒来四条腿
  location: 老周家养猪场 · 猪圈
  time: 清晨
  atmosphere: 晨雾未散的猪圈，泥地湿冷，空气里混着饲料酸味和玉米秸秆的干涩气，脚步声与哼叫声此起彼伏，荒诞中透着日常的烟火气。
  description: 薄雾贴着地皮从猪棚的缝隙里钻进来，带着一股发酵饲料的酸甜气。你趴在干草堆上，后背硌着半截砖头，鼻尖前面是湿漉漉的泥地。你试着翻了个身——四条腿一齐蹬空，整个人，不，整头猪歪进了食槽边沿。你想喊“妈”，嗓子眼里滚出来的却是一串响亮的哼唧。隔壁栏里那头黑白花母猪正拿眼角瞟你，嚼着草根，一脸见怪不怪。棚外传来胶鞋踩在冻土上的闷响，一下，一下，带着咳嗽声。你认得这个脚步声——你爸每天五点四十分准时来查圈，三十年了，误差不超过三分钟。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 北方农村清晨的养猪场，薄雾低垂，泥土地上排列着几间砖砌猪圈，木栏杆上挂着霜，食槽边散落干草和玉米秸秆，远处灰蓝色天光下一排光秃秃的杨树，棚顶石棉瓦滴着露水，地面湿漉漉反着微光。
- id: scene_02
  name: 一声哼叫惊了娘
  location: 老周家养猪场·猪圈棚内
  time: 清晨
  atmosphere: 清冷晨光里混着饲料酸气和霜化的湿意，一头猪的异常惊叫搅动了整个院子的平静，人声、桶响、猪哼交织成一片将信将疑的躁动。
  description: 你的蹄子把铁栏杆扒得哐哐响，脖子伸到快脱臼，那一声哼叫从丹田提到嗓子眼，拐了三个弯，硬是挤出了半个人调。春桃正往棚里迈的脚悬在半空，手里那把舀料的大铁勺差点没攥住。猪棚顶上凝了一夜的霜被这嗓子震得簌簌往下掉渣，落在你拱起的脊梁上。老周已经走到第三栏了，闻声顿住，回头拿眼剜了你一下，那眼神跟看一栏出了毛病的猪没啥两样。花妞在隔壁不紧不慢地嚼着料，耳朵都没抖一下，只是把圆眼睛斜过来，像在看一出早就排过的戏。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 北方农村清晨的养猪场棚内，铁栏杆分隔的猪圈，湿泥地上散着干草和半截砖头，食槽边结着薄霜，棚顶缝隙透进清冷白光，远处晾着玉米的架子轮廓模糊。
