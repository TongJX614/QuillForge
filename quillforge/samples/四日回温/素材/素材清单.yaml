assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 林见夏
    - name: 陈默
    - name: 周雪
    - name: 老秦
  - type: 场景背景
    scenes:
    - name: 周一清晨·倒计时开始
      mood: 清晨的日常感与主角内心的末日倒计时形成强烈反差，阳光越正常，压迫感越重。
      details: 清晨的城市居民楼外景，阳光斜照在老旧居民楼的阳台上，楼下早餐摊冒着白色热气，行道树挂着深秋黄叶，街道干净，天空湛蓝，远处有晨练的行人剪影，整体色调温暖但透着一种不真实的平静。
    - name: 周一上午·超市冷柜前
      mood: 阳光明媚的超市里弥漫着一股说不出的错位感，冷柜的低鸣像倒计时的秒针，暖意之下暗流涌动。
      details: 社区超市临街店面内部，上午阳光从玻璃门斜射进来，货架整齐排列，收银台上摊着纸张，冷柜泛着白光，门外街道明亮，行道树黄叶未落。
    - name: 周一上午·风铃与镜头
      mood: 上午的阳光把货架影子拉得老长，风铃还在轻轻晃，门外零星有人驻足张望，空气里飘着一点说不清的躁动。
      details: 上午的社区超市门口，玻璃门半开，门框上挂着一串铜色风铃，阳光斜照在货架和收银台上，门外是铺着地砖的街道和几棵挂着黄叶的行道树，远处有居民楼和早餐摊的热气。
