characters:
- id: char_01
  name: 林见夏
  role: 主角
  species: human
  gender: female
  age: 26
  occupation: 气象数据分析师
  appearance: 身高中等偏瘦，齐肩黑色短发在重生后总是凌乱，眼下有青黑。常穿一件洗得发白的灰色连帽卫衣，右手腕系一圈深蓝编织绳。目光锐利，习惯性抿唇，手指关节因长期敲键盘而微微泛红。
  personality: 冷静偏执，对细节有强迫症般的记忆，表面克制内心焦灼。
  voice_tone: 语速快，习惯用数据佐证观点，口头禅是“我算过”；紧张时会压低声音重复对方的话尾。
  motivation: 用重生的四天时间，阻止上一世极寒中所有人的死亡。
  background: 上一世在极寒爆发首日因外出取数据冻死在气象局门口；重生回周一清晨，手机日历显示距离寒潮还有四天。
  arc: 从独自背负秘密的绝望预测者，学会信任他人并接受无法拯救所有人的现实。
- id: char_02
  name: 陈默
  role: 配角/关键盟友
  species: human
  gender: male
  age: 32
  occupation: 社区超市店长
  appearance: 体格壮实，圆寸头，左眉有一道旧疤。常年穿深绿色工装围裙，口袋里插着记账笔。手掌粗大，指节有冻疮痕迹。笑起来眼角有细纹，但多数时候表情憨厚而警惕。
  personality: 务实多疑，嘴硬心软，对物资数字极其敏感。
  voice_tone: 说话慢，爱用反问句“你凭啥”，每句话末尾带“呗”；拒绝人时先说“不是我说”。
  motivation: 守住超市和店里常来的几个老顾客，不再让任何人死在自己眼前。
  background: 退伍后开了这家社区超市，上一世极寒中为救困在店里的老人而冻死在仓库。
  arc: 从只信自己仓库钥匙的守财奴，变成愿意把物资分给陌生人的组织者。
- id: char_03
  name: 周雪
  role: 配角/信息阻碍者
  species: human
  gender: female
  age: 19
  occupation: 大二学生/网络主播
  appearance: 个子娇小，染成浅金色的长发扎成高马尾，穿亮粉色羽绒服和厚底雪地靴，手指涂着斑驳的指甲油。随身挂着毛绒小熊挂件，脸上总带着讨好又不安的笑。
  personality: 话多怯懦，容易动摇，对关注度有强烈渴求。
  voice_tone: 语速极快，爱用网络流行语“绝了”“家人们”，紧张时句子碎成短促的气音。
  motivation: 想靠直播“末日预警”涨粉，却不敢真的相信灾难会来。
  background: 独自在城市读书，父母在外地；上一世因直播被嘲“蹭热度”而赌气留在宿舍，最终未能及时撤离。
  arc: 从靠别人点赞确认存在感的女孩，成长为敢在关键时刻关掉直播去敲门救人的行动者。
- id: char_04
  name: 老秦
  role: 配角/社区阻力
  species: human
  gender: male
  age: 58
  occupation: 小区物业保安队长
  appearance: 身材干瘦却腰背笔直，花白寸头，戴老式金属框眼镜。冬季制服永远扣到最上面一颗，左胸别着褪色的物业徽章，手里攥着对讲机，走路时皮鞋跟敲地节奏均匀。
  personality: 刻板守序，嘴碎心热，把“规定”二字当护身符。
  voice_tone: 声音沙哑洪亮，开口先清嗓子“咳嗯”，爱引用“上头文件”和“小区规定第几条”。
  motivation: 在退休前守住小区不出乱子，对任何“造谣”都条件反射式压制。
  background: 在小区当了十五年保安，上一世极寒夜坚持巡逻，最后倒在单元门口。
  arc: 从用规定堵人嘴的看门人，变成偷偷打开广播帮林见夏通知全楼的破例者。
