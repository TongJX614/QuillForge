scenes:
- id: scene_01
  name: 周一清晨·倒计时开始
  location: 林见夏的出租屋
  time: 周一清晨六点
  atmosphere: 清晨的日常感与主角内心的末日倒计时形成强烈反差，阳光越正常，压迫感越重。
  description: 你从床上猛地惊醒，后背的冷汗浸透了睡衣。手机屏幕亮着，日历显示11月17日，周一。窗外阳光正好，楼下早餐摊的油烟混着豆浆香气飘上来，电动车铃铛声此起彼伏。一切正常得令人发指。你冲到窗前——天空湛蓝，行道树还挂着深秋的黄叶，行人裹着薄外套慢悠悠走着。可你记得清清楚楚，四天后的傍晚六点，气温会在三小时内跌破零下二十度，然后彻底失控。桌上摊着那份气象分析报告，上面是你上一世没来得及交上去的曲线图。你必须从今天开始，把所有人从悬崖边拉回来。第一个该找谁？
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 清晨的城市居民楼外景，阳光斜照在老旧居民楼的阳台上，楼下早餐摊冒着白色热气，行道树挂着深秋黄叶，街道干净，天空湛蓝，远处有晨练的行人剪影，整体色调温暖但透着一种不真实的平静。
- id: scene_02
  name: 周一上午·超市冷柜前
  location: 社区超市·东门临街店面
  time: 周一上午
  atmosphere: 阳光明媚的超市里弥漫着一股说不出的错位感，冷柜的低鸣像倒计时的秒针，暖意之下暗流涌动。
  description: 你推开超市的玻璃门，门框上的风铃叮当一响。货架整齐，地面干净得能照出人影，冷柜嗡嗡低鸣，一切都和平常没什么两样。陈默正蹲在收银台后面清点一箱矿泉水，听见动静抬起头，看见是你，眉梢动了一下。店里的收音机正播着午间天气预报，主持人语气轻快地说明天最高温十八度、适合出行。你攥紧包里的报告，指节发白。门外阳光斜斜照进来，把货架上的价签映得发亮——这暖意越正常，你心里越冷。你只有四天，而眼前这个人，是你必须第一个说服的。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 社区超市临街店面内部，上午阳光从玻璃门斜射进来，货架整齐排列，收银台上摊着纸张，冷柜泛着白光，门外街道明亮，行道树黄叶未落。
- id: scene_03
  name: 周一上午·风铃与镜头
  location: 社区超市门口及店内
  time: 周一上午
  atmosphere: 上午的阳光把货架影子拉得老长，风铃还在轻轻晃，门外零星有人驻足张望，空气里飘着一点说不清的躁动。
  description: 风铃被撞得乱响，周雪举着手机倒退着进了门，镜头先扫过冷柜又扫过你的脸。陈默从柜台后绕出来，往门口一站，像堵墙似的把光线挡了一半。你退到货架旁，摊开那份报告，在背面空白处飞快地列清单：水、米、面、蜡烛、电池。店外有路过的居民探头张望，周雪的声音尖细地飘过来，一句接一句，没有停顿。你听着她的话，笔尖在纸上顿了顿——她还没走，事情就还有转圜的余地，但必须先让陈默稳住场面。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 上午的社区超市门口，玻璃门半开，门框上挂着一串铜色风铃，阳光斜照在货架和收银台上，门外是铺着地砖的街道和几棵挂着黄叶的行道树，远处有居民楼和早餐摊的热气。
