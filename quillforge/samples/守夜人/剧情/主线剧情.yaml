# 主线剧情
# 定义故事的主要脉络

main_plot:
  # ============================================================
  # 剧情概要
  # ============================================================
  summary: |
    2024年深秋，在城市独居的录音师沈夜接到远房叔公的电话，得知祖母沈婆婆去世。
    她被迫回到逃离了十二年的湘西古村——棺木岭。按照村中规矩，沈家引魂人的
    继承人必须在祠堂守夜七日。沈夜本不信这些，但第一夜祠堂中传来的婴儿啼哭
    让她无法入睡。随着守夜推进，她发现祖母留下的手记中记载着一个可怕的真相：
    祠堂地下封印着三百年来村中横死者的怨念凝聚体——"夜啼"。祖母一生都在
    维护封印，如今她死了，封印正在崩溃。沈夜必须在第七夜之前做出选择：
    继承祖母的宿命成为新的引魂人，还是打破封印让一切终结？

  themes:
    - "家族宿命 — 血脉中的诅咒，是继承还是斩断？"
    - "恐惧的本质 — 最可怕的不是鬼，是你不敢面对的记忆"
    - "和解 — 与逝者和解，与自己的过去和解"

  core_conflict: |
    沈夜的核心冲突是：继承 vs 逃离。
    继承意味着：永远留在棺木岭，重复祖母孤独的一生，与恐惧为伴；
    逃离意味着：封印崩溃，"夜啼"释放，整个村庄将被吞噬。
    还有第三条路：打破封印，直面"夜啼"，但代价未知。
    这个冲突在场景3（第七夜）达到顶点。

  # ============================================================
  # 剧情阶段
  # ============================================================
  stages:
    # 第一阶段：归乡
    - stage_id: "stage_01"
      name: "归乡"
      description: "被迫回到逃离十二年的故乡"
      scenes:
        - "scene_01"
      key_events:
        - "沈夜接到叔公电话，得知祖母去世"
        - "跋涉进入棺木岭，感受到村庄的异样"
        - "在祖母遗物中发现手记和守夜规矩"
      emotional_arc: "抗拒 → 不安 → 震惊"

    # 第二阶段：守夜
    - stage_id: "stage_02"
      name: "守夜"
      description: "七夜守灵中逐夜升级的恐惧"
      scenes:
        - "scene_02"
      key_events:
        - "第一夜：祠堂中传来婴儿啼哭"
        - "第三夜：纸扎铺的纸人似乎换了位置"
        - "第五夜：在祖母手记中发现'夜啼'的真相"
        - "第六夜：封印出现裂缝，异象加剧"
      emotional_arc: "怀疑 → 恐惧 → 崩溃边缘"

    # 第三阶段：抉择
    - stage_id: "stage_03"
      name: "抉择"
      description: "第七夜，面对封印下的真相"
      scenes:
        - "scene_03"
      key_events:
        - "沈夜进入祠堂地下古井"
        - "直面'夜啼'——发现它是祖母年轻时的创伤"
        - "做出最终选择"
      emotional_arc: "坚定 → 动摇 → 抉择"

    # 第四阶段：结局
    - stage_id: "stage_04"
      name: "天明"
      description: "选择的代价与新生"
      scenes:
        - "scene_04"
      key_events:
        - "根据选择进入不同结局"
        - "每个结局的代价与收获"
        - "故事主题的最终呈现"
      emotional_arc: "释然/悲恸/希望（取决于结局）"

  # ============================================================
  # 剧情节拍
  # ============================================================
  beats:
    - beat_id: "beat_01"
      name: "归乡之路"
      description: "沈夜在颠簸的山路上回忆童年，祖母的面容模糊而清晰"
      scene: "scene_01"
      purpose: "建立压抑氛围，交代主角与祖母的复杂关系"

    - beat_id: "beat_02"
      name: "第一声啼哭"
      description: "守夜第一夜，祠堂深处传来婴儿的哭声"
      scene: "scene_01"
      purpose: "第一个恐怖节点，打破主角的理性防线"

    - beat_id: "beat_03"
      name: "手记中的秘密"
      description: "沈夜翻阅祖母手记，发现引魂人的真正职责"
      scene: "scene_02"
      purpose: "信息揭露，建立世界观，为后续恐惧提供逻辑基础"

    - beat_id: "beat_04"
      name: "纸人夜行"
      description: "纸扎铺中的纸人出现在不该出现的位置"
      scene: "scene_02"
      purpose: "恐怖升级，动摇主角的理性认知"

    - beat_id: "beat_05"
      name: "井中之声"
      description: "沈夜在祠堂地下听到清晰的呼唤——是祖母的声音"
      scene: "scene_03"
      purpose: "情感高潮，恐惧与思念交织"

    - beat_id: "beat_06"
      name: "最终选择"
      description: "沈夜面对'夜啼'，做出决定命运的选择"
      scene: "scene_03"
      purpose: "玩家代入感的最高点"

    - beat_id: "beat_07"
      name: "天明"
      description: "结局呈现，长夜终将过去——或永远不会"
      scene: "scene_04"
      purpose: "主题升华，留下思考空间"

  # ============================================================
  # 剧情钩子
  # ============================================================
  hooks:
    - hook_id: "hook_01"
      type: "悬念钩子"
      description: "祖母为何独自守了六十年？沈夜逃离的真正原因是什么？"
      scene: "scene_01"

    - hook_id: "hook_02"
      type: "恐怖钩子"
      description: "每夜递增的异象——是心理暗示，还是封印真的在崩溃？"
      scene: "scene_02"

    - hook_id: "hook_03"
      type: "情感钩子"
      description: "祖母手记最后一页：'夜儿，婆婆对不起你，也对不起它'"
      scene: "scene_03"

    - hook_id: "hook_04"
      type: "结局钩子"
      description: "每个选择都有代价，没有完美的解脱"
      scene: "scene_04"
