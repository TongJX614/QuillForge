# 结局系统
# 定义游戏的所有结局

endings:
  # ============================================================
  # 结局A：永夜
  # ============================================================
  - id: "ending_01"
    type: "bad"
    title: "《永夜》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择inherit"
      - type: "choice_made"
        value: "在scene_03选择seal_again"

    narrative: |
      你点燃了第七盏灯，诵完了最后一遍引魂词。
      古井中的啼哭声渐渐平息，封印重新合拢。
      你感到一股冰冷的力量从井底升起，渗入你的骨骼。
      从今以后，你就是新的引魂人了。
      你站在祠堂门口，看着棺木岭的晨雾散去，
      村民们远远地向你鞠躬，然后转身离开。
      没有人会留下来陪你。就像没有人陪过祖母一样。
      你关上了祠堂的门，坐到了祖母坐了六十年的位置上。
      下一个夜晚，啼哭声会再次响起。
      而你会再次点灯。

    epilogue: |
      三十年后，一个年轻人接到了电话。
      "你祖母去世了，你得回来守夜。"
      你看着那个年轻人惊恐的眼睛，就像看到了十二岁的自己。
      你想说些什么，但最终只是递给他一盏灯。
      "第一夜，"你说，"只要点着灯就好。"
      循环从未结束。

    replay_value: "这个结局会让你思考：接受宿命是否真的是唯一的出路？"
    unlock_conditions:
      - "在scene_02选择继承引魂术"

  # ============================================================
  # 结局B：长明
  # ============================================================
  - id: "ending_02"
    type: "normal"
    title: "《长明》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择continue_watch"
      - type: "choice_made"
        value: "在scene_03选择negotiate"

    narrative: |
      你没有继承引魂术，也没有打破封印。
      你选择了第三条路——你留在棺木岭，但不是作为引魂人，
      而是作为一个"记得的人"。
      你用录音笔录下了祠堂中所有的声音，
      你用文字记下了祖母手记中的每一个仪式。
      封印仍在，但你不再独自守护它。
      你联系了民俗学者，联系了文物保护部门，
      让棺木岭不再是一个被遗忘的角落。
      每到夜晚，你仍会点一盏灯放在祠堂门口。
      不是仪式，只是纪念。

    epilogue: |
      一年后的清明，你带着几个学生回到祠堂。
      你教他们辨认祖母手记中的符号，
      给他们讲引魂人的故事——不是作为迷信，而是作为记忆。
      夜里，你独自坐在祠堂中，听到了极轻极远的啼哭声。
      你没有害怕。你打开录音机，按下录制键。
      "我在，"你对着黑暗说，"我记得你们。"
      啼哭声渐渐平息，像是一个孩子终于被哄睡。

    replay_value: "这个结局展示了和解的可能：不继承，不逃避，而是记住。"
    unlock_conditions:
      - "在scene_02选择继续守夜但不继承"
      - "在scene_03选择与'夜啼'对话"

  # ============================================================
  # 结局C：天明
  # ============================================================
  - id: "ending_03"
    type: "good"
    title: "《天明》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择break_seal"
      - type: "choice_made"
        value: "在scene_03选择release"
      - type: "hidden_choices"
        value: "在scene_01选择forgive且在scene_03选择hidden"

    narrative: |
      你打碎了古井上的封印石。
      三百年的怨念如潮水般涌出，祠堂剧烈震颤，
      所有的灯同时熄灭，黑暗吞噬了一切。
      但你没有跑。你站在井口，对着那片黑暗开口了。
      你说的不是引魂词，不是咒语。
      你说的是："我知道你们痛。"
      你念出了手记中记载的每一个名字——
      三百年来横死在棺木岭的人，每一个都有名字。
      你念了整整一夜。
      当最后一个名字落下时，东方的天际泛起了鱼肚白。
      啼哭声变成了叹息，然后变成了沉默。
      不是被封印的沉默，而是终于被听见的安宁。

    epilogue: |
      你离开了棺木岭，但没有回到城市。
      你去了一个有海的小镇，开了一间录音工作室。
      你专门录制声音——风声、雨声、老人的故事、孩子的笑声。
      有时候，深夜录音时，你会听到极轻的婴儿笑声。
      不是啼哭，是笑。
      你会微微一笑，继续工作。
      祖母的手记被你捐给了县博物馆，
      扉页上你加了一行字：
      "献给所有被遗忘的声音。被听见，就是被超度。"

    replay_value: "这是最艰难的结局，但也是最温柔的。恐惧的尽头不是对抗，是理解。"
    unlock_conditions:
      - "在scene_02选择打破封印"
      - "在scene_03选择释放并念出名字"
      - "在scene_01选择原谅祖母（解锁隐藏路径）"
