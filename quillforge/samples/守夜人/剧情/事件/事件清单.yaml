# 事件清单
# 定义影响剧情流程但不分岔的普通事件

events:
  # ============================================================
  # 事件1：第一夜的啼哭
  # ============================================================
  - id: "event_01"
    name: "第一夜的啼哭"
    type: "剧情"
    description: "守夜第一夜，祠堂深处传来婴儿的哭声"

    trigger_conditions:
      - type: "场景触发"
        value: "进入scene_01的夜晚阶段"

    location: "沈家祠堂·正厅"
    time: "第一夜，子时"
    characters_involved:
      - "shen_ye"

    content: |
      你刚在祠堂正厅的草席上躺下，油灯的火焰突然矮了一截。
      然后你听到了。
      从地板下方，从祠堂最深处的某个角落，传来一声婴儿的啼哭。
      不是远处村庄里传来的——是从脚下，从地底。
      哭声很轻，像是隔了很厚的土层，但每一个音节都清晰无比。
      你屏住呼吸，哭声停了。
      你呼出一口气，哭声又响了。
      像是...在回应你的呼吸。

    choices:
      - id: "investigate_sound"
        text: "循着声音寻找来源"
        consequences: "你发现声音来自祠堂后方的石板地面下，但石板纹丝不动"
      - id: "stay_still"
        text: "一动不动，等待天亮"
        consequences: "你蜷缩在草席上，用被子蒙住头，哭声持续了整整一夜"

    rewards:
      - type: "线索"
        value: "确认祠堂地下确实有东西，与祖母手记中的记载吻合"

    repeatable: false
    cooldown: 0

  # ============================================================
  # 事件2：纸人移位
  # ============================================================
  - id: "event_02"
    name: "纸人移位"
    type: "探索"
    description: "纸扎铺中的纸人出现在不该出现的位置"

    trigger_conditions:
      - type: "场景触发"
        value: "在scene_02中探索纸扎铺"

    location: "纸扎铺"
    time: "第三夜，丑时"
    characters_involved:
      - "shen_ye"

    content: |
      你推开纸扎铺的门，霉味和纸灰的气息扑面而来。
      月光从破窗照进来，照亮了满屋的纸人。
      你记得很清楚——昨天来的时候，那个穿红嫁衣的纸人站在最里面的架子上。
      但现在，它站在门口。
      面朝你。
      你后退一步，它没有动。你再看——它的纸脸上画着微笑，
      但嘴角的弧度...好像比昨天大了一点。
      你转身离开时，身后传来极轻的"沙沙"声，像纸被风吹动。
      但今夜无风。

    choices:
      - id: "check_paper_figure"
        text: "仔细检查纸人"
        consequences: "你发现纸人内部有祖母的笔迹，写着一个名字和日期"
      - id: "leave_quickly"
        text: "立刻离开纸扎铺"
        consequences: "你快步离开，但总觉得身后有视线跟随"

    rewards:
      - type: "证据"
        value: "纸人内藏有祖母记录的'夜啼'受害者名单"

    repeatable: false
    cooldown: 0

  # ============================================================
  # 事件3：叔公的警告
  # ============================================================
  - id: "event_03"
    name: "叔公的警告"
    type: "日常"
    description: "村长沈福贵在守夜期间前来探望，欲言又止"

    trigger_conditions:
      - type: "场景触发"
        value: "进入scene_02的第四夜"

    location: "沈家祠堂·门口"
    time: "第四夜，黄昏"
    characters_involved:
      - "shen_ye"
      - "shen_fugui"

    content: |
      黄昏时分，叔公沈福贵提着一篮饭菜来到祠堂门口。
      他把篮子放下，却没有像往常一样立刻离开。
      "夜儿，"他叫你的小名，声音沙哑，"你婆婆...她走之前那几个月，
      每天晚上都在祠堂里说话。"
      他停顿了一下，浑浊的眼睛看着你。
      "不是念经。是说话。像是...跟什么人聊天。"
      他转身要走，又停住了。
      "第七夜之前，别下地窖。你婆婆说过，时候没到，不能下去。"
      他的背影消失在暮色中，你注意到他走路时一直在回头看你。

    choices:
      - id: "ask_more"
        text: "追问叔公更多细节"
        consequences: "叔公摆摆手不肯再说，但你听到他嘟囔：'跟你婆婆年轻时一模一样'"
      - id: "let_go"
        text: "不再追问"
        consequences: "你选择尊重叔公的沉默，但他的话在你心中种下了种子"

    rewards:
      - type: "信息"
        value: "确认祖母生前一直在与'夜啼'交流，且警告不要提前进入地窖"

    repeatable: false
    cooldown: 0

  # ============================================================
  # 事件4：童年的记忆
  # ============================================================
  - id: "event_04"
    name: "童年的记忆"
    type: "日常"
    description: "在祖母遗物中发现一段温暖的童年记忆"

    trigger_conditions:
      - type: "随机触发"
        value: "在scene_02翻阅祖母手记时"
        probability: 0.6

    location: "祖母的卧室"
    time: "第五夜，白天"
    characters_involved:
      - "shen_ye"

    content: |
      你在祖母的枕头下发现了一张泛黄的照片。
      照片上，六岁的你骑在祖母背上，笑得露出缺了门牙的嘴。
      祖母也笑着，眼睛弯成月牙。
      你突然想起那个夏天——祖母背着你走过悬棺崖下的小路，
      你害怕那些挂在崖壁上的棺材，把脸埋在祖母背上。
      "婆婆，那里面是什么？"
      "是睡着了的人。"
      "他们什么时候醒？"
      "等有人记得他们的时候。"
      照片背面，祖母的字迹："夜儿六岁，不怕了。"
      你发现自己已经泪流满面。

    choices:
      - id: "keep_photo"
        text: "将照片贴身收好"
        consequences: "你把照片放进胸口的口袋，感到一丝温暖"
      - id: "put_back"
        text: "将照片放回原处"
        consequences: "你把照片放回枕下，但那个笑容已经刻在了脑海里"

    rewards:
      - type: "情感"
        value: "与祖母的温暖回忆，强化了理解祖母动机的基础"

    repeatable: false
    cooldown: 0
