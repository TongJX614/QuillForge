# 场景清单
# 定义剧本中所有场景的详细设定

scenes:
  # ============================================================
  # 场景1：归乡
  # ============================================================
  - id: "scene_01"
    name: "归乡"
    location: "棺木岭·沈家祠堂"
    time: "2024年农历九月初九，黄昏至深夜"
    atmosphere: "压抑、荒凉、暮色中的古村散发着腐朽与沉香交织的气息"

    description: |
      沈夜在颠簸了六个小时的山路后，终于踏上了棺木岭的青石板路。
      村庄比记忆中更加破败——大半吊脚楼已经空置，门窗用木板钉死。
      村口的老槐树下，叔公沈福贵拄着拐杖等她，身后是几个佝偻的老人。
      没有人寒暄，叔公只是说了一句："你婆婆等你很久了。"
      祠堂里，祖母的棺木停在正厅中央，周围点着七盏油灯。
      遗像上的祖母微笑着，和记忆中一模一样。
      遗像前放着一本泛黄的手记，封面写着四个字："夜儿亲启"。

    trigger_conditions:
      - type: "game_start"
        value: "初始场景"

    characters_present:
      - "shen_ye"
      - "shen_fugui"

    interactions:
      - id: "face_relics"
        type: "阅读"
        description: "面对祖母的遗物和手记"
        prompt: "你站在祖母的遗像前，手记就放在那里，封面写着'夜儿亲启'。"
        options:
          - id: "read_immediately"
            text: "立刻翻开手记"
            description: "你需要答案，现在就要"
          - id: "forgive"
            text: "先对着遗像说一声'婆婆，我回来了'"
            description: "无论如何，她是你祖母，你欠她一句话"
          - id: "refuse"
            text: "把手记推到一边"
            description: "你逃离了十二年，不是为了回来面对这些"

    assets_needed:
      - "棺木岭黄昏全景"
      - "沈家祠堂正厅"
      - "祖母遗像特写"
      - "七盏油灯与棺木"
      - "手记封面特写"

    branching_point: true
    critical_choice: "choice_01"

    narrative_notes: |
      本场景是玩家的第一个决策点。通过沈夜的感官体验建立恐怖氛围。
      着重描写声音：山风、木门吱呀、远处乌鸦、油灯噼啪。
      叔公的对话应简短而意味深长，留下悬念。
      无论玩家选择什么，第一夜的啼哭都会发生——但选择影响后续情感基调。

  # ============================================================
  # 场景2：守夜
  # ============================================================
  - id: "scene_02"
    name: "守夜"
    location: "棺木岭（祠堂、纸扎铺、祖母卧室、悬棺崖）"
    time: "第一夜至第六夜（2024年农历九月初九至十四）"
    atmosphere: "逐夜递进的恐惧，从不安到惊悚到濒临崩溃"

    description: |
      七个夜晚的守灵。每一夜，祠堂中的异象都会升级：
      第一夜是啼哭，第二夜是脚步，第三夜纸人移位，
      第四夜墙壁渗水，第五夜手记中的名字在墙上浮现，
      第六夜所有声音同时响起。
      白天，沈夜可以探索村庄——纸扎铺、祖母的卧室、悬棺崖。
      每一处都藏着关于祖母和"夜啼"的线索。
      第五夜，沈夜读完手记最后一页，必须做出选择。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_01"

    characters_present:
      - "shen_ye"
      - "shen_fugui"

    interactions:
      - id: "night_watch"
        type: "探索"
        description: "在守夜中面对逐夜升级的异象"
        prompt: "第五夜，你读完了手记最后一页。祖母写道：'它不是怪物，它只是太痛了。'你怎么办？"
        options:
          - id: "inherit"
            text: "学习引魂术，继承祖母的位置"
            description: "也许这就是你的命，你认了"
          - id: "break_seal"
            text: "研究如何彻底打破封印"
            description: "三百年的痛苦不该继续，你要终结这一切"
          - id: "continue_watch"
            text: "完成守夜，但不做任何承诺"
            description: "你只想撑过这七天，然后离开"

    assets_needed:
      - "祠堂夜景（七种变化）"
      - "纸扎铺内部"
      - "祖母卧室"
      - "悬棺崖月夜"
      - "手记内页特写"
      - "墙壁渗水/名字浮现效果"

    branching_point: true
    critical_choice: "choice_02"

    narrative_notes: |
      本场景是故事的核心恐怖段落。六夜的异象必须严格递进，
      不能一开始就达到顶峰。恐怖以声音为主，视觉为辅。
      白天的探索是信息获取时间，节奏相对舒缓，为夜晚的恐惧蓄力。
      选择"继承"触发分支线A，选择"打破封印"触发分支线B。

  # ============================================================
  # 场景3：第七夜
  # ============================================================
  - id: "scene_03"
    name: "第七夜"
    location: "沈家祠堂·地下古井"
    time: "2024年农历九月十五，子时"
    atmosphere: "极致的压迫感、黑暗、声音的洪流与突然的寂静"

    description: |
      第七夜，子时。祠堂的地板裂开了一道缝，露出通往地下的石阶。
      沈夜沿着石阶向下，经过三层地下空间，最终来到古井边。
      井口覆盖着刻满符文的石板——镇物。
      井底传来声音，不再是啼哭，而是一个清晰的声音——祖母的声音。
      "夜儿，你来了。"
      黑暗中，有什么东西在看着你。不是恶意，是...等待。
      三百年的等待。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_02"

    characters_present:
      - "shen_ye"
      - "grandmother_memory"

    interactions:
      - id: "face_entity"
        type: "对峙"
        description: "面对古井中的存在"
        prompt: "你站在古井边，井底传来祖母的声音。黑暗中，你感到有什么东西在看着你。"
        options:
          - id: "seal_again"
            text: "重新封印"
            description: "按照祖母的方法，将封印重新加固"
          - id: "negotiate"
            text: "与它对话"
            description: "祖母说它不是怪物，你想试试"
          - id: "release"
            text: "打开封印，释放它"
            description: "三百年的痛苦该结束了（需要满足隐藏条件）"

    assets_needed:
      - "地下石阶"
      - "古井与镇物石板"
      - "黑暗中的微光效果"
      - "符文发光效果"
      - "声音可视化效果（可选）"

    branching_point: true
    critical_choice: "choice_03"

    narrative_notes: |
      本场景是情感与恐怖的双重高潮。古井中的存在不应被直接描写，
      只通过声音、温度、气味和沈夜的心理反应来暗示。
      祖母的声音是真是幻，留给玩家判断。
      沈婆婆以声音/幻影的形式从古井中出现，与沈夜对话——她不是实体，
      是记忆与执念的回响，语气应温柔而遥远，如同从很深的水底传来。
      选择"释放"需要在之前场景中收集到足够线索和情感积累。

  # ============================================================
  # 场景4：天明
  # ============================================================
  - id: "scene_04"
    name: "天明"
    location: "多个结局场景"
    time: "2024年农历九月十五之后"
    atmosphere: "根据结局不同而变化"

    description: |
      故事的终章。根据沈夜在前几个场景中的选择，
      命运将走向不同的终点。
      长夜终将过去——或者，永远不会。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_03"

    characters_present:
      - "shen_ye"
      - "grandmother_memory"

    interactions:
      - id: "ending"
        type: "结局"
        description: "根据选择进入不同结局"
        prompt: "第七夜过去了。天，亮了吗？"

    assets_needed:
      - "结局场景A：沈夜坐在祠堂中（永夜）"
      - "结局场景B：沈夜在祠堂门口点灯（长明）"
      - "结局场景C：沈夜走出村庄，天光大亮（天明）"
      - "结局旁白UI"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景根据玩家之前的选择，进入三个不同结局之一。
      每个结局都应该给玩家留下深刻印象，引发思考。
      结局A是循环的悲剧，结局B是温和的妥协，结局C是彻底的解脱。
      无论哪个结局，最后一句话都应该与"声音"有关。
