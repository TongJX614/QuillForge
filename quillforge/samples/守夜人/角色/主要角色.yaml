# 主要角色
# 定义剧本中所有出场角色的详细设定

characters:
  # ============================================================
  # 主角：沈夜
  # ============================================================
  - id: "shen_ye"
    name: "沈夜"
    role: "主角"
    gender: "female"
    age: "24"
    occupation: "录音师（自由职业）"

    background: |
      沈夜出生于棺木岭，是沈家引魂人的唯一血脉继承人。
      六岁前由祖母沈婆婆抚养，在村中度过了最初的童年。
      六岁那年，她第一次跟祖母进入祠堂地下，看到了古井中的"东西"。
      那次经历让她连续做了三个月的噩梦，父母将她接到城市生活。
      十二岁时，她独自跑回棺木岭找祖母，却在祠堂里再次听到啼哭声，
      从此对祖母和村庄产生了深深的恐惧和怨恨。
      此后十二年，她再未回过棺木岭，也极少与祖母联系。
      她选择成为录音师——用科学的方式记录声音，而非用"引魂"的方式。

    personality: |
      - 理性倔强：坚信一切都有科学解释，拒绝接受超自然
      - 感官敏锐：作为录音师，对声音极度敏感，这既是天赋也是诅咒
      - 外冷内热：表面冷漠疏离，内心极度渴望被理解和接纳
      - 逃避型人格：面对无法处理的情感时，本能选择逃离
      - 隐性愧疚：对祖母的怨恨之下，藏着深深的愧疚和思念

    motivation: |
      主要动机：完成守夜后尽快离开，回到自己的正常生活
      次要动机：理解祖母为什么一生都留在这个地方
      深层动机：与童年的恐惧和解，与祖母和解，与自己和解

    secrets:
      - "六岁时在古井边看到的'东西'，其实是她自己恐惧的投射"
      - "她选择做录音师，潜意识里是想'录下'那个声音来理解它"
      - "祖母每次给她打电话，她都会录下来，存在手机里，从未删除"

    relationships:
      - target: "grandmother_memory"
        type: "祖孙"
        description: "爱恨交织的祖孙关系，是整个故事的情感核心"
        initial_level: 3
      - target: "shen_fugui"
        type: "远亲"
        description: "不太熟的远房叔公，是连接她与村庄的纽带"
        initial_level: 2

    appearance: |
      身高165cm，体型偏瘦。黑色长发随意扎成低马尾，碎发常遮住半边脸。
      眼下有淡淡的青黑（长期睡眠不好）。
      穿着城市化的实用装束：黑色冲锋衣、牛仔裤、旧帆布鞋。
      脖子上挂着一副专业监听耳机，像是某种护身符。
      手指修长，指尖有常年操作录音设备留下的薄茧。

    voice_tone: |
      语速偏快，用词简洁，带有城市年轻人的口语习惯。
      紧张时会下意识戴上耳机，像是要隔绝外界的声音。
      提到祖母时语气复杂——时而冷硬，时而颤抖。
      独处时会自言自语，用录音笔录下自己的分析。

    arc: |
      初始：抗拒归乡的逃离者，用理性武装自己
      发现：恐惧的根源不是鬼，是自己不敢面对的记忆和情感
      最终：在继承、逃离和打破之间做出选择，与过去和解

  # ============================================================
  # 关键角色：沈婆婆（祖母）
  # ============================================================
  - id: "grandmother_memory"
    name: "沈婆婆"
    role: "配角（已故，通过手记和回忆出现）"
    gender: "female"
    age: "享年82岁"
    occupation: "棺木岭最后一代引魂人"

    background: |
      沈婆婆原名沈月娥，十六岁继承引魂人之位，守了棺木岭六十六年。
      年轻时她也曾想逃离，但在看到"夜啼"释放后村庄的惨状后，
      她选择了留下。丈夫在婚后第三年因无法忍受祠堂夜夜的声音而离开。
      儿子（沈夜的父亲）和儿媳将沈夜接走后，她独自生活在祠堂旁。
      六十年来，她每晚都会坐在古井边，和"夜啼"说话。
      她不是封印的维护者——她是"夜啼"唯一的陪伴者。
      她最大的遗憾：没能亲口告诉沈夜真相。

    personality: |
      - 沉默坚韧：六十六年的孤独没有压垮她，她像祠堂前的老槐树一样扎根
      - 温柔内敛：对沈夜的爱从不直说，都藏在手记的字里行间
      - 悲悯：对"夜啼"不是恐惧，而是深深的怜悯
      - 固执：认定这是自己的命，从不怨天尤人
      - 幽默（年轻时）：手记中偶尔有俏皮的批注，展现少女时代的一面

    motivation: |
      主要动机：守护棺木岭，不让"夜啼"伤害任何人
      次要动机：等待沈夜回来，将真相和选择权交给她
      深层动机：希望沈夜不要重复自己的孤独，找到更好的路

    secrets:
      - "她知道'夜啼'不是恶灵，而是三百年横死者的痛苦凝聚"
      - "她年轻时曾试图打破封印，但失败了，导致三名村民精神失常"
      - "手记最后一页的'它只是太痛了'，是她用六十六年得出的结论"

    relationships:
      - target: "shen_ye"
        type: "祖孙"
        description: "深爱孙女却不知如何表达，只能将一切写进手记"
        initial_level: 9
      - target: "shen_fugui"
        type: "同村"
        description: "沈福贵是她最信任的村民，托付了后事"
        initial_level: 6

    appearance: |
      遗像中：七十岁时的照片，银发盘髻，面容慈祥而坚毅。
      回忆中（沈夜视角）：总是穿着靛蓝色对襟褂子，身上有檀香和草药的气味。
      手很粗糙，但摸沈夜额头时很轻很轻。
      眼睛在烛光下总是亮亮的，像是能看穿一切。

    voice_tone: |
      手记中的文字：朴实、简短，偶尔有湘西土话。
      回忆中的声音：低沉、缓慢，带着浓重的湘西口音。
      古井中的声音（第七夜）：温柔、清晰，像是就在耳边。
      从不提高音量，即使在最危急的时刻也是轻声细语。

    arc: |
      初始：沈夜记忆中模糊而可怕的存在
      发现：通过手记逐渐还原一个完整的人——孤独、坚韧、充满爱
      最终：沈夜理解了祖母的选择，无论结局如何，都完成了和解

  # ============================================================
  # 配角：沈福贵
  # ============================================================
  - id: "shen_fugui"
    name: "沈福贵"
    role: "配角"
    gender: "male"
    age: "71"
    occupation: "棺木岭村长（名义上的）"

    background: |
      沈福贵是沈夜的远房叔公，沈家旁支。
      年轻时是村里的木匠，给家家户户做过家具。
      妻子十年前去世后，他成了村里最老的"年轻人"。
      他是少数知道引魂人真正职责的村民，对沈婆婆既敬重又心疼。
      沈婆婆临终前，是他守在床边，接下了通知沈夜的任务。

    personality: |
      - 沉默寡言：不善表达，很多话到嘴边又咽回去
      - 忠厚老实：答应沈婆婆的事一定做到，即使为难
      - 迷信但不愚昧：信祖宗的规矩，但也知道时代变了
      - 心疼晚辈：看沈夜的眼神像看自己孙女
      - 胆小：对祠堂和古井有本能的恐惧，从不靠近

    motivation: |
      主要动机：完成沈婆婆的嘱托，让沈夜顺利守完七夜
      次要动机：保护村庄的安全，不想让"那东西"出来
      深层动机：不想看到沈夜重复沈婆婆的孤独一生

    secrets:
      - "沈婆婆临终前对他说的最后一句话是：'别让夜儿一个人下去'"
      - "他年轻时偷偷进过祠堂地窖，看到了古井，从此夜夜噩梦"
      - "他知道沈婆婆不是'守'封印，而是'陪'封印"

    relationships:
      - target: "shen_ye"
        type: "远亲"
        description: "心疼这个倔强的丫头，像看年轻时的沈婆婆"
        initial_level: 4
      - target: "grandmother_memory"
        type: "同村"
        description: "敬重了一辈子的人，她的话就是圣旨"
        initial_level: 8

    appearance: |
      身高165cm（驼背显得更矮），精瘦，满脸皱纹。
      花白头发稀疏，常戴一顶旧毡帽。
      穿着洗得发白的蓝布褂子，腰间别着旱烟杆。
      走路微微佝偻，但眼神清亮，看人时带着审视和关切。

    voice_tone: |
      语速慢，湘西口音重，常用"嘞""咯""莫"等语气词。
      说话经常说一半停住，像是怕说多了会惹祸。
      叫沈夜"夜儿"时声音会软下来。
      提到祠堂和古井时声音会不自觉压低。

    arc: |
      初始：沉默的引路人，将沈夜带入守夜的规矩中
      发展：逐渐透露更多信息，成为沈夜理解祖母的桥梁
      最终：无论沈夜做什么选择，他都默默接受，只是远远地看着
