# 素材清单
# 定义剧本所需的视觉、音频和互动素材

assets:
  # ============================================================
  # 视觉素材
  # ============================================================
  visual:
    - type: "角色立绘"
      description: "主要角色的立绘，包含多种表情和姿态"
      dimensions: "800x1200"
      style: "中式水墨风格，暗色调，烛光照明效果，细节丰富"
      format: "PNG（透明背景）"
      quantity: "每个角色6个变体"
      characters:
        - name: "沈夜"
          variants: 6
          expressions: 4
          outfits: 2
        - name: "沈婆婆（遗像/回忆）"
          variants: 4
          expressions: 2
          outfits: 1
        - name: "沈福贵"
          variants: 4
          expressions: 3
          outfits: 1

    - type: "场景背景"
      description: "主要场景的背景图"
      dimensions: "1920x1080"
      style: "中式哥特风格，暗色调，烛光与月光交织，阴影浓重"
      format: "PNG"
      scenes:
        - name: "棺木岭全景"
          mood: "荒凉、压抑、暮色沉沉"
          details: "群山环绕的古村，吊脚楼层叠，悬棺崖在背景中若隐若现"
        - name: "沈家祠堂·正厅"
          mood: "肃穆、幽暗、香火缭绕"
          details: "三层木构建筑内部，棺木居中，七盏油灯，祖宗牌位"
        - name: "纸扎铺"
          mood: "诡异、逼仄、纸灰飞舞"
          details: "满屋纸人，月光从破窗照入，红嫁衣纸人特写"
        - name: "地下古井"
          mood: "极致黑暗、压迫、深渊感"
          details: "三层地下空间，石阶蜿蜒，古井居中，符文微光"
        - name: "悬棺崖"
          mood: "壮阔、苍凉、死亡气息"
          details: "绝壁上悬挂数百具古棺，月光照射，云雾缭绕"
        - name: "祖母卧室"
          mood: "温暖与衰败并存"
          details: "简朴的木屋，旧家具，药味，枕下的照片"

    - type: "UI元素"
      description: "游戏界面元素"
      dimensions: "多种尺寸"
      style: "古朴、暗色系、毛笔字体、烛火元素"
      format: "PNG/SVG"
      items:
        - "选择按钮（普通/悬停/选中状态）"
        - "对话框背景（竹简/旧纸风格）"
        - "守夜进度（七盏灯，逐夜点亮/熄灭）"
        - "手记翻阅界面"
        - "声音波形可视化（恐怖元素）"
        - "关系值显示（香炉烟雾浓度）"

    - type: "插图"
      description: "关键剧情节点的插图"
      dimensions: "1920x1080"
      style: "电影感、暗色调、中式恐怖美学"
      format: "PNG"
      count: 6
      items:
        - "沈夜初到棺木岭（暮色中的村庄）"
        - "第一夜啼哭（祠堂地板下的黑暗）"
        - "纸人移位（红嫁衣纸人面朝门口）"
        - "手记中的真相（泛黄纸页上的文字）"
        - "古井对峙（沈夜站在井口，黑暗仰望）"
        - "天明（沈夜走出村庄，背后是晨光）"

  # ============================================================
  # 音频素材
  # ============================================================
  audio:
    - type: "背景音乐"
      description: "场景背景音乐，营造氛围"
      tracks:
        - name: "主题曲 - 守夜人"
          mood: "压抑、孤寂、宿命感"
          instruments: "古琴、箫、低频弦乐、环境音"
          tempo: "极慢"
          duration: "3-5分钟"

        - name: "场景1 - 归乡"
          mood: "荒凉、不安、回忆"
          instruments: "古琴独奏、山风音效、远处乌鸦"
          tempo: "慢"
          duration: "贯穿整个场景"

        - name: "场景2 - 守夜（第一至三夜）"
          mood: "不安、诡异、逐渐逼近"
          instruments: "低频嗡鸣、木鱼声、偶尔的弦乐刺音"
          tempo: "极慢，偶有突变"
          duration: "贯穿场景前半"

        - name: "场景2 - 守夜（第四至六夜）"
          mood: "恐惧、压迫、濒临崩溃"
          instruments: "失真古琴、多重人声低语、心跳节奏"
          tempo: "渐快"
          duration: "贯穿场景后半"

        - name: "场景3 - 第七夜"
          mood: "极致压迫、黑暗、突然的寂静"
          instruments: "全频段低频、人声合唱（远处）、突然静音"
          tempo: "无固定节拍"
          duration: "贯穿整个场景"

        - name: "结局A - 永夜"
          mood: "循环、宿命、无尽的孤独"
          instruments: "古琴循环乐句、油灯噼啪声"
          tempo: "极慢，循环"
          duration: "2-3分钟"

        - name: "结局B - 长明"
          mood: "平静、温暖、淡淡的忧伤"
          instruments: "古琴、箫、自然环境音"
          tempo: "中速"
          duration: "2-3分钟"

        - name: "结局C - 天明"
          mood: "释然、希望、温柔的悲伤"
          instruments: "古琴渐入明亮调式、鸟鸣、晨风"
          tempo: "渐快渐明"
          duration: "3-4分钟"

    - type: "音效"
      description: "场景音效和UI音效"
      effects:
        - name: "婴儿啼哭（远处）"
          duration: "3-5秒"
          description: "从地底传来的模糊婴儿哭声，有回响"

        - name: "婴儿啼哭（近处）"
          duration: "2-3秒"
          description: "清晰的婴儿哭声，像是就在耳边"

        - name: "木板吱呀声"
          duration: "1-2秒"
          description: "老建筑木板受压的声音"

        - name: "油灯闪烁音"
          duration: "0.5秒"
          description: "油灯火焰突然矮下的轻微声响"

        - name: "纸人沙沙声"
          duration: "2秒"
          description: "纸张被无形之手触碰的声音"

        - name: "石阶脚步回响"
          duration: "3秒"
          description: "在地下石阶上行走的脚步声，有强烈回响"

        - name: "古井深处的声音"
          duration: "5秒"
          description: "从井底传来的混合声音：低语、叹息、水滴"

        - name: "封印碎裂音"
          duration: "3秒"
          description: "石板碎裂、锁链断裂的混合音效"

        - name: "选择按钮点击音"
          duration: "0.5秒"
          description: "木鱼单击声，清脆而短促"

        - name: "手记翻页音"
          duration: "1秒"
          description: "泛黄纸张翻动的声音"

  # ============================================================
  # 互动素材
  # ============================================================
  interactive:
    - type: "选择系统"
      description: "玩家做出选择的交互界面"
      features:
        - "多选项展示（2-3个选项）"
        - "选项悬停效果（烛火摇曳）"
        - "选择确认动画（油灯明灭）"
        - "倒计时选择（部分场景）"
        - "隐藏选项解锁提示（符文发光）"

    - type: "对话系统"
      description: "角色对话展示系统"
      features:
        - "打字机效果逐字显示"
        - "对话历史回顾（手记形式）"
        - "角色表情切换"
        - "环境音随对话变化"

    - type: "守夜系统"
      description: "场景2专用的守夜交互"
      features:
        - "七盏灯状态显示（亮/灭/闪烁）"
        - "夜晚推进动画（月升月落）"
        - "异象触发时的画面抖动/扭曲"
        - "声音方向指示（可选）"

    - type: "手记系统"
      description: "祖母手记的翻阅交互"
      features:
        - "手记翻页动画"
        - "关键文字高亮"
        - "手记内容随剧情解锁"
        - "批注和涂鸦显示"

    - type: "成就系统"
      description: "结局达成记录"
      features:
        - "结局解锁通知"
        - "完成度统计（七夜守完/手记读完/名字念完）"
        - "隐藏成就（需要特定条件）"
