  - type: 场景背景
    scenes:
    - name: 道具箱底的戏票
      mood: 昏黄、积尘、隐约的樟脑味，日光灯管发出电流的嗡鸣
      details: 老剧场后台的杂物间，傍晚的光从高窗斜射进来，照亮空气中浮动的灰尘。墙边堆着褪色的道具箱和衣架，几件旧戏服挂在角落。头顶一盏日光灯管忽明忽暗，发出微弱电流声。地面是磨得发亮的水磨石，墙角有剥落的墙皮。
    - name: 财务室的存根
      mood: 逼仄、沉闷、尘埃在斜射的夕光中悬浮
      details: 一间狭小的老式财务室，铁皮档案柜锈迹斑斑，柜门半开，抽屉里塞满发黄的票据册。窗外的夕光斜斜切进来，在积灰的地板上投下长条光斑。墙上挂着一面停摆的挂钟，桌上一台老式算盘和几摞牛皮纸信封。空气里飘着纸张霉变和陈年墨水的味道。
