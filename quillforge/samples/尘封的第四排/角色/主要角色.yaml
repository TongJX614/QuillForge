characters:
- id: char_01
  name: 沈砚秋
  role: 主角
  species: human
  gender: female
  age: 52
  occupation: 剧团前副导演/现剧场看门人
  appearance: 身形清瘦挺拔，银灰色短发利落地别在耳后，眼角细纹深刻。常穿一件洗得发白的藏青色工装外套，内搭黑色高领衫，手腕上戴着一块旧式上海牌手表，指节修长但关节泛红。
  personality: 严谨克制、记忆力惊人、不轻易表露情绪
  voice_tone: 语速偏慢，用词精准，习惯用“按规矩”开头，生气时反而声音更轻
  motivation: 想弄明白那张戏票是谁的，也借此给自己十年的执念一个交代。
  background: 十年前剧团解散时她力排众议保下剧场，此后以看门人身份独守空楼，每年仍按旧制排一次剧目单。
  arc: 从执着于“查清楚”到学会放下，承认有些事不需要答案也能释怀。
- id: char_02
  name: 周野
  role: 配角
  species: human
  gender: male
  age: 34
  occupation: 前剧团灯光师/现婚庆灯光租赁商
  appearance: 中等身材，微胖，圆脸，寸头，鬓角有一道旧疤。穿亮橙色冲锋衣和工装裤，脖子上挂着一串LED灯控钥匙，手指有多年拧螺丝留下的厚茧，笑起来眼睛眯成缝。
  personality: 话痨热心、爱开玩笑、关键时刻比谁都认真
  voice_tone: 嗓门大，爱用“我跟你说”“你猜怎么着”，常把灯泡拟人化称呼“老伙计”
  motivation: 想借最后一场戏证明自己当年没白干，也偷偷想撮合老班底重聚。
  background: 剧团解散后他转行做婚庆灯光，但一直把旧剧场的灯控台当宝贝供在家里，随叫随到。
  arc: 从用玩笑掩盖不舍，到能坦率说出对剧团的感情。
- id: char_03
  name: 林知夏
  role: 配角
  species: human
  gender: female
  age: 26
  occupation: 自由编剧/前剧团学员
  appearance: 个子高挑，扎低马尾，碎发垂在颊边，戴一副细框圆眼镜。穿米白色宽松针织衫和直筒牛仔裤，帆布包上别满各类徽章，背包侧袋插着一支旧钢笔和一本卷边笔记本。
  personality: 观察力敏锐、说话直来直去、对细节有执念
  voice_tone: 语速快，逻辑清晰，习惯先抛结论再补“因为”，紧张时会反复转动手里的笔
  motivation: 想写一个关于剧团解散的剧本，那张戏票成了她调查的线索。
  background: 她是剧团解散那年最后一批学员，只待了三个月，却把那段经历当作创作起点。
  arc: 从把旧事当素材，到真正理解当事人，学会让故事有温度而非只有结构。
