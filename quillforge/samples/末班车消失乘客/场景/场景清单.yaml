scenes:
- id: scene_01
  name: 空座位
  location: 末班公交车厢内
  time: 深夜十一点四十七分
  atmosphere: 惨白灯光下的车厢里弥漫着一种被抽空了的寂静，窗外老城区的街灯一盏盏往后退去，像被谁按顺序掐灭。
  description: 末班车驶出总站时，车厢里的灯管闪了两下才稳定下来，惨白的光照在斑驳的扶手上。夜风从半开的车窗灌进来，带着老城区特有的潮湿霉味。你从后视镜里扫了一眼——打瞌睡的老郑歪在座位上，低头画画的苏晚笔尖沙沙作响，后排靠窗那个穿灰夹克的男人……你记得他上车时还咳嗽了两声。可现在那个座位上只剩一张公交卡，孤零零地躺在蓝色椅面上，像是被人随手放下的。你下意识看了一眼后视镜，镜子里自己的眉头皱了起来。车速没变，路也没颠，人怎么就没了？
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的公交车厢内部，惨白的灯管照亮蓝色塑料座椅和斑驳的金属扶手，窗外是模糊后退的老城区街灯，车厢后段光线昏暗，地面有轻微反光，整体色调冷白偏青。
