characters:
- id: char_01
  name: 林默
  role: 主角
  species: human
  gender: male
  age: 28
  occupation: 夜班公交司机
  appearance: 身高178cm，体型偏瘦，短发略显凌乱，黑眼圈很重，胡茬未刮干净。常穿深蓝色公交制服，袖口磨得发白，右手食指有老茧。
  personality: 沉默寡言、观察力强、内心善良但犹豫
  voice_tone: 说话简短低沉，常用“嗯”“行”“坐稳了”等短句，极少主动搭话，紧张时会反复握方向盘。
  motivation: 想弄清楚乘客消失的真相，同时保住这份赖以生存的工作。
  background: 开了三年末班公交，半年前开始遇到乘客莫名消失的怪事，向公司报告却被当成精神问题。
  arc: 从逃避恐惧到主动面对真相，学会为乘客承担责任。
- id: char_02
  name: 苏晚
  role: 配角/关键人物
  species: human
  gender: female
  age: 24
  occupation: 自由插画师
  appearance: 身高163cm，偏瘦，齐肩黑发常扎成低马尾，戴一副圆框眼镜，穿米色风衣和帆布鞋，随身背一个画筒。眼睛很亮，习惯性皱眉观察。
  personality: 好奇心强、嘴硬心软、擅长用画画记录细节
  voice_tone: 语速快，爱用反问句，“你不觉得奇怪吗？”“等等，你看见了吗？”，紧张时会下意识数数。
  motivation: 想画下消失乘客的真相，完成一本关于城市怪谈的绘本。
  background: 经常坐末班车回家，今晚是第三次遇到乘客消失，前两次以为是自己眼花。
  arc: 从单纯的好奇记录者，变成愿意为他人冒险的参与者。
- id: char_03
  name: 老郑
  role: 配角/知情者
  species: human
  gender: male
  age: 62
  occupation: 退休铁道检修工
  appearance: 身高170cm，微驼背，花白板寸头，脸上皱纹很深，穿洗得发白的灰色夹克和军绿色裤子，脚踩老布鞋，手里总攥着一个旧保温杯。
  personality: 固执、迷信、嘴碎但心肠热
  voice_tone: 说话带方言腔调，爱念叨“我早说过”“这趟车不干净”，喜欢用“后生”“姑娘”称呼年轻人。
  motivation: 想验证自己多年前听说的关于这条线路的传闻。
  background: 年轻时在铁路系统工作，听说过末班车“收人”的旧事，今晚特意来坐车求证。
  arc: 从神神叨叨的旁观者，变成关键时刻提供线索的守护者。
