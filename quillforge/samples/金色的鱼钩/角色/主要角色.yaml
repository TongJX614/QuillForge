characters:
- id: char_01
  name: 老班长
  role: 主角
  species: human
  gender: male
  age: 45
  occupation: 红军炊事班长
  appearance: 身形瘦削但脊背挺直，饱经风霜的古铜色面庞上刻满皱纹，颧骨因长期饥饿而凸出。头戴褪色的八角帽，身穿打满补丁的灰绿色军装，腰间系着一条旧皮带。双手粗糙如树皮，手指关节粗大，眼神却温和而坚定。
  personality: 沉默寡言、无私奉献、外冷内热
  voice_tone: 嗓音沙哑低沉，说话简短朴实，常以“同志们”开头，习惯用命令式的短句掩饰关心。
  motivation: 把三个生病的小战士活着带出草地，完成党交给的任务。
  background: 参加过井冈山斗争的老红军，经历过多次反围剿，对野菜和草地有着丰富的生存经验。
  arc: 从隐瞒真相独自承受饥饿，到被小战士发现真相后坦然面对牺牲，完成精神传承。
- id: char_02
  name: 小梁
  role: 配角/视角人物
  species: human
  gender: male
  age: 19
  occupation: 红军通讯员
  appearance: 圆脸，带点孩子气的青涩，嘴唇干裂起皮。个子不高但身形精干，头戴略大的八角帽，帽檐下露出汗湿的黑色短发。身穿略显宽大的灰军装，斜挎一个磨破边的帆布包，腰后别着一支驳壳枪。眼睛大而明亮，透着机灵与倔强。
  personality: 机灵好奇、重情重义、藏不住事
  voice_tone: 说话语速快，带着少年人的清脆，爱用“班长，我……”句式，着急时会结巴。
  motivation: 想弄明白老班长每天煮的鱼汤到底是从哪来的。
  background: 江西兴国县参军，年仅十六岁跟着部队长征，把老班长当作父亲一样的依靠。
  arc: 从被保护者成长为懂得真相后主动分担责任的小战士。
- id: char_03
  name: 小陈
  role: 配角
  species: human
  gender: male
  age: 17
  occupation: 红军卫生员
  appearance: 面黄肌瘦，因疟疾未愈而嘴唇发白，身子单薄得一阵风就能吹倒。戴一副圆框眼镜，镜片上有细细的裂纹。灰军装外面套着一件洗得发白的白大褂，斜挎的药箱磕掉了漆。说话时习惯性地推眼镜。
  personality: 文弱细心、爱哭但倔强、懂得感恩
  voice_tone: 声音轻细，带着读书人的斯文，常说“我没事，别管我”，着急时鼻音变重。
  motivation: 不想成为队伍的累赘，想用医术回报老班长的照顾。
  background: 原本是长沙的学生，投笔从戎参加红军，在湘江战役中负伤后一直未痊愈。
  arc: 从自怨自艾的病号，到强撑病体为老班长采药，完成自我价值的确认。
- id: char_04
  name: 小刘
  role: 配角
  species: human
  gender: male
  age: 18
  occupation: 红军战士
  appearance: 浓眉大眼，脸上还带着婴儿肥，右脸颊有一道浅疤。身材壮实但明显消瘦，军装袖子短了一截露出结实的小臂，草鞋磨穿了底。肩上扛着一根当拐棍用的树枝，走路一瘸一拐。
  personality: 憨厚乐观、爱哼山歌、认死理
  voice_tone: 大嗓门，说话直来直去，爱用“俺”自称，动不动就拍胸脯说“俺去”。
  motivation: 相信跟着老班长就一定能走出草地。
  background: 贫农出身，在川陕根据地参军，没读过书但记性极好，能记住沿途所有野菜的样子。
  arc: 从盲目乐观到明白真相后一夜长大，主动把鱼汤让给战友。
