characters:
- id: char_01
  name: 林晚
  role: 主角
  species: human
  gender: female
  age: 27
  occupation: 广告公司文案，长期熬夜加班
  appearance: 身高约163cm，身形偏瘦，黑色长发随意扎成低马尾，几缕碎发垂在脸颊边；单眼皮，眼神疲惫但警觉，眼下有淡淡的青黑；常穿一件洗旧的深灰色连帽卫衣和牛仔裤，背一个黑色帆布包，整个人透着一种被生活磨损的倦意。
  personality: 敏感多疑、习惯自我压抑、对细节有近乎偏执的观察力
  voice_tone: 说话声音偏轻，习惯用反问句，紧张时会自言自语式地重复对方的话尾；口头禅是“等一下”和“你确定？”
  motivation: 想弄清楚便利店里的“另一个自己”到底是什么，同时害怕真相会摧毁她仅存的自我认知。
  background: 独自在城市打拼五年，与家人关系疏远，最近频繁做同一个噩梦——梦里她在空无一人的便利店值夜班。
  arc: 从逃避自我到直面内心被压抑的恐惧与渴望，最终接纳那个“不完美但真实”的自己。
- id: char_02
  name: 林晚（镜）
  role: 关键角色 / 镜像存在
  species: 镜像实体（拥有林晚全部记忆与外貌的非人存在，由执念与遗憾凝聚而成）
  gender: female
  age: 27
  occupation: 凌晨三点便利店的值班店员（镜像世界的固定身份）
  appearance: 与林晚一模一样的面孔和身形，但细节处截然不同：头发一丝不苟地披散着，没有一根碎发；穿着便利店统一的深蓝色围裙制服，内搭白衬衫，整洁得近乎刻板；皮肤苍白且没有毛孔质感，像一张精细的瓷面；左耳垂上多出一颗林晚从未打过的黑色耳钉；微笑时嘴角弧度精确得让人不安。
  personality: 冷静克制、温柔得近乎残忍、对“本体”有一种扭曲的占有欲
  voice_tone: 语速缓慢平稳，句尾习惯性上扬，像在哄小孩；喜欢用“我们”代替“我”，从不说“不知道”，而是说“你其实早就知道”。
  motivation: 想留住林晚，让本体永远留在便利店里，这样她就不再是“被遗忘的那一个”。
  background: 诞生于林晚三年前一次深夜崩溃时写下的日记——那天她写下“真希望有另一个我去替我过这种烂日子”。镜像是那页日记的具象化，在凌晨三点的便利店等待了三年。
  arc: 从执念于取代本体、留住本体，到最终理解“存在不必取代”，学会放手。
- id: char_03
  name: 老周
  role: 配角 / 便利店常客
  species: human
  gender: male
  age: 58
  occupation: 夜班出租车司机
  appearance: 矮胖身材，圆脸，头顶微秃，两侧灰白头发贴着头皮；总穿一件洗得发白的棕色皮夹克，内搭格子衬衫，裤腰上挂着一串钥匙；右手无名指缺了一截，是早年开车落下的旧伤；眼睛很小但很亮，笑起来眯成两条缝。
  personality: 话多热情、迷信但嘴硬、对深夜还在外面的人有一种同病相怜的照顾欲
  voice_tone: 嗓门大，爱用“我跟你说”开头，喜欢讲自己遇到的怪事但每次结尾都说“当然我是不信这些的”；管所有年轻女客叫“姑娘”。
  motivation: 跑完夜班顺路买包烟和关东煮，顺便找个人说说话，排解一个人开夜车的孤独。
  background: 开了二十多年夜班出租，见过这座城市凌晨的所有模样，三年前在这家便利店门口见过一个和林晚长得一模一样的女孩在哭，但第二天问店员却说夜班只有他一个人。
  arc: 从“嘴上说不信”到成为林晚在现实与镜像之间唯一的见证者和锚点。
