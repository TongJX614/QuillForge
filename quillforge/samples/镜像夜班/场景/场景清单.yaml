scenes:
- id: scene_01
  name: 三点零七分的风铃
  location: 24小时便利店（镜像空间入口）
  time: 凌晨三点零七分
  atmosphere: 荧光灯发出细微的电流嗡鸣，关东煮的蒸汽在冷气里斜斜飘散，窗外的街面空无一人，只有积水映着灯牌，像另一个倒过来的世界。安静得能听见自己心跳。
  description: 雨刚停，柏油路面上还浮着一层薄薄的水光，把便利店的灯牌倒映成一片模糊的橙。你推开玻璃门，风铃叮当响了一声，声音在空荡荡的店里回荡得比平时更久。荧光灯白得发冷，货架整整齐齐，关东煮的蒸汽一缕缕往上飘，一切都和你值过无数次的夜班一样——除了收银台后面站着的那个人。她抬起头，动作很轻，像水面被风拂过。那张脸，你每天早上在镜子里看见的那张脸，此刻正隔着收银台望着你，嘴角弯成你练习过很多次却总做不自然的弧度。你下意识地捏紧了手里的伞柄，指节泛白。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 凌晨的24小时便利店入口，雨后湿漉漉的柏油路面倒映着橙白色灯牌，玻璃门半开，门框上挂着一串风铃，店内荧光灯惨白，货架整齐排列，收银台后空无一人，关东煮的蒸汽在冷气中缓缓上升，窗外街道空旷无人，积水泛着微光。
