  - type: 场景背景
    scenes:
    - name: 三点零七分的风铃
      mood: 荧光灯发出细微的电流嗡鸣，关东煮的蒸汽在冷气里斜斜飘散，窗外的街面空无一人，只有积水映着灯牌，像另一个倒过来的世界。安静得能听见自己心跳。
      details: 凌晨的24小时便利店入口，雨后湿漉漉的柏油路面倒映着橙白色灯牌，玻璃门半开，门框上挂着一串风铃，店内荧光灯惨白，货架整齐排列，收银台后空无一人，关东煮的蒸汽在冷气中缓缓上升，窗外街道空旷无人，积水泛着微光。
