main_plot:
  summary: 凌晨三点，加班后的林晚走进便利店，发现店员长着自己的脸。镜中人温柔地留她“多待一会儿”，而老周的出现让林晚意识到，天亮之前她必须做出选择：留下，还是回去。
  themes:
  - 自我认同
  - 逃避与面对
  - 被遗忘的渴望
  core_conflict: 林晚必须在逃避现实的安逸（留在镜像空间）与直面真实自我的痛苦（回到现实）之间做出抉择。
