characters:
- id: char_01
  name: 林默
  role: 主角
  species: human
  gender: male
  age: 28
  occupation: 大学图书馆夜班管理员
  appearance: 身高178cm，偏瘦，黑色短发略显凌乱，戴一副细框眼镜，常穿深灰高领毛衣和卡其色工装裤，左手腕有一道浅疤。
  personality: 谨慎、理性、内敛，习惯用逻辑解释一切，但内心深处害怕孤独。
  voice_tone: 说话简短、冷静，常用“等等”“让我想想”来争取思考时间，极少表露情绪。
  motivation: 查明电梯为何停在负七层，以及那个与自己一模一样的人究竟是谁。
  background: 三年前来到这所大学图书馆工作，选择夜班是因为失眠，对图书馆的每一寸空间都了如指掌。
  arc: 从用理性否认超自然现象，到被迫面对内心被压抑的孤独与记忆。
- id: char_02
  name: 镜像林默
  role: 核心对手/镜像
  species: human（镜像实体）
  gender: male
  age: 28
  occupation: 无（镜像存在）
  appearance: 与林默外貌完全相同，但肤色更苍白，眼神更空洞，嘴角常挂着一丝不属于林默的浅笑，衣服上无任何褶皱或污渍。
  personality: 冷静、蛊惑、执着，说话像在复述记忆，总用“我们”代替“我”。
  voice_tone: 声音与林默一模一样，但语速更慢，每个字都像从很远的地方传来，喜欢用反问句。
  motivation: 让林默承认自己内心的空洞，并取代他回到地面。
  background: 由林默长期压抑的孤独和自我怀疑凝聚而成，在负七层这个被遗忘的空间中获得了形态。
  arc: 从试图说服林默交换位置，到逐渐暴露出对存在本身的渴望和脆弱。
- id: char_03
  name: 沈鸢
  role: 关键配角/前管理员
  species: human
  gender: female
  age: 34
  occupation: 前图书馆夜班管理员，现自由职业者
  appearance: 身高165cm，微胖，栗色长发总是扎成低马尾，穿一件洗旧的墨绿风衣，右耳戴一枚银色耳钉，笑起来有酒窝。
  personality: 直率、敏锐、带着一种过来人的疲惫和温柔，喜欢用玩笑掩饰认真。
  voice_tone: 语速快，爱用“我跟你说”“你听好了”开头，偶尔夹杂自嘲的笑声。
  motivation: 阻止林默重蹈自己三年前的覆辙——她曾与自己的镜像对话，并付出了代价。
  background: 三年前在同一个电梯里遭遇过镜像，最终选择留下自己的一部分记忆才得以脱身，从此离开图书馆。
  arc: 从回避过去，到鼓起勇气回到图书馆帮助林默面对镜像。
