  - type: 场景背景
    scenes:
    - name: 负七层
      mood: 冷白灯光下的死寂，空气里浮动着旧纸与尘埃的气味，远处传来若有若无的电流嗡鸣
      details: 深夜的图书馆电梯间，金属门向两侧缓缓滑开，露出向下延伸的狭长走廊。走廊两侧是望不到尽头的旧书架，排列整齐却蒙着薄灰。天花板嵌着冷白色荧光灯管，光线均匀得没有一丝阴影，地面是磨旧的水磨石，反射着模糊的光晕。走廊尽头完全陷入黑暗，只能隐约看见书架投下的长影向深处斜斜拉长。
