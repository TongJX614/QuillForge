scenes:
- id: scene_01
  name: 负七层
  location: 图书馆电梯与负七层走廊
  time: 深夜十一点四十分
  atmosphere: 冷白灯光下的死寂，空气里浮动着旧纸与尘埃的气味，远处传来若有若无的电流嗡鸣
  description: 电梯门在身后合拢的声音闷得像一口井盖扣上。你站在轿厢里，看见楼层显示停在“-7”——一个从未在任何图纸上出现过的数字。门开了，冷白色的灯光涌进来，没有温度。走廊两侧的书架一眼望不到头，每一格都塞满了书脊朝内的旧书，书脊上没有字。空气很静，静到你能听见自己咽口水的声音。然后你看见了那个人——从书架深处走出来，步子不紧不慢，穿着和你一样的深灰外套，一样的黑色工装裤。他停在距你五步远的地方，灯光把他的脸照得清清楚楚。那是一张和你一模一样的脸，连左眉尾那道浅疤都分毫不差。他偏了偏头，像在打量一件旧物。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的图书馆电梯间，金属门向两侧缓缓滑开，露出向下延伸的狭长走廊。走廊两侧是望不到尽头的旧书架，排列整齐却蒙着薄灰。天花板嵌着冷白色荧光灯管，光线均匀得没有一丝阴影，地面是磨旧的水磨石，反射着模糊的光晕。走廊尽头完全陷入黑暗，只能隐约看见书架投下的长影向深处斜斜拉长。
