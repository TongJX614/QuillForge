characters:
- id: char_01
  name: 林越
  role: 主角
  species: human
  gender: male
  age: 34
  occupation: 深海空间站维生系统工程师
  appearance: 身高178cm，体型精瘦，常年不见阳光的皮肤泛着苍白；黑色短发因缺乏打理而略显凌乱，下颌有未刮净的胡茬；穿着深灰色连体工装，袖口磨损，胸前别着褪色的空间站徽章；左眉有一道旧疤，手指关节粗大，习惯性戴着一副薄框护目镜。
  personality: 偏执较真、沉默寡言、对细节有近乎病态的敏感
  voice_tone: 说话简短，常用陈述句，遇到质疑时会重复对方的话再冷冷反驳；口头禅是“数据不会骗人”
  motivation: 查明敲击声的来源，证明自己没有精神失常
  background: 三年前因一次深海作业事故失去搭档，此后主动申请调往最偏僻的深渊空间站，用工作麻痹自己。
  arc: 从拒绝相信直觉、只信仪表，到学会在数据之外聆听自己的判断。
- id: char_02
  name: 沈月
  role: 配角/空间站站长
  species: human
  gender: female
  age: 41
  occupation: 深渊空间站站长
  appearance: 身高165cm，体态挺拔，银灰色短发利落地别在耳后；面容瘦削，颧骨明显，眼角有细纹，眼神锐利；穿着深蓝色站长制服，肩章锃亮，领口扣到最上一颗；左手无名指戴着一枚旧式机械表，说话时习惯性用指尖敲桌面。
  personality: 果决务实、控制欲强、习惯用权威掩盖不安
  voice_tone: 语速快，用词精准，喜欢用“我要求”“立刻”等命令式短句，情绪激动时会压低声音
  motivation: 维持空间站稳定，避免任何可能引发恐慌的事件上报
  background: 在深海基地服役十五年，经历过三次重大事故，靠铁腕管理赢得上级信任，但下属私下称她“冰站长”。
  arc: 从压制真相、维护秩序，到被迫面对自己一直逃避的愧疚。
- id: char_03
  name: 阿澈
  role: 配角/通信员
  species: human
  gender: male
  age: 23
  occupation: 空间站通信与声呐监测员
  appearance: 身高172cm，圆脸，脸颊有青春痘留下的浅印；栗色卷发蓬松，总有一撮翘在头顶；穿着略大的橙色连体工作服，脖子上挂着监听耳机，手腕缠着彩色编织绳；笑起来有虎牙，紧张时会咬指甲。
  personality: 话多好奇、容易紧张、对灵异故事又怕又爱
  voice_tone: 语速快而碎，爱用“我跟你说”“不是吧”等口头禅，紧张时句子会重复结尾词
  motivation: 想立功证明自己不是靠关系进的空间站
  background: 海洋大学声呐专业毕业，是站里最年轻的成员，因叔叔在总部任职而被同事暗中排挤。
  arc: 从遇事就慌的新人，到在关键时刻敢按下那个没人敢按的按钮。
- id: char_04
  name: 老周
  role: 配角/机械师
  species: human
  gender: male
  age: 56
  occupation: 空间站机械维修师
  appearance: 身高170cm，体格敦实，肩背厚实；花白寸头，国字脸，皱纹深重，右手背有烫伤疤痕；穿着洗得发白的蓝色工装，腰间挂满工具，口袋里永远揣着一小瓶白酒；说话时习惯眯眼，走路带轻微跛脚。
  personality: 老练世故、嘴硬心软、信经验不信仪器
  voice_tone: 嗓音沙哑低沉，爱用“你们年轻人”开头说教，常带“啧”的咂舌声，说急了会蹦出方言
  motivation: 平平安安熬到退休，拿到那笔养老金回老家看孙子
  background: 在深海平台干了三十年，见过太多“解释不了的事”，学会了一套自己的应对方式——多喝酒，少说话。
  arc: 从明哲保身、装聋作哑，到为了救年轻人打破自己“不掺和”的规矩。
