scenes:
- id: scene_01
  name: 舱壁上的敲击
  location: 深渊一号空间站B区管道检修通道
  time: 深夜（空间站标准时间02:17）
  atmosphere: 荧光灯嗡鸣不定，金属通道狭长幽闭，舱壁另一侧是六千米的绝对黑暗与压力，空气里浮动着机油和冷凝水的味道。
  description: B区检修通道的荧光灯管坏了一根，剩下那根每隔十几秒就发出电流不稳的嗡鸣。你蹲在管道旁，扳手抵着法兰螺栓，汗珠沿着安全帽的边缘滑进领口。六千米的海水就压在舱壁另一侧——这种念头三年了也没能习惯。通道尽头的压力表指针微微颤动，读数正常，一切正常，除了刚才那三下。你屏住呼吸，把耳朵贴上冰冷的合金舱壁，金属的寒意瞬间穿透工作服。然后它们又响了——三下，间隔两秒，再两下。有节奏的，刻意的，从舱壁外侧传来的。你的手指下意识收紧，攥住了扳手柄。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的深海空间站内部检修通道，狭长金属走廊，一根荧光灯管忽明忽暗，管道与法兰密布，压力表嵌在舱壁上，通道尽头没入阴影，金属表面泛着冷光与冷凝水珠，整体幽闭压抑。
