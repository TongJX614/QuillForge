characters:
- id: char_01
  name: 莉娜
  role: 主角
  species: human
  gender: female
  age: 19
  occupation: 黑魔法学徒
  appearance: 中等身高，身形偏瘦，因长期熬夜研究魔法而显得苍白。黑色长发随意扎成低马尾，几缕碎发垂在脸颊。常穿一件洗得发白的深紫色学徒长袍，袖口有磨损痕迹。左手手背有一块暗红色魔法烙印，形状如荆棘。眼神中混合着倔强与不安。
  personality: 倔强、内疚、求知欲强
  voice_tone: 说话时习惯性压低声音，常用'我……'开头表达犹豫，紧张时会反复摩挲左手手背。用词精准但偶尔冒出晦涩的魔法术语。
  motivation: 摆脱黑魔法反噬，赎清自己无意中犯下的罪孽。
  background: 曾是学院最被看好的治愈系学徒，因偷阅禁书被逐，为求生计误入黑魔法师门下，在一次实验中不慎释放了诅咒。
  arc: 从逃避过去的懦弱者成长为直面错误、为他人承担后果的真正的施法者。
- id: char_02
  name: 卡厄斯
  role: 导师/关键配角
  species: human
  gender: male
  age: 47
  occupation: 被逐出议会的黑魔法师
  appearance: 高瘦，肩背微驼，灰白长发披散至肩，面容布满细密的旧伤疤。左眼瞳孔呈暗红色，右眼正常。常年裹着一件多口袋的黑色旧斗篷，腰间挂满装着不明液体的玻璃瓶。手指修长，指甲发黑。
  personality: ' cynical、刀子嘴豆腐心、对魔法规则敬畏'
  voice_tone: 嗓音沙哑低沉，喜欢用反问句和讽刺，口头禅是'天真'。提到危险事物时会突然变得极其严肃。
  motivation: 防止自己传授的黑魔法知识被用于不可挽回的破坏。
  background: 曾是议会首席附魔师，因一次禁忌实验导致同僚丧生而被放逐，此后隐居收徒只为监控黑魔法流向。
  arc: 从冷漠旁观者到愿意为学徒赴险，重新找回责任与信任。
- id: char_03
  name: 米娅
  role: 盟友
  species: 灵体
  gender: female
  age: 12
  occupation: 被诅咒束缚的灵体少女
  appearance: 半透明身形，约孩童身高，边缘泛着微弱蓝光。短而蓬松的银白色头发无风自动，眼睛是两点明亮的白光，穿着样式古朴的白色连衣裙，脚踝处缠着一段断裂的黑色锁链虚影。
  personality: 天真、执着、偶尔毒舌
  voice_tone: 声音清脆但带轻微回音，喜欢直呼名字不用敬称，会说'笨蛋'但语气不带恶意。不懂现代生活常识，常问出奇怪问题。
  motivation: 找到解除自身诅咒的方法，同时不再连累他人。
  background: 生前是村庄女孩，因一场黑魔法事故被转化为灵体，记忆残缺，只记得'要等一个人'。
  arc: 从只关心自己解脱到学会信任并帮助他人。
- id: char_04
  name: 格雷姆
  role: 反派
  species: human
  gender: male
  age: 52
  occupation: 黑魔法集会首领
  appearance: 体格魁梧，光头，下巴有短而硬的灰白胡须。右脸有一道从眉骨延伸到嘴角的旧伤，行走时拄一根顶端嵌着黑色晶石的金属手杖。穿深红色高领长袍，双手戴满刻有符文的戒指。
  personality: 冷酷、精于算计、伪装优雅
  voice_tone: 说话不紧不慢，喜欢用敬语和完整长句，即使威胁时也保持礼貌腔调。常以'亲爱的'称呼对手。
  motivation: 收集足够多的灵体与诅咒能量以打开禁忌之门。
  background: 曾是莉娜所在学院的资助人，暗中运营黑魔法网络，以'研究'为名招募学徒进行危险实验。
  arc: 从幕后操控者到被自己的野心反噬，暴露脆弱本质。
