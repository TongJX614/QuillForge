  - type: 场景背景
    scenes:
    - name: 锁链下的低语
      mood: 烛火将熄未熄，禁书锁链上的锈迹在光里泛着暗红，灵体的微光与烙印的余热在空气中无声角力。
      details: 深夜的地下石砌工坊，橡木长桌上摊着泛黄符文草图与被三道锈蚀锁链缠绕的厚重禁书，几支残烛在石壁凹槽里摇曳，投下晃动的光斑，木梯通向黑暗高处，角落堆满发霉典籍与冷却的蜡油痕迹，空气里浮着细尘。
    - name: 井边的长袍
      mood: 烛光昏沉，空气里井水的潮气与蜡油味交织，灵体的冷光在石壁上投下不安的涟漪，暗室之门的阴影正从楼梯下缓缓爬出。
      details: 深夜的地下石砌工坊，穹顶低垂，墙壁被烛火染成暖橙色，橡木桌上摊着泛黄的符文草图和一本缠着锈蚀锁链的厚书，桌角一盏未点燃的油灯，远处楼梯下方隐没在阴影里，空气中有细小的尘埃在光柱中浮沉。
