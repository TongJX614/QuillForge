scenes:
- id: scene_01
  name: 锁链下的低语
  location: 卡厄斯的地下魔法工坊
  time: 深夜
  atmosphere: 烛火将熄未熄，禁书锁链上的锈迹在光里泛着暗红，灵体的微光与烙印的余热在空气中无声角力。
  description: 地下工坊的空气里弥漫着陈年羊皮纸与冷却蜡油的气味。烛火在石壁上投下摇晃的光斑，将一排排发霉的典籍照得忽明忽暗。你面前的橡木桌上，那本被三道锈蚀锁链缠住的禁书正压着一张泛黄的符文草图，而草图边缘，你偷偷刻下的修补阵纹已经歪斜着亮起微光。左手手背传来熟悉的刺痛——旧烙印在提醒你，每一次尝试都在喂养它。你咬住下唇，把注意力压回阵纹上，却听见身后传来一声极轻的、不属于活人的叹息。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的地下石砌工坊，橡木长桌上摊着泛黄符文草图与被三道锈蚀锁链缠绕的厚重禁书，几支残烛在石壁凹槽里摇曳，投下晃动的光斑，木梯通向黑暗高处，角落堆满发霉典籍与冷却的蜡油痕迹，空气里浮着细尘。
- id: scene_02
  name: 井边的长袍
  location: 卡厄斯的地下工坊
  time: 深夜
  atmosphere: 烛光昏沉，空气里井水的潮气与蜡油味交织，灵体的冷光在石壁上投下不安的涟漪，暗室之门的阴影正从楼梯下缓缓爬出。
  description: 你往前倾了倾身，指尖几乎碰到米娅灵体边缘那层毛茸茸的冷光。追问的话一出口，工坊里的烛焰便像被无形的手拨了一下，齐齐朝你这边偏了偏。米娅的轮廓不再剧烈闪烁，反而凝固成一种脆弱的清晰——像薄冰覆在深水上，一碰就会碎。卡厄斯没有出声，只是把油灯往桌角推远了些，好让光线不会刺穿她。空气里那股陈年蜡油味被一丝极淡的、井水般的潮气取代，你知道那是她在无意识间渗出的记忆。你左手手背的旧烙印还在隐隐发烫，提醒你每多知道一分，就离那摊浑水更近一步。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的地下石砌工坊，穹顶低垂，墙壁被烛火染成暖橙色，橡木桌上摊着泛黄的符文草图和一本缠着锈蚀锁链的厚书，桌角一盏未点燃的油灯，远处楼梯下方隐没在阴影里，空气中有细小的尘埃在光柱中浮沉。
