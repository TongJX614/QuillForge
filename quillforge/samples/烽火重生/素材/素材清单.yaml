    - name: 赵铁柱
    - name: 苏静
    - name: 老周
  - type: 场景背景
    scenes:
    - name: 雨夜担架
      mood: 阴冷潮湿，紧张压抑，泥泞与枪声交织
      details: 深秋雨夜的山谷，狭窄泥泞的山道蜿蜒向上，两侧是陡峭的黑色岩壁和密林。雨丝密集，火把在风雨中摇曳，映出湿滑的石阶和浑浊的水洼。远处山脊上隐约有闪烁的火光，雾气弥漫，一盏马灯挂在树枝上，光线昏黄，照亮一小片泥地。
    - name: 岭上枪声
      mood: 冷雨渐歇，雾气浓重，山风裹着湿木头和硝烟的味道，一种紧绷的、随时会炸开的寂静
      details: 黎明前浓雾笼罩的陡峭山岭，湿滑的碎石坡上散落着被踩倒的蕨草，左侧山梁顶部有嶙峋黑岩和几棵歪斜的松树，远处山谷间浮着灰白色的雾带，天边只有一线极淡的青灰，岩石表面泛着雨后的水光，没有月亮，没有星，只有雾气在松枝间缓缓流动
