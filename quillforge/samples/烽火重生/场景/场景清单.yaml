scenes:
- id: scene_01
  name: 雨夜担架
  location: 川黔边界山谷
  time: 深秋雨夜
  atmosphere: 阴冷潮湿，紧张压抑，泥泞与枪声交织
  description: 冷雨顺着岩壁淌下来，把山道泡成了一条泥河。你在一阵颠簸中睁开眼，后脑勺钝痛，额上敷着的湿布已经半温。担架吱呀作响，抬担架的战士喘着粗气，草鞋在泥里一步一滑。赵铁柱的嗓门从队伍前头压过来，混着雨声和远处零星的枪响。你侧过头，看见苏静正把雨布往你身上掖，队伍末尾，老周挑着那口黑锅，骂骂咧咧地踩着水坑。空气里全是泥腥味和湿柴的烟味。你心里清楚——按路程算，天亮前必须翻过这道山脊，否则追兵一到，这条山谷就是死地。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深秋雨夜的山谷，狭窄泥泞的山道蜿蜒向上，两侧是陡峭的黑色岩壁和密林。雨丝密集，火把在风雨中摇曳，映出湿滑的石阶和浑浊的水洼。远处山脊上隐约有闪烁的火光，雾气弥漫，一盏马灯挂在树枝上，光线昏黄，照亮一小片泥地。
- id: scene_02
  name: 岭上枪声
  location: 川黔边界野马岭左侧山梁
  time: 黎明前最暗的时刻
  atmosphere: 冷雨渐歇，雾气浓重，山风裹着湿木头和硝烟的味道，一种紧绷的、随时会炸开的寂静
  description: 你的命令让整支队伍在泥坡上多停了半个时辰。赵铁柱嘴上骂骂咧咧，脚却已经带着二班的人往左坡摸上去了。雾气浓得像棉絮，五步之外就只剩下人影的轮廓。你靠在担架边，数着山梁上每一块岩石的位置——如果伏击真的在，枪口一定架在那几块歪松后面。苏静蹲在你身旁，把最后一点干粮掰成碎块塞进你手里，指尖冰凉。队伍里没人说话，只有压抑的咳嗽和草鞋碾过碎石的窸窣声。你心里反复盘算着时间，天一亮，山谷里的一切都会暴露，而追兵不会等你们慢慢翻岭。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 黎明前浓雾笼罩的陡峭山岭，湿滑的碎石坡上散落着被踩倒的蕨草，左侧山梁顶部有嶙峋黑岩和几棵歪斜的松树，远处山谷间浮着灰白色的雾带，天边只有一线极淡的青灰，岩石表面泛着雨后的水光，没有月亮，没有星，只有雾气在松枝间缓缓流动
