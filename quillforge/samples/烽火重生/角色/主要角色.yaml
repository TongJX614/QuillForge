characters:
- id: char_01
  name: 林向远
  role: 主角
  species: human
  gender: male
  age: 28
  occupation: 现代军事历史学家
  appearance: 中等身高，体型偏瘦但结实，短发，额头有浅浅的抬头纹，眼神深邃，穿着褪色的灰蓝色棉布旧军装，腰系皮带，脚穿草鞋
  personality: 理性冷静、意志坚定、内心柔软
  voice_tone: 语速平缓，常用'从战术上说'、'历史告诉我们'，但面对战友时会不自觉放柔声音，偶尔脱口现代词汇然后懊恼地改口
  motivation: 利用未来知识帮助红军减少伤亡，活到胜利那一天
  background: 现代研究长征的学者，在一次实地考察中意外坠崖，醒来发现自己成了1935年红一方面军的一名侦察参谋
  arc: 从试图'修正历史'的旁观者，到真正融入革命队伍、愿意为战友牺牲的战士
- id: char_02
  name: 赵铁柱
  role: 重要配角
  species: human
  gender: male
  age: 32
  occupation: 红一方面军侦察连连长
  appearance: 身材高大壮实，皮肤黝黑粗糙，方脸，左眉有一道浅疤，常年戴一顶磨破的八角帽，军装洗得发白但整齐，绑腿打得紧实
  personality: 豪爽直率、护短、粗中有细
  voice_tone: 嗓门大，爱说'格老子的'、'莫得问题'，对上级尊敬但敢顶嘴，对弟兄们像大哥一样
  motivation: 带弟兄们活着走完长征，一个都不能少
  background: 江西苏区老红军，参加过反围剿，全家被还乡团杀害，把连队当自己的家
  arc: 从怀疑林向远是'知识分子花架子'，到生死与共的信任，最终学会听'参谋的意见'
- id: char_03
  name: 苏静
  role: 配角
  species: human
  gender: female
  age: 22
  occupation: 红军卫生员
  appearance: 个头娇小，圆脸，齐耳短发用别针夹在耳后，眼睛大而亮，穿改小的灰军装，背一个鼓鼓的布药包，手腕缠着白布条
  personality: 温柔坚韧、细心果敢、有点倔
  voice_tone: 轻声细语但一急就提高调门，爱说'再坚持一下'、'不许睡'，对伤员像哄孩子
  motivation: 尽可能多救一个人，哪怕缺医少药
  background: 湖南师范学校学生，跟着队伍上井冈山，亲眼看着老师牺牲在湘江边
  arc: 从害怕见血的新手，成长为在炮火中面不改色的战地护士
- id: char_04
  name: 老周
  role: 配角
  species: human
  gender: male
  age: 45
  occupation: 炊事班长
  appearance: 矮胖身材，圆脸，络腮胡子花白，戴一顶旧毡帽，腰间挂着一口黑铁锅和一把缺了口的菜刀，衣服上全是油渍补丁
  personality: 乐观幽默、爱唠叨、把粮食看得比命重
  voice_tone: 一口四川话，爱说'吃口热的再走'、'莫要慌，锅里还有'，喜欢用吃的打比方
  motivation: 让队伍里没人饿着肚子打仗
  background: 参加过南昌起义的老兵，负过伤不能再上一线，主动要求当炊事员
  arc: 从总担心粮食不够的'抠门'班长，到舍得把最后一把炒面留给伤员
