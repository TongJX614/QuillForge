scenes:
- id: scene_01
  name: 半句人声
  location: 废弃加油站便利店
  time: 黄昏
  atmosphere: 黄昏的光线正一寸寸退去，便利店里阴影爬升，收音机的杂音与远处狗的低吼交替响起，像两把钝刀来回拉锯，安静随时可能被打破。
  description: 最后一缕天光从破碎的玻璃窗斜斜切进来，在积灰的货架上铺了一层浑浊的橘红。你半蹲在门边，用肩膀抵住歪斜的货架，铁皮被风推得吱呀作响。便利店深处，老周的收音机发出断断续续的电流杂音，像溺水的人在水面扑腾。陈小满跪坐在冰柜旁，正替一个陌生女人缠紧小臂上的绷带，动作轻得几乎听不见布料摩擦。远处传来一声狗的低吼，闷闷的，带着某种不确定的试探，从加油站后面的荒草地里滚过来。就在这时，收音机里猛地窜出半句人声，清晰得不像真的，随后又被杂音吞没。老周的手停在旋钮上，整个人僵住了。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 黄昏的废弃加油站便利店，破碎的玻璃窗外是荒芜的公路和齐腰的枯草，店内货架东倒西歪，积灰的柜台和冰柜上散落着过期商品，橘红色的夕阳从窗口斜切进来，在地面上拉出长长的影子，角落里有一台老式收音机亮着微弱的指示灯。
- id: scene_02
  name: 静默的代价
  location: 废弃便利店
  time: 黄昏
  atmosphere: 绷紧的安静里藏着一触即发的危险，每个人都在用自己的方式压住声响，连呼吸都像在算计。
  description: 你伸手按下了老周手背，收音机的声音戛然而止，像一扇门被轻轻关上。便利店里只剩下风从破窗灌进来的呜咽，和陈小满压抑的呼吸声。老周张了张嘴，最终只是把旋钮又拧了半圈，确认彻底断电，才把手缩回去，在裤子上蹭了蹭。门外，那条狗的低吼停了，取而代之的是爪子踩在碎砖上的细碎声响，忽远忽近，像在丈量什么。陈小满低着头，手指压在那女人腕上，嘴唇抿成一条线，你看见她肩膀绷得很紧。货架投下的阴影越拉越长，把你们三个人都罩了进去。那女人忽然动了一下，眼皮颤了颤，喉咙里滚出一声含糊的气音。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 黄昏时分的废弃便利店内部，货架歪斜倾倒，地面散落着罐头和碎玻璃，破窗外透进浑浊的橘红色天光，远处隐约可见加油站的生锈招牌和丛生荒草，阴影浓重，光线昏暗而压抑。
