characters:
- id: char_01
  name: 林远
  role: 主角
  species: human
  gender: male
  age: 32
  occupation: 前消防员
  appearance: 身高一米八二，身形精瘦但结实，短发凌乱，左眉一道旧疤，胡茬浓密，穿着磨破的深蓝色消防外套，背一个旧帆布包，眼神沉稳警惕。
  personality: 冷静果敢、习惯性保护他人、沉默寡言
  voice_tone: 说话简短低沉，常用‘跟紧我’、‘别回头’这类命令式短语，极少解释原因。
  motivation: 找到传闻中的安全区‘余烬营地’，并护送幸存者抵达。
  background: 末日爆发时他正在休假，救出十余人后独自流浪，坚信秩序可以重建。
  arc: 从只信任自己的独行者，学会重新依靠团队并接受他人帮助。
- id: char_02
  name: 陈小满
  role: 配角
  species: human
  gender: female
  age: 19
  occupation: 医学院学生
  appearance: 个子娇小，圆脸，齐耳短发有些毛躁，戴一副用胶带缠过腿的圆框眼镜，穿洗得发白的连帽卫衣和不合身的男款工装裤，背着塞满药品的红色双肩包。
  personality: 好奇心旺盛、话多爱提问、对伤痛有超乎年龄的敏感
  voice_tone: 语速快，喜欢用‘那个……’开头，紧张时会不停碎碎念医学名词。
  motivation: 找到能安全做手术的医疗点，救回被咬伤但尚未变异的同伴。
  background: 疫情暴发时她正在医院实习，靠给伤员处理伤口活了下来，包里还剩半瓶抗生素。
  arc: 从害怕做决定的医学生，成长为敢在废墟里开刀救人的真正医生。
- id: char_03
  name: 老周
  role: 配角
  species: human
  gender: male
  age: 58
  occupation: 退休无线电维修工
  appearance: 矮胖身材，花白络腮胡，头顶半秃，穿褪色的军绿色棉袄，腰间挂着一排螺丝刀，手里总提着一台改装过的旧收音机，走路微跛。
  personality: 乐观豁达、爱讲冷笑话、对机器比对人更有耐心
  voice_tone: 嗓门大，爱说‘你听我说啊’，每句话结尾习惯加个‘嘛’字，喜欢用修理术语打比方。
  motivation: 修好电台，听到人类频道里传来一句完整的、不带杂音的问候。
  background: 在城市边缘独居了两年，靠拆解废弃电器维生，坚信还有人在发信号。
  arc: 从只相信电波的老顽固，学会相信身边活着的人。
- id: char_04
  name: 灰狼
  role: 配角/威胁
  species: 变异犬
  gender: male
  age: 4
  occupation: 无
  appearance: 体型接近成年德国牧羊犬，但骨架更宽，灰黑色短毛多处打结脱落，露出结痂的皮肤，眼睛浑浊呈暗黄色，下颚错位导致口水不断滴落，左耳缺了一半，尾巴短而僵硬。
  personality: 残存本能中的忠诚、对特定声音有反应、攻击前会低吼示警
  voice_tone: 无法说话，用低吼、呜咽和尾巴摆动幅度表达情绪。
  motivation: 闻到旧主人制服的气味时会短暂犹豫，其余时间受饥饿和疼痛驱使。
  background: 曾是搜救犬，感染后未完全丧失对制服和哨声的条件反射。
  arc: 在关键场景中因林远的哨声产生迟疑，成为危险的变数。
