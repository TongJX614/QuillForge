assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 林远
    - name: 陈小满
    - name: 老周
    - name: 灰狼
  - type: 场景背景
    scenes:
    - name: 半句人声
      mood: 黄昏的光线正一寸寸退去，便利店里阴影爬升，收音机的杂音与远处狗的低吼交替响起，像两把钝刀来回拉锯，安静随时可能被打破。
      details: 黄昏的废弃加油站便利店，破碎的玻璃窗外是荒芜的公路和齐腰的枯草，店内货架东倒西歪，积灰的柜台和冰柜上散落着过期商品，橘红色的夕阳从窗口斜切进来，在地面上拉出长长的影子，角落里有一台老式收音机亮着微弱的指示灯。
    - name: 静默的代价
      mood: 绷紧的安静里藏着一触即发的危险，每个人都在用自己的方式压住声响，连呼吸都像在算计。
      details: 黄昏时分的废弃便利店内部，货架歪斜倾倒，地面散落着罐头和碎玻璃，破窗外透进浑浊的橘红色天光，远处隐约可见加油站的生锈招牌和丛生荒草，阴影浓重，光线昏暗而压抑。
