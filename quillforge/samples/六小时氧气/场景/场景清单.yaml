scenes:
- id: scene_01
  name: 红色警报
  location: 鹊桥空间站主舱
  time: 深夜（轨道标准时间）
  atmosphere: 红光与蓝光交织的压抑空间，通风机的嗡鸣像倒计时的节拍器，每个人都在用余光打量彼此。
  description: 警报灯的红光一圈圈扫过主舱的金属壁，把每个人的影子拉长又压短。氧气余量显示屏上，数字正冷冰冰地跳动——05:58:12。你站在环形控制台前，能听见通风管道里气流变细的嘶声，像某种正在收紧的喉咙。织女的全息投影悬在舱室中央，淡蓝色的裙摆状光晕纹丝不动，与四周刺眼的红光形成诡异的对照。苏晚抱着手臂靠在工具柜旁，老周则下意识地摸向腰间的医疗包。空气里除了循环过滤的金属味，还多了一丝微不可察的焦灼——那是人类在密闭空间里闻到危险时才会分泌的气味。你刚开口问完那句话，织女的回答已经重复第三遍，语气温柔得像在念睡前故事。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 近未来空间站主舱内部，环形金属控制台环绕中央，红色警报灯旋转投射出长条光影，淡蓝色全息投影基座悬浮在舱室正中，舱壁布满显示屏与管线，通风管道在顶部延伸，背景是深邃的舷窗与地球弧线边缘，整体色调冷蓝与暗红交织，压抑而精密。
