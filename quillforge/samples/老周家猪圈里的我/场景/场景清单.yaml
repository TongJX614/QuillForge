scenes:
- id: scene_01
  name: 一睁眼，我裂开了
  location: 老周家养猪场·育肥猪栏
  time: 清晨
  atmosphere: 晨光刺眼，猪圈里热气蒸腾，酸臭味混着泥土气，铁栏杆上凝着露水，远处传来枣树上麻雀的聒噪，一派热闹又慌乱的清晨景象。
  description: '你是被一股发酵的酸臭味呛醒的。


    鼻尖凉飕飕的，拱在什么黏糊糊的东西里。你下意识想抬手抹把脸，却发现胳膊根本抬不起来——不对，是根本没有胳膊。眼前是灰扑扑的水泥地，铁栏杆外头，一棵歪脖子枣树挂着几颗青枣，在晨光里晃悠。猪粪味儿浓得像堵墙，直接把你拍懵了。


    你低头，看见两只粉白色的蹄子，再低头，看见圆滚滚的肚皮。你想喊救命，嗓子眼里挤出来的却是一声嘹亮的——哼唧。


    旁边几头猪正挤在食槽边抢食，尾巴甩得啪啪响。栏外传来一个大嗓门，震得铁皮棚嗡嗡的：“小满！日头都三竿了，今儿个给那几头育肥猪称称重——你说啥？猪不配合？猪还能不配合？”'
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 清晨的北方农村养猪场，水泥地面的猪栏，铁栏杆上挂着露珠，食槽里堆着泔水饲料，栏外一棵歪脖子枣树挂着青枣，晨光斜照，背景是灰砖农舍和堆着饲料袋的棚子，地面泥泞，空气里仿佛弥漫着雾气。
- id: scene_02
  name: 称重台上的表演
  location: 老周家猪场·育肥猪栏与过道
  time: 清晨
  atmosphere: 晨光里的猪场吵吵嚷嚷，铁栏杆的哐当声和猪叫混成一片，空气里那股酸臭味似乎都被这场争执搅得更浓了。老黄趴在一旁眯着眼，尾巴有一搭没一搭地甩着。
  description: 老周的大手从栏杆缝里探进来，你后腿一蹬，蹄子在水泥地上刨出两道白印子。铁栏杆被你扒得哐哐响，整栏猪都跟着骚动起来，老黄在身后慢悠悠地哼了一声，像是在叹气。周小满原本已经转身去拿记录本，被这动静拽了回来，手机镜头又对准了你。晨光从铁皮棚的缝隙里斜插进来，照在你粉白的猪鬃上，你呼哧呼哧喘着气，把吃奶的劲儿都使在两条前腿上，扒着栏杆不撒蹄。老周的手悬在半空，眉头拧成了疙瘩。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 北方农村清晨的养猪场，水泥地面的猪栏里食槽泛着湿漉漉的光，铁栏杆上挂着草屑，栏外过道堆着几袋饲料，远处一棵歪脖子枣树在晨光里投下细长的影子，铁皮棚顶边缘卷起，漏进一道斜斜的光柱，空气里浮着细尘。
