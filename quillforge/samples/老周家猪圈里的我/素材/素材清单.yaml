assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 我（陈大雷）
    - name: 老周
    - name: 周小满
    - name: 老黄
  - type: 场景背景
    scenes:
    - name: 一睁眼，我裂开了
      mood: 晨光刺眼，猪圈里热气蒸腾，酸臭味混着泥土气，铁栏杆上凝着露水，远处传来枣树上麻雀的聒噪，一派热闹又慌乱的清晨景象。
      details: 清晨的北方农村养猪场，水泥地面的猪栏，铁栏杆上挂着露珠，食槽里堆着泔水饲料，栏外一棵歪脖子枣树挂着青枣，晨光斜照，背景是灰砖农舍和堆着饲料袋的棚子，地面泥泞，空气里仿佛弥漫着雾气。
    - name: 称重台上的表演
      mood: 晨光里的猪场吵吵嚷嚷，铁栏杆的哐当声和猪叫混成一片，空气里那股酸臭味似乎都被这场争执搅得更浓了。老黄趴在一旁眯着眼，尾巴有一搭没一搭地甩着。
      details: 北方农村清晨的养猪场，水泥地面的猪栏里食槽泛着湿漉漉的光，铁栏杆上挂着草屑，栏外过道堆着几袋饲料，远处一棵歪脖子枣树在晨光里投下细长的影子，铁皮棚顶边缘卷起，漏进一道斜斜的光柱，空气里浮着细尘。
