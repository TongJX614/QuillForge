characters:
- id: char_01
  name: 我（陈大雷）
  role: 主角
  species: 猪
  gender: male
  age: 32
  occupation: 原为城市白领，现为一头育肥猪
  appearance: 体长约一米五的粉白色杂交猪，圆滚滚的肚皮贴地，耳朵耷拉着像两片软布，鼻盘湿润泛着淡粉色，尾巴细短卷成一个小圈，四个蹄子沾满泥巴，左耳上钉着黄色的防疫耳标。全身的毛稀稀拉拉，脊背上有几块蹭痒留下的深色泥印。
  personality: 嘴碎爱吐槽、内心戏丰富、怂但关键时刻有主意
  voice_tone: 满嘴都市打工人黑话，动不动就'绝了''我裂开'，爱用反问句，着急了会哼哼唧唧地叫唤
  motivation: 搞清楚自己怎么变成猪的，并在被拉去屠宰之前变回人。
  background: 在城市打工十年刚被裁员，回老家散心，路过老周家养猪场时进去借厕所，再一睁眼就躺在了猪圈食槽旁边。
  arc: 从拼命想逃回城市，到在猪圈里重新理解'活着'这件事。
- id: char_02
  name: 老周
  role: 养猪场主人
  species: human
  gender: male
  age: 58
  occupation: 养猪专业户
  appearance: 矮壮身材，一米六出头，皮肤黝黑粗糙，花白寸头，脸上沟壑纵横，常年穿一件洗得发白的蓝布大褂和黑胶雨靴，腰间挂着一串猪圈钥匙，右手食指缺了半截——年轻时被猪咬的。
  personality: 嘴硬心软、精明算计、对猪比对人有耐心
  voice_tone: 嗓门大，说话像吵架，三句不离'这猪崽子'，爱用反问和感叹，口头禅是'你说啥？'
  motivation: 把这一栏猪养肥卖个好价钱，给在城里念书的闺女攒嫁妆。
  background: 养了三十年猪，经历过猪瘟、猪价暴跌，老婆受不了猪圈味儿早走了，一个人拉扯大闺女。
  arc: 从一开始把'我'当最肥的猪看待，到慢慢发现这头猪不对劲，最后在杀猪刀和人性之间做出选择。
- id: char_03
  name: 周小满
  role: 老周的闺女
  species: human
  gender: female
  age: 19
  occupation: 省城农业大学畜牧专业大一学生，暑假回家帮忙
  appearance: 瘦高个儿，扎高马尾，皮肤是晒不黑的白，戴一副圆框眼镜，穿印着卡通猪图案的T恤和牛仔裤，帆布鞋上永远沾着猪饲料渣，手里常拿个记录本。
  personality: 学院派较真、善良但不天真、爱用专业知识怼她爹
  voice_tone: 语速快，爱说'根据数据''从行为学角度讲'，被她爹气到会飙方言，生气时叫'爸！'尾音拖长
  motivation: 用科学方法帮爹把猪场搞好，同时偷偷攒钱想毕业后把猪场改造成生态农场。
  background: 从小在猪圈边上长大，对猪有特殊感情，高考填志愿时全村不理解，只有她爹骂骂咧咧地掏了学费。
  arc: 从把'我'当成研究对象，到成为唯一相信'这头猪是人'的人。
- id: char_04
  name: 老黄
  role: 猪圈里的老住户
  species: 猪
  gender: female
  age: 6
  occupation: 母猪，猪圈里的'大姐头'
  appearance: 体型庞大，黑白花色的老母猪，体重足有两百多公斤，肚皮松弛下垂，背上有一道长长的旧疤，左耳缺了个口子，眼神精明像能看透猪心，吃食时总是第一个占住食槽。
  personality: 老江湖、护犊子、看破不说破
  voice_tone: 说话慢悠悠的，带点东北口音，爱说'小伙子你新来的吧''我跟你说啊'，惯用过来猪的语气教训人
  motivation: 在这栏里多活一天是一天，顺带罩着刚来的小猪崽。
  background: 生过七窝崽，全被老周卖了，自己因为产仔多留到现在，是这圈里唯一见过'外面的世界'又回来的猪。
  arc: 从冷眼旁观新来的'怪猪'，到最后用自己的方式帮'我'一把。
