      details: 深夜的生物实验室办公室，惨白的荧光灯管在天花板嗡嗡作响，长条实验台上整齐排列着移液枪和离心管架，一台老旧的电脑显示器亮着幽蓝的光，屏幕上是一封打开的邮件界面，窗外是漆黑的夜色，远处城市灯火稀疏，玻璃窗上凝结着细密的水雾。
