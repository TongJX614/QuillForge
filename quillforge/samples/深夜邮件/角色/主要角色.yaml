characters:
- id: char_01
  name: 林落
  role: 主角
  species: human
  gender: female
  age: 29
  occupation: 生物研究员
  appearance: 身高165cm，体型偏瘦，黑色齐肩短发，常戴黑框眼镜，穿白色实验室大褂，内搭深灰高领毛衣，眼神锐利但眼下有淡淡黑眼圈。
  personality: 严谨、固执、内心敏感
  voice_tone: 语速快，喜欢用数据说话，口头禅是“这不是巧合”，紧张时会反复推眼镜。
  motivation: 查明十年前的真相，还导师清白。
  background: 曾是已故教授陈远山的关门弟子，因导师被指控数据造假而蒙羞，转行到私营实验室。
  arc: 从只为自证清白到直面学术体制的黑暗，最终选择公开真相。
- id: char_02
  name: 陈默
  role: 关键线人
  species: human
  gender: male
  age: 45
  occupation: 匿名邮件发送者，前实验室数据员
  appearance: 身高178cm，体型微胖，秃顶，穿旧格子衬衫和卡其裤，戴银色金属细框眼镜，手指有常年敲键盘的茧。
  personality: 怯懦、愧疚、谨慎
  voice_tone: 说话吞吞吐吐，常用“我也不确定……但”，习惯用大量省略号。
  motivation: 赎罪，当年他被迫篡改数据。
  background: 十年前是陈远山实验室的数据员，因家庭压力配合造假，后离职隐姓埋名。
  arc: 从躲藏到鼓起勇气交出关键证据，最终出庭作证。
- id: char_03
  name: 周维安
  role: 反派
  species: human
  gender: male
  age: 52
  occupation: 大学副校长、当年实验室主任
  appearance: 身高180cm，挺拔精瘦，银灰色背头，穿定制深蓝西装，袖扣是名校校徽，笑容温和但目光冷。
  personality: 伪善、控制欲强、精于算计
  voice_tone: 语调平稳缓慢，爱用“年轻人”“大局为重”等词，从不提高音量。
  motivation: 维护自己的学术地位和既得利益。
  background: 当年为抢发论文授意篡改关键数据，事后嫁祸给陈远山。
  arc: 从稳坐钓鱼台到被证据步步紧逼，最终身败名裂。
- id: char_04
  name: 姜小满
  role: 盟友
  species: human
  gender: female
  age: 24
  occupation: 科技记者
  appearance: 身高160cm，圆脸，栗色高马尾，穿亮黄色卫衣和牛仔裤，背双肩包，口袋里永远插着录音笔。
  personality: 热血、机灵、嘴比脑子快
  voice_tone: 声音清脆，爱用网络流行语，激动时会连说“等等等等”。
  motivation: 挖到大新闻，同时真心敬佩陈远山。
  background: 刚入行一年，在调查学术不端选题时注意到林落。
  arc: 从只想博眼球到理解真相的重量，学会负责任地报道。
