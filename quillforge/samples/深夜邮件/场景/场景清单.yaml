scenes:
- id: scene_01
  name: 匿名邮件
  location: 生物实验室办公室
  time: 深夜十一点
  atmosphere: 压抑、寂静、荧光灯下的不安
  description: 深夜十一点，实验楼只剩下你这间办公室还亮着灯。荧光灯管发出持续的嗡嗡声，像一根绷紧的弦。你揉了揉酸胀的眼睛，把最后一组数据录入表格——转行到私营实验室两年了，你还是改不掉在深夜整理数据的习惯。电脑右下角忽然弹出新邮件提示，你下意识瞥了一眼，手指僵在键盘上。发件人是匿名地址，标题只有一行字：你导师没有造假。没有正文，没有附件，光标在屏幕上静静闪烁。你摘下眼镜擦了擦，又戴回去，心跳声在寂静里格外清晰。这不是巧合——十年来第一次，有人主动碰了这个话题。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的生物实验室办公室，惨白的荧光灯管在天花板嗡嗡作响，长条实验台上整齐排列着移液枪和离心管架，一台老旧的电脑显示器亮着幽蓝的光，屏幕上是一封打开的邮件界面，窗外是漆黑的夜色，远处城市灯火稀疏，玻璃窗上凝结着细密的水雾。
