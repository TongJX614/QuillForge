characters:
- id: char_01
  name: 老周
  role: 主角
  species: human
  gender: male
  age: 58
  occupation: 养猪场场主
  appearance: 身材矮壮，皮肤黝黑粗糙，常年穿洗得发白的蓝色工装外套和沾着泥点的胶鞋，头顶微秃，两侧花白短发，脸上有深深的皱纹，笑起来眼睛眯成一条缝。
  personality: 固执、节俭、嘴硬心软
  voice_tone: 说话大嗓门，爱用方言俚语，口头禅是'哎呦喂'，数落人时滔滔不绝，但关心人时却别扭地转移话题。
  motivation: 守住祖传的养猪场，供儿子读完大学。
  background: 养了三十年猪，经历过猪瘟、市场暴跌，欠了一屁股债，但死活不肯卖地。
  arc: 从把猪当牲口到真正理解动物的情感，学会倾听和尊重。
- id: char_02
  name: 周小军
  role: 配角
  species: human
  gender: male
  age: 22
  occupation: 大学生（暑假回家帮忙）
  appearance: 瘦高个，戴黑框眼镜，头发乱蓬蓬，穿简单的白T恤和牛仔裤，手指修长，总是不自觉地推眼镜，皮肤比父亲白净许多。
  personality: 温和、理想主义、有点书呆子气
  voice_tone: 说话慢条斯理，喜欢用科学术语解释一切，常被父亲打断，但依然耐心，口头禅是'从生物学角度来说'。
  motivation: 想说服父亲转型生态养殖，同时隐瞒自己偷偷写小说的事。
  background: 农业大学畜牧专业学生，对父亲的传统养殖方式又敬佩又矛盾。
  arc: 从逃避家庭责任到主动承担，找到传统与创新的平衡点。
- id: char_03
  name: 大花
  role: 配角
  species: 猪
  gender: female
  age: 3
  occupation: 猪圈里的'女王'
  appearance: 一头黑白花斑的母猪，体型肥硕，毛色油亮，两只小眼睛透着精明，左耳有个缺口，尾巴总是得意地卷成圈，走路时臀部一扭一扭。
  personality: 傲娇、贪吃、护短
  voice_tone: 哼哼唧唧，说话尖酸刻薄但关键时刻很仗义，口头禅是'哼，人类啊'。
  motivation: 保护猪圈里的同伴，争取更好的伙食待遇。
  background: 在养猪场生活了三年，见过好几批同伴被拉走，早已看透猪生。
  arc: 从对人类充满戒备到愿意信任善良的人类。
- id: char_04
  name: 你
  role: 主角（玩家扮演）
  species: 猪
  gender: male
  age: 25
  occupation: 原本是来养猪场采访的记者
  appearance: 一头粉白色的年轻公猪，体型匀称偏瘦，毛色干净，眼睛又黑又亮，鼻子粉嫩，右后腿有一小块灰色胎记，尾巴短小卷曲，耳朵总是警觉地竖着。
  personality: 好奇、机灵、有点慌不择路
  voice_tone: 内心吐槽不断，说话直来直去，遇到危险时语速飞快，口头禅是'不是，等等——'。
  motivation: 搞清楚自己为什么变成猪，并想办法变回去。
  background: 原本是来采访老周养猪场的都市报记者，刚踏进猪圈就莫名其妙变成了猪。
  arc: 从惊慌失措到利用人类智慧在猪圈生存，最终理解动物处境。
