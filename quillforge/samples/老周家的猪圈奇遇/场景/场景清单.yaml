scenes:
- id: scene_01
  name: 猪圈惊变
  location: 老周家养猪场·猪圈内
  time: 黄昏
  atmosphere: 夕阳余晖中的猪圈，热气与泔水味交织，猪群哼哼声此起彼伏，铁栏外传来胶鞋踏泥的声响和方言骂咧，荒诞中透着一股日常的烟火气
  description: 夕阳把砖墙染成橘红色，猪食槽里冒着热气的泔水味直冲鼻腔。你本该举着录音笔站在猪圈外做采访，可此刻四蹄着地，视野低得离谱。二十多头猪挤在铁栏后，一头花白母猪正斜眼打量你，嘴角还挂着半截红薯藤。你低头看见自己粉白的肚皮——完了，真成猪了。远处传来胶鞋踩泥的啪嗒声，老周的大嗓门由远及近，骂骂咧咧说着什么饲料又涨价了。你张嘴想喊救命，喉咙里却只滚出一串哼哼。大花慢悠悠踱过来，用鼻子拱了拱你的肋巴骨。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_03
  - char_01
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 黄昏时分的乡村养猪场，橘红色夕阳斜照在斑驳的红砖墙上，铁栏杆投下长长的影子，水泥食槽里冒着热气的饲料，地面散落着干草和泥脚印，远处是低矮的平房和堆放的饲料袋，天空泛着紫红色的晚霞
- id: scene_02
  name: 食槽边的暗战
  location: 老周家养猪场·猪圈
  time: 黄昏
  atmosphere: 黄昏将尽，猪圈里弥漫着泔水酸味和干草气息，铁栏外父子俩一个骂骂咧咧一个闷头记录，猪群在食槽边挤挤挨挨，暗流涌动
  description: 你被大花一屁股顶到食槽边，泔水的酸馊味直冲天灵盖，可肚子不争气地咕噜起来。胶鞋声越来越近，老周拎着铁桶咣当往槽里一倒，红薯藤混着米糠溅了你一脸。你学着大花的样子埋头拱食，余光里老周正叉腰扫视猪群，嘴里数落着'这批崽子吃得多长得慢'。铁栏外，一个戴眼镜的年轻人抱着笔记本小跑过来，被老周一嗓子吼得缩了缩脖子。猪群里一阵骚动，几头半大猪挤过来抢食，把你拱得东倒西歪。大花护食地横在你前面，哼了一声，那意思分明是：看好了，这才叫猪圈规矩。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 黄昏时分的乡村养猪场，红砖墙围着铁栏杆猪圈，食槽里堆着红薯藤和米糠，夕阳余晖斜照在泥地上，远处有低矮瓦房和电线杆，天色由橘转紫
