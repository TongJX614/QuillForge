      mood: 日光灯惨白，车窗外的路灯一盏盏向后掠过，车厢里静得能听见每个人的呼吸，车尾那团暗红色像一块吸光的墨。
      details: 深夜城市街道，一辆老旧的公交车行驶在空旷的马路上，车厢内日光灯惨白，窗外路灯昏黄向后掠过，路边梧桐树影浓密，路面泛着潮湿的微光，远处高楼零星亮着几扇窗。
