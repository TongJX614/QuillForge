scenes:
- id: scene_01
  name: 零点发车
  location: 末班公交车厢内
  time: 深夜零点
  atmosphere: 日光灯惨白，车窗外的路灯一盏盏向后掠过，车厢里静得能听见每个人的呼吸，车尾那团暗红色像一块吸光的墨。
  description: 零点整，末班车从总站缓缓驶出，车灯切开浓稠的夜色。车厢里稀稀拉拉坐着五六个人，日光灯管嗡嗡作响，投下惨白的光。你握紧方向盘，习惯性地扫了一眼后视镜——倒数第二排那个扎马尾的姑娘正低头啃面包，门边靠窗的老周闭着眼，像是睡着了。车尾靠窗的位置，一团暗红色缩在角落里，兜帽压得很低，看不清脸。报站器忽然滋滋响了两声，一个你从没听过的站名从喇叭里挤出来，声音平得像念悼词。你皱了皱眉，再看后视镜——后排靠过道那个空座上，原本坐着的人不见了，只剩座垫上一个浅浅的凹痕。车厢里静得能听见面包袋的窸窣声。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜城市街道，一辆老旧的公交车行驶在空旷的马路上，车厢内日光灯惨白，窗外路灯昏黄向后掠过，路边梧桐树影浓密，路面泛着潮湿的微光，远处高楼零星亮着几扇窗。
