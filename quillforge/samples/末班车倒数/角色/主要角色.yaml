characters:
- id: char_01
  name: 陆平
  role: 主角
  species: human
  gender: male
  age: 32
  occupation: 夜班公交司机
  appearance: 身形偏瘦，肩背微驼，常年夜班让他的脸色带着不健康的青白。短寸头，鬓角已有零星白发，下巴总挂着没刮净的胡茬。穿深蓝色公交制服，袖口磨得起球，左手腕戴一块老式电子表。
  personality: 沉默寡言，观察力极强，认死理——认定的事九头牛拉不回
  voice_tone: 说话短促，常带命令式，口头禅是“坐稳了”“别乱动”；紧张时会反复清嗓子
  motivation: 弄清这条线上到底出了什么事，把乘客平安送到站
  background: 开了八年夜班车，最近一个月总感觉末班车上人数对不上，向车队反映却没人当真。
  arc: 从只想自保的旁观者，变成主动追查真相、承担责任的人
- id: char_02
  name: 苏小满
  role: 关键配角
  species: human
  gender: female
  age: 22
  occupation: 大四学生，兼职便利店夜班
  appearance: 个子娇小，圆脸，齐刘海配低马尾，发尾染过褪色的亚麻色。穿宽松的灰色连帽卫衣和帆布鞋，怀里总抱一个塞得鼓鼓的帆布包，包上挂着好几个毛绒挂件。
  personality: 好奇心过剩，嘴比脑子快，但关键时刻心细如发
  voice_tone: 语速快，爱用网络流行语，惊讶时连说“不是吧不是吧”，习惯把“我跟你说”当开场白
  motivation: 想知道那些消失的乘客去了哪里，也怕自己成为下一个
  background: 每晚坐这趟末班车回学校，上周亲眼看着邻座大叔在座位上凭空不见。
  arc: 从一惊一乍的胆小女生，成长为能冷静记录线索、帮助他人的关键人物
- id: char_03
  name: 老周
  role: 神秘配角
  species: human
  gender: male
  age: 68
  occupation: 退休铁路调度员
  appearance: 身材敦实，背却挺得笔直，满头银发梳得一丝不苟。穿藏青色旧中山装，上衣口袋别一支钢笔，脚踩黑布鞋。左手提一只掉漆的军绿色保温杯，右手拄一根磨得发亮的竹节拐杖。
  personality: 固执，讲究规矩，说话慢条斯理却句句有分量
  voice_tone: 慢悠悠的北方口音，爱打比方，常说“这事儿啊，跟火车调度一个理儿”，被质疑时先哼一声再开口
  motivation: 守住自己知道的那个“规矩”，不让车上的人再少下去
  background: 年轻时调度过一条现已废弃的支线，那条线曾出过事故，他退休后每晚都坐这趟末班车。
  arc: 从守口如瓶的旁观者，到最终交出关键真相、完成自我救赎
- id: char_04
  name: 穿红雨衣的女人
  role: 反派 / 谜团核心
  species: human
  gender: female
  age: 30
  occupation: 身份不明
  appearance: 永远穿着一件鲜红色塑料雨衣，兜帽压得很低，只露出苍白尖削的下巴和一小截黑发。雨衣下摆滴着水，脚下却从不留水渍。脸色白得没有血色，眼睛细长，看人时一眨不眨。
  personality: 安静得令人发毛，从不主动开口，被问话时只微笑不答
  voice_tone: 几乎不说话，偶尔开口声音又轻又平，像念台词，句尾习惯性上扬，带着说不清的笑意
  motivation: 带走“不该在这趟车上的人”，维持某种她认定的秩序
  background: 据老周说，多年前那场支线事故里，有个穿红雨衣的女人没能下车。
  arc: 从纯粹的恐怖符号，逐渐显露出执念背后的悲剧底色
