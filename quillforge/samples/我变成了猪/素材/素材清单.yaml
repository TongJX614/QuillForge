assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 陈大志
    - name: 老周
    - name: 周小满
    - name: 阿花
  - type: 场景背景
    scenes:
    - name: 猪圈惊变
      mood: 湿冷、嘈杂、荒诞，带着清晨猪圈特有的泥腥气，远处鸡鸣与铁桶声交织
      details: 清晨的乡村养猪场猪圈，泥地被露水浸得发亮，石棉瓦顶漏下几缕清冷天光，食槽边沿挂着水珠，稻草堆凌乱，远处省道灰白如带，一片撂荒的稻田泛着薄雾，整体色调灰蓝带暖黄
    - name: 对牛弹琴
      mood: 清晨的猪圈雾气未散，泔水酸味与泥腥味交织，铁桶磕碰声和猪叫搅碎了乡村的寂静，荒诞中透着一丝说不清的紧张。
      details: 南方乡村清晨的养猪场，石棉瓦顶的猪舍，水泥栏杆上挂着锈迹斑斑的铁桶，栏内泥地湿滑，食槽边散落菜叶米糠，远处省道灰蒙蒙的，稻田撂荒长满杂草，晨雾贴着地面流动，天光从瓦缝漏下形成斜长的光柱。
    - name: 圈中旧事
      mood: 晨光渐亮，猪圈里弥漫着一种旧事重提后的沉闷与不安，食槽边的苍蝇嗡嗡作响，铁门外脚步声由远及近，悬念收紧。
      details: 南方乡村清晨的猪圈内景，石棉瓦屋顶漏下斜斜的光柱，泥地上有凌乱的蹄印和歪斜的划痕，食槽泛着油光，干草堆散落在角落，远处省道隐约可见，晨雾将散未散。
