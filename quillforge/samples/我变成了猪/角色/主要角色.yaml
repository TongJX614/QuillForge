characters:
- id: char_01
  name: 陈大志
  role: 主角
  species: 猪
  gender: male
  age: 38
  occupation: 原为广告公司创意总监，现为养殖场肉猪
  appearance: 粉白色家猪，体型圆润肥硕，约两百斤，短粗四肢，圆鼻头呈肉粉色，耳朵大而下垂遮住眼侧，背脊有一道浅浅的黑色鬃毛，尾巴短小卷曲，左耳尖有一小块锯齿状缺口，眼神总带着不属于猪的忧郁和机警
  personality: 嘴硬心软，爱说反话，自尊心极强却总在关键时刻妥协
  voice_tone: 满嘴职场黑话和广告术语，口头禅是'这个需求不成立啊'，一着急就发出'哼哼'的鼻音，用词刻薄但尾音常常软下来
  motivation: 想搞清楚自己为什么会变成猪，并赶在出栏日之前变回人
  background: 从农村考出来的凤凰男，拼了二十年才在城市站稳脚跟，却在拿下年度最佳创意的庆功宴上醉倒，醒来发现自己躺在猪圈里
  arc: 从拼命想逃离'猪'的身份，到在猪圈里重新看清自己作为人时错过的亲情与真心
- id: char_02
  name: 老周
  role: 关键配角
  species: human
  gender: male
  age: 62
  occupation: 养猪场场主，陈大志的远房表舅
  appearance: 精瘦黝黑，身高一米七出头，常年穿洗得发白的蓝布工装外套，裤脚总沾着泥，花白寸头，脸上皱纹深如刀刻，左手缺半截小指，总叼着一根没点着的旱烟，笑起来露出一口黄牙
  personality: 嘴碎心善，认死理，装糊涂的本事一流
  voice_tone: 浓重乡音，爱用歇后语，一句话里能塞三个'俺跟你讲'，说到关键处就突然压低声音，最后必带一声'哎——'
  motivation: 守住这间传了三代的养猪场，等在外打工的儿子回来接手
  background: 年轻时也出去闯过，赔光了本钱才回乡养猪，最懂'人这辈子的账算不清'的道理
  arc: 从把陈大志当一头普通肉猪，到隐约察觉这头猪的异样，最终选择相信并帮他
- id: char_03
  name: 周小满
  role: 重要配角
  species: human
  gender: female
  age: 26
  occupation: 兽医，老周的女儿，刚从省城辞职回村
  appearance: 身高一米六八，扎高马尾，几缕碎发总掉在额前，戴圆框金属眼镜，穿墨绿色冲锋衣和牛仔裤，脚踩沾泥的白色板鞋，右手虎口有被动物抓伤留下的浅疤，笑起来左边一颗虎牙特别显眼
  personality: 直率较真，嘴上不饶人，却会为一只瘸腿的小狗蹲在泥地里半宿
  voice_tone: 语速快，爱反问，口头禅是'你确定？'和'这不科学'，急了会连珠炮似的蹦专业术语，对动物说话时声音会自动降八度变温柔
  motivation: 想在村里建一个真正规范的动物诊疗站，证明自己辞职回来不是犯傻
  background: 省农业大学兽医专业毕业，在城里宠物医院干了三年，见多了被抛弃的宠物，一气之下回了老家
  arc: 从只相信检查报告和数据，到愿意为一个无法解释的现象赌上职业判断
- id: char_04
  name: 阿花
  role: 配角/喜剧担当
  species: 猪
  gender: female
  age: 3
  occupation: 养殖场母猪，猪圈里的'情报中心'
  appearance: 黑白花斑家猪，体型比陈大志小一圈，耳朵一只立一只耷，鼻子上有一块圆形的黑斑，右后腿走路微微跛，尾巴卷成两个圈，眼睛又黑又亮，总是一副看热闹不嫌事大的神情
  personality: 八卦成瘾，乐天知命，偶尔一语中的
  voice_tone: 语速慢悠悠，爱打听'你以前是干啥的'，每句话结尾都拖着'呗'字，说到兴头上会忍不住拱对方一下
  motivation: 在出栏前吃好每一顿，顺便把猪圈里所有秘密都打听清楚
  background: 在养殖场出生长大，见过三批猪来来去去，是圈里唯一'活得明白'的猪
  arc: 从只关心吃喝八卦，到成为陈大志在猪圈里第一个真正的朋友
