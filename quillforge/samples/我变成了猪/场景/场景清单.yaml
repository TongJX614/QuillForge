scenes:
- id: scene_01
  name: 猪圈惊变
  location: 老周家养猪场猪圈
  time: 清晨
  atmosphere: 湿冷、嘈杂、荒诞，带着清晨猪圈特有的泥腥气，远处鸡鸣与铁桶声交织
  description: 你是被一阵湿冷的泥腥味呛醒的。稻草扎着你的背，食槽边沿滴着隔夜的泔水，天光从石棉瓦的缝隙里漏下来，照得满圈浮尘乱舞。你下意识想揉眼睛，抬起来的却是一只粉褐色的蹄子。你猛地翻身站起，四只脚在烂泥里打了个趔趄——手没了，脚也没了。你张嘴想骂，喉咙里滚出来的却是一声嘹亮的猪叫。这时，一头黑白花猪慢悠悠踱到你面前，歪着脑袋打量你，眼神里那点看热闹的意思，让你后脊梁一阵发凉。远处铁桶撞着水泥地的声响越来越近，一个苍老的嗓门正拖着长音哼着不知名的小调。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 清晨的乡村养猪场猪圈，泥地被露水浸得发亮，石棉瓦顶漏下几缕清冷天光，食槽边沿挂着水珠，稻草堆凌乱，远处省道灰白如带，一片撂荒的稻田泛着薄雾，整体色调灰蓝带暖黄
- id: scene_02
  name: 对牛弹琴
  location: 老周家养猪场·一号猪栏
  time: 清晨
  atmosphere: 清晨的猪圈雾气未散，泔水酸味与泥腥味交织，铁桶磕碰声和猪叫搅碎了乡村的寂静，荒诞中透着一丝说不清的紧张。
  description: 你顾不上体面了。泔水的酸腐味直冲鼻腔，你却猛地往前一窜，四只蹄子在湿泥里打出一串慌乱的水花，冲着栏杆外那个佝偻的身影扯开嗓子嚎叫。老周手里还拎着铁桶，被你这阵仗惊得往后仰了仰。你急得原地打转，抬起右前蹄拼命往自己胸口戳，又扭头朝自己身上指——指什么？这身皮囊！你恨不得把'我是人'三个字刻在脑门上。老周眯起眼，把桶搁在栏边，慢吞吞地蹲下来，那双被日头晒得浑浊的眼睛里，竟真闪过一丝琢磨的意思。晨雾还没散尽，省道上偶尔碾过一辆货车，声音闷闷的。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 南方乡村清晨的养猪场，石棉瓦顶的猪舍，水泥栏杆上挂着锈迹斑斑的铁桶，栏内泥地湿滑，食槽边散落菜叶米糠，远处省道灰蒙蒙的，稻田撂荒长满杂草，晨雾贴着地面流动，天光从瓦缝漏下形成斜长的光柱。
- id: scene_03
  name: 圈中旧事
  location: 老周家养猪场猪圈
  time: 清晨
  atmosphere: 晨光渐亮，猪圈里弥漫着一种旧事重提后的沉闷与不安，食槽边的苍蝇嗡嗡作响，铁门外脚步声由远及近，悬念收紧。
  description: 老周的背影消失在猪舍拐角，铁门吱呀一声合上，圈里重新安静下来。晨雾被太阳逼退到省道那边，石棉瓦缝隙漏下的光斜斜切过泥地，照亮你方才划拉出的那个歪斜的“周”字，蹄印边缘已经渗出一圈浅浅的水痕。食槽里的泔水泛着隔夜的油光，几只苍蝇绕着槽沿打转。你胸口那股火还没下去，可脑子先冷静了——老周去找周小满了，这是你唯一争取来的变量。你转过头，看向那头黑白花的老猪。她正卧在干草堆上，眼皮半耷拉着，像是把方才那场闹剧全看在眼里，又像是压根没打算掺和。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 南方乡村清晨的猪圈内景，石棉瓦屋顶漏下斜斜的光柱，泥地上有凌乱的蹄印和歪斜的划痕，食槽泛着油光，干草堆散落在角落，远处省道隐约可见，晨雾将散未散。
