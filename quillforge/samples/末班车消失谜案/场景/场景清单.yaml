scenes:
- id: scene_01
  name: 末班车启程
  location: 郊线末班公交车车厢内
  time: 深夜11:40
  atmosphere: 昏黄灯光摇曳不定，引擎低鸣如叹息，车厢里弥漫着潮湿的霉味和某种说不清的压迫感。
  description: 深夜的站台空无一人，末班公交车带着沉闷的引擎声缓缓驶出。你靠窗坐下，车厢里只有零星几个乘客——一个缩在角落的女孩，一个打瞌睡的中年男人，还有一对低声交谈的情侣。灯光昏黄，随着车身轻微晃动，车窗外的路灯一盏一盏向后退去，很快便只剩无边的黑暗。空气里弥漫着一股潮湿的霉味，像是从车厢深处渗出来的。你揉了揉酸涩的眼睛，连续加班的疲惫让你几乎要睡过去。就在这时，公交车靠站停下，车门吱呀打开，又缓缓关上。你下意识扫了一眼车厢——刚才那个打瞌睡的中年男人，不见了。座位上空空荡荡，仿佛从来没有人坐过。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的郊线公交车车厢内部，昏黄顶灯投下摇晃的光影，深蓝色座椅成排延伸，车窗外是浓稠的黑暗与偶尔掠过的模糊树影，车厢地面泛着陈旧的光泽，空气中仿佛凝着一层薄薄的水汽。
