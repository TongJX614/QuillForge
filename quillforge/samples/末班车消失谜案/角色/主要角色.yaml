characters:
- id: char_01
  name: 林悦
  role: 主角
  species: human
  gender: female
  age: 24
  occupation: 加班到深夜的广告公司职员
  appearance: 身高165cm，黑色长发扎成低马尾，穿着米色风衣和深色牛仔裤，面容疲倦但眼神警觉，手里紧握手机。
  personality: 理性冷静，观察力强，责任感重
  voice_tone: 说话简洁，常用反问句，口头禅是“不对劲”
  motivation: 找出乘客消失的真相并活着下车
  background: 连续加班一周，今晚搭末班车回家，却遭遇诡异事件。
  arc: 从恐惧到主动调查，最终揭开真相并拯救剩余乘客。
- id: char_02
  name: 老陈
  role: 配角
  species: human
  gender: male
  age: 52
  occupation: 末班公交车司机
  appearance: 身高175cm，微胖，短发灰白，穿蓝色公交制服，戴老花镜，左手有旧伤疤，表情严肃。
  personality: 沉默寡言，经验丰富，内心愧疚
  voice_tone: 低沉缓慢，常叹气，说话带方言口音
  motivation: 掩盖多年前同一线路的事故真相
  background: 开了二十年末班车，五年前曾发生乘客失踪事件，他知情但从未声张。
  arc: 从隐瞒到坦白，最终帮助林悦阻止悲剧重演。
- id: char_03
  name: 小雅
  role: 配角
  species: human
  gender: female
  age: 17
  occupation: 高中生
  appearance: 身高160cm，齐肩短发，穿校服，背着书包，脸色苍白，眼神惶恐，手里攥着护身符。
  personality: 胆小敏感，但关键时刻勇敢
  voice_tone: 声音颤抖，常用“那个……”，说话断断续续
  motivation: 找到失踪的姐姐（五年前末班车乘客）
  background: 姐姐五年前在这条线路上失踪，她今晚特意来调查。
  arc: 从恐惧到坚强，最终直面真相并释怀。
- id: char_04
  name: 司机老陈（幻影）
  role: 反派
  species: 灵体
  gender: male
  age: 50
  occupation: 五年前事故中死亡的司机
  appearance: 半透明人形轮廓，身穿破旧公交制服，面部模糊，眼睛空洞，周身散发冷气，行动无声。
  personality: 执念深重，怨恨活人，行为机械
  voice_tone: 声音空洞回响，重复“终点站到了”
  motivation: 将所有乘客带往“终点站”以填补自己的孤独
  background: 五年前因疲劳驾驶导致公交车坠河，死后怨念化作幻影，不断在末班车上带走乘客。
  arc: 被林悦和老陈化解执念，最终消散。
