scenes:
- id: scene_01
  name: 雨夜初语
  location: 图书馆旧书区
  time: 深夜
  atmosphere: 雨声与旧纸气味交织的深夜，昏黄台灯只照亮一小片天地，第七排书架安静地站在光与暗的交界处，仿佛在等待被选择。
  description: 雨点密集地敲打着旧书区高窗的玻璃，像无数细小的手指在叩门。闭馆后的图书馆比白天多了一排书架——你确信昨天这里只有六排，现在却分明有七排，那多出来的一排安静地立在昏黄灯光照不到的阴影里，像是刚从雨夜里长出来的一样。你抱着还书车，轮子在木地板上发出轻微的吱呀声，空气里弥漫着旧纸页、皮革封面和一丝若有若无的霉味。正当你踮脚去够最顶层的书脊时，一个文绉绉的声音从书架深处飘出来，尾音拖得又慢又长，仿佛是从三百年前的某个下午寄来的。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的图书馆旧书区，高窗外大雨滂沱，密集的雨痕划过玻璃，昏黄的台灯照亮一小片木质地板和几排高大的深色书架，书架向暗处延伸，最深处多出一排若隐若现的书架轮廓，空气中有漂浮的微尘，旧纸与皮革封面在暖光下泛着柔和的光泽。
