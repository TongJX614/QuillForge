  - type: 场景背景
    scenes:
    - name: 雨夜初语
      mood: 雨声与旧纸气味交织的深夜，昏黄台灯只照亮一小片天地，第七排书架安静地站在光与暗的交界处，仿佛在等待被选择。
      details: 深夜的图书馆旧书区，高窗外大雨滂沱，密集的雨痕划过玻璃，昏黄的台灯照亮一小片木质地板和几排高大的深色书架，书架向暗处延伸，最深处多出一排若隐若现的书架轮廓，空气中有漂浮的微尘，旧纸与皮革封面在暖光下泛着柔和的光泽。
