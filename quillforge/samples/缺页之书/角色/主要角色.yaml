characters:
- id: char_01
  name: 墨言
  role: 主角（会说话的书）
  species: 书灵（一本皮革封面的古籍）
  gender: male
  age: 312
  occupation: 被遗忘的典籍
  appearance: 一本厚重的深棕色皮革封面古书，四角包着氧化发黑的铜皮，书脊上有三道褪色的金线，封面中央烫印着一个模糊的圆形徽记。书页边缘泛黄卷曲，内页偶尔闪过微弱的银蓝色光泽，翻动时会发出沙沙的轻响。
  personality: 博学但健忘、固执、嘴硬心软
  voice_tone: 说话文绉绉的，爱用书面语和古谚，紧张时会结巴，口头禅是“容我翻翻……”，称对方为“小友”。
  motivation: 找回散落在图书馆各处的三页丢失章节，拼回完整的自己。
  background: 三百年前由一位无名装帧师制成，曾被无数人翻阅批注，后来被遗忘在图书馆最深的角落，渐渐有了灵识。
  arc: 从执念于“完整”到接受残缺也是自己的一部分。
- id: char_02
  name: 林知夏
  role: 主角（人类读者）
  species: human
  gender: female
  age: 22
  occupation: 图书馆夜班管理员（兼职）
  appearance: 偏瘦的年轻女性，齐肩黑发常扎成低马尾，戴一副圆框细边眼镜，穿深绿色针织开衫和白色帆布鞋，口袋里总揣着一支铅笔。
  personality: 好奇心旺盛、行动力强、有点冒失
  voice_tone: 语气轻快，爱用“诶？”“真的假的？”，兴奋时语速变快，自言自语时会小声嘀咕。
  motivation: 想弄清楚这本怪书的来历，也怕它吵醒整栋楼。
  background: 大学文学系学生，为了赚生活费接下图书馆夜班，从小就喜欢在旧书里找前人留下的笔记。
  arc: 从把书灵当作麻烦到真心把它当作朋友，学会倾听沉默之物。
- id: char_03
  name: 灰伯
  role: 配角（图书馆老猫）
  species: 猫
  gender: male
  age: 11
  occupation: 图书馆捕鼠官
  appearance: 一只体型偏胖的英国短毛猫，蓝灰色短毛，胸口有一撮白毛，左耳缺了一小块，琥珀色眼睛半睁半闭，尾巴粗短，走路慢悠悠的。
  personality: 慵懒、毒舌、暗中观察一切
  voice_tone: 低沉沙哑，说话慢吞吞，爱用反问句，口头禅是“喵的……”，从不称呼对方名字，一律叫“喂”。
  motivation: 守护图书馆的安宁，顺便找个暖和的地方睡觉。
  background: 在图书馆出生，比任何管理员都熟悉这里的每一个角落和每一本不寻常的书。
  arc: 从冷眼旁观到在关键时刻给出决定性提示。
