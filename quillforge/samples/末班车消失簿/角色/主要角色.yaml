characters:
- id: char_01
  name: 黎晚
  role: 主角
  species: human
  gender: female
  age: 26
  occupation: 夜班护士
  appearance: 身高165cm，身形偏瘦，黑色长直发随意扎成低马尾，几缕碎发垂在颊边。常穿浅灰色连帽卫衣和牛仔裤，背一个洗得发白的帆布包，眼下有长期熬夜留下的淡青黑眼圈，手指关节处贴着一块创可贴。
  personality: 冷静观察型、习惯性照顾他人、对细节敏感
  voice_tone: 语速偏慢，常用短句确认事实，口头禅是“等一下，你刚才说什么？”紧张时会压低声音数数让自己镇定。
  motivation: 找到从末班车上消失的乘客并带他们回来。
  background: 连续值了三个大夜班，今晚是唯一能早回家的日子，却在末班车上目睹邻座老人凭空消失。
  arc: 从只想自保的旁观者，成长为主动串联线索、守护同伴的召集人。
- id: char_02
  name: 老周
  role: 配角/关键知情人
  species: human
  gender: male
  age: 58
  occupation: 公交公司退休调度员
  appearance: 身高172cm，微驼背，花白寸头，脸膛黑红，穿一件洗得发亮的深蓝公交制服外套，左胸别着褪色的工号牌，手里永远攥着一个掉漆的保温杯，右手小指缺了一截。
  personality: 固执话多、嘴硬心软、对公交系统有执念
  voice_tone: 嗓门大，爱用调度术语，口头禅是“这条线我跑了三十年，我还不晓得？”说到关键处会突然压低声音。
  motivation: 弄清三十年前那班失踪公交的真相，给自己一个交代。
  background: 三十年前他当班调度的那趟末班车连人带车消失，只有他因临时换班躲过一劫，从此再没离开过这条线路。
  arc: 从用经验吓唬人的老顽固，变成愿意承认自己也不知道答案、与年轻人并肩查下去的长辈。
- id: char_03
  name: 阿澈
  role: 配角/神秘少年
  species: human
  gender: male
  age: 17
  occupation: 高中生（夜校）
  appearance: 身高178cm，瘦高，黑色短碎发，皮肤偏白，穿一件明显大一号的黑色校服外套，拉链拉到顶，耳朵里塞着有线耳机，书包侧袋插着一本卷边的速写本，手腕上系着红绳。
  personality: 沉默寡言、观察力极强、用画画代替说话
  voice_tone: 几乎不主动开口，被问急了才蹦几个字，声音很轻，习惯用“嗯”“不知道”“画下来了”回应。
  motivation: 找到每晚在末班车最后一排画画时见到的那个“不存在的人”。
  background: 每晚坐末班车去夜校，最近发现速写本上会自动多出他从未画过的乘客肖像，而那些人第二天就不在车上了。
  arc: 从把自己封闭在耳机和画本里，到主动把画本交给同伴、用画面帮助大家拼出消失规律。
- id: char_04
  name: 芳姨
  role: 配角/情绪锚点
  species: human
  gender: female
  age: 49
  occupation: 夜市摊主
  appearance: 身高158cm，体态圆润，短发烫成小卷，穿枣红色碎花罩衫和黑色布裤，斜挎一个鼓鼓的腰包，手腕上套着七八个彩色发圈，身上有淡淡的葱油饼味道。
  personality: 热心肠、爱张罗、嘴快但心细
  voice_tone: 语速快，嗓门亮，爱叫人“闺女”“小伙子”，紧张时反而更爱说话，用絮叨掩饰害怕。
  motivation: 平平安安收摊回家，给上大学的女儿攒够下个月生活费。
  background: 每天收摊后坐末班车回城郊的家，今晚车上人少得反常，她第一个发现有人不见了。
  arc: 从靠不停说话壮胆的普通乘客，到关键时刻第一个站出来清点人数、不让任何人被落下的主心骨。
