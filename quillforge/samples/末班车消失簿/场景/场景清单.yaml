  narrative_notes: 深夜公交车厢内部，昏黄顶灯只亮半数，空荡的深蓝色座椅排列整齐，中门紧闭，车窗外的城市霓虹被拉成模糊光带，地面散落一只塑料袋和几样杂物，过道尽头光线暗淡
