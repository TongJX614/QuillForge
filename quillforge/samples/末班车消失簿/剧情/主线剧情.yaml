main_plot:
  summary: 夜班护士黎晚在末班车上目睹乘客接连消失，她联合退休调度员老周、沉默少年阿澈和热心摊主芳姨，从遗留物和速写本里拼出消失规律，在终点站前阻止最后一人消失。
  themes:
  - 记忆与存在
  - 陌生人的善意
  - 面对未知时的选择
  core_conflict: 车上的人必须在彼此记忆被抹去之前，找出让乘客消失的源头，否则下一个消失的就是自己。
  stages:
  - name: 空座上的外套
    goal: ''
