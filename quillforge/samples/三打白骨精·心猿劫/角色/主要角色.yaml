characters:
- id: char_01
  name: 孙悟空
  role: 主角
  species: 猴妖（灵明石猴）
  gender: male
  age: 1200
  occupation: 西天取经护法行者
  appearance: 通体金棕色短毛，毛发在阳光下泛着琥珀光泽；身形精瘦矫健，四肢修长有力，指节粗大；面部猴相明显，雷公嘴、凹脸尖腮，一双火眼金睛呈熔金色，瞳仁竖立如针；头顶一圈金箍嵌入皮毛，耳后两撮长毫毛翘起；身穿褪色虎皮短裙，腰系粗麻绳，赤足，脚踝有猴毛覆盖；尾长而灵活，尾尖微卷。
  personality: 桀骜刚烈、急躁护短、重情重义
  voice_tone: 语速快，声调高扬，爱用“俺老孙”自称，骂人时连珠炮般不歇气，急了会抓耳挠腮地重复“打杀！打杀！”，对师父说话时又刻意压低嗓门带哄劝口吻。
  motivation: 保护唐僧安全抵达西天，以证自己改邪归正的真心。
  background: 五百年前大闹天宫的齐天大圣，被压五行山后受观音点化，保唐僧取经以求正果。
  arc: 从凭本能降妖到学会收敛锋芒，最终在紧箍咒的剧痛与师父的绝情中，仍选择最后一次出手除妖。
- id: char_02
  name: 唐僧
  role: 核心配角
  species: human
  gender: male
  age: 32
  occupation: 取经僧
  appearance: 身材修长清瘦，面皮白净，眉目慈和却常带忧色；剃度光头，头顶有细密戒疤；身穿洗得发白的灰色僧袍，外披褪色红袈裟，颈挂一串木质念珠；手持九环锡杖，锡杖环扣已磨得发亮；足蹬麻编草鞋，行囊斜挎。
  personality: 慈悲迂执、耳根偏软、信念坚定
  voice_tone: 语速缓慢，声调平和温吞，常先念“阿弥陀佛”再开口，训斥悟空时用“你这泼猴”起头，语气从温和渐变严厉，说理时爱引佛经原句。
  motivation: 以慈悲度化众生，不愿错杀一个好人，哪怕冒自己性命之险。
  background: 金蝉子转世，十世修行的好人，因肉眼凡胎不识妖邪，屡次错怪大徒弟。
  arc: 从坚信“眼见为实”到在悔恨中动摇，最终明白慈悲需有锋芒。
- id: char_03
  name: 白骨精
  role: 反派
  species: 白骨精（尸魔）
  gender: female
  age: 800
  occupation: 盘踞白虎岭的千年尸魔
  appearance: 本相为一具莹白如玉的骷髅，骨骼表面布满细密裂纹，缝隙中渗出幽绿磷光；眼眶空洞深处两点鬼火跳动，下颌骨开合时咔咔作响；无皮无肉，关节处由灰黑雾气粘连；可化人形时变为身穿素白衣裙的村妇，面色苍白如纸，唇色乌青，眼神闪烁不定，走路时裙摆下不见双脚。
  personality: 阴险狡诈、善于伪装、睚眦必报
  voice_tone: 化人形时声音柔糯甜腻，尾音拖长带颤，爱用“长老”“师父”等亲昵称呼；本相发声时如碎骨摩擦，一字一顿，阴冷刺耳；被识破时会突然尖笑，笑声忽高忽低。
  motivation: 吃掉唐僧肉以求长生不老，并报复孙悟空屡次坏她好事。
  background: 白虎岭上一具千年枯骨吸日月精华成精，最擅长剖人皮囊披在身上伪装。
  arc: 从自信伪装天衣无缝到狗急跳墙现出本相，最终在第三棒下灰飞烟灭。
- id: char_04
  name: 猪八戒
  role: 配角
  species: 猪妖
  gender: male
  age: 600
  occupation: 取经僧·二徒弟
  appearance: 体型肥硕圆滚，肚皮几乎垂到膝盖；皮肤呈灰粉色，鬃毛粗硬乌黑，从头顶直延伸到后背；长鼻大耳，鼻孔外翻，一对招风耳耷拉到肩头；獠牙外露但已磨钝发黄；身穿青布直裰，领口绷得紧紧的，肚腩处扣子总系不上；脚蹬大号草鞋，脚趾粗短如蒜。
  personality: 贪吃懒做、爱挑拨、关键时刻却不出力
  voice_tone: 瓮声瓮气，说话爱拖长调，常用“哎哟喂”开头，抱怨时絮絮叨叨，挑拨时压低声音凑近人耳边说，被拆穿就装傻嘿嘿笑。
  motivation: 混完取经路混个正果，最好一路有吃有喝不出力。
  background: 原天蓬元帅，因调戏嫦娥被贬下界错投猪胎，在高老庄被收服后随行。
  arc: 从煽风点火看热闹到师父赶走大师兄后独自面对妖怪时，第一次尝到后悔的滋味。
