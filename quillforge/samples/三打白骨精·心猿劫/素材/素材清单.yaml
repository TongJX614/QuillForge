assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 孙悟空
    - name: 唐僧
    - name: 白骨精
    - name: 猪八戒
  - type: 场景背景
    scenes:
    - name: 白虎岭·画圈之疑
      mood: 阴风压日，山岚如浊纱，看似晴明却透骨生寒
      details: 正午时分却天色昏黄的白虎岭山道，两侧枯松怪石嶙峋，山岚如灰白色浊纱缠绕山腰，一条黄土小径蜿蜒向上，路面散落碎石与枯骨状的白色树根，远处山坳间隐约可见几缕不自然的炊烟，阳光被阴云滤成惨淡的冷白色，投下稀疏而锐利的阴影，山风卷起细尘，气氛压抑荒凉
    - name: 白虎岭·篮外之变
      mood: 惨白日光下暗藏阴气，甜香中混着若有若无的土腥，圈内圈外一线之隔却如隔阴阳
      details: 荒凉山道旁一块青石，地上有一圈浅淡的焦痕围成圆形，圈外三步处放着一只竹篮，白布半揭开，热气袅袅升腾。远处山坳雾气沉沉，枯树歪斜，惨白日光透过灰蒙蒙的天幕洒下，地面阴影短而浓重，四周寂静无声，只有山风卷起细尘。
    - name: 白虎岭·白布之下
      mood: 死寂般的对峙，山风凝滞，日光惨白如纸，空气中弥漫着令人窒息的紧绷感
      details: 惨白日光下的荒凉山道，枯草僵立不动，地面一道焦黑的圆圈痕迹，圈外三步处放着一只竹篮，白布半垂，热气袅袅升腾，远处山石嶙峋如兽脊，天空无云却泛着不正常的灰白色
