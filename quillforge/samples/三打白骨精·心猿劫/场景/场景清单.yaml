scenes:
- id: scene_01
  name: 白虎岭·画圈之疑
  location: 白虎岭山道
  time: 正午
  atmosphere: 阴风压日，山岚如浊纱，看似晴明却透骨生寒
  description: 正午的白虎岭却没有半分正午的暖意。你站在山道上，只觉得那太阳像是被什么东西滤过了一层，惨白惨白的，照在身上也生不出热气。八戒正瘫坐在一块青石上哼哼唧唧，沙僧默默卸下担子擦汗。悟空从耳朵里捻出金箍棒，往地上重重一杵，画了个圈，火星四溅。他叮嘱的话音还没散尽，人已经腾云去了。你望着他消失的方向，又低头看看脚下那道浅浅的圈痕——圈外的风忽然软了下来，山坳深处，一个挎着竹篮的身影正袅袅走来，篮上盖着的白布被热气顶得一鼓一鼓，甜腻的麦香顺着风飘过来。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 正午时分却天色昏黄的白虎岭山道，两侧枯松怪石嶙峋，山岚如灰白色浊纱缠绕山腰，一条黄土小径蜿蜒向上，路面散落碎石与枯骨状的白色树根，远处山坳间隐约可见几缕不自然的炊烟，阳光被阴云滤成惨淡的冷白色，投下稀疏而锐利的阴影，山风卷起细尘，气氛压抑荒凉
- id: scene_02
  name: 白虎岭·篮外之变
  location: 白虎岭山道，悟空所画圆圈边缘
  time: 正午偏后
  atmosphere: 惨白日光下暗藏阴气，甜香中混着若有若无的土腥，圈内圈外一线之隔却如隔阴阳
  description: 你终究还是开了口，劝师父接下这份善缘，只让那村妇把篮子搁在圈外。唐僧迟疑片刻，到底点了头。素衣村妇笑盈盈地应了声好，弯下腰，将竹篮轻轻放在那道焦痕之外三步远的地方，白布一角垂落在地，热气仍在往外冒。八戒咽了口唾沫，眼睛直勾勾盯着篮子，脚底下像生了根。山风忽然停了，连枯草都不再晃动。你注意到那村妇直起身时，袖口滑落，露出一截手腕——白得不像活人，像是浸久了的纸。她却浑然不觉似的，仍在笑，笑得眉眼弯弯，只是那笑意，怎么也不到眼底去。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 荒凉山道旁一块青石，地上有一圈浅淡的焦痕围成圆形，圈外三步处放着一只竹篮，白布半揭开，热气袅袅升腾。远处山坳雾气沉沉，枯树歪斜，惨白日光透过灰蒙蒙的天幕洒下，地面阴影短而浓重，四周寂静无声，只有山风卷起细尘。
- id: scene_03
  name: 白虎岭·白布之下
  location: 白虎岭山道，焦痕圆圈旁
  time: 正午
  atmosphere: 死寂般的对峙，山风凝滞，日光惨白如纸，空气中弥漫着令人窒息的紧绷感
  description: 你强压下胸中翻涌的怒火，退开两步，将金箍棒往地上一拄，不再言语。唐僧见你退让，神色稍缓，整了整袈裟，缓步走向那只竹篮。山道上静得能听见自己的心跳。那村妇仍跌坐在地，袖掩着脸，肩头一颤一颤的。八戒伸长脖子，眼睛在篮子和唐僧之间来回打转。唐僧蹲下身，双手合十低诵了一声佛号，才伸手去掀那白布一角。你的火眼金睛早已看透布下之物，却咬紧了牙关不出声——这一回，让师父自己看个明白。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 惨白日光下的荒凉山道，枯草僵立不动，地面一道焦黑的圆圈痕迹，圈外三步处放着一只竹篮，白布半垂，热气袅袅升腾，远处山石嶙峋如兽脊，天空无云却泛着不正常的灰白色
