characters:
- id: char_01
  name: 陈建国
  role: 主角
  gender: male
  age: 62
  occupation: 退休刑警
  appearance: 身高175cm，体型健硕但不臃肿；花白短发，国字脸，左眉梢有一道旧伤疤；常穿深灰色夹克、黑裤、旧皮鞋，脖子上挂着一枚褪色的警哨
  personality: 沉稳、敏锐、外冷内热
  voice_tone: 低沉平缓，偶尔透出不容置疑的威严
  motivation: 即便已退休，仍无法对求救视而不见
  background: 当了35年刑警，破案无数，十年前妻子病逝后与女儿相依为命，最怕过年时冷清的饭桌
  arc: 从刻意隐藏自己的警察身份到坦然接受内心正义
- id: char_02
  name: 杨小璐
  role: 配角
  gender: female
  age: 28
  occupation: 派出所民警
  appearance: 身高163cm，身形偏瘦；黑色马尾辫，戴一副黑框眼镜，脸上偶尔挂着一丝青涩；穿着笔挺的冬执勤服，腰间挂着执法记录仪和对讲机
  personality: 认真、容易紧张、但责任感强
  voice_tone: 语速稍快，略带稚气，但努力保持专业
  motivation: 这是她独立处理的第一起案件，绝不能搞砸
  background: 警校毕业刚两年，分配到老城区派出所，除夕夜值班，一直想证明自己
  arc: 从依赖老警察的经验到学会自己的判断
- id: char_03
  name: 苏薇
  role: 配角
  gender: female
  age: 35
  occupation: 超市收银员
  appearance: 身高160cm，微胖，圆脸；黑色短发用发夹别在耳后，穿超市红色工作服，外面套一件旧羽绒服，手指甲缝里还有洗不掉的油墨印
  personality: 焦急、温柔、坚强
  voice_tone: 略带哭腔，说话急促且声音发颤
  motivation: 她的儿子就是一切，必须找到他
  background: 单亲妈妈，独自抚养6岁的儿子，春节还要上班，把孩子托给邻居帮忙照看，结果孩子自己跑出来玩失踪
  arc: 从无助崩溃到重燃希望
- id: char_04
  name: 孙大勇
  role: 反派
  gender: male
  age: 45
  occupation: 超市保安
  appearance: 身高178cm，身材壮实，略微驼背；板寸头，右颈有一块青色胎记；穿超市深蓝色保安服，袖口磨损发白，腰间挂着一串钥匙和橡胶棍
  personality: 阴沉、暴躁、表面装老实
  voice_tone: 粗哑低沉，说话时眼神闪烁
  motivation: 为了还赌债，企图利用孩子勒索家属
  background: 曾是小区保安，因赌博被开除，靠关系在超市混了个夜班，对周围环境极为熟悉
  arc: 从自以为天衣无缝到被揭穿后的疯狂
