  - type: 场景背景
    scenes:
    - name: 除夕的警铃
      mood: 热闹的节日氛围中隐隐透出紧张与不安
      details: 除夕下午的老城区街角，夕阳斜照在挂满红灯笼的骑楼下，一家杂货店门口站着一位穿旧警服的老人和一个气喘吁吁的年轻女警。门楣的春联红得刺眼，远处庙会的人潮和糖葫芦摊构成温暖背景。画面色调偏暖，但女警焦急的表情与老人沉稳的眼神形成戏剧紧张感。
    - name: 庙会入口的承诺
      mood: 人潮涌动中透着紧迫与不安，春节的喧嚣与失踪的焦虑交织成一张无形的网
      details: 除夕下午的庙会入口，大红灯笼挂在古色古香的牌楼两侧，人流如织，小孩举着糖葫芦和气球穿行其间。左边石狮旁站着一个神情焦虑的红衣女人和一个穿警服的年轻女警，远处一条老巷子隐在阴影中，形成鲜明对比。暮色渐沉，空气中带着一股火药味和饭菜香。
