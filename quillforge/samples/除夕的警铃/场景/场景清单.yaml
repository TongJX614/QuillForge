scenes:
- id: scene_01
  name: 除夕的警铃
  location: 老城区街角的杂货店
  time: 除夕下午三点
  atmosphere: 热闹的节日氛围中隐隐透出紧张与不安
  description: 除夕的老城区像一锅煮沸的饺子——红灯笼挂满骑楼廊柱，春联的墨香混着炸丸子的油味弥漫在空气里。远处庙会的电子鞭炮声噼里啪啦地炸响，孩子们举着糖葫芦在人缝里钻来钻去。你正坐在自家杂货店柜台后面，电视里春晚彩排的笑声和你手里的账本一样，让人提不起兴致。门口那盏掉漆的警灯——你当了三十年刑警留下的纪念——在斜阳里投下斑驳的影子。突然，一阵急促的脚步声打碎了午后慵懒的节拍，一个穿警服的年轻姑娘冲进门，额头上汗珠闪闪发光，她举起手机时手指在发抖。你下意识地把老花镜往上推了推，心里咯噔一下：这种眼神，你见过太多次了。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 除夕下午的老城区街角，夕阳斜照在挂满红灯笼的骑楼下，一家杂货店门口站着一位穿旧警服的老人和一个气喘吁吁的年轻女警。门楣的春联红得刺眼，远处庙会的人潮和糖葫芦摊构成温暖背景。画面色调偏暖，但女警焦急的表情与老人沉稳的眼神形成戏剧紧张感。
- id: scene_02
  name: 庙会入口的承诺
  location: 老城区庙会入口
  time: 除夕下午3点20分
  atmosphere: 人潮涌动中透着紧迫与不安，春节的喧嚣与失踪的焦虑交织成一张无形的网
  description: 你快步穿过拥挤的庙会街，红灯笼在头顶晃动，糖葫芦摊主的吆喝声被一阵急救车的警笛声撕开。你在庙会入口的石狮旁找到了那个女人——一个三十出头的母亲，穿着洗得发白的羽绒服，头发被风吹得凌乱，正死死攥着一张皱巴巴的照片。她抬头看见你走近，眼眶已经红肿得不像话，却还在拼命控制着情绪。旁边站着一个年轻的便衣女警，手拿对讲机，神情紧张得像是踩在钢丝上。她的目光在你身上停了一瞬，随即认出了你脸上的皱纹和那身褪色的皮夹克——这个老城区谁都认识你，退休的老刑警陈建国。人群在你们身边流动，没有人注意到这个角落里正在酝酿的风暴。你深吸一口气，走进了这场迟早要面对的对峙。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 除夕下午的庙会入口，大红灯笼挂在古色古香的牌楼两侧，人流如织，小孩举着糖葫芦和气球穿行其间。左边石狮旁站着一个神情焦虑的红衣女人和一个穿警服的年轻女警，远处一条老巷子隐在阴影中，形成鲜明对比。暮色渐沉，空气中带着一股火药味和饭菜香。
