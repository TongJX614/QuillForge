assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 林小满
    - name: 陈屿
    - name: 林建国
    - name: 周敏
  - type: 场景背景
    scenes:
    - name: 花盆下的信
      mood: 梅雨季的闷热与潮湿交织，天光将暗未暗，晾晒的床单在风里缓慢翻动，像某种无声的招手。
      details: 南方小城老小区天台，水泥地面泛着潮气，几根锈迹斑斑的铁丝晾衣绳横跨半空，挂着褪色的床单和旧衣物。角落堆着废弃花盆、破藤椅和发霉的纸箱，墙根爬满青苔。远处是密密麻麻的老楼屋顶，天空是梅雨季特有的灰白，云层低垂，楼下一盏路灯刚刚亮起，昏黄的光晕在湿气里晕开。
    - name: 信纸上的空白
      mood: 梅雨季的闷热与潮湿交织，天光正在一寸寸退去，晾衣绳上的旧床单被风吹得猎猎作响，像某种不安的预兆
      details: 南方老小区天台，傍晚时分，天空是压抑的铅灰色，远处有低垂的雨云。地面是年代久远的水泥地，布满裂缝和青苔，西南角堆着几个废弃的陶土花盆，盆沿破损，泥土干裂。一道锈迹斑斑的铁栏杆围住天台边缘，栏杆上挂着几件被遗忘的旧衣物，在风里晃动。墙角有一盏声控灯，灯泡发黄，尚未亮起。整体光线昏暗，阴影浓重，空气里弥漫着潮湿的霉味。
    - name: 米缸底下的存折
      mood: 昏暗、潮湿，带着米糠和陈旧木柜的气味，窗外雨声渐密
      details: 老式厨房，墙壁贴着泛黄的瓷砖，一盏白炽灯泡发出昏黄的光。角落立着一个半人高的旧陶米缸，木盖子边缘有磨损痕迹。灶台上搁着搪瓷盆，窗玻璃蒙着水雾，外面是连绵的雨幕和模糊的楼房轮廓。地面铺着老式花砖，有几处裂纹。
