scenes:
- id: scene_01
  name: 花盆下的信
  location: 老旧小区天台
  time: 傍晚
  atmosphere: 梅雨季的闷热与潮湿交织，天光将暗未暗，晾晒的床单在风里缓慢翻动，像某种无声的招手。
  description: 天台的铁门半掩着，发出被风吹动的吱呀声。你蹲在西南角的废弃花盆堆前，手指沾满湿泥，正在翻找能卖废品的旧铁皮。空气里是梅雨季特有的霉味，混着楼下谁家煮饭的油烟。一只旧花盆底下压着什么——你抽出来，是个受潮泛黄的信封，边角被水渍洇开，但上面那行字你一眼就认了出来：母亲的字迹。楼下传来出租车发动机的低响，父亲的车。你捏着信封，指尖发凉。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 南方小城老小区天台，水泥地面泛着潮气，几根锈迹斑斑的铁丝晾衣绳横跨半空，挂着褪色的床单和旧衣物。角落堆着废弃花盆、破藤椅和发霉的纸箱，墙根爬满青苔。远处是密密麻麻的老楼屋顶，天空是梅雨季特有的灰白，云层低垂，楼下一盏路灯刚刚亮起，昏黄的光晕在湿气里晕开。
- id: scene_02
  name: 信纸上的空白
  location: 老小区天台西南角
  time: 傍晚，天色将暗未暗
  atmosphere: 梅雨季的闷热与潮湿交织，天光正在一寸寸退去，晾衣绳上的旧床单被风吹得猎猎作响，像某种不安的预兆
  description: 铁门在父亲身后合上，脚步声沿着楼梯一层层往下，最终被雨前的闷风吞没。你蹲回花盆旁，把信封放在膝盖上，深吸了一口气。封口没有粘死，只是折了两折，像是匆忙间塞进去的。你的手指有些抖，拆了两次才把信纸抽出来。纸很薄，受潮后发软，边缘起了毛。你展开它，目光从头扫到尾，又从尾扫到头，反复了三遍。信上只有两行字，第一行是母亲的名字和日期，第二行是“存折在米缸底下，密码是你生日”。没有遗言，没有解释，没有一句告别。你盯着那两行字，脑子里嗡嗡作响。这不是遗书。这更像一张匆忙写下的便条。可为什么，它会被压在天台的花盆底下？
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 南方老小区天台，傍晚时分，天空是压抑的铅灰色，远处有低垂的雨云。地面是年代久远的水泥地，布满裂缝和青苔，西南角堆着几个废弃的陶土花盆，盆沿破损，泥土干裂。一道锈迹斑斑的铁栏杆围住天台边缘，栏杆上挂着几件被遗忘的旧衣物，在风里晃动。墙角有一盏声控灯，灯泡发黄，尚未亮起。整体光线昏暗，阴影浓重，空气里弥漫着潮湿的霉味。
- id: scene_03
  name: 米缸底下的存折
  location: 老小区家中厨房
  time: 傍晚
  atmosphere: 昏暗、潮湿，带着米糠和陈旧木柜的气味，窗外雨声渐密
  description: 你几乎是跑下楼的，楼梯间的声控灯一层层被你踩亮又一层层暗下去。推开家门时，厨房里的白炽灯还亮着，父亲显然刚走不久，灶台上的一碗剩菜还冒着最后一点热气。你径直走向角落那个半人高的旧陶米缸，木盖子沉甸甸的，掀开时扬起一层细白的米糠。缸里的米只剩不到三分之一，你把手探进去，指尖触到冰凉的陶壁，一路往下摸——米粒钻进袖口，痒得难受。缸底，你的指腹碰到一个硬邦邦的塑料封皮。你把它抽出来，一本老式存折，封皮上沾着米粒和一层薄灰。窗外雨声忽然大了，噼里啪啦敲在玻璃上。你翻开存折，手停在半空。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 老式厨房，墙壁贴着泛黄的瓷砖，一盏白炽灯泡发出昏黄的光。角落立着一个半人高的旧陶米缸，木盖子边缘有磨损痕迹。灶台上搁着搪瓷盆，窗玻璃蒙着水雾，外面是连绵的雨幕和模糊的楼房轮廓。地面铺着老式花砖，有几处裂纹。
