characters:
- id: char_01
  name: 林小满
  role: 主角
  species: human
  gender: female
  age: 18
  occupation: 高三学生，喜欢摄影
  appearance: 身高165cm，清瘦，齐肩黑发常扎成低马尾，额前碎刘海。常穿洗旧的白色校服衬衫，搭配深蓝百褶裙和帆布鞋，脖子上挂着一台旧胶片相机。眼神倔强，嘴角习惯性抿紧。
  personality: 执拗、敏感、行动力强
  voice_tone: 说话直接，常用反问句，紧张时会压低声音反复确认细节，口头禅是“不对，肯定有问题”。
  motivation: 查清母亲三年前坠楼身亡的真相，证明那不是自杀。
  background: 母亲三年前从同一栋楼的天台坠亡，警方以自杀结案。小满一直无法接受，与父亲关系疏远。
  arc: 从偏执追查真相，到学会面对失去，最终理解母亲的选择并重新连接家人。
- id: char_02
  name: 陈屿
  role: 配角/关键盟友
  species: human
  gender: male
  age: 19
  occupation: 大一休学生，曾住同小区
  appearance: 身高178cm，偏瘦，黑色自然卷短发，戴细框圆眼镜。常穿褪色连帽卫衣和工装裤，背一个旧邮差包。手指修长，习惯转笔。
  personality: 温和、细致、有轻微社恐但观察力极强
  voice_tone: 语速偏慢，喜欢用“嗯……让我想想”开头，很少用感叹号，回答问题时先整理逻辑再开口。
  motivation: 当年目击过一些细节但未敢作证，想弥补愧疚。
  background: 三年前母亲坠楼那晚，他在对面楼阳台无意中看到天台有人影，但没看清脸，警方未采信他的模糊证词。
  arc: 从回避过去，到勇敢说出自己的目击，帮助小满拼出真相。
- id: char_03
  name: 林建国
  role: 配角/父亲
  species: human
  gender: male
  age: 47
  occupation: 出租车夜班司机
  appearance: 身高172cm，微胖，短发花白，脸上有常年熬夜的疲惫纹路。常穿深灰夹克和旧牛仔裤，手上有老茧。习惯皱眉，眼神闪躲。
  personality: 沉默寡言、回避冲突、内心自责
  voice_tone: 话极少，常用单字回答，被追问时会提高音量说“别问了”，但说完会立刻后悔地叹气。
  motivation: 保护女儿不再受伤害，同时隐瞒自己当年的懦弱。
  background: 妻子去世后独自抚养女儿，三年前因工作未接妻子最后一通电话，一直自责并逃避谈论此事。
  arc: 从用沉默筑墙，到终于向女儿坦白自己的懦弱与爱。
- id: char_04
  name: 周敏
  role: 配角/母亲（回忆中）
  species: human
  gender: female
  age: 42
  occupation: 社区图书馆管理员
  appearance: 身高160cm，圆脸，长发披肩，常穿米色针织开衫和碎花长裙，手腕上戴着一只旧银镯。笑容温柔，眼角有细纹。
  personality: 隐忍、体贴、习惯独自扛事
  voice_tone: 说话轻声细语，喜欢用“没事的”安慰别人，被追问时会把话题转到对方身上。
  motivation: 不想让家人担心，独自面对当时的经济困境和健康问题。
  background: 三年前被诊断出重病，同时家里因投资失败欠债，她选择瞒着家人独自处理。
  arc: 通过遗书和回忆碎片，逐渐呈现一个“选择沉默的爱”的完整形象。
