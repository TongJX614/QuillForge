characters:
- id: char_01
  name: 沈默
  role: 主角（驿卒）
  species: human
  gender: male
  age: 34
  occupation: 荒郊驿站驿卒
  appearance: 中等身材，偏瘦但筋骨结实，肤色黝黑，脸有风霜纹路。短硬黑发，眼神沉静。穿洗得发白的灰蓝驿卒短袄，袖口磨出毛边，腰系旧革带，别一把铜钥匙。常提一盏油纸灯笼。
  personality: 寡言谨慎、善良有原则、擅长观察
  voice_tone: 话少，多用短句，声音低沉平稳。紧张时会轻咳一声再开口。
  motivation: 守住驿站规矩，护住每一个叩门的人。
  background: 曾是县城捕快，因一桩旧案心灰意冷，自请调至荒郊驿站，独守十年。
  arc: 从封闭自保到重新为他人冒险，直面旧日阴影。
- id: char_02
  name: 凌霜
  role: 女主角（求宿女侠）
  species: human
  gender: female
  age: 26
  occupation: 游侠
  appearance: 身形高挑清瘦，湿发贴颊，黑发束高马尾。面容清冷，左眉一道浅疤，嘴唇发白。身穿深青劲装，外罩半旧油布斗篷，雨水沿衣角滴落。右手紧抱一把带鞘长刀，刀尖凝着暗红血迹。
  personality: 冷厉果决、戒备心重、内心尚有柔软
  voice_tone: 语气短促清冷，多用命令式。道谢时别开脸，声音放低。
  motivation: 查明师父死因，手刃真凶。
  background: 自幼被师父收养习武，师父三日前死于密室，她成为最大嫌疑，带着师父的刀逃亡。
  arc: 从孤身复仇到学会信任，放下刀锋，面对真相。
- id: char_03
  name: 老周
  role: 配角（追踪者/前同僚）
  species: human
  gender: male
  age: 58
  occupation: 县衙老捕头
  appearance: 矮胖，圆脸花白短须，穿暗红旧捕服，腰悬铁尺。眼睛总眯着，看似和气。蓑衣斗笠，靴上泥泞。
  personality: 圆滑世故、口蜜腹剑、目的性极强
  voice_tone: 笑呵呵，爱拉家常，句尾带“啊”“嘛”。话里藏刀。
  motivation: 拿凌霜归案，保住自己多年捕头位置。
  background: 沈默旧日上司，当年旧案的知情人。表面追查命案，实则掩盖真相。
  arc: 从伪装善意到暴露真面目，成为沈默直面过去的镜子。
