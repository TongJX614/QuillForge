  trigger_conditions: {}
  location: 沈家别墅花园
  time: 深夜
  characters_involved:
  - char_01
  - char_03
  content: 月光被云层切割成碎片，洒在修剪整齐的草坪上。你站在秋千旁，指尖还残留着江晚的温度，但面前的人已经将那份温暖撕开了一道裂缝。陆子昂从蔷薇丛的阴影里走出来，白衬衫的领口松开一颗扣子，脸上挂着那副你熟悉的、
  choices:
  - text: 借机提出要亲自和江晚告别，争取再见她一面
  - text: 顺从地点头，但心里盘算着如何暗中联络江晚
  rewards: ''
- id: event_02
  name: 窃听风声
  type: plot
  description: 你踩着楼梯返回二楼，走廊里只剩下夜灯昏黄的光。每一扇紧闭的门后都没有声音，但你知道，今晚的安静比白天
  trigger_conditions: {}
  location: 沈宅二楼走廊 / 沈清漪卧室
  time: 深夜接近午夜
  characters_involved:
  - char_01
  - char_04
  content: 你踩着楼梯返回二楼，走廊里只剩下夜灯昏黄的光。每一扇紧闭的门后都没有声音，但你知道，今晚的安静比白天的喧嚣更危险。蔷薇的香气从半开的窗户渗进来，混着草坪上残留的烟味——那是陆子昂留下的。你关上卧室门，
  choices:
  - text: 冒险从窗户翻出去，沿着蔷薇丛潜到佣人房见江晚
  - text: 假装睡下，等后半夜再行动，先发条加密信息给江晚约好时间
  rewards: ''
- id: event_03
  name: 暗夜密信
  type: plot
  description: 你躺在柔软的床垫上，却感觉每一根神经都绷成了弦。窗帘缝隙里透进一丝月光，在地板上画出细长的银线。墙上
  trigger_conditions: {}
  location: 沈清漪的卧室
  time: 深夜
  characters_involved:
  - char_01
  content: 你躺在柔软的床垫上，却感觉每一根神经都绷成了弦。窗帘缝隙里透进一丝月光，在地板上画出细长的银线。墙上的挂钟滴答作响，每一声都像在提醒你——时间不多了。陆子昂的话还在耳边回响，那些优雅的威胁像藤蔓般缠绕
  choices:
  - text: 准时赴约，不携带任何多余的东西
  - text: 提前几分钟到，先观察周围环境再露面
  rewards: ''
- id: event_04
  name: 蔷薇私语
  type: plot
  description: 你踩着走廊尽头的木板楼梯，脚步轻得像猫。佣人房的门虚掩着，门缝里漏出一线昏黄的灯光。你推开门，看见江
  trigger_conditions: {}
  location: 佣人房小屋
  time: 后半夜
  characters_involved:
  - char_01
  - char_02
  content: 你踩着走廊尽头的木板楼梯，脚步轻得像猫。佣人房的门虚掩着，门缝里漏出一线昏黄的灯光。你推开门，看见江晚坐在床边的小凳子上，膝上搁着一个洗得发白的布包袱。她抬起头，眼睛里没有惊讶，只有一种你从未见过的平
  choices:
  - text: 握住她的手，一起推开那扇门
  - text: 让她先走，自己留下处理一切
  rewards: ''
