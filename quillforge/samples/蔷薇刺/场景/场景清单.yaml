scenes:
- id: scene_01
  name: 暗夜之眼
  location: 沈家别墅花园
  time: 深夜
  atmosphere: 月光被云层遮蔽又露出，花园里的蔷薇在夜风中沙沙作响，泳池的水面反射着别墅窗口漏出的冷光，远处传来一两声犬吠，空气里绷着一根即将断裂的弦。
  description: 你目送江晚的背影匆匆消失在佣人房的小径尽头，指尖还残留着她颤抖的温度。秋千的铁链在风里轻轻晃动，发出细碎的呜咽。你深吸一口气，试图让睡衣下狂跳的心脏平复下来。就在这时，身后的蔷薇丛传来一阵不紧不慢的脚步声。你转过身，看见陆子昂从黑影里走出来，西装外套搭在肩上，手机屏幕的冷光映着他脸上那个你无比熟悉的、从容而残忍的笑容。他抬起手，轻轻晃了晃手机——屏幕上清清楚楚是你和江晚拥抱的照片，角度刁钻，你的脸清晰可见。夜风突然停了，整个世界像被按下了静音。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜别墅花园，月光昏暗，泳池泛着冷光，蔷薇花丛被夜风吹动。前景中一个穿睡裙的年轻女人（沈清漪）背对镜头站立，对面一个西装男人（陆子昂）站在阴影里，手机屏幕照亮他半张脸，嘴角带着冷笑。背景是远处亮着几扇窗户的别墅主体。
- id: scene_02
  name: 蔷薇下的交易
  location: 沈家别墅花园
  time: 深夜
  atmosphere: 压抑、微凉，蔷薇的暗香与对峙的紧张感交织
  description: 月光被云层切割成碎片，洒在修剪整齐的草坪上。你站在秋千旁，指尖还残留着江晚的温度，但面前的人已经将那份温暖撕开了一道裂缝。陆子昂从蔷薇丛的阴影里走出来，白衬衫的领口松开一颗扣子，脸上挂着那副你熟悉的、礼貌而得体的微笑——只是眼底的光，冷得像淬了冰。他站定在你面前三步远的地方，夜风拂过，蔷薇花枝簌簌作响，尖锐的刺在月光下泛着微光。你没有退路，你知道他什么都看见了。深吸一口气，你压下喉咙口的颤抖，迎上他的目光，努力让声音听起来平静如常。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的沈家花园，月光被云层遮蔽，蔷薇丛的阴影中站着两个对峙的身影。年轻女人穿着睡衣站在秋千旁，身体紧绷却强作镇定，面前的男人白衬衫半敞，指尖夹着香烟，烟雾在冷空气中缭绕。背景可见别墅的轮廓和佣人房的一角，远处路灯投下昏黄的微光，整体色调暗蓝与墨绿交织，蔷薇的红色花苞在暗处若隐若现，暗示着危险与温柔并存的氛围。
- id: scene_03
  name: 窃听风声
  location: 沈宅二楼走廊 / 沈清漪卧室
  time: 深夜接近午夜
  atmosphere: 压抑的寂静，暗处仿佛有无数只眼睛，空调的低鸣如心电图的杂音
  description: 你踩着楼梯返回二楼，走廊里只剩下夜灯昏黄的光。每一扇紧闭的门后都没有声音，但你知道，今晚的安静比白天的喧嚣更危险。蔷薇的香气从半开的窗户渗进来，混着草坪上残留的烟味——那是陆子昂留下的。你关上卧室门，门锁咔哒一声轻响，却没能锁住心头的慌乱。你的手伸向手机，指尖在冰冷的屏幕上停留片刻，又缩回来。也许手机已经被监听，也许陆子昂就站在走廊尽头的阴影里等着你犯错。但你知道，江晚一定还在佣人房等着你的消息，哪怕只是一个眼神的确认。窗外，泳池的水面泛着幽蓝的光，像一只沉默的眼睛。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_04
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的沈宅二楼走廊，昏暗的夜灯，一扇半开的卧室门透出暖光，门内床边放着一杯牛奶；走廊尽头的另一扇门缝里透出一线刺眼的白光；窗外可见别墅草坪和泳池的蓝色水面，蔷薇花丛在月光下投出扭曲的阴影，画面整体色调偏冷，压抑而安静
- id: scene_04
  name: 暗夜密信
  location: 沈清漪的卧室
  time: 深夜
  atmosphere: 静谧而压抑，黑暗中有种被监视的错觉
  description: 你躺在柔软的床垫上，却感觉每一根神经都绷成了弦。窗帘缝隙里透进一丝月光，在地板上画出细长的银线。墙上的挂钟滴答作响，每一声都像在提醒你——时间不多了。陆子昂的话还在耳边回响，那些优雅的威胁像藤蔓般缠绕着你的呼吸。你侧耳倾听，确认走廊里再无脚步声，然后从枕头下摸出手机。屏幕亮起的瞬间，你本能地用手遮住光，只留一条缝隙，指尖在键盘上飞快敲打。加密的暗语是你和江晚早就约好的——用日常话题掩盖真正的意图。你按下了发送键，心脏在胸腔里擂鼓般跳动。等待的每一秒都被拉得比一生还长。
  trigger_conditions: {}
  characters_present:
  - char_01
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 昏暗的卧室，月光透过窗帘缝隙洒在地板上，床上蜷缩着一个身影，手机屏幕的微光照亮她紧张的脸庞，枕边隐约可见手机的光源被手掌半遮着。房间安静得能听见壁钟的滴答声。
- id: scene_05
  name: 蔷薇私语
  location: 佣人房小屋
  time: 后半夜
  atmosphere: 静谧而压抑，月光透过窗帘缝隙洒入，空气里浮动着尘土与旧木的气息，远处隐约传来虫鸣
  description: 你踩着走廊尽头的木板楼梯，脚步轻得像猫。佣人房的门虚掩着，门缝里漏出一线昏黄的灯光。你推开门，看见江晚坐在床边的小凳子上，膝上搁着一个洗得发白的布包袱。她抬起头，眼睛里没有惊讶，只有一种你从未见过的平静——像是已经把所有决定都做完了。房间里很安静，只有窗外的虫鸣和你自己的呼吸声。床单叠得整整齐齐，枕头上放着一朵压干了的蔷薇，花瓣已经脆成深褐色。你关上门，门锁发出一声轻响，像是把整个世界都隔在了外面。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的佣人房内，昏黄的台灯照亮两个年轻女子相对而立的身影。一个身穿简单家居服，另一个拎着旧布包袱。桌上放着一朵干枯的蔷薇，房间狭小而陈旧，窗外是朦胧的月光和蔷薇丛的剪影。
- id: scene_06
  name: 远行
  location: 沈家别墅后门小径
  time: 深夜
  atmosphere: 寂静中带着决绝的温柔，月光清冷，蔷薇香气缠绕
  description: 你握住江晚的手，掌心里传来一阵微凉的颤栗，像是她终于把全部的信任交到了你手上。佣人房的木门吱呀一声推开，夜风裹着蔷薇的香气扑面而来，月光在青石小径上铺成一条银白的路。你回头看了一眼那栋亮着昏黄灯光的别墅——二楼窗后或许有一双眼睛正盯着你们，但你不再去想。江晚的手指收紧，指尖轻轻摩挲着你的手背，那一瞬间你意识到，她从来都不是软弱的人，只是在等你先迈出这一步。小径尽头的铁栅栏门半掩着，锁链垂落在草地上——这是她白天悄悄打开的。你深吸一口气，拉着她踏上了那条被月光洗亮的石子路。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的沈家别墅后门，月光照亮青石小径与半开的铁栅栏，两个年轻女性的剪影手牵手站在蔷薇丛旁，背影决绝而温柔，远方的城市灯火依稀可见
