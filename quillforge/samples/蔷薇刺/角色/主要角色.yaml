characters:
- id: char_01
  name: 沈清漪
  role: 主角
  gender: female
  age: 23
  occupation: 艺术系研究生 / 家族企业继承人
  appearance: 身高168cm，及腰黑长直发，发尾微卷，鹅蛋脸，杏仁眼，左眼角有一颗淡痣。日常穿着米白或浅灰的宽松针织衫、真丝半身裙，气质温婉却带一丝疏离。
  personality: 敏感、固执、内敛
  voice_tone: 轻柔缓慢，略带犹豫和颤音
  motivation: 想要挣脱家族的束缚，真实地爱一次
  background: 沈家独女，从小被母亲严格培养成继承人，内心渴望自由却习惯压抑。
  arc: 从顺从的千金小姐蜕变为敢于为爱反抗的独立女性。
- id: char_02
  name: 江晚
  role: 主角恋人
  gender: female
  age: 21
  occupation: 花店花艺师 / 保姆之女
  appearance: 身高162cm，及肩碎短黑发，发梢挑染一缕暗红，眉眼清秀利落，右耳戴一枚银色耳钉。常穿牛仔工装裤、白衬衫外搭皮质围裙，袖口卷起，手指有细小伤疤。
  personality: 温柔坚韧、隐忍、略带忧郁
  voice_tone: 低哑柔和，偶尔带笑意
  motivation: 想守护沈清漪，又害怕破坏她的人生
  background: 母亲在沈家做了二十年保姆，她从小在佣人房里长大，敏感于身份的差距。
  arc: 从自卑退缩到勇敢面对自己的感情与身份。
- id: char_03
  name: 陆子昂
  role: 配角 / 前男友
  gender: male
  age: 26
  occupation: 投行经理
  appearance: 身高183cm，短发后梳，露出额头，剑眉星目，下颌线分明，常穿深色西装或休闲夹克，腕戴银色表盘。
  personality: 强势、控制欲强、表面体面实则自私
  voice_tone: 低沉清晰，语气果断，带有压迫感
  motivation: 维持自己与沈家的联姻以巩固事业
  background: 与沈清漪交往两年，自认是最合适的结婚对象。
  arc: 从虚伪包容到暴露出控制本性，最终放手或报复。
- id: char_04
  name: 赵姨
  role: 配角
  gender: female
  age: 52
  occupation: 沈家保姆 / 江晚母亲
  appearance: 身高158cm，花白短发挽成低髻，面容憔悴但眼神慈祥，常穿深蓝布衣裤，系着素色围裙，双手粗糙。
  personality: 朴实、隐忍、忠诚又懦弱
  voice_tone: 温和带乡音，语速慢，总带叹气
  motivation: 希望女儿安稳，不想失去工作
  background: 在沈家工作二十年，视沈清漪如亲女但更护着自己女儿。
  arc: 从阻止到无奈接受女儿的感情选择。
