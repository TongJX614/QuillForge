assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 沈清漪
    - name: 江晚
    - name: 陆子昂
    - name: 赵姨
  - type: 场景背景
    scenes:
    - name: 暗夜之眼
      mood: 月光被云层遮蔽又露出，花园里的蔷薇在夜风中沙沙作响，泳池的水面反射着别墅窗口漏出的冷光，远处传来一两声犬吠，空气里绷着一根即将断裂的弦。
      details: 深夜别墅花园，月光昏暗，泳池泛着冷光，蔷薇花丛被夜风吹动。前景中一个穿睡裙的年轻女人（沈清漪）背对镜头站立，对面一个西装男人（陆子昂）站在阴影里，手机屏幕照亮他半张脸，嘴角带着冷笑。背景是远处亮着几扇窗户的别墅主体。
    - name: 蔷薇下的交易
      mood: 压抑、微凉，蔷薇的暗香与对峙的紧张感交织
      details: 深夜的沈家花园，月光被云层遮蔽，蔷薇丛的阴影中站着两个对峙的身影。年轻女人穿着睡衣站在秋千旁，身体紧绷却强作镇定，面前的男人白衬衫半敞，指尖夹着香烟，烟雾在冷空气中缭绕。背景可见别墅的轮廓和佣人房的一角，远处路灯投下昏黄的微光，整体色调暗蓝与墨绿交织，蔷薇的红色花苞在暗处若隐若现，暗示着危险与温柔并存的氛围。
    - name: 窃听风声
      mood: 压抑的寂静，暗处仿佛有无数只眼睛，空调的低鸣如心电图的杂音
      details: 深夜的沈宅二楼走廊，昏暗的夜灯，一扇半开的卧室门透出暖光，门内床边放着一杯牛奶；走廊尽头的另一扇门缝里透出一线刺眼的白光；窗外可见别墅草坪和泳池的蓝色水面，蔷薇花丛在月光下投出扭曲的阴影，画面整体色调偏冷，压抑而安静
    - name: 暗夜密信
      mood: 静谧而压抑，黑暗中有种被监视的错觉
      details: 昏暗的卧室，月光透过窗帘缝隙洒在地板上，床上蜷缩着一个身影，手机屏幕的微光照亮她紧张的脸庞，枕边隐约可见手机的光源被手掌半遮着。房间安静得能听见壁钟的滴答声。
    - name: 蔷薇私语
      mood: 静谧而压抑，月光透过窗帘缝隙洒入，空气里浮动着尘土与旧木的气息，远处隐约传来虫鸣
      details: 深夜的佣人房内，昏黄的台灯照亮两个年轻女子相对而立的身影。一个身穿简单家居服，另一个拎着旧布包袱。桌上放着一朵干枯的蔷薇，房间狭小而陈旧，窗外是朦胧的月光和蔷薇丛的剪影。
    - name: 远行
      mood: 寂静中带着决绝的温柔，月光清冷，蔷薇香气缠绕
      details: 深夜的沈家别墅后门，月光照亮青石小径与半开的铁栅栏，两个年轻女性的剪影手牵手站在蔷薇丛旁，背影决绝而温柔，远方的城市灯火依稀可见
