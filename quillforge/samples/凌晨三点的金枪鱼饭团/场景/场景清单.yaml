scenes:
- id: scene_01
  name: 雨夜便利店
  location: 老街区十字路口的24小时便利店
  time: 凌晨两点五十分
  atmosphere: 雨夜独有的潮湿凉意渗进门缝，日光灯的白光把一切都照得过于清晰，安静得能听见水壶里气泡翻滚的声音。
  description: 雨丝斜斜地扫过玻璃门，在霓虹灯的映照下像一层薄薄的纱。日光灯管发出持续的嗡嗡声，和冰柜压缩机的低鸣交织成一首属于深夜的单调曲子。你拿着抹布，从货架这头擦到那头，每一件商品的标签都朝外对齐，这是你雷打不动的习惯。收银台后面，老周的鼾声忽然断了一下，又续上了。你抬头看了一眼墙上的监控屏幕，红色的时间数字跳动着：02:51。还有十六分钟。你放下抹布，走到窗边，雨水在玻璃上蜿蜒而下，街对面那盏路灯忽明忽暗，像在打瞌睡。你忽然意识到自己在数秒，于是自嘲地扯了扯嘴角。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的24小时便利店外景，雨夜，老街区十字路口，湿漉漉的柏油路面反射着昏黄路灯和便利店透出的白光，玻璃门上凝着水珠，街对面有一盏忽明忽暗的路灯，远处是模糊的老式居民楼轮廓，整体色调偏冷偏暗，宁静而略带孤独感。
- id: scene_02
  name: 三点零七分的准时
  location: 老街区十字路口·24小时便利店
  time: 凌晨三点
  atmosphere: 雨声渐稀，日光灯的白光把小小的便利店照得像一个与世隔绝的盒子，安静里藏着一触即发的追问。
  description: 你转过身，把老周那句调侃晾在身后，抹布重新按上货架。可你的眼睛不听使唤，每隔几秒就往玻璃门外瞟一眼。雨小了些，路灯还在苟延残喘地闪。墙上的监控数字跳到03:04，你听见自己心里有个声音在数：还有三分钟。日光灯的嗡嗡声忽然显得格外响，冰柜压缩机停了又启，像有人憋着气又吐出来。老周在你身后嘟囔了一句什么，你没听清，也没回头。玻璃门上映出你模糊的影子，你才发现自己站得笔直，抹布悬在半空，货架上那排饭团被你擦了三遍。你暗骂自己一句，把抹布叠好，摆正，又摆正。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 凌晨三点的老街区十字路口24小时便利店，玻璃门外细雨绵绵，街对面路灯忽明忽暗，店内日光灯惨白，货架整齐，收银台旁电水壶冒着热气，地砖上有一块吸水垫，窗外霓虹在湿漉漉的柏油路上晕开模糊的光。
