  - type: 场景背景
    scenes:
    - name: 雨夜便利店
      mood: 雨夜独有的潮湿凉意渗进门缝，日光灯的白光把一切都照得过于清晰，安静得能听见水壶里气泡翻滚的声音。
      details: 深夜的24小时便利店外景，雨夜，老街区十字路口，湿漉漉的柏油路面反射着昏黄路灯和便利店透出的白光，玻璃门上凝着水珠，街对面有一盏忽明忽暗的路灯，远处是模糊的老式居民楼轮廓，整体色调偏冷偏暗，宁静而略带孤独感。
    - name: 三点零七分的准时
      mood: 雨声渐稀，日光灯的白光把小小的便利店照得像一个与世隔绝的盒子，安静里藏着一触即发的追问。
      details: 凌晨三点的老街区十字路口24小时便利店，玻璃门外细雨绵绵，街对面路灯忽明忽暗，店内日光灯惨白，货架整齐，收银台旁电水壶冒着热气，地砖上有一块吸水垫，窗外霓虹在湿漉漉的柏油路上晕开模糊的光。
