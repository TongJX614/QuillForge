characters:
- id: char_01
  name: 林默
  role: 主角
  species: human
  gender: male
  age: 27
  occupation: 深夜便利店店员
  appearance: 中等身高，偏瘦，常年熬夜导致眼下有淡淡的青黑。头发是自然卷的黑色短发，有些毛躁，刘海总是遮住一边眼睛。穿着便利店的深蓝色条纹制服，袖子随意挽到手肘，胸前别着褪色的工牌。右手食指上有一块小小的烫伤疤痕。
  personality: 沉默寡言但观察力强，习惯性失眠，对细节有强迫症般的记忆力
  voice_tone: 说话简短，常带自嘲式的冷幽默，口头禅是“反正也睡不着”
  motivation: 想弄清为什么自己总在凌晨三点醒来，以及那个女孩为什么每天买同一款饭团
  background: 大学退学后辗转做过几份工作，半年前开始在这家24小时便利店上夜班，失眠问题从三年前开始，试过各种方法都无效。
  arc: 从被动接受失眠的孤独，到主动追寻真相并学会与他人建立联系
- id: char_02
  name: 苏晚
  role: 神秘女孩
  species: human
  gender: female
  age: 22
  occupation: 未知（自称自由职业）
  appearance: 身材娇小纤细，齐肩的黑色直发，发梢微微内扣。皮肤白皙到近乎透明，眼睛是深褐色的，眼下有浅浅的卧蚕。总是穿着一件略显宽大的米白色针织开衫，里面是素色连衣裙，脚踩帆布鞋。左手腕上戴着一根褪色的红绳。
  personality: 温柔礼貌但保持距离感，说话轻声细语，偶尔流露出与年龄不符的沧桑
  voice_tone: 语速缓慢，用词文雅，喜欢用“呢”“吧”等语气词结尾，从不直接回答关于自己的问题
  motivation: 每天准时来买同一款饭团，似乎在等待或确认某件事
  background: 三个月前开始每天凌晨三点零七分出现在便利店，每次都买金枪鱼蛋黄酱饭团和一瓶温热的无糖乌龙茶，从不例外。
  arc: 从封闭的等待者，逐渐愿意向他人敞开内心并接受现实
- id: char_03
  name: 老周
  role: 配角/便利店店主
  species: human
  gender: male
  age: 58
  occupation: 便利店店主
  appearance: 矮胖身材，圆脸，头顶微秃但两侧留着一圈灰白短发。常穿一件洗得发白的polo衫，腰间挂着一大串钥匙。右手无名指缺了一截，喜欢在收银台后面泡功夫茶。
  personality: 话痨但嘴硬心软，爱管闲事，对员工像对自家孩子一样唠叨
  voice_tone: 嗓门大，喜欢用“我跟你说”开头，批评人时爱说“像什么话”，关心人时却支支吾吾
  motivation: 把便利店经营好，顺便照顾店里这些“不省心的年轻人”
  background: 开了二十年便利店，见过形形色色的夜班客，三年前开始收留林默上夜班，觉得这孩子“虽然怪但靠谱”。
  arc: 从只把林默当员工，到真正理解并支持他的选择
