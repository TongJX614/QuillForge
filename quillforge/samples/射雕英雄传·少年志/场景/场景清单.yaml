scenes:
- id: scene_01
  name: 张家口酒楼初相逢
  location: 张家口·醉仙楼
  time: 黄昏
  atmosphere: 喧闹嘈杂，暮色昏黄，酒楼里热气蒸腾，暗藏几分市井的戒备与初遇的微妙试探。
  description: 暮色自长城垛口那边漫过来，把张家口这条官道染成一片浑黄。醉仙楼上下两层早已坐得七七八八，跑堂的伙计肩上搭着白巾，端着热气腾腾的羊肉和莜面在桌缝间穿梭。楼下散座多是贩皮的、赶骆驼的，吵吵嚷嚷，酒气混着肉香从门帘缝里直往外冒。你坐在靠墙角一张旧木桌旁，桌上摆着刚点的馒头和一碗羊汤，热气模糊了你的脸。你正笨拙地数着铜板，心里盘算这一顿会不会太贵——忽然面前一暗，一个瘦小的影子不知从哪儿钻出来，一只手已经按在了装馒头的碟子边上。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 黄昏时分的北方古镇酒楼，两层木楼临街而立，楼下散座摆着旧木桌条凳，桌上粗瓷碗碟冒着热气，窗外是浑黄的暮色与远处长城垛口的轮廓，街面尘土微扬，驼队与行人剪影稀疏，暖黄灯光从窗格间透出。
