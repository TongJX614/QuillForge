characters:
- id: char_01
  name: 郭靖
  role: 主角
  species: human
  gender: male
  age: 18
  occupation: 蒙古金刀驸马、全真教弟子（挂名）
  appearance: 身材敦实，肩宽背厚，比同龄人略高半个头；皮肤被大漠风沙吹得黝黑粗糙；方脸浓眉，眼神憨厚而坚定；头发用一根旧皮绳随意扎成短髻；身穿蒙古牧民的灰褐色旧皮袍，袖口磨损，腰间挂一把无鞘短刀，脚蹬磨破边的牛皮靴，站姿如钉入地面般沉稳。
  personality: 憨直木讷，认死理，一诺千金；反应慢但心志坚，从不取巧。
  voice_tone: 语速慢，常停顿，爱说“我师父说……”“我娘说……”；不会用华丽辞藻，急了只会重复“我不懂，但我觉得不对”。
  motivation: 为父报仇，同时守住对江南七怪和蒙古大汗的承诺。
  background: 遗腹子，由母亲李萍在蒙古大漠抚养长大；六岁拜江南七怪为师，十八岁南下赴嘉兴醉仙楼之约。
  arc: 从不懂变通的笨小子，成长为明白“侠之大者，为国为民”的真正侠客。
- id: char_02
  name: 黄蓉
  role: 女主角
  species: human
  gender: female
  age: 16
  occupation: 桃花岛主之女，离家出走中
  appearance: 身材纤细娇小，比郭靖矮一个头；肌肤白嫩如瓷，一双大眼灵动狡黠，睫毛浓密；乌黑长发用一根金环束成双髻，垂在耳侧；身穿鹅黄色绸衫，外罩白色轻纱披风，腰间系一条翠绿丝绦，挂着一个小小的绣花锦囊；嘴角总带着三分捉弄人的笑意。
  personality: 古灵精怪，机变百出，嘴巴不饶人但心地极软；最恨别人看不起她。
  voice_tone: 语速极快，声音清脆如铃，爱用反问句和俏皮话；常自称“本姑娘”，损人时笑眯眯，哄人时甜得发腻。
  motivation: 逃离桃花岛，找一个真心对她好、不图她身份的人。
  background: 东邪黄药师独女，因与父亲赌气偷跑出岛；聪明绝顶却从未出过远门，对江湖险恶一知半解。
  arc: 从任性逃家的小妖女，学会真心待人，也学会为自己的选择负责。
- id: char_03
  name: 杨康
  role: 核心对手
  species: human
  gender: male
  age: 18
  occupation: 大金国小王爷
  appearance: 身材修长挺拔，比郭靖高挑；面容俊朗，眉目清秀但眼角微挑，带着几分矜贵之气；皮肤白皙，手指修长干净；头戴束发金冠，身穿月白色锦缎长袍，腰系玉带，外披银灰色狐裘斗篷，足踏鹿皮软靴，一身贵气与江湖格格不入。
  personality: 聪明机警，善辨风向，表面温文尔雅，骨子里极重利益；最怕失去已有的富贵。
  voice_tone: 语调温和有礼，用词讲究，爱说“依我看……”“此事不妨从长计议”；被戳穿时会突然变冷，语速加快，用命令句。
  motivation: 保住小王爷的身份和荣华富贵，不愿承认自己是宋人。
  background: 名义上是金国六王爷完颜洪烈之子，实为宋人杨铁心遗腹子；从小锦衣玉食，十八岁才得知身世真相。
  arc: 在富贵与血脉之间反复摇摆，最终因不肯放手而走向歧路。
- id: char_04
  name: 洪七公
  role: 关键导师
  species: human
  gender: male
  age: 55
  occupation: 丐帮帮主，天下五绝之“北丐”
  appearance: 身材魁梧高大，肩背微驼；乱蓬蓬的花白头发用一根竹簪随意别着，胡须拉碴；圆脸大耳，笑起来眼睛眯成缝，右手中指缺了一截；身穿打满补丁的灰布丐袍，腰间系一个油亮的红漆酒葫芦，背后斜插一根碧绿竹棒，赤脚穿草鞋，走起路来晃悠悠。
  personality: 贪吃如命，豪爽不拘小节，最恨恃强凌弱；看似糊涂，大事上比谁都清醒。
  voice_tone: 嗓门洪亮，爱拍大腿，三句话不离“吃”；骂人直来直去，夸人也不绕弯，常说“老叫花我吃过的盐比你吃过的米多”。
  motivation: 吃遍天下美食，同时把丐帮和一身本事交给值得托付的人。
  background: 丐帮第十八代帮主，降龙十八掌和打狗棒法传人；一生浪迹江湖，无儿无女，最看重后辈的人品。
  arc: 从游戏人间的老饕，到认真选定衣钵传人，完成丐帮的传承。
