    - name: 张家口酒楼初相逢
      mood: 喧闹嘈杂，暮色昏黄，酒楼里热气蒸腾，暗藏几分市井的戒备与初遇的微妙试探。
      details: 黄昏时分的北方古镇酒楼，两层木楼临街而立，楼下散座摆着旧木桌条凳，桌上粗瓷碗碟冒着热气，窗外是浑黄的暮色与远处长城垛口的轮廓，街面尘土微扬，驼队与行人剪影稀疏，暖黄灯光从窗格间透出。
