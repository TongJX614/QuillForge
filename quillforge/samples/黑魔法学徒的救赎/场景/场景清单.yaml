scenes:
- id: scene_01
  name: 低语之书
  location: 霍格沃茨地下教室
  time: 深夜
  atmosphere: 潮湿阴冷的石室中烛光摇曳，低语与沉默交替，像一根绷紧的弦，随时可能断裂。
  description: 地下教室的石壁渗着寒气，烛火在潮湿的空气中微微摇曳，把你的影子拉得忽长忽短。你面前那本黑魔法书摊开着，书页上的墨迹像活物一样缓缓蠕动，低语声时远时近，仿佛有人贴着你的耳根呢喃。你屏住呼吸，试图辨认那些模糊的字母，指尖却不由自主地朝书页探去。就在指尖即将触到纸面的刹那，门轴发出一声尖细的呻吟，冷风灌入，烛焰猛地一歪。你猛地抬头，门口站着一个人影，镜片反射着烛光，看不清眼睛。空气骤然凝固，那本书的低语也仿佛屏住了呼吸。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的霍格沃茨地下教室，潮湿的石墙上挂着几盏摇曳的烛台，暖黄烛光在冷灰色石面上投下摇晃的光斑，一张陈旧的长木桌上摊着翻开的古书，四周堆着蒙尘的羊皮纸卷和玻璃瓶，头顶拱形石顶隐入阴影，远处一扇半开的木门透进走廊的微光。
- id: scene_02
  name: 壁炉余烬
  location: 艾莉丝·克罗夫特的办公室
  time: 傍晚
  atmosphere: 炉火将熄未熄，阴影在书架间缓慢移动，谈话像在薄冰上行走，每句话都压着未说出口的旧事。
  description: 艾莉丝的办公室在城堡西塔的拐角，比地下教室干燥得多，却同样幽暗。壁炉里的火苗压得很低，橘光只够照亮书桌一角，其余的空间都沉在灰蓝色的阴影里。墙上挂着一幅褪色的傲罗合影，玻璃面蒙着薄灰，像刻意不去擦拭。你进门时，她正背对着你往壁炉里添一块柴，火舌舔上来，把她的影子投到天花板上，又高又瘦。书桌上摊着几份文件，最上面那份盖着魔法部的封蜡。她没回头，只抬了抬下巴示意你关门，门锁在你身后咔哒一声自动合拢。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 城堡西塔的圆形办公室，傍晚，壁炉里压低的橘色火苗，石墙上挂着蒙尘的旧相框，深色木质书架高耸至天花板，书桌上摊着盖有封蜡的文件，窗外是渐暗的暮色与远处禁林的轮廓，室内阴影浓重，光线昏暗而温暖。
- id: scene_03
  name: 不属于这个世界的人
  location: 西塔，艾莉丝的办公室
  time: 深夜
  atmosphere: 压抑的信任试探，炉火将熄，秘密在两人之间缓缓摊开，危险与希望并存
  description: 壁炉里的柴火塌了一角，溅出几点火星，在石板上明灭一瞬便冷了。你听见自己的呼吸声在寂静里显得格外响。窗外的风把玻璃吹得轻轻震颤，远处禁林的树影在月色里起伏，像一片沉默的黑色海面。艾莉丝没有催你，只是站在书桌旁，手指搭在那只刻满符文的木匣上，目光像秤一样压着你。炉火的余温烘着你的脸，你却觉得掌心发凉。你知道，这句话一旦出口，就再也收不回去了——在这座城堡里，从来没有哪个学生说过这样的话。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的古老书房，石砌墙壁，壁炉中余烬微红，火光只照亮书桌一角，桌上摊着文件与一只刻满符文的深色木匣，墙上挂着蒙尘的旧照片，窗外是月色下的禁林剪影，整体幽暗、静谧而神秘
