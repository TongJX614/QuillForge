  content: 艾莉丝的办公室在城堡西塔的拐角，比地下教室干燥得多，却同样幽暗。壁炉里的火苗压得很低，橘光只够照亮书桌一角，其余的空间都沉在灰蓝色的阴影里。墙上挂着一幅褪色的傲罗合影，玻璃面蒙着薄灰，像刻意不去擦拭。
  choices:
