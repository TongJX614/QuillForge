characters:
- id: char_01
  name: 林默
  role: 主角
  species: human
  gender: male
  age: 16
  occupation: 霍格沃茨六年级学生（穿越者）
  appearance: 黑色短发略显凌乱，眼睛深邃呈深棕色，肤色偏白。常穿霍格沃茨校服，但总在袖口别着一枚暗银色的蛇形徽章。身材瘦高，手指修长，适合握魔杖。
  personality: 谨慎多疑，善于观察，内心渴望被接纳
  voice_tone: 说话前常停顿，用词精准，偶尔冒出中文口头禅'那个……'，紧张时会语速加快
  motivation: 找到穿越的真相，同时避免被黑魔法吞噬理智
  background: 来自现代中国的普通高中生，意外穿越到霍格沃茨，被分入斯莱特林，对黑魔法有异常天赋。
  arc: 从恐惧黑魔法到学会控制它，最终明白力量本身无善恶，选择权在自己手中。
- id: char_02
  name: 艾莉丝·克罗夫特
  role: 导师/关键配角
  species: human
  gender: female
  age: 34
  occupation: 霍格沃茨黑魔法防御术教授
  appearance: 深红色长卷发，常盘成低髻，用一根黑檀木簪固定。碧绿色眼睛锐利，戴细框金边眼镜。高挑纤细，常穿深墨绿长袍，腰间挂着一串银质小瓶。
  personality: 严厉而克制，洞察力强，暗藏同情心
  voice_tone: 语调平稳冰冷，喜欢用反问句，生气时会压低声音，偶尔冒出苏格兰口音
  motivation: 保护学生不重蹈自己当年的覆辙
  background: 曾是魔法部傲罗，因一次黑魔法事故失去搭档后转入教职，对黑魔法有深刻理解与警惕。
  arc: 从对林默的怀疑和防备，到最终信任并引导他走出阴影。
- id: char_03
  name: 卢卡斯·斯特林
  role: 对手/复杂配角
  species: human
  gender: male
  age: 17
  occupation: 斯莱特林级长
  appearance: 铂金色短发向后梳，灰蓝色眼睛冷淡。身材高大挺拔，常穿剪裁考究的斯莱特林长袍，胸前别着级长徽章。左手戴一枚家族戒指。
  personality: 傲慢但重荣誉，表面冷漠实则忠诚，对家族期望感到压力
  voice_tone: 说话慢条斯理，带着贵族式拖腔，常用'有趣'和'你确定？'，从不提高音量
  motivation: 证明自己比父亲更出色，同时守护家族声誉
  background: 出身古老纯血家族，父亲是魔法部高官，从小被严格要求，内心孤独。
  arc: 从敌视林默到承认他的天赋，最终学会用自己的标准衡量荣誉。
- id: char_04
  name: 莫甘娜
  role: 神秘指引者
  species: 幽灵
  gender: female
  age: 15
  occupation: 霍格沃茨幽灵（曾为拉文克劳学生）
  appearance: 半透明的银白色身影，身穿古老款式的拉文克劳长袍，长发飘散如雾。面容苍白但清秀，眼睛是空洞的珍珠白。飘浮时脚下无影，周身泛着微光。
  personality: 忧郁而好奇，记忆残缺，说话富有诗意
  voice_tone: 声音空灵有回声，喜欢用隐喻和谜语，经常忘记自己说到哪
  motivation: 找回生前关于黑魔法的记忆碎片
  background: 数百年前因研究禁忌黑魔法而意外身亡，化为幽灵，记忆支离破碎。
  arc: 从迷惘的碎片记忆中拼凑真相，最终选择放手并指引林默。
