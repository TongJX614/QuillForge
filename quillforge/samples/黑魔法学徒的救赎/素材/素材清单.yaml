assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 林默
    - name: 艾莉丝·克罗夫特
    - name: 卢卡斯·斯特林
    - name: 莫甘娜
  - type: 场景背景
    scenes:
    - name: 低语之书
      mood: 潮湿阴冷的石室中烛光摇曳，低语与沉默交替，像一根绷紧的弦，随时可能断裂。
      details: 深夜的霍格沃茨地下教室，潮湿的石墙上挂着几盏摇曳的烛台，暖黄烛光在冷灰色石面上投下摇晃的光斑，一张陈旧的长木桌上摊着翻开的古书，四周堆着蒙尘的羊皮纸卷和玻璃瓶，头顶拱形石顶隐入阴影，远处一扇半开的木门透进走廊的微光。
    - name: 壁炉余烬
      mood: 炉火将熄未熄，阴影在书架间缓慢移动，谈话像在薄冰上行走，每句话都压着未说出口的旧事。
      details: 城堡西塔的圆形办公室，傍晚，壁炉里压低的橘色火苗，石墙上挂着蒙尘的旧相框，深色木质书架高耸至天花板，书桌上摊着盖有封蜡的文件，窗外是渐暗的暮色与远处禁林的轮廓，室内阴影浓重，光线昏暗而温暖。
    - name: 不属于这个世界的人
      mood: 压抑的信任试探，炉火将熄，秘密在两人之间缓缓摊开，危险与希望并存
      details: 深夜的古老书房，石砌墙壁，壁炉中余烬微红，火光只照亮书桌一角，桌上摊着文件与一只刻满符文的深色木匣，墙上挂着蒙尘的旧照片，窗外是月色下的禁林剪影，整体幽暗、静谧而神秘
