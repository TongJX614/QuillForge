  - type: 场景背景
    scenes:
    - name: 灶火自燃
      mood: 昏暗的厨房里火光摇曳，米粥的蒸汽与晨雾交织，温暖中透着一股说不清的怅然。
      details: 江南老屋的厨房清晨，光线昏暗，青砖地面泛着微光。传统柴火灶台上架着铁锅，锅口腾起白色蒸汽，灶膛内柴火噼啪燃烧，火光将墙壁映成暖橙色。灶台旁是旧木碗柜和竹编蒸笼，墙上挂着一串干辣椒。窗外天井灰蓝色晨雾弥漫，隐约可见青瓦屋檐。
