characters:
- id: char_01
  name: 林晓
  role: 主角
  species: human
  gender: female
  age: 26
  occupation: 城市白领
  appearance: 中等身高，体型偏瘦，黑色长发简单扎成低马尾，几缕碎发垂在耳侧。穿着米色针织开衫、白色T恤和深色牛仔裤，脚踩帆布鞋，背一个旧帆布包，手腕上戴着一只外婆留下的银镯子。
  personality: 理性务实，内心柔软，习惯用忙碌掩饰情感，对过去有逃避倾向。
  voice_tone: 语速偏快，常用“其实”、“怎么说呢”等填充词，紧张时会重复对方的话尾。
  motivation: 查明灶台自燃的真相，同时处理自己对奶奶的未解心结。
  background: 从小由外婆带大，大学后留在城市工作，外婆去世后回老屋处理遗物，却发现灶台每天清晨自动生火煮粥。
  arc: 从逃避悲伤到直面回忆，学会与失去和解，并重新连接家乡。
- id: char_02
  name: 阿灶
  role: 关键配角
  species: 灶神/灵体
  gender: male
  age: 60
  occupation: 老屋灶台守护灵
  appearance: 半透明灵体，形态是矮胖的老爷爷模样，身穿灰蓝色粗布短褂，腰间系着沾有灶灰的围裙，花白胡子扎成小辫，头顶有火星般的光点闪烁，脚不沾地，周身环绕淡淡炊烟。
  personality: 唠叨慈祥，爱管闲事，对灶台规矩一丝不苟，但心软念旧。
  voice_tone: 沙哑温和，爱用“小囡”称呼人，说话带吴语腔调，常念叨“火候到了”。
  motivation: 守住外婆的嘱托，等林晓回来吃最后一碗粥。
  background: 因外婆数十年诚心供奉灶台而凝聚成形，外婆去世前将最后的心愿托付给他。
  arc: 从固执执行外婆遗愿到理解林晓的悲伤，最终释然送别。
- id: char_03
  name: 陈伯
  role: 配角
  species: human
  gender: male
  age: 68
  occupation: 退休乡村教师
  appearance: 身材清瘦，背微驼，满头银白短发，戴黑框老花镜，穿洗得发白的藏青色中山装，口袋里别着一支钢笔，脚穿黑布鞋，手里常拎着一个搪瓷茶杯。
  personality: 热心肠，爱讲故事，有点固执，相信老规矩。
  voice_tone: 慢条斯理，喜欢引经据典，口头禅是“老话说得好”。
  motivation: 保护老屋和外婆留下的传统，不愿看到老屋被卖掉。
  background: 外婆的老邻居，也是老屋的常客，知道一些关于灶台的旧事。
  arc: 从劝阻林晓到支持她做出自己的选择。
