scenes:
- id: scene_01
  name: 灶火自燃
  location: 老屋厨房
  time: 清晨五点半
  atmosphere: 昏暗的厨房里火光摇曳，米粥的蒸汽与晨雾交织，温暖中透着一股说不清的怅然。
  description: 天还没亮透，老屋厨房里只有灶膛的火光在跳动。你穿着睡衣站在灶台前，脚底是冰凉的青砖地，眼前却是噼啪作响的柴火和咕嘟冒泡的白粥。铁锅边缘腾起的热气模糊了你的视线，米香混着柴烟味钻进鼻腔。这已经是第三天了——每天清晨五点半，灶台准时自己生火，不多不少煮出两碗白粥。你伸手探了探锅沿，烫得缩回来。厨房里没有别人，可你总觉得有什么东西在看着你。窗外的天井还沉在灰蓝色的晨雾里，远处隐约传来第一声鸟叫。你深吸一口气，决定今天一定要弄个明白。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 江南老屋的厨房清晨，光线昏暗，青砖地面泛着微光。传统柴火灶台上架着铁锅，锅口腾起白色蒸汽，灶膛内柴火噼啪燃烧，火光将墙壁映成暖橙色。灶台旁是旧木碗柜和竹编蒸笼，墙上挂着一串干辣椒。窗外天井灰蓝色晨雾弥漫，隐约可见青瓦屋檐。
