characters:
- id: char_01
  name: 林昭
  role: 主角
  species: human
  gender: female
  age: 32
  occupation: 火星温室植物学家
  appearance: 身高约165cm，身形偏瘦，黑色短发利落别在耳后，眼角有一颗小痣，常年穿着灰蓝色连体工作服，袖口别着一支旧式金属笔，手指因长期接触土壤而粗糙。
  personality: 执拗、细腻、不善表达情感
  voice_tone: 说话简短，常用植物学名词代替情绪表达，紧张时会反复推眼镜，口头禅是'数据不会骗人'。
  motivation: 想弄明白这朵花为什么会出现在火星，以及它是否意味着母亲临终前说的'地球还没有死'是真的。
  background: 出生于火星第二代移民家庭，母亲是首批殖民者中的园艺师，临终前留下一包未标注的种子。
  arc: 从只相信数据的科学家，变成愿意为无法解释的奇迹冒险的人。
- id: char_02
  name: 老周
  role: 配角/导师
  species: human
  gender: male
  age: 58
  occupation: 温室维护工程师
  appearance: 身高175cm，微胖，圆脸上有深深的皱纹，花白胡子修剪得很短，常穿橙色工装背心，口袋塞满扳手和螺丝，左腿装着老式机械义肢。
  personality: 话痨、热心、爱讲过去的地球故事
  voice_tone: 嗓门大，爱用'我跟你说'开头，讲起地球的雨和泥土时语速加快，偶尔停顿叹气。
  motivation: 想在退休前亲眼看到火星上长出真正的地球花，证明自己这辈子的坚持没白费。
  background: 地球移民，年轻时是建筑工人，参与过温室穹顶的搭建，对地球的记忆只剩模糊的雨声。
  arc: 从沉溺于怀旧回忆，到接受火星也能成为'家'的事实。
- id: char_03
  name: 小满
  role: 配角/助手
  species: human
  gender: female
  age: 19
  occupation: 温室实习生
  appearance: 身高158cm，圆脸，扎着两个歪歪扭扭的低马尾，脸上有几颗雀斑，穿着 oversized 的白色实验袍，口袋里总揣着一本画满涂鸦的笔记本。
  personality: 天真、好奇心旺盛、容易掉眼泪
  voice_tone: 说话带笑，喜欢用'哇'和'好厉害'表达惊叹，紧张时会结巴，把'蓝玫瑰'叫成'蓝宝宝'。
  motivation: 想成为像林昭一样厉害的植物学家，并偷偷给地球的奶奶写信描述火星的花。
  background: 火星出生，从未见过真实的地球植物，只在全息图鉴里看过。
  arc: 从盲目崇拜到学会独立思考，敢于质疑权威。
- id: char_04
  name: 陈监
  role: 反派/压力来源
  species: human
  gender: male
  age: 45
  occupation: 殖民地资源管理主任
  appearance: 身高180cm，精瘦，银灰色寸头，戴无框眼镜，永远穿着笔挺的深灰色制服，胸前别着殖民地徽章，手里总拿着一块数据板。
  personality: 冷酷、讲效率、视规则为一切
  voice_tone: 语速平稳，用词精确，喜欢说'根据条例'和'资源配给'，从不提高音量但每个字都像判决。
  motivation: 维持殖民地资源平衡，任何未经批准的生物样本都必须销毁。
  background: 地球总部派来的管理者，认为火星殖民地的意义在于生存而非浪漫。
  arc: 从刻板执行规则，到被迫面对规则与人性的冲突。
