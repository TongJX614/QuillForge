scenes:
- id: scene_01
  name: 意外的蓝色
  location: 新家园殖民地·第三温室
  time: 清晨（人工照明模拟日出）
  atmosphere: 静谧中带着一丝不安的紧绷感，人工晨光与植物蒸腾的水汽交织成朦胧的暖意，但角落的异常让空气里藏着细小的电流。
  description: 清晨的第三温室里，人工照明正从暗红过渡到淡金，模拟着地球的日出。你沿着巡检路线走过一排排培养槽，数据板在掌心发出规律的滴答声。一切都在配额之内——直到角落那株不该存在的植物撞进视线。一朵蓝玫瑰，花瓣上凝着露珠，在晨光里泛着近乎不真实的冷蓝色。你的数据板显示该区域零登记。心跳快了半拍，你蹲下身，指尖悬在花瓣上方。露珠折射出细碎的光，像母亲临终前眼睛里的那一点亮。你听见自己的呼吸在温室里格外清晰。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 巨大的穹顶温室内部，弧形玻璃外是暗红色火星荒原。顶部成排的人工照明灯正模拟日出，洒下淡金色光线。一排排金属培养槽整齐排列，营养液在管道中泛着微光。角落处一株矮小的绿色植物从槽中探出，旁边散落着几片落叶。水滴从叶片边缘缓缓滑落，在光下闪烁。
- id: scene_02
  name: 取样与倒计时
  location: 第三温室角落工作台
  time: 清晨七点四十五
  atmosphere: 紧张的安静，人工晨光逐渐明亮，倒计时般的紧迫
  description: 老周拍了拍你的肩膀，转身朝温室正门走去，嘴里已经开始念叨着'我跟你说，陈监，那个营养液回收率的事儿……'。他的声音很快被一排排培养槽吞没。你回头看向小满，她还蹲在蓝玫瑰旁边，眼睛亮得像那花瓣上的露珠。工作台就在三步之外，取样针、离心管、便携测序仪都在该在的位置。你打开数据板，把母亲留下的种子编号调出来，和根系标记并排放在屏幕上。七点四十六分。距离陈监例行查日志，还有十四分钟。小满已经站起来，手忙脚乱地帮你把取样盒打开，金属搭扣弹了一下，她吓得缩了缩脖子。温室的循环风扇低低地转着，把蓝玫瑰那点说不清的气味搅散在空气里。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 温室角落的简易工作台，金属台面上散落着数据板和取样工具，头顶人工照明从暗红渐变为淡金色，培养槽的玻璃壁映出模糊的光斑，背景是一排排整齐的绿色作物，远处穹顶外是暗红色的火星荒原
