assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 林昭
    - name: 老周
    - name: 小满
    - name: 陈监
  - type: 场景背景
    scenes:
    - name: 意外的蓝色
      mood: 静谧中带着一丝不安的紧绷感，人工晨光与植物蒸腾的水汽交织成朦胧的暖意，但角落的异常让空气里藏着细小的电流。
      details: 巨大的穹顶温室内部，弧形玻璃外是暗红色火星荒原。顶部成排的人工照明灯正模拟日出，洒下淡金色光线。一排排金属培养槽整齐排列，营养液在管道中泛着微光。角落处一株矮小的绿色植物从槽中探出，旁边散落着几片落叶。水滴从叶片边缘缓缓滑落，在光下闪烁。
    - name: 取样与倒计时
      mood: 紧张的安静，人工晨光逐渐明亮，倒计时般的紧迫
      details: 温室角落的简易工作台，金属台面上散落着数据板和取样工具，头顶人工照明从暗红渐变为淡金色，培养槽的玻璃壁映出模糊的光斑，背景是一排排整齐的绿色作物，远处穹顶外是暗红色的火星荒原
