  - type: 场景背景
    scenes:
    - name: 张家口·一碗面
      mood: 喧闹、烟火气十足，带着一丝少年人初入江湖的茫然与温暖
      details: 南宋年间的北方重镇街角，正午阳光明亮，一座简陋的露天面摊支着褪色布棚，长条木桌板凳油光发亮。铁锅热气腾腾，白雾袅袅升腾，案板上堆着粗瓷大碗。远处街市人来人往，货郎挑担、骡马嘶鸣，土墙灰瓦的店铺幌子在风里轻轻摇晃。地面是压实的黄土，散落着几片菜叶和马蹄印。
