scenes:
- id: scene_01
  name: 张家口·一碗面
  location: 张家口闹市街角面摊
  time: 正午
  atmosphere: 喧闹、烟火气十足，带着一丝少年人初入江湖的茫然与温暖
  description: 正午的日头直直照在张家口的土街上，面摊的大铁锅咕嘟咕嘟冒着白气，混着葱花的香味飘出老远。你摸了摸怀里最后几钱银子，还是朝那缩在墙角的小乞丐招了招手。面端上来时，那小乞丐也不客气，抓起筷子便埋头狼吞虎咽，汤汁溅在脏兮兮的衣襟上。你坐在对面，看着碗里渐渐见底，心里却觉得踏实——娘说过，出门在外，见人饿着，能帮一把是一把。街市上人声嘈杂，你却只听见对面吸溜面条的声响，还有偶尔抬起来的一双黑亮眼睛，正滴溜溜地打量你。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 南宋年间的北方重镇街角，正午阳光明亮，一座简陋的露天面摊支着褪色布棚，长条木桌板凳油光发亮。铁锅热气腾腾，白雾袅袅升腾，案板上堆着粗瓷大碗。远处街市人来人往，货郎挑担、骡马嘶鸣，土墙灰瓦的店铺幌子在风里轻轻摇晃。地面是压实的黄土，散落着几片菜叶和马蹄印。
