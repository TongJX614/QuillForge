characters:
- id: char_01
  name: 郭靖
  role: 主角
  species: human
  gender: male
  age: 18
  occupation: 草原牧羊少年/武林新秀
  appearance: 身高七尺有余，体格健壮如牛犊，皮肤黝黑粗糙，浓眉大眼，鼻梁宽厚，一头乌黑浓密的头发用麻绳随意束在脑后，常年穿着粗羊毛织成的灰色短褐，腰间系着牛皮水囊，脚蹬旧皮靴，双手布满厚茧。
  personality: 憨厚木讷、重情重义、坚韧不屈
  voice_tone: 语速慢、用词直白，常以“我娘说”开头，爱说“俺觉得”，被问急了会结巴，但承诺时一字一顿。
  motivation: 为父报仇，同时守护身边每一个在乎的人。
  background: 遗腹子，由母亲李萍在蒙古草原抚养长大，与拖雷结为安答，师从江南七怪，武功根基扎实但天资平平。
  arc: 从只知报恩的笨拙少年，成长为懂得“侠之大者，为国为民”的侠客。
- id: char_02
  name: 黄蓉
  role: 女主角
  species: human
  gender: female
  age: 16
  occupation: 桃花岛主之女/丐帮帮主
  appearance: 身量纤细，约五尺出头，瓜子脸，肌肤白腻如雪，一双杏眼黑白分明，眼波流转间狡黠灵动，长发乌黑如瀑，常以一根金带束成垂鬟，穿着淡黄色窄袖纱衫，腰间系一条缀满小铃铛的银链，步履轻盈如燕。
  personality: 古灵精怪、伶牙俐齿、爱恨分明
  voice_tone: 语速快如连珠，爱用“本姑娘”“你懂什么”开头，喜欢用俏皮话绕人，生气时反而声音更甜。
  motivation: 逃离桃花岛的寂寞，找一个真心待她好的人，一起看遍天下热闹。
  background: 东邪黄药师独女，自幼聪慧过人，因不满父亲严厉管束而离家出走，扮作小乞丐游荡江湖。
  arc: 从任性刁蛮的少女，学会体谅与担当，成为真正的江湖儿女。
- id: char_03
  name: 杨康
  role: 配角/对手
  species: human
  gender: male
  age: 19
  occupation: 金国小王爷/武林后起之秀
  appearance: 身高七尺二寸，身形修长挺拔，面容俊朗，皮肤白净，剑眉星目，嘴角总挂着一丝若有若无的笑，一头黑发用金冠束起，身着锦缎白衣，腰悬玉佩，手持折扇，举手投足间带着贵气。
  personality: 精明世故、心高气傲、摇摆不定
  voice_tone: 语调从容优雅，喜欢用“本王爷”“你可知”开头，话中常带三分笑意七分试探，被戳穿时会突然拔高声音。
  motivation: 保住自己金国小王爷的荣华富贵，同时不愿被人看低。
  background: 杨铁心之子，自幼被完颜洪烈收养，在金国王府长大，不知自己身世，与郭靖同年同月同日生。
  arc: 在身世真相与富贵权势之间反复挣扎，最终选择决定命运。
- id: char_04
  name: 黄药师
  role: 配角/黄蓉之父
  species: human
  gender: male
  age: 45
  occupation: 桃花岛主/东邪
  appearance: 身高七尺五寸，清瘦俊逸，面容冷峻，眉目疏朗，留三绺长须，两鬓微霜，常穿一袭青布长袍，腰悬竹箫，头戴方巾，眼神孤傲如寒星。
  personality: 孤僻冷傲、学识渊博、护短至极
  voice_tone: 语调清冷缓慢，爱用“哼”“也罢”开头，从不解释自己，说半句留半句，对女儿说话时会不自觉放轻。
  motivation: 守护桃花岛的一方清净，护女儿周全，不被俗世打扰。
  background: 天下五绝之一，精通奇门五行、琴棋书画，因妻子冯蘅离世而性情大变，对女儿既宠溺又严苛。
  arc: 从孤僻避世的东邪，到为女儿放下身段，承认江湖中也有值得托付之人。
