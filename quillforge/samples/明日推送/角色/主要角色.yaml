characters:
- id: char_01
  name: 林默
  role: 主角
  species: human
  gender: male
  age: 28
  occupation: 地铁信号维修技术员
  appearance: 瘦高个，身高178cm，偏瘦但肩膀宽。黑色短发略显凌乱，前额总有几缕碎发垂下来。眼窝较深，单眼皮，眼神常带一种过度专注的凝视感。常年穿深蓝色工装夹克，内搭灰色圆领T恤，工装裤侧袋里插着螺丝刀和万用表笔。左手腕戴一块老式卡西欧电子表，表带磨损发白。
  personality: 强迫症式的细节控、对异常极度敏感、表面冷静内心容易过载
  voice_tone: 说话短促、爱用技术术语打比方，紧张时会重复对方的话尾，常自言自语'不对，这里不对'
  motivation: 弄清那部手机为什么会有明天的新闻，以及照片里的自己究竟发生了什么。
  background: 三年前从通信工程专业毕业后一直在城市地铁系统做信号维护，习惯了在深夜末班车后检修设备，对地铁的每一寸结构了如指掌。独居，社交圈极窄。
  arc: 从'相信一切都有技术解释'的理性主义者，被迫面对无法用逻辑消化的真相，学会在不确定中做出选择。
- id: char_02
  name: 苏晚
  role: 关键配角 / 信息提供者
  species: human
  gender: female
  age: 26
  occupation: 自媒体新闻编辑（夜班）
  appearance: 中等身高，圆脸，皮肤偏白，眼下有常年熬夜留下的淡青色。栗棕色中长发随意扎成低马尾，碎发用黑色一字夹别在耳后。穿米色宽松针织开衫配深色牛仔裤，斜挎一个塞满充电宝和录音笔的帆布包。右手食指有长期握笔磨出的薄茧。
  personality: 好奇心过剩、嘴快心软、对'独家'有近乎偏执的执着
  voice_tone: 语速快，喜欢用'我跟你说'开头，句尾常带'对吧？'确认对方反应，兴奋时会不自觉提高音量
  motivation: 追到能让她在媒体圈站稳脚跟的独家真相，同时不忍心看着林默独自面对怪事。
  background: 在一家本地新闻聚合平台做夜班编辑，负责凌晨时段的推送排版，对'时间'和'发布'有职业性的敏感。曾因一篇未经核实的报道被处分，至今想证明自己。
  arc: 从追逐爆款新闻的编辑，转变为愿意为保护一个人而压下一篇报道的守护者。
- id: char_03
  name: 老周
  role: 配角 / 地铁老员工
  species: human
  gender: male
  age: 57
  occupation: 地铁站务员（即将退休）
  appearance: 矮胖身材，身高约168cm，肚子微凸。花白寸头，脸上皱纹深且多，笑起来眼角堆叠。穿洗得发白的深绿色站务制服，左胸别着工号牌'047'，脚上是一双磨平了底的黑色布鞋。手里常年端着一个掉漆的搪瓷缸。
  personality: 沉默寡言、记性极好、对站里的事知道得比谁都多但从不主动说
  voice_tone: 声音低沉沙哑，说话极简，常以'嗯'或'这个嘛……'起头，关键处故意停顿，爱用老话和俗语
  motivation: 平安退休，但心里压着一件多年前在地铁里发生、从未对任何人说全的事。
  background: 在这条地铁线干了三十多年，从售票窗口干到站台巡视，见过太多深夜乘客的悲欢。对某些'不该出现的东西'有一套自己的忌讳和说法。
  arc: 从守口如瓶的旁观者，到最终交出那句藏了多年的关键信息。
- id: char_04
  name: 顾衍
  role: 对立角色 / 谜团核心
  species: human
  gender: male
  age: 34
  occupation: 身份不明（自称'数据回收员'）
  appearance: 高瘦，身高185cm，肩窄，站姿笔直得有些不自然。极短的黑色寸头，鬓角干净利落。面部轮廓锋利，颧骨高，皮肤苍白，唇色淡。穿一身没有任何标识的炭灰色高领衫和黑色长裤，外套一件深灰风衣，口袋里露出一截白色数据线。双手修长，指甲修剪得过分整齐。
  personality: 冷静到近乎冷漠、说话滴水不漏、对规则有机械式的遵守
  voice_tone: 语速平缓均匀，几乎不带情绪起伏，喜欢用'根据流程''这不属于你的权限'这类句式，从不说'我'开头的要求
  motivation: 回收那部落入'错误的人'手里的设备，维持某种他坚信不可打破的秩序。
  background: 没有人知道他从哪来、为谁工作。他出现在地铁系统的监控死角，只与'出了问题'的设备有关。老周似乎见过他，但从不提起。
  arc: 从冷冰冰的规则执行者，在某个瞬间暴露出他也曾是被规则困住的人。
