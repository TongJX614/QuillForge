main_plot:
  summary: 林默在地铁座位下捡到一部手机，锁屏推送着明天日期的新闻，配图里是他自己。他与夜班编辑苏晚、老站务员老周一起追查，却撞上自称'数据回收员'的顾衍——手机必须还回去，而还回去的代价，是让推送成真。
  themes:
  - 预知与自由意志
  - 信息时代的信任危机
  - 普通人在异常面前的抉择
  core_conflict: 林默必须在'交还手机让预言的新闻成真'与'留下手机对抗未知秩序'之间做出选择，而每一条推送都在倒计时。
  stages:
  - name: 末班车的遗落物
    goal: ''
    conflict: ''
    scenes:
    - scene_01
