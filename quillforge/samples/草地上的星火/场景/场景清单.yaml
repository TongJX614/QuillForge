scenes:
- id: scene_01
  name: 草地黄昏
  location: 松潘草地边缘
  time: 黄昏
  atmosphere: 阴云低垂，泥水泛着铁锈色，远处雷声隐隐，空气中弥漫着潮湿与焦灼
  description: 阴云像浸透的旧棉絮，低低地压在草地尽头。泥水泛着铁锈色，一脚踩下去，咕叽咕叽地往上冒。你蹲在一丛枯草旁，用指尖在泥地上画着只有自己才认得的符号——左弯是河沟，三道短横是那棵歪脖子柳树，前卫营该在的方位，你画了个圈，又用指头把圈抹淡了。远处滚过一阵闷雷，像大地在翻身。前卫营那边，没有信号。老葛蹲在下风处，铜勺刮着空面袋，刮一下，停一下，声音干涩得像砂纸磨骨头。英子坐在药包上，把三支针剂一支一支数过去，又一支一支数回来，数到第三遍，手指头停住了。风从北边来，带着泥腥味，也带着更远处若有若无的枪声。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 黄昏时分的茫茫草地，阴云低垂压向地面，泥沼水面泛着铁锈般的暗红色反光，枯草丛生，几株矮小灌木歪斜地插在泥水里，远处雷云翻滚，天边最后一线灰白的光被云层吞没，地面散落着浅浅的水洼，倒映着铅灰色的天空，荒凉而苍茫，画面中没有人物。
- id: scene_02
  name: 泥沼夜行
  location: 松潘草地深处
  time: 深夜
  atmosphere: 风雨交加，泥泞没膝，黑暗与沼泽的威胁如影随形
  description: 雨水顺着你的眉骨往下淌，你眯起眼，还是看不清三步外的路。脚下的泥沼像活物一样，每拔一脚都要跟你较半天劲。你按着记忆里的符号探路——左弯的河沟该到了，可眼前只有一片白茫茫的水洼，连根像样的草都摸不着。身后的脚步声断断续续，老葛的锅在雨里磕碰出闷响，英子的喘息被风撕成碎片。你蹲下身，指尖在泥里摸索，想找回白天画下的那道深痕，可雨水早把一切都泡烂了。你心里一沉：记号没了。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的松潘草地，墨色的天幕低垂，豆大的雨点斜织成密不透风的雨帘。地面是深浅不一的泥沼，水洼反射着微弱的天光，枯黄的草甸在风雨中伏倒。远处隐约可见几丛低矮的灌木，被风吹得剧烈摇晃。一条被踩踏出的模糊小径蜿蜒伸向黑暗深处，路旁散落着几块半陷的草皮墩。整个画面笼罩在灰蓝与泥褐的冷色调中，雨雾弥漫，能见度极低。
