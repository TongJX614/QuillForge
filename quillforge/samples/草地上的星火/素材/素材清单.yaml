  - type: 角色立绘
    characters:
    - name: 石根生
    - name: 老葛
    - name: 英子
  - type: 场景背景
    scenes:
    - name: 草地黄昏
      mood: 阴云低垂，泥水泛着铁锈色，远处雷声隐隐，空气中弥漫着潮湿与焦灼
      details: 黄昏时分的茫茫草地，阴云低垂压向地面，泥沼水面泛着铁锈般的暗红色反光，枯草丛生，几株矮小灌木歪斜地插在泥水里，远处雷云翻滚，天边最后一线灰白的光被云层吞没，地面散落着浅浅的水洼，倒映着铅灰色的天空，荒凉而苍茫，画面中没有人物。
    - name: 泥沼夜行
      mood: 风雨交加，泥泞没膝，黑暗与沼泽的威胁如影随形
      details: 深夜的松潘草地，墨色的天幕低垂，豆大的雨点斜织成密不透风的雨帘。地面是深浅不一的泥沼，水洼反射着微弱的天光，枯黄的草甸在风雨中伏倒。远处隐约可见几丛低矮的灌木，被风吹得剧烈摇晃。一条被踩踏出的模糊小径蜿蜒伸向黑暗深处，路旁散落着几块半陷的草皮墩。整个画面笼罩在灰蓝与泥褐的冷色调中，雨雾弥漫，能见度极低。
