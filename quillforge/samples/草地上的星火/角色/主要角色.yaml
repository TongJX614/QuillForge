characters:
- id: char_01
  name: 石根生
  role: 主角
  species: human
  gender: male
  age: 19
  occupation: 红军某部通讯员
  appearance: 身材精瘦结实，晒成古铜色的长脸，颧骨高耸，浓眉下一双黑亮坚定的眼睛。身穿洗得发白、多处补丁的灰色粗布军装，头戴八角帽，腰间别着铜哨和旧牛皮文件包，脚穿磨损的草鞋。
  personality: 沉默寡言但心细如发，认死理，对战友有深沉的责任感
  voice_tone: 说话简短、声调低沉，紧张时会无意识地重复对方最后几个字，口头禅是“我再去看看”
  motivation: 把最后一份重要命令按时送到前卫营，绝不让任何一个战友因他的疏忽掉队
  background: 江西苏区出来的放牛娃，参军三年，从没上过学，靠画圈和符号记路，被连长称为“活地图”
  arc: 从只相信自己双腿的独行通讯员，学会把后背交给战友，理解“一个人走不远，一群人才能过草地”
- id: char_02
  name: 老葛
  role: 配角/精神支柱
  species: human
  gender: male
  age: 42
  occupation: 红军某部炊事班长
  appearance: 矮壮敦实，圆脸盘上刻满风霜皱纹，两鬓斑白，下巴留着乱茬胡须，一笑露出缺了门牙的牙床。军装外系着油亮的粗布围裙，背后背一口凹了底的黑铁锅，腰间挂着盐袋和小铜勺，草鞋上沾满泥浆。
  personality: 乐天派、爱张罗、嘴碎心热，再苦也要让战士喝上口热汤
  voice_tone: 嗓门大，爱用“娃儿”称呼年轻人，三句话不离吃食，常说“肚里有粮，心里不慌”
  motivation: 用一口铁锅和最后半袋青稞面，让身边的战士活着走出草地
  background: 当过十年长工，年过四十才参军，全连的“伙夫老爹”，背锅翻雪山时救过三个战士的命
  arc: 从执着于“喂饱每一个人”，到明白有时把最后一口粮让给年轻人，才是炊事班长最该做的事
- id: char_03
  name: 英子
  role: 配角/战友
  species: human
  gender: female
  age: 17
  occupation: 红军某部卫生员
  appearance: 个子娇小，圆脸，两条短辫塞在八角帽里，眼睛大而亮，嘴唇因长期缺水有些干裂。军装明显大了一号，袖口卷了好几道，斜挎一个印着红十字的旧药包，里面露出半截纱布和几个小药瓶。
  personality: 嘴快心软，倔强不服输，见不得别人受苦，自己受伤却总说“没事”
  voice_tone: 语速快，尾音上扬带点川音，爱用“莫得事”安慰人，急起来会连珠炮似的数落人
  motivation: 守住药包里最后几支针剂，留给最需要的伤员，一个都不放弃
  background: 川北穷苦人家的女儿，家乡闹红时跟着队伍走，在卫生队学了半年包扎，最怕看见战友倒下
  arc: 从只会哭着给伤员包扎的小丫头，成长为能在沼泽里冷静救人的真正卫生员
