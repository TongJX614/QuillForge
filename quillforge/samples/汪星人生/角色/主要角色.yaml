characters:
- id: char_01
  name: 林小凡
  role: 主角
  species: 狗（柯基）
  gender: male
  age: 28
  occupation: 程序员（变狗前）
  appearance: 一只三色柯基犬，毛色为黄白黑相间，短腿长身，大立耳，圆眼睛，尾巴短小，体型圆润，眼神充满人类式的困惑。
  personality: 理性、吐槽、自嘲
  voice_tone: 说话带程序员术语，爱用'编译失败''bug'等比喻，语气无奈但幽默。
  motivation: 找到变回人类的方法，同时适应狗的生活。
  background: 因加班过度在电脑前睡着，醒来变成了一只柯基，被邻居女孩收养。
  arc: 从抗拒狗身份到利用狗视角解决人际问题，最终接受新生活。
- id: char_02
  name: 苏小暖
  role: 女主
  species: human
  gender: female
  age: 25
  occupation: 宠物咖啡店店员
  appearance: 齐肩短发，圆脸，常穿浅色围裙，笑起来有酒窝，身上总带着宠物零食。
  personality: 善良、话多、乐观
  voice_tone: 语气轻快，爱用叠词，常对狗自言自语，口头禅'哎呀呀'。
  motivation: 给流浪宠物一个温暖的家。
  background: 独自经营一家小宠物咖啡店，收养了变成狗的男主。
  arc: 从把狗当宠物到逐渐察觉异常，最终成为男主的人类盟友。
- id: char_03
  name: 老黄
  role: 重要配角
  species: 狗（中华田园犬）
  gender: male
  age: 10
  occupation: 流浪狗首领
  appearance: 黄色短毛，体型精瘦，左耳有缺口，眼神沧桑，脖子上有旧项圈。
  personality: 老练、毒舌、讲义气
  voice_tone: 沙哑嗓音，爱用反问句，常说'小子，你太嫩了'。
  motivation: 守护街区流浪狗的生存地盘。
  background: 在街头混迹多年，见多识广，能听懂部分人类语言。
  arc: 从嫌弃男主是'宠物狗'到认可他，成为男主的导师。
- id: char_04
  name: 阿杰
  role: 反派
  species: human
  gender: male
  age: 30
  occupation: 宠物店老板
  appearance: 油头，穿花衬衫，戴金链，总是假笑，手持捕狗网。
  personality: 贪婪、狡猾、伪善
  voice_tone: 表面热情，实则话里带刺，常用'哎呀兄弟'开头。
  motivation: 抓流浪狗卖给地下繁殖场牟利。
  background: 表面经营正规宠物店，暗中做非法勾当。
  arc: 从得意到被揭穿，最终被法律制裁。
