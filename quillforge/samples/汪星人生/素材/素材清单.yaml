  - type: 场景背景
    scenes:
    - name: 加班惊变
      mood: 深夜出租屋里一片狼藉，屏幕幽光与窗外路灯交织，空气中弥漫着咖啡渍和惊慌失措的气息。
      details: 深夜的出租屋，电脑屏幕蓝光映亮桌面，水杯倾倒，水渍在地板上蔓延，窗外城市灯火稀疏，室内堆着外卖盒和代码打印纸。
    - name: 土豆的第一夜
      mood: 深夜的暖光与不安交织，陌生的狗窝里弥漫着狗粮和猫薄荷的混合气味，窗外偶有车灯扫过，室内则因一只不速之客的土狗而骤然紧张。
      details: 凌晨三点的宠物咖啡店二楼小客厅，暖黄色小夜灯，藤编狗窝和两只陶瓷碗摆在地板上，窗外街灯树影斑驳，天花板投下摇晃的光斑，墙边堆着宠物玩具和半开的储物柜。
