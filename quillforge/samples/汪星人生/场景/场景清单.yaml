scenes:
- id: scene_01
  name: 加班惊变
  location: 林小凡的出租屋
  time: 深夜
  atmosphere: 深夜出租屋里一片狼藉，屏幕幽光与窗外路灯交织，空气中弥漫着咖啡渍和惊慌失措的气息。
  description: 凌晨两点十七分，显示器的蓝光刺得你眼眶发酸，光标在代码行末尾一闪一闪，像在嘲笑你的无效加班。你揉着太阳穴，打算趴桌上眯五分钟——然后你被自己打翻的水杯冰醒了。不对，你是被水杯砸醒的，可你伸出去扶杯子的手不见了，取而代之的是一只毛茸茸的短腿，粉色的肉垫按在冰凉的地板上。你猛地抬头，屏幕映出一张尖耳朵、黑鼻头、眼神惊恐的狗脸。柯基。你变成了一只柯基。后腿蹬了两下才站稳，尾巴不受控制地摇，这具身体的每一个零件都在跟你作对。就在你试图用爪子敲键盘验证人生时，门口传来钥匙转动的声音。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的出租屋，电脑屏幕蓝光映亮桌面，水杯倾倒，水渍在地板上蔓延，窗外城市灯火稀疏，室内堆着外卖盒和代码打印纸。
- id: scene_02
  name: 土豆的第一夜
  location: 苏小暖的宠物咖啡店二楼小客厅
  time: 凌晨三点
  atmosphere: 深夜的暖光与不安交织，陌生的狗窝里弥漫着狗粮和猫薄荷的混合气味，窗外偶有车灯扫过，室内则因一只不速之客的土狗而骤然紧张。
  description: 你的激烈挣扎最终只换来苏小暖一句「哎呀呀力气还挺大」和更紧的怀抱。走廊尽头的门被推开，暖黄色的灯光洒下来，空气里浮着淡淡的猫薄荷和烘焙饼干的甜香。你被放进一个铺着软垫的藤编窝里，窝边摆着两只陶瓷碗，一只盛水一只空空如也。窗外街灯把树影投在天花板上，远处高架桥上偶尔驶过一辆夜车。你趴在窝里，短腿蜷着，尾巴不受控制地拍了拍垫子——这具身体连「安静趴着」都要跟你作对。苏小暖正背对着你翻柜子，塑料袋窸窸窣窣地响，她嘴里哼着不成调的歌。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 凌晨三点的宠物咖啡店二楼小客厅，暖黄色小夜灯，藤编狗窝和两只陶瓷碗摆在地板上，窗外街灯树影斑驳，天花板投下摇晃的光斑，墙边堆着宠物玩具和半开的储物柜。
