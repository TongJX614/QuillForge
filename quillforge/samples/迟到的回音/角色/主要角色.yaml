characters:
- id: char_01
  name: 陈守拙
  role: 主角
  species: human
  gender: male
  age: 75
  occupation: 退休邮递员
  appearance: 身高约一米七，身形瘦削但腰背挺直，满头银白短发梳理得一丝不苟，脸上布满深刻的皱纹，眼窝深陷却目光清亮，常穿洗得发白的藏蓝色中山装，口袋里插着一支旧钢笔。
  personality: 沉默寡言、固执、内心柔软
  voice_tone: 说话缓慢低沉，爱用'话说当年'开头，习惯在句尾加'罢了'，很少直接表达感情。
  motivation: 想弄明白这封五十年前的信为何现在才到，并弥补当年未说出口的遗憾。
  background: 当了四十年邮递员，老伴五年前去世，独生女在外地工作，每天最大的乐趣是整理旧物和喂巷口的流浪猫。
  arc: 从沉溺于过去的沉默老人，变成愿意主动联系女儿、重新拥抱生活的讲述者。
- id: char_02
  name: 林若溪
  role: 配角
  species: human
  gender: female
  age: 28
  occupation: 社区图书馆管理员
  appearance: 身高约一米六，圆脸，杏眼，扎着低马尾，几缕碎发垂在耳边，穿米白色针织开衫和帆布鞋，手腕上戴着一串旧铜铃铛手链。
  personality: 热情好奇、爱刨根问底、有点冒失
  voice_tone: 语速偏快，常带'诶？''真的假的？'等感叹，喜欢用叠词，讲到兴奋处会拍手。
  motivation: 想帮陈爷爷找到信背后的故事，顺便给自己的社区口述史项目找素材。
  background: 刚搬到这个老社区，负责整理旧档案时听说了陈守拙的事，主动上门帮忙。
  arc: 从单纯的好奇者，变成真正理解老人情感并学会耐心倾听的陪伴者。
- id: char_03
  name: 老周
  role: 配角
  species: human
  gender: male
  age: 78
  occupation: 退休中学语文教师
  appearance: 身高略矮，体态圆润，头顶微秃，两侧留着一圈白发，戴圆框眼镜，常穿灰色夹克和布鞋，手里总攥着一把折扇。
  personality: 健谈幽默、爱卖关子、重情义
  voice_tone: 喜欢引经据典，说话带文言腔调，常以'贤弟'称呼陈守拙，讲到关键处会故意停顿摇扇子。
  motivation: 想帮老友解开心结，也借机回忆自己当年的青春。
  background: 陈守拙的高中同学兼多年棋友，当年是那封信的见证人之一。
  arc: 从爱开玩笑的旁观者，变成坦承当年隐瞒之事的真诚老友。
- id: char_04
  name: 陈小满
  role: 配角
  species: human
  gender: female
  age: 45
  occupation: 建筑设计师
  appearance: 身高约一米六五，短发利落，眉眼与陈守拙有几分相似，穿深色西装外套和直筒裤，脖子上挂着工作牌，手指修长。
  personality: 干练果断、嘴硬心软、工作狂
  voice_tone: 说话简洁干脆，常用'知道了''回头再说'，不耐烦时会提高音量，但语气里藏着关心。
  motivation: 想接父亲去城里同住，却不知如何开口，只能用忙碌掩饰牵挂。
  background: 陈守拙的独生女，母亲去世后与父亲关系疏远，每月按时打钱却很少回家。
  arc: 从回避沟通的女儿，变成主动请假回家、陪父亲一起读完那封信的人。
