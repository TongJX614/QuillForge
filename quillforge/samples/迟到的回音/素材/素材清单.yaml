assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 陈守拙
    - name: 林若溪
    - name: 老周
    - name: 陈小满
  - type: 场景背景
    scenes:
    - name: 一封迟到五十年的信
      mood: 潮湿、安静、带着旧时光的微凉与恍惚
      details: 南方小城的老街巷，青石板路被细雨打湿泛着微光，两侧是斑驳的骑楼，墙面爬着青苔，屋檐滴着水珠。陈守拙家老屋的木门半掩，门框上贴着褪色的春联，门口摆着一张矮竹凳和一只搪瓷盆。巷口一棵老榕树垂下气根，雨雾中几只流浪猫蜷在墙角，远处骑楼下挂着一块褪色的邮筒，铁皮上锈迹斑斑。
    - name: 雨檐下的旧信
      mood: 潮湿微凉，雨声渐歇，光线从云缝里透下来，旧物与旧事在檐下缓缓展开
      details: 南方老街骑楼下的青石板地面被雨水打湿，泛着柔和的水光。屋檐滴着残余的雨水，一根竹竿横在廊柱间，上面挂着几件没来得及收的旧衣裳。墙角摆着一张矮竹凳和一张小木桌，桌上放着一把蒲扇和一只搪瓷杯。远处巷子被雨雾笼罩，青灰色的瓦顶层层叠叠，几株墙头草在风里轻轻摇晃。
