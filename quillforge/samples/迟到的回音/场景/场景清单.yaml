scenes:
- id: scene_01
  name: 一封迟到五十年的信
  location: 老街巷·陈守拙家老屋门口
  time: 阴雨午后
  atmosphere: 潮湿、安静、带着旧时光的微凉与恍惚
  description: 雨丝斜斜地落在青石板上，溅起细碎的水花。你站在老屋门口，手里捏着那封刚从邮递员那儿接过来的信，指腹摩挲过泛黄的纸面，像摸到一块被岁月磨温的旧木头。信封上的字迹歪歪扭扭，分明是你年轻时候的手笔——可邮戳上的日期，清清楚楚是五十年前。你愣在原地，雨声忽然变得很远，巷口那只三花猫慢悠悠蹭过来，尾巴扫过你的裤脚，湿漉漉的。远处的骑楼下传来谁家收衣服的竹竿碰撞声，一切都和往常一样，只有这封信，像从地底下冒出来似的，烫着你的手。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 南方小城的老街巷，青石板路被细雨打湿泛着微光，两侧是斑驳的骑楼，墙面爬着青苔，屋檐滴着水珠。陈守拙家老屋的木门半掩，门框上贴着褪色的春联，门口摆着一张矮竹凳和一只搪瓷盆。巷口一棵老榕树垂下气根，雨雾中几只流浪猫蜷在墙角，远处骑楼下挂着一块褪色的邮筒，铁皮上锈迹斑斑。
- id: scene_02
  name: 雨檐下的旧信
  location: 陈守拙家老屋门口骑楼下
  time: 午后，雨势渐小
  atmosphere: 潮湿微凉，雨声渐歇，光线从云缝里透下来，旧物与旧事在檐下缓缓展开
  description: 雨势渐渐收住，只剩下屋檐还在一滴一滴地数着时辰。你搬来那张竹凳坐下，凳面被雨水沁得微凉，透过裤腿渗上来，倒让你清醒了几分。林若溪捧着信纸站在你面前，肩膀还是湿的，却浑然不觉似的，两只眼睛亮得能照见人影。老周收了蒲扇，往廊柱上一靠，扇子别在腰后，那副神情像是等着听一出早就知道结局的戏。巷口的三花猫不知什么时候钻到了桌底下，蜷成一团。你深吸一口气，把双手搁在膝上，点了点头。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 南方老街骑楼下的青石板地面被雨水打湿，泛着柔和的水光。屋檐滴着残余的雨水，一根竹竿横在廊柱间，上面挂着几件没来得及收的旧衣裳。墙角摆着一张矮竹凳和一张小木桌，桌上放着一把蒲扇和一只搪瓷杯。远处巷子被雨雾笼罩，青灰色的瓦顶层层叠叠，几株墙头草在风里轻轻摇晃。
