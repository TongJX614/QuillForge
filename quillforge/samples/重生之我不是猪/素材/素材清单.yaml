    - name: 重生之猪圈惊魂
      mood: 晨雾缭绕的泥泞猪圈，荒诞与真实交织，带着一股初来乍到的慌张和花妞没心没肺的欢快。
      details: 清晨薄雾中的南方乡村养猪场，低矮的砖砌猪圈，铁皮顶棚滴着露水，泥泞的围栏地面散落着稻草，远处是青翠的丘陵和几亩水稻田，天色微亮，光线柔和而潮湿。
