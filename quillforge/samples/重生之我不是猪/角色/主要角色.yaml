characters:
- id: char_01
  name: 朱重生
  role: 主角
  species: 猪
  gender: male
  age: 28
  occupation: 前互联网大厂程序员，现养猪场头号吃货
  appearance: 一头体格健壮的成年公猪，黑色鬃毛从额头竖起到脊背，皮肤粉白但沾满泥点，一对大耳朵像两片耷拉的蒲扇，眼睛小而圆，透着不合时宜的精明，尾巴卷成螺旋状，时不时甩动，左耳有一个被耳标打过的小缺口。
  personality: 精于算计、碎嘴吐槽、内心柔软
  voice_tone: 说话总带代码思维，爱用'迭代''优化''跑个流程'等词，口头禅是'这不科学'，内心独白时语速极快，对外只会哼哼，但能通过哼哼的节奏表达情绪。
  motivation: 搞清楚自己为什么重生为猪，并想办法恢复人形，或者至少活出猪的生命价值。
  background: 生前是996程序员，猝死后一睁眼变成养猪场里的一头猪，保留了全部人类记忆和编程思维。
  arc: 从嫌弃猪身、整天想逃，到接纳现状并用人类智慧改变猪圈生态，最终重新定义'活着'的意义。
- id: char_02
  name: 林晓雯
  role: 女主
  species: human
  gender: female
  age: 26
  occupation: 兽医
  appearance: 身高165cm左右，扎着低马尾，穿藏青色工作服和防水胶鞋，脸上有几颗雀斑，左手腕戴着一根红绳，指甲剪得很短，随身背着兽医药箱。
  personality: 善良较真、面冷心热、对动物有读心般的直觉
  voice_tone: 说话干脆利落，带一点南方口音，对动物会用哄小孩的语气，对不靠谱的人会直接怼，口头禅是'你不对劲'。
  motivation: 想找出这头行为异常的黑猪到底得了什么病，顺便保住养猪场不被老板卖掉。
  background: 农大兽医专业毕业，被分配到这个半死不活的养猪场，是全场唯一真心关心猪的人。
  arc: 从把朱重生当成疑难病例，到逐渐信任这头'通人性'的猪，最后成为唯一知道真相的人类。
- id: char_03
  name: 黄大壮
  role: 配角/养猪场老板
  species: human
  gender: male
  age: 48
  occupation: 养猪场老板
  appearance: 身材矮胖，圆脸，头顶微秃，穿一件洗得发白的polo衫，腰间挂一大串钥匙，脚踩人字拖，手指上戴一个金戒指，走路时肚子先到。
  personality: 抠门精明、爱吹牛、关键时刻讲义气
  voice_tone: 嗓门大，爱拍大腿，说话喜欢带'我跟你说'开头，算账时语速飞快，喝多了就爱讲当年勇。
  motivation: 把养猪场维持下去，最好能靠这头'网红猪'翻身还债。
  background: 养猪场是祖上传下来的，前几年行情不好欠了一屁股债，正琢磨着把场子卖了去城里开网约车。
  arc: 从只想把猪卖了还债，到被朱重生的'灵性'打动，决定再拼一次。
- id: char_04
  name: 花妞
  role: 配角/猪圈同伴
  species: 猪
  gender: female
  age: 2
  occupation: 养猪场原住民母猪
  appearance: 一头粉白色的小母猪，体型比朱重生小两圈，圆滚滚的肚子，耳朵上有一撮卷毛，鼻头永远是湿漉漉的粉色，眼睛大而温顺，最爱在泥坑里打滚。
  personality: 天真乐天、贪吃、对一切充满好奇
  voice_tone: 只会哼哼，但哼声节奏丰富，高兴时是短促的三连哼，害怕时是拉长的颤音，朱重生能听懂她在'说'什么。
  motivation: 每天吃饱、拱泥、晒太阳，对生活没有更高的要求。
  background: 从小在养猪场长大，是黄大壮女儿养大的宠物猪，所以逃过了被卖的命运。
  arc: 从单纯快乐的猪，到被朱重生的焦虑感染，最后反而教会朱重生什么是真正的快乐。
