scenes:
- id: scene_01
  name: 重生之猪圈惊魂
  location: 南方丘陵间的家庭养猪场·猪圈
  time: 清晨
  atmosphere: 晨雾缭绕的泥泞猪圈，荒诞与真实交织，带着一股初来乍到的慌张和花妞没心没肺的欢快。
  description: 晨雾还没散尽，湿漉漉的空气里混着泥浆和稻草的气味。你从一堆温热的烂泥里睁开眼，视线低得离谱——只能看见自己面前一摊浑浊的水洼，倒映出一个粉黑色的、圆滚滚的猪鼻子。你试着抬手，抬起来的却是一只蹄子。猪圈的铁皮顶棚滴着露水，远处丘陵上传来几声鸟叫，一切安静得像一场荒谬的梦。但泥巴的凉意、胃里的饥饿感、还有那股控制不住的想往泥里拱的冲动，真实得让你头皮发麻。就在这时，一团毛茸茸的粉影子欢快地冲过来，把你撞了个趔趄。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 清晨薄雾中的南方乡村养猪场，低矮的砖砌猪圈，铁皮顶棚滴着露水，泥泞的围栏地面散落着稻草，远处是青翠的丘陵和几亩水稻田，天色微亮，光线柔和而潮湿。
