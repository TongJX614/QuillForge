scenes:
- id: scene_01
  name: 末班车·第十三站
  location: 末班地铁车厢内与幽灵站站台
  time: 暴雨深夜
  atmosphere: 潮湿、寂静中带着异样的低鸣，灯光闪烁如呼吸
  description: 雨水顺着你的发梢滴在深绿色绒布座椅上，洇开一小片深色。你刚把湿透的包甩上行李架，列车就一头扎进没有灯的隧道，窗玻璃瞬间变成一面黑镜子，只映出你自己疲惫又狼狈的脸。车厢里除了你，只有一个穿深蓝制服的老司机坐在驾驶室半开的门后打瞌睡，花白的后脑勺一点一点。你掏出手机——没信号，隧道嘛，正常。可当广播“滋啦”一声响起，报出一个你在这条线上住了三年从未听过的站名时，你抬起头，看见车门正缓缓滑开，冷白的光涌进来，站台上水磨石地面湿漉漉的，一个穿蓝白校服的小女孩站在那里，安安静静地看着你。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 暴雨如注的深夜地铁隧道，末班车厢内暖黄灯光映着湿漉漉的玻璃窗，窗外漆黑一片，只有雨痕蜿蜒；车厢连接处光线昏暗，座椅是旧式深绿色绒布；隧道深处隐约透出老式站台的冷白日光灯管，站台地面铺着褪色的水磨石，墙上是二十年前的瓷砖广告，雨从站台边缘的缝隙渗进来，积水映着灯光。
- id: scene_02
  name: 三分钟·站台
  location: 幽灵站站台
  time: 深夜·暴雨
  atmosphere: 冷白灯管忽明忽暗，雨水从站台边缘的缝隙渗进来，空气中弥漫着潮湿的旧水泥味和隐约的广播回声
  description: 你咬咬牙，一脚跨出车门，鞋底踩上湿冷的水磨石地面，水花溅起，凉意顺着脚踝往上爬。身后的车门没有立刻关上，发出一种低沉的嗡鸣，像在等你反悔。站台上的空气比车厢冷得多，带着旧水泥和铁锈的味道，头顶的灯管闪了两下，把你的影子拉长又缩短。那个叫小满的女孩站在两步开外，校服领口洗得发白，手里还举着那只皱巴巴的信封，眼睛一眨不眨地看着你，像怕你下一秒就消失。你下意识摸向口袋里的手机——屏幕亮着，但没有信号，时间停在二十三点五十九分，秒数一动不动。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 一座二十年前风格的老式地铁站台，水磨石地面湿漉漉地反着冷白灯光，天花板上几根日光灯管接触不良地闪烁，墙壁贴着褪色的米色瓷砖，站台边缘画着已经模糊的黄色安全线，隧道口的黑洞里隐约传来雨声和滴水声，站台立柱上挂着一面落满灰尘的老式圆钟，指针停在某处。
