main_plot:
  summary: 暴雨夜，加班到深夜的林晚坐上末班地铁，列车驶入一座地图上不存在的老车站。她在站台遇见等待了十年的灵体女孩小满和沉默的老司机老周，被迫面对一封无法送达的信，也面对自己一直逃避的亲情遗憾。
  themes:
  - 告别与释怀
  - 都市孤独中的联结
  - 未说出口的爱
  core_conflict: 林晚必须在天亮前帮小满把信送到她母亲手中，才能搭上返程的末班车，而这个过程逼她直面自己与母亲之间的未解心结。
