assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 林晚
    - name: 老周
    - name: 小满
    - name: 周敏
  - type: 场景背景
    scenes:
    - name: 末班车·第十三站
      mood: 潮湿、寂静中带着异样的低鸣，灯光闪烁如呼吸
      details: 暴雨如注的深夜地铁隧道，末班车厢内暖黄灯光映着湿漉漉的玻璃窗，窗外漆黑一片，只有雨痕蜿蜒；车厢连接处光线昏暗，座椅是旧式深绿色绒布；隧道深处隐约透出老式站台的冷白日光灯管，站台地面铺着褪色的水磨石，墙上是二十年前的瓷砖广告，雨从站台边缘的缝隙渗进来，积水映着灯光。
    - name: 三分钟·站台
      mood: 冷白灯管忽明忽暗，雨水从站台边缘的缝隙渗进来，空气中弥漫着潮湿的旧水泥味和隐约的广播回声
      details: 一座二十年前风格的老式地铁站台，水磨石地面湿漉漉地反着冷白灯光，天花板上几根日光灯管接触不良地闪烁，墙壁贴着褪色的米色瓷砖，站台边缘画着已经模糊的黄色安全线，隧道口的黑洞里隐约传来雨声和滴水声，站台立柱上挂着一面落满灰尘的老式圆钟，指针停在某处。
