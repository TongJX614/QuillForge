characters:
- id: char_01
  name: 林晚
  role: 主角
  species: human
  gender: female
  age: 26
  occupation: 互联网公司运营专员
  appearance: 身高约165cm，偏瘦，齐肩短发因连日加班有些毛躁，黑眼圈明显但眼睛大而亮。穿着皱巴巴的浅灰色通勤衬衫和黑色西裤，背一个塞满文件的帆布包，手里攥着快没电的手机。
  personality: 现实主义者、嘴硬心软、习惯性焦虑
  voice_tone: 说话快，爱用反问句吐槽，紧张时会自言自语列清单，口头禅是“行吧行吧”和“这不合理”。
  motivation: 赶在暴雨封路前回到独居的出租屋，第二天还有一场关乎转正的提案。
  background: 独自在大城市打拼三年，习惯用加班麻痹对家乡的思念，父亲两年前病逝后与母亲关系疏远。
  arc: 从用忙碌逃避情感，到被迫直面内心最深的遗憾，学会主动联系母亲。
- id: char_02
  name: 老周
  role: 关键配角/引路人
  species: human
  gender: male
  age: 58
  occupation: 地铁末班车司机（已退休返聘）
  appearance: 身高175cm，微驼背，花白寸头，脸膛黝黑布满皱纹，穿洗得发白的深蓝地铁制服，胸口别着磨损的工号牌，手里总拎一个老式铝制保温杯。
  personality: 沉默寡言、观察力惊人、有老派温情
  voice_tone: 语速极慢，爱用“嗯”开头，说话像在报站，偶尔冒出一句老派谚语，从不正面回答问题。
  motivation: 在这条线上开了三十年车，想确认一个困扰自己多年的秘密。
  background: 年轻时在幽灵站所在位置附近的老街区长大，对消失的车站有模糊的童年记忆，曾有一位在此站下车的故人。
  arc: 从沉默的旁观者，到主动交出车钥匙，让林晚替自己完成未竟的告别。
- id: char_03
  name: 小满
  role: 关键配角/谜团核心
  species: 灵体
  gender: female
  age: 10
  occupation: 生前是小学三年级学生
  appearance: 半透明灵体，身形瘦小约120cm，齐耳波波头，穿红白相间的校服和旧白球鞋，胸前别一朵褪色的纸绢花，皮肤苍白无血色，双脚离地悬浮约五厘米，靠近时周围空气会变凉，情绪波动时轮廓会闪烁。
  personality: 天真执拗、记忆力惊人、用孩子的逻辑理解死亡
  voice_tone: 声音又轻又脆，像隔着一层水，爱把问题重复三遍，叫林晚“姐姐”，说“姐姐你听我说”开头。
  motivation: 想让人帮她把一封没送出去的信交给妈妈。
  background: 十年前在暴雨天独自坐末班车回家，在幽灵站下车后再也没能离开，她只记得妈妈的名字和家的方向。
  arc: 从困在站台反复等待，到愿意放手把信交给林晚，接受自己已经到站的事实。
- id: char_04
  name: 周敏
  role: 配角/情感落点
  species: human
  gender: female
  age: 52
  occupation: 社区图书馆管理员
  appearance: 身高160cm，微胖，短发别在耳后，穿深绿色针织开衫和布裤，戴细框眼镜，眼角有细纹，手腕上戴一根褪色的红绳。
  personality: 温和克制、有未愈的伤口、习惯性照顾别人
  voice_tone: 声音轻柔，说话前会先轻轻吸一口气，喜欢用“没关系”开头，提到女儿时会突然停顿。
  motivation: 守着女儿留下的东西，用平静的日常消化无法言说的失去。
  background: 十年前女儿小满在暴雨夜失踪，她搬到城市另一端生活，在社区图书馆工作，每年那天都会坐一次末班地铁。
  arc: 从用沉默封存记忆，到接过信后终于放声哭出来，决定把女儿的故事讲给更多人听。
