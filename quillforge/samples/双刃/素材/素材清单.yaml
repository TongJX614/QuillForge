assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 王尹君
    - name: 佟佳鑫
    - name: 老猫
    - name: 苏曼青
  - type: 场景背景
    scenes:
    - name: 雨夜旧货市场
      mood: 潮湿、昏暗、被雨声包裹的逼仄空间，旧物气息与铁锈味混杂，一盏昏黄灯泡在头顶摇晃
      details: 南方旧城区骑楼下的狭窄店铺，深夜暴雨，卷帘门半拉，店内堆满待修的旧钟表、收音机和泛黄纸箱，一盏裸露的灯泡悬在头顶投下昏黄光圈，玻璃柜台上散落着螺丝刀和拆开的机芯，门外雨幕如注，霓虹灯牌在水洼里晕开模糊的红绿倒影
    - name: 灯下对账
      mood: 雨声渐密，昏黄灯光下纸张与旧金属的气味交织，沉默里全是试探
      details: 旧货市场深处的狭小铺面，深夜，两排玻璃柜台挤出一条窄过道，柜中陈列着数十块停摆的旧表和旧收音机，一盏昏黄的吊灯垂下，灯光落在柜台上一张被推过来的纸质文件上，卷帘门外是连绵雨幕与骑楼瓦檐滴落的水线，玻璃上凝着雾气，整体光影昏暗而潮湿
    - name: 名单的重量
      mood: 雨势渐歇，车内密闭而克制，仪表盘微光映着两张各怀心事的脸
      details: 深夜雨后的旧城区街道，黑色轿车停在骑楼阴影下，挡风玻璃上残留的水珠折射着远处便利店的冷白灯光，车窗内隐约透出仪表盘幽蓝微光，车外柏油路面湿亮，倒映着褪色的霓虹招牌，雨后的水汽在路灯下浮动成薄雾
