characters:
- id: char_01
  name: 王尹君
  role: 主角（前刑警，现为独立调查员）
  species: human
  gender: female
  age: 29
  occupation: 独立调查员（前市局刑侦支队副队长）
  appearance: 身形高挑精瘦，肩背挺直如尺；短发齐耳、发色自然黑，常将一侧别于耳后；眉骨清晰，眼尾微挑，瞳色深褐；常年穿深灰风衣配黑色高领衫与直筒长裤，脚蹬短靴，左手腕戴一只旧钢表。
  personality: 冷静缜密、执拗、不擅示弱
  voice_tone: 语速偏慢，用词精准，习惯先陈述事实再下判断，极少用感叹词；紧张时会下意识重复对方话里的关键词。
  motivation: 查清三年前那起导致她离开警队的案件真相，并亲手抓住幕后之人。
  background: 曾是市局最年轻的副队长，因一次行动中关键证据链断裂而被调离，从此以独立身份追查旧案线索。
  arc: 从只信证据、隔绝情感，到学会在真相与人心之间做出选择。
- id: char_02
  name: 佟佳鑫
  role: 主角（金融集团高管，亦敌亦友）
  species: human
  gender: male
  age: 31
  occupation: 鑫和资本合伙人
  appearance: 身高约一米八五，身形修长，肩线利落；深棕短发三七分、打理得一丝不乱；眉眼温和却带锋，鼻梁挺直，下颌线清晰；常着炭灰三件套西装、白衬衫不系领带，袖扣为银色小方块；左手无名指有一枚素圈银戒。
  personality: 温文尔雅、善于周旋、控制欲极强
  voice_tone: 声音偏低而稳，习惯用“我们”代替“我”，句末常带一个轻轻的“呢”或“吧”；越是危险的话题，语气越轻。
  motivation: 保住家族企业并彻底抹掉三年前那笔资金的痕迹，同时不愿王尹君真正受伤。
  background: 鑫和资本最年轻的合伙人，人前是慈善晚宴的常客，人后替家族处理见不得光的旧账；三年前与王尹君有过一段未公开的关系。
  arc: 从用谎言筑墙、把所有人当棋子，到被迫面对自己亲手毁掉的东西。
- id: char_03
  name: 老猫
  role: 配角（线人，前刑侦支队技术员）
  species: human
  gender: male
  age: 47
  occupation: 旧货店老板（前警队技术员）
  appearance: 中等身材、微驼背，头发花白且蓬乱如鸟窝；圆脸、眼袋明显，常年穿洗得发白的军绿色夹克和卡其裤，脚上一双旧布鞋；胸前挂着一副用胶带缠过镜腿的老花镜。
  personality: 嘴碎心细、胆小但讲义气、记仇
  voice_tone: 语速快、爱唠叨，三句话不离“我跟你说”，习惯用“啧”开头；紧张时反复搓手并压低声音。
  motivation: 安安稳稳守着自己的小店，同时还清当年欠王尹君的人情。
  background: 三年前因操作失误导致关键数据丢失而被清退，如今在旧货市场替人修表修收音机，暗地里仍替王尹君跑腿查资料。
  arc: 从只想自保的旁观者，到关键时刻站出来作证。
- id: char_04
  name: 苏曼青
  role: 反派（鑫和资本法务总监）
  species: human
  gender: female
  age: 38
  occupation: 鑫和资本法务总监
  appearance: 身高约一米七，身形利落如刀；深栗色长发一丝不苟地盘成低髻，露出光洁额头；凤眼薄唇，妆容永远是哑光红唇配细眉；穿黑色修身西装裙套装，耳垂上一对珍珠耳钉，右手常执一支黑色钢笔。
  personality: 精于算计、滴水不漏、从不感情用事
  voice_tone: 语速均匀、用词书面化，习惯先给出结论再补充“依据”；从不说“可能”，只说“是”或“不是”。
  motivation: 确保三年前的账目永远沉底，并借机将佟佳鑫踢出局、独掌鑫和。
  background: 鑫和资本元老，替集团处理过多起危机公关与法务纠纷；三年前那笔资金的经手人正是她，而她把痕迹嫁祸给了当时在场的王尹君。
  arc: 从稳坐幕后的操盘手，到被自己布下的局反噬。
