scenes:
- id: scene_01
  name: 雨夜旧货市场
  location: 明州旧城区·老猫的修理铺
  time: 深夜
  atmosphere: 潮湿、昏暗、被雨声包裹的逼仄空间，旧物气息与铁锈味混杂，一盏昏黄灯泡在头顶摇晃
  description: 雨从傍晚就没停过，水珠顺着骑楼的瓦檐连成线，在卷帘门前砸出一片密响。老猫的铺子缩在旧货市场最里头，两排玻璃柜把空间挤得只剩一条过道，柜里躺着几十块停摆的旧表，指针全停在不同的时刻。你坐在柜台前的塑料凳上，手里那张转账流水复印件被潮气泡得发软，金额栏的数字模糊得像被谁故意蹭过。老猫蹲在角落翻一只铁皮盒，嘴里念念有词。风铃突然响了一声，很轻，被雨声盖去大半，可你听见了——门口的黑伞缓缓收拢，来人站在昏黄的光与雨幕的交界处，皮鞋尖沾着水，笑得很浅。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 南方旧城区骑楼下的狭窄店铺，深夜暴雨，卷帘门半拉，店内堆满待修的旧钟表、收音机和泛黄纸箱，一盏裸露的灯泡悬在头顶投下昏黄光圈，玻璃柜台上散落着螺丝刀和拆开的机芯，门外雨幕如注，霓虹灯牌在水洼里晕开模糊的红绿倒影
- id: scene_02
  name: 灯下对账
  location: 旧货市场老猫的铺子
  time: 深夜
  atmosphere: 雨声渐密，昏黄灯光下纸张与旧金属的气味交织，沉默里全是试探
  description: 你把那张被潮气泡软的复印件推到吊灯正下方，指尖压住一角，让模糊的金额栏正对着他。灯光透过纸背，那些被蹭花的数字显出深浅不一的灰。雨声在卷帘门外连成一片，铺子里静得能听见旧表壳里某根游丝偶然的轻响。佟佳鑫没有立刻低头，他先看了你一眼，那眼神像在称量什么，然后才把视线落到纸上。老猫缩在柜台最里头，连呼吸都放轻了，只把搓手的动作停在了半空。你注意到佟佳鑫收伞时留在袖口的水痕，正一点点洇进他衬衫的袖扣旁边。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 旧货市场深处的狭小铺面，深夜，两排玻璃柜台挤出一条窄过道，柜中陈列着数十块停摆的旧表和旧收音机，一盏昏黄的吊灯垂下，灯光落在柜台上一张被推过来的纸质文件上，卷帘门外是连绵雨幕与骑楼瓦檐滴落的水线，玻璃上凝着雾气，整体光影昏暗而潮湿
- id: scene_03
  name: 名单的重量
  location: 明州旧城区·佟佳鑫的车内
  time: 深夜
  atmosphere: 雨势渐歇，车内密闭而克制，仪表盘微光映着两张各怀心事的脸
  description: 雨声终于从密响退成稀疏的滴答，顺着车顶滑落，在挡风玻璃上拖出一道道歪斜的水痕。佟佳鑫的车停在骑楼阴影里，引擎熄着，只有仪表盘漏出一点幽蓝的光，把两个人的轮廓都削得很薄。名单就搁在你们之间的中控台上，一张对折过的A4纸，边角还带着打印机残留的余温。你没有去拿，先看他的侧脸——雨后的路灯透过水痕照进来，在他下颌线上切成明暗两半。街对面便利店的冷白灯箱亮着，一个穿雨衣的人正收伞进门。他把车窗降下一条缝，潮湿的空气立刻钻进来，混着他身上淡淡的木质气息。那张纸在空气里轻轻翘起一角，像在等你先开口。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜雨后的旧城区街道，黑色轿车停在骑楼阴影下，挡风玻璃上残留的水珠折射着远处便利店的冷白灯光，车窗内隐约透出仪表盘幽蓝微光，车外柏油路面湿亮，倒映着褪色的霓虹招牌，雨后的水汽在路灯下浮动成薄雾
