characters:
- id: char_01
  name: 郭靖
  role: 主角
  species: human
  gender: male
  age: 35
  occupation: 襄阳守将、丐帮名誉长老
  appearance: 身长八尺，肩宽腰细，肌肉虬结如铁铸。面如古铜，浓眉大眼，鼻直口方，眉宇间一股坚毅憨厚之气。常年束发戴一顶旧毡帽，身穿洗得发白的粗布青袍，外罩软皮甲，腰间系一条牛皮板带，足蹬牛皮短靴。双手骨节粗大，掌心布满厚茧。
  personality: 大智若愚、重义轻生、拙于言辞而敏于行
  voice_tone: 语速缓慢，用词朴实如“俺”“咱们”，很少用华丽辞藻，激动时声音低沉发颤，常以“蓉儿说……”开头引用妻子的话
  motivation: 守住襄阳一城百姓，不负江南七怪与洪七公的教诲
  background: 自幼丧父，由江南七怪教养成人，后得洪七公传授降龙十八掌，与黄蓉结为夫妻。如今蒙古大军压境，他携妻儿镇守襄阳已逾十年。
  arc: 从一心只想做个好人的憨厚少年，成长为明知不可为而为之的家国脊梁
- id: char_02
  name: 黄蓉
  role: 女主角
  species: human
  gender: female
  age: 33
  occupation: 丐帮帮主、襄阳军师
  appearance: 身形纤细高挑，肌肤胜雪，一双杏眼灵动如秋波，眼角微微上挑，笑起来狡黠如狐。乌黑长发以一根素银簪绾成堕马髻，鬓边常别一朵新鲜野花。身穿淡黄色窄袖短衫，外罩翠绿比甲，腰束鹅黄丝绦，足踏软底绣鞋，行走时轻捷无声。
  personality: 机变百出、快意恩仇、护短且记仇
  voice_tone: 语速极快，常带戏谑笑音，爱说“你猜怎么着”“笨死了”，对丈夫说话时温柔中带嗔怪，对敌人则句句带刺
  motivation: 用尽一切智计保住襄阳，同时护住郭靖和一双儿女
  background: 东邪黄药师之女，自幼在桃花岛长大，精通奇门遁甲与厨艺。与郭靖成婚后将丐帮事务交给鲁有脚，自己全力辅佐丈夫守城。
  arc: 从游戏人间的聪明女子，学会接受有些局终究算不尽、守不住
- id: char_03
  name: 杨过
  role: 关键配角
  species: human
  gender: male
  age: 20
  occupation: 江湖游侠
  appearance: 身量颀长，面容俊朗却带三分孤傲之色，剑眉斜飞入鬓，左袖空空随风飘荡。黑发以一根木簪随意束起，几缕碎发垂在颊边。身穿玄色窄袖劲装，腰间悬一柄无鞘玄铁重剑，足踏薄底快靴，步履间有孤狼之态。
  personality: 狂放不羁、外冷内热、口硬心软
  voice_tone: 语速中等偏快，言辞锋利带刺，常冷笑反问“凭什么”，但说到小龙女时会突然放轻声音
  motivation: 查明父亲杨康死因真相，同时不愿见襄阳百姓遭难
  background: 自幼流落嘉兴，被郭靖寻回后因误会出走，断臂后得神雕相助练成玄铁剑法，如今独来独往于襄阳城外。
  arc: 从一心只想报私仇的偏激少年，重新理解“侠之大者”四字的分量
- id: char_04
  name: 金轮法王
  role: 反派
  species: human
  gender: male
  age: 55
  occupation: 蒙古国师
  appearance: 身躯魁梧如铁塔，肩宽背厚，比常人高出大半个头。面庞方正，颧骨高耸，虬髯灰白浓密，一双鹰目深陷，目光如刀。头戴金箍束发，身穿大红僧袍，外披金线绣纹的袈裟，颈挂一百零八颗人骨念珠，手持九环金轮，轮上铜环撞击声如催命。
  personality: 高傲自负、执念深重、惜才如命
  voice_tone: 声若洪钟，说话慢条斯理却字字压人，常以“老衲”自称，爱说“可惜了”“若你肯拜老衲为师……”
  motivation: 为蒙古攻下襄阳，同时收一个能继承龙象般若功的衣钵传人
  background: 西藏密宗高手，受忽必烈之邀助蒙古南征，毕生浸淫龙象般若功已至第十层，一心要在中原武林扬名立万。
  arc: 从执着于胜负的武痴，在最终对决中面对“为何而战”的诘问
