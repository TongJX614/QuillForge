assets:
  visual:
  - type: 角色立绘
    characters:
    - name: 郭靖
    - name: 黄蓉
    - name: 杨过
    - name: 金轮法王
  - type: 场景背景
    scenes:
    - name: 夜雨孤城
      mood: 夜雨潇潇，孤城危立，灯火与雨幕交织出压抑而紧绷的临战气氛
      details: 深秋雨夜中的古城墙，雨水顺着青灰色城砖流淌，城头火把在风雨中明灭不定，远处平原上蒙古军营的灯火连成一片模糊的光带，夜空低沉无星，雨丝斜织如幕
    - name: 聚义厅夜议
      mood: 灯火昏黄，雨声渐歇，议事厅内气氛凝重，众人各怀心思，一场关乎全城存亡的博弈刚刚拉开序幕。
      details: 深夜的古代守备府议事厅，油灯昏黄，墙上悬挂大幅城防地图，长木桌上散落竹签与草图，窗外雨丝将歇，檐角滴水，石阶湿滑反光，厅内空无一人。
    - name: 灯下问心
      mood: 灯影摇曳，夜风微凉，一场关乎生死的密议在方寸斗室间悄然成形，悲壮中透着一丝暖意
      details: 深夜的守府偏厅内景，一盏油灯将昏黄的光晕投在斑驳的木桌与摊开的地图上，窗外夜雨初歇，檐角残滴映着微光，墙上挂着旧甲与弓弩，气氛沉凝而安静
