main_plot:
  summary: 蒙古大军围困襄阳，郭靖黄蓉死守孤城。金轮法王携武林高手助阵，杨过意外卷入。忠义与私仇、守城与破城，一场决定天下命运的决战在烽火中展开。
  themes:
  - 家国大义与个人恩怨
