scenes:
- id: scene_01
  name: 夜雨孤城
  location: 襄阳城头
  time: 深秋夜雨
  atmosphere: 夜雨潇潇，孤城危立，灯火与雨幕交织出压抑而紧绷的临战气氛
  description: 雨丝斜织，将城头的火把浇得噼啪作响。你裹着湿透的蓑衣，手扶垛口，望向远处蒙古大营——灯火连成一片星河，望不到尽头。城墙上守军三三两两缩在箭垛后，有人啃着硬得硌牙的干饼，有人抱着长枪打盹。雨水顺着你的胡茬淌下，你浑然不觉，只是反复摩挲着城砖上一道深深的刀痕。十年了，这城墙上的每一道裂口你都摸得出来。忽然身后传来急促的脚步声，踩得积水四溅。你回头，见黄蓉提着一盏风灯快步走来，灯罩被雨打得歪斜，她鬓角湿了一缕，手里攥着一封火漆密信，脸色在灯火下明灭不定。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深秋雨夜中的古城墙，雨水顺着青灰色城砖流淌，城头火把在风雨中明灭不定，远处平原上蒙古军营的灯火连成一片模糊的光带，夜空低沉无星，雨丝斜织如幕
- id: scene_02
  name: 聚义厅夜议
  location: 襄阳城守备府聚义厅
  time: 深夜
  atmosphere: 灯火昏黄，雨声渐歇，议事厅内气氛凝重，众人各怀心思，一场关乎全城存亡的博弈刚刚拉开序幕。
  description: 你一声令下，守城将领们冒着夜雨陆续赶到聚义厅。厅内油灯昏黄，墙上的襄阳城防图被穿堂风吹得微微翻卷。王坚、吕文焕等将佐甲胄未卸，脸上还带着城头的泥水，围站一圈。黄蓉已铺开一幅手绘的敌军布防草图，墨迹未干处晕开一小片。杨过也被你硬拉了进来，独臂抱剑靠在门框边，斗笠摘了，湿发贴在额角，一双眼睛半眯着，看不出在想什么。厅外雨声渐小，檐角滴水却更显清晰，一滴一滴敲在石阶上，像在数着城中仅剩的粮草。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: true
  critical_choice: ''
  narrative_notes: 深夜的古代守备府议事厅，油灯昏黄，墙上悬挂大幅城防地图，长木桌上散落竹签与草图，窗外雨丝将歇，檐角滴水，石阶湿滑反光，厅内空无一人。
- id: scene_03
  name: 灯下问心
  location: 襄阳城守府偏厅
  time: 深夜
  atmosphere: 灯影摇曳，夜风微凉，一场关乎生死的密议在方寸斗室间悄然成形，悲壮中透着一丝暖意
  description: 你抬手止住厅中纷争，众人目光齐刷刷落在杨过身上。油灯爆了个灯花，光影在他脸上跳了跳。你让王坚、吕文焕先回城头督防，厅里只留下蓉儿、过儿和你三人。黄蓉会意，将草图一卷，退到窗边倚着，指尖无意识地转着那根竹签，眼睛却亮亮地瞧着这边。杨过把玄铁剑往桌上一搁，发出沉闷一声响，自己拖了条板凳大马金刀坐下，独臂搭在膝上，下巴微抬，一副“要问便问”的架势。檐外雨已停了，夜风从窗缝钻进来，吹得灯焰歪向一边，你听见自己粗重的呼吸声。
  trigger_conditions: {}
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的守府偏厅内景，一盏油灯将昏黄的光晕投在斑驳的木桌与摊开的地图上，窗外夜雨初歇，檐角残滴映着微光，墙上挂着旧甲与弓弩，气氛沉凝而安静
