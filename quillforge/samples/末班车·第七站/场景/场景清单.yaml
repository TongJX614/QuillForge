scenes:
- id: scene_01
  name: 第七站之前
  location: 7路末班车车厢内
  time: 深夜十一点四十分
  atmosphere: 摇晃的车厢、坏掉的灯管与过分明亮的站牌灯，构成一种被窥视的压抑感；每个人都在回避彼此的目光，却又都在偷偷打量。
  description: 车厢里的灯管有一根坏了，剩下的那根发出嗡嗡的电流声，把每个人的脸都照得发青。你坐在靠门的位置，数过——连你在内五个人。老康从后视镜里瞟了你一眼，嘴唇动了动，像是往水里扔了颗石子。窗外的街道空得过分，连路灯都隔一盏才亮，光从车窗上一格一格地爬过去，像有人在数座位。你抬手拢头发，指尖碰到鬓角那枚冰凉的银色发卡，动作停住了。三年前姐姐别在头上的那枚，现在正别在你头上。你不记得自己戴过它。车厢最后一排，那个穿连帽衫的少年正盯着你——不，盯着你的鬓角。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的公交车厢内部，一根坏掉的灯管闪烁不定，另一根发出冷白的光；车窗上倒映着掠过的一格格路灯，车窗外是空无一人的街道和隔盏才亮的路灯；座椅陈旧，扶手泛着金属冷光，车头方向隐约可见后视镜的轮廓。
