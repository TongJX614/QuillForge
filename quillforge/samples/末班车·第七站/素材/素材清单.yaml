  - type: 场景背景
    scenes:
    - name: 第七站之前
      mood: 摇晃的车厢、坏掉的灯管与过分明亮的站牌灯，构成一种被窥视的压抑感；每个人都在回避彼此的目光，却又都在偷偷打量。
      details: 深夜的公交车厢内部，一根坏掉的灯管闪烁不定，另一根发出冷白的光；车窗上倒映着掠过的一格格路灯，车窗外是空无一人的街道和隔盏才亮的路灯；座椅陈旧，扶手泛着金属冷光，车头方向隐约可见后视镜的轮廓。
