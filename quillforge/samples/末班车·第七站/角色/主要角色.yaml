characters:
- id: char_01
  name: 周晚
  role: 主角
  species: human
  gender: female
  age: 26
  occupation: 市晚报社会新闻记者
  appearance: 身高约165cm，偏瘦，黑色短发齐耳，左侧鬓角别着一枚旧银色发卡；常穿深灰色连帽卫衣配牛仔裤，背一个磨旧的帆布斜挎包，包里露出录音笔和半截笔记本；眼神警觉，眼下有淡淡青黑，右手虎口有一道浅疤。
  personality: 刨根问底、嘴硬心软、对细节有近乎偏执的记忆力
  voice_tone: 说话短促直接，习惯用反问句追问对方，紧张时会低声自言自语复述细节（“等等，刚才明明是六个人……”），口头禅是“记一下”。
  motivation: 查清三年前姐姐在同一路末班车上失踪的真相。
  background: 姐姐周早三年前深夜乘坐7路末班车后人间蒸发，警方以“自行下车”结案。周晚不信，从此专跑社会新闻，暗中收集7路线的所有异常记录。
  arc: 从只想揭开真相的旁观者，变成必须选择“带谁下车”的当事人。
- id: char_02
  name: 老康
  role: 配角/关键知情人
  species: human
  gender: male
  age: 58
  occupation: 7路末班车司机
  appearance: 矮壮身材，圆脸，花白寸头，眉心一颗黑痣；穿洗得发白的蓝色公交制服，左胸工牌照片已褪色；右手戴一只老式上海牌手表，指节粗大，常年握方向盘磨出厚茧；笑起来眼角皱纹堆叠，但眼神总往车内后视镜瞟。
  personality: 圆滑世故、话里有话、关键时刻异常固执
  voice_tone: 嗓门大，爱用“哎——”拖长音开头，习惯称呼乘客“同志”，讲规矩时会把“这车有这车的规矩”挂在嘴边，紧张时反复擦后视镜。
  motivation: 守住7路末班车的“规矩”，熬到退休平安下车。
  background: 开了二十年7路末班车，亲眼见过太多乘客“到站不见人”，他从不回头、从不数人数，只认一条死规矩：过了第七站前别往后看。
  arc: 从死守规矩的沉默者，到被迫开口说出“第七站”真相的破戒人。
- id: char_03
  name: 阿澈
  role: 配角/神秘少年
  species: human
  gender: male
  age: 17
  occupation: 无业，常在夜班车上过夜
  appearance: 清瘦少年，身高约175cm，苍白肤色，黑色碎发略长遮住右眼；穿一件明显偏大的藏青色旧校服外套，拉链坏了一半，里面是褪色T恤；背着空荡荡的双肩包，脚上是一双刷得发白的帆布鞋；左手腕系一根红绳，绳结处磨得发亮。
  personality: 沉默寡言、观察力惊人、偶尔说出不像少年的话
  voice_tone: 声音轻而慢，常答非所问，喜欢用“你数过吗？”这类问句结尾，紧张时会攥住左手腕的红绳。
  motivation: 找到三年前在车上消失的哥哥，哪怕只能在第七站见一面。
  background: 哥哥三年前坐7路末班车失踪，阿澈从此每晚坐这趟车，已经摸清“消失”的规律，却始终不敢在第七站下车。
  arc: 从只敢旁观规律的胆小鬼，到主动选择在第七站留下或带人回来的关键变量。
- id: char_04
  name: 林姨
  role: 配角/乘客
  species: human
  gender: female
  age: 47
  occupation: 夜班保洁员
  appearance: 微胖，烫过的短卷发用黑色发网兜着，鬓角有汗湿的碎发；穿橙色反光条保洁马甲，里面是深红毛衣，袖口起球；脚穿黑色防滑胶鞋，手提一个印着超市logo的塑料袋，袋里饭盒和保温杯叮当作响；脖子上挂着一串钥匙，走路时哗啦响。
  personality: 热心碎嘴、胆小怕事、一紧张就念佛
  voice_tone: 语速快，爱拉家常，三句话不离“我跟你说”，害怕时反复念叨“阿弥陀佛，菩萨保佑”，声音会越念越小。
  motivation: 只想平安回家给上夜班的儿子留门。
  background: 在林姨负责的写字楼里，三年前有个夜班保安坐7路末班车后再没来上班，她一直觉得那趟车“不干净”，今晚是实在没赶上别的车。
  arc: 从只想躲事的普通乘客，到被迫面对“要不要叫醒别人”的道德抉择。
