    - name: 血鼓催命
      mood: 残阳如血，鼓声如雷，恐慌在营中蔓延
      details: 黄昏时分的古代军营辎重区，残阳将天边染成暗红色，几辆高大的木制粮车歪斜停放，地上散落着草料和麻袋，远处营帐连绵，篝火未燃，一面残破的联军旗帜在风中低垂，地面泥土被踩得一片狼藉，投下长长的车影，整体色调昏黄压抑，充满大战前的肃杀气息
