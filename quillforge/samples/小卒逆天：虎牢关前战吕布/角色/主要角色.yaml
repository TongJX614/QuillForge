characters:
- id: char_01
  name: 林越
  role: 主角
  species: human
  gender: male
  age: 24
  occupation: 现代大学生穿越成东汉小卒
  appearance: 普通青年男性，身高约178cm，体型偏瘦但结实；黑色短发因军规被粗布巾胡乱扎起，额前碎发凌乱；身穿不合身的旧皮甲，肩部缝补痕迹明显，腰挎一把锈迹斑斑的环首刀，脚蹬草鞋，小腿绑腿沾满泥泞。
  personality: 嘴碎、机灵、惜命但讲义气
  voice_tone: 现代口语混搭半文半白的军汉腔，紧张时爱嘀咕'我靠'，认真时会突然冒出条理清晰的分析
  motivation: 活下去，并想办法回到现代
  background: 现代历史系大三学生，熬夜打游戏后穿越到东汉末年，成了虎牢关前一名无名小卒，刚睁眼就听说要迎战吕布。
  arc: 从贪生怕死的现代宅男，成长为敢于在绝境中挺身而出的真正战士。
- id: char_02
  name: 吕布
  role: 核心对手
  species: human
  gender: male
  age: 30
  occupation: 董卓麾下第一猛将
  appearance: 魁梧雄壮的成年男性，身高近两米，肩宽腰窄肌肉贲张；头戴束发金冠，面如冠玉却杀气凛然，剑眉星目，颔下短须修剪整齐；身披西川红锦百花袍，内衬兽面吞头连环铠，腰系勒甲玲珑狮蛮带，手持方天画戟，胯下赤兔马如火焰腾空。
  personality: 狂傲、嗜战、蔑视弱者
  voice_tone: 声如洪钟，用词简短霸道，常以'蝼蚁'、'废物'称呼对手，得意时大笑如雷
  motivation: 用绝对武力碾压一切，证明自己天下无敌
  background: 并州五原郡九原人，自幼弓马娴熟，投董卓后如虎添翼，虎牢关前连斩数将，气焰滔天。
  arc: 从不可一世的战神，逐渐被一个无名小卒的韧性与诡计撼动心神。
- id: char_03
  name: 王大柱
  role: 战友/喜剧担当
  species: human
  gender: male
  age: 35
  occupation: 联军中的老兵什长
  appearance: 敦实粗壮的庄稼汉体型，身高170cm，圆脸络腮胡，皮肤黝黑粗糙；头裹褪色黄巾，身穿打满补丁的旧袄甲，腰挂一圈麻绳和干粮袋，手持一柄刃口卷边的短矛，走路外八字。
  personality: 憨厚、话痨、极度迷信
  voice_tone: 一口浓重方言，爱说'俺滴个乖乖'，每句话都要带上'老天爷'，紧张时语速翻倍
  motivation: 攒够军饷回家娶媳妇，顺便活着打完这仗
  background: 豫州农家出身，被强征入伍三年，打过的仗全是输仗，却总能活下来，自有一套'保命哲学'。
  arc: 从只想逃命的滑头老兵，变成愿意为兄弟挡刀的真正军人。
- id: char_04
  name: 公孙雪
  role: 关键盟友
  species: human
  gender: female
  age: 22
  occupation: 公孙瓒麾下白马义从女斥候
  appearance: 高挑英气的年轻女性，身高172cm，身形矫健如豹；长发用白色皮绳高高束成马尾，面容清秀但左眉有一道浅浅旧疤；身穿轻便皮甲外罩白色披风，腰悬短剑，背挎角弓，马靴沾满尘土。
  personality: 冷静、敏锐、外冷内热
  voice_tone: 语速平稳，用词精准简洁，极少用感叹词，但偶尔会冒出一句冷幽默
  motivation: 为被吕布斩杀的同袍复仇，同时保全白马义从最后的火种
  background: 公孙瓒族中孤女，自幼在军中长大，骑射精湛，是白马义从仅存的女斥候。
  arc: 从一心复仇的独行斥候，学会信任并带领一支杂牌小队创造奇迹。
