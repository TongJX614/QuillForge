scenes:
- id: scene_01
  name: 血鼓催命
  location: 虎牢关前联军大营，粮车辎重区
  time: 黄昏
  atmosphere: 残阳如血，鼓声如雷，恐慌在营中蔓延
  description: 残阳把整座大营泡在血水里。你缩在一辆粮车后面，后脑勺还在隐隐作痛——上一秒你还在宿舍打游戏，下一秒就跪在这片泥地里，身上套着不合身的皮甲，手里被塞了一根削尖的木棍。远处鼓声一下一下砸过来，像有人拿锤子敲你的天灵盖。中军帐前那三颗首级在风里轻轻晃，血还没干透。周围的士兵全低着头，没人说话，只有牙关打颤的声音此起彼伏。你刚想理清这到底是怎么回事，一个黑塔似的身影就蹲到了你旁边，手里也攥着根木棍。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_03
  - char_04
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 黄昏时分的古代军营辎重区，残阳将天边染成暗红色，几辆高大的木制粮车歪斜停放，地上散落着草料和麻袋，远处营帐连绵，篝火未燃，一面残破的联军旗帜在风中低垂，地面泥土被踩得一片狼藉，投下长长的车影，整体色调昏黄压抑，充满大战前的肃杀气息
