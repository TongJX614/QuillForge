main_plot:
  summary: 过雪山时，炊事班长赵铁柱发现粮袋里多出三块银元。追查之下，竟是马夫老周偷偷卖掉驮骡换来的。小满急需药品，骡子又是全连的运输命脉，三块银元在三人间掀起一场沉默的风暴。
  themes:
  - 纪律与人性
  - 牺牲与成全
  - 绝境中的信任
  core_conflict: 在绝境中，是严守纪律交出银元，还是昧下这救命的“赃物”？个人的良心与集体的生存针锋相对。
  stages:
  - name: 雪线下的银元
    goal: ''
    conflict: ''
    scenes:
    - scene_01
  beats: []
  hooks: []
