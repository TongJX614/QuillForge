  - type: 场景背景
    scenes:
    - name: 雪线下的银元
      mood: 风雪暂歇的死寂，灰白天地间只剩喘息声
      details: 海拔四千米的雪山半山腰，一块巨大的岩石形成浅浅的避风窝，岩壁上结着厚厚的冰壳，地面是踩实的积雪，散落着几根枯黑的灌木枝。天色是傍晚的铅灰色，云层压得很低，远处山脊线被残雪勾勒出模糊的轮廓，几缕稀薄的日光从云缝里漏下来，照在雪面上泛着冷蓝的光。岩窝旁有一串深深的脚印通向岩壁背风处，脚印边缘已经开始被风吹起的细雪填埋。
