scenes:
- id: scene_01
  name: 雪线下的银元
  location: 夹金山半山腰避风岩窝
  time: 傍晚
  atmosphere: 风雪暂歇的死寂，灰白天地间只剩喘息声
  description: 风雪终于歇了，可这歇息比刮风时更叫人心里发毛——天压得低，空气薄得像刀子割喉咙。三连的战士们靠着岩壁挤成一排，裹着单衣的、披着油布的，谁也没力气说话。你蹲在背风处清点粮袋，手指头冻得不听使唤，一粒一粒数着青稞，数到第三遍还是那点数目。可就在袋底，你的指头碰上了三块硬邦邦的东西，掏出来一看——三块银元，在灰蒙蒙的天光底下泛着冷光。你的手猛地攥紧了，指节发白。这银元不是你的，也不是连里任何一个人的。你抬头扫了一圈，小满蹲在雪地里给伤员缠绷带，老周抱着骡子脖子蹲在远处，眼睛却直往你这边瞟，一碰你的目光就躲开了。
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 海拔四千米的雪山半山腰，一块巨大的岩石形成浅浅的避风窝，岩壁上结着厚厚的冰壳，地面是踩实的积雪，散落着几根枯黑的灌木枝。天色是傍晚的铅灰色，云层压得很低，远处山脊线被残雪勾勒出模糊的轮廓，几缕稀薄的日光从云缝里漏下来，照在雪面上泛着冷蓝的光。岩窝旁有一串深深的脚印通向岩壁背风处，脚印边缘已经开始被风吹起的细雪填埋。
