characters:
- id: char_01
  name: 赵铁柱
  role: 主角
  species: human
  gender: male
  age: 28
  occupation: 红一方面军某部三连炊事班长
  appearance: 身高一米七左右，身形精瘦结实，颧骨突出。头戴灰布八角帽，帽檐下露出寸许长的黑发茬，脸颊被高原风雪皴裂出细密血丝。身穿褪色的灰蓝粗布军装，肩头、肘弯打着深浅不一的补丁，腰间系一条牛皮绳，别着半截烟杆。脚蹬一双磨穿了底的草鞋，露出缠着破布的车轴汉子大脚。
  personality: 沉默寡言，心细如发，认定的事九头牛拉不回
  voice_tone: 说话简短带川北口音，常用“要得”“莫得问题”回应，急起来会结巴，从不说漂亮话
  motivation: 保住全连最后的口粮，把每一个战士活着带出雪山
  background: 三年前在川北老家参加红军，从挑夫干到炊事班长，背上的行军锅换过三口，连里人都叫他“赵锅头”。
  arc: 从只认粮食不认人，到明白有些东西比粮食更金贵
- id: char_02
  name: 小满
  role: 配角
  species: human
  gender: female
  age: 16
  occupation: 红四方面军妇女独立团卫生员
  appearance: 个头瘦小，圆脸盘上嵌着一双黑亮杏眼，嘴唇干得起白皮。灰军装明显大了一号，袖子卷到小臂中段，露出冻得发红的手腕。八角帽下两条麻花辫扎得紧实，发梢用红头绳系着。挎一只半旧的牛皮药箱，箱盖上用白漆画了个红十字，箱带缠着防滑的布条。
  personality: 嘴快心热，爱笑也爱哭，认死理不认人
  voice_tone: 说话像竹筒倒豆子，一口一个“同志哥”“同志姐”，着急时爱跺脚，带川东尾音
  motivation: 跟上前面的队伍，把药箱里最后一支针剂留给最需要的人
  background: 原在通江老家给草药郎中打下手，参加红军后编入卫生队，过草地时和连队走散，误打误撞跟上了赵铁柱的三连。
  arc: 从被保护的小妹，成长为能独自拿主意、扛责任的战士
- id: char_03
  name: 马夫老周
  role: 配角/对手
  species: human
  gender: male
  age: 45
  occupation: 三连饲养员
  appearance: 矮壮墩实，方脸宽额，络腮胡子花白杂乱。常年戴一顶油渍麻花的毡帽，帽耳朵耷拉着，遮住半只耳朵。身上裹一件老羊皮坎肩，毛都擀了毡，露出光板皮面。腰间挂一把豁了口的砍柴刀，刀把缠着麻绳。走路微跛，是湘江战役留下的老伤。
  personality: 倔驴脾气，嘴硬心软，认牲口比认人亲
  voice_tone: 嗓门粗大，爱骂骂咧咧，张口闭口“畜生都知道好歹”，常把“你懂个屁”挂嘴边
  motivation: 保住连里最后一匹驮骡，那是全连的命根子
  background: 从中央苏区一路跟过来的老运输兵，亲手喂过五匹牲口，死了三匹，剩下这匹黑骡子比儿子还亲。
  arc: 从死守骡子不放，到主动松开缰绳
