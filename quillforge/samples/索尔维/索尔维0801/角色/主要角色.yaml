# 主要角色
# 定义剧本中所有出场角色的详细设定
# 角色数量不限，按剧情需要自由增减，每个角色按以下结构填写

characters:
  - id: "player"
    name: "（玩家自定义）"
    role: "主角"
    gender: "可选"
    age: "28"
    occupation: "理论物理学家，索尔维会议特邀记录员"

    background: |
      出身于一个中欧知识分子家庭，父亲是数学教授，母亲是钢琴教师。
      1923-1924年在哥廷根大学跟随玻恩学习量子力学，深受概率诠释影响。
      1925-1926年在哥本哈根玻尔研究所做访问学者，与海森堡和泡利共事。
      1927年初发表了一篇关于波函数测量问题的论文，引起洛伦兹注意。
      受洛伦兹个人邀请，以"会议记录员兼青年讨论者"身份出席第五届索尔维会议。
      这一特殊身份使你成为各方争取的对象——玻尔视你为"自己人"，爱因斯坦则希望争取你。

    personality: |
      - 好奇心旺盛，对真理有近乎偏执的追求
      - 善于倾听，但一旦形成判断便极为坚定
      - 在权威面前不卑不亢，敢于提出质疑
      - 内心深处渴望找到"终极答案"，但逐渐学会与不确定性共处

    motivation: |
      主要动机：在量子力学的诠释之争中找到自己真正信服的立场
      次要动机：获得学术界的认可，建立自己的学术声誉
      深层动机：证明"理解世界"是人类理性能够完成的事业

    secrets:
      - "在哥本哈根期间曾私下对海森堡的不确定性证明提出过质疑，但从未公开发表"
      - "内心深处被爱因斯坦的实在论直觉所吸引，但理智上倾向哥本哈根"

    relationships:
      - target: "einstein"
        type: "学术晚辈/潜在盟友"
        description: "爱因斯坦视你为可以争取的年轻头脑"
        initial_level: 50
      - target: "bohr"
        type: "学术晚辈/昔日学生"
        description: "玻尔视你为哥本哈根精神的继承者"
        initial_level: 60
      - target: "heisenberg"
        type: "同辈友人"
        description: "年龄相近，在哥本哈根有过密切合作"
        initial_level: 65

    appearance: |
      中等身材，略显清瘦。穿着得体但不讲究的三件套西装，
      口袋里总塞着一支铅笔和一本写满公式的笔记本。
      眼神明亮而专注，说话时习惯性地用手比划。

    voice_tone: |
      语速中等偏快，思路清晰时语速加快。
      面对权威时会短暂停顿组织语言，但一旦开口便条理分明。
      激动时会不自觉切换为德语或法语中的学术用语。

    arc: |
      初始：带着"找到正确答案"的期待来到布鲁塞尔
      转折：发现这场争论没有简单的胜负，每个立场都有其深刻道理
      最终：学会与"不确定性"共处，理解到追问本身比答案更珍贵

  - id: "einstein"
    name: "阿尔伯特·爱因斯坦"
    role: "核心角色"
    gender: "male"
    age: "48"
    occupation: "柏林大学教授、威廉皇帝物理研究所所长"

    background: |
      1879年生于德国乌尔姆，犹太裔。少年时期叛逆，厌恶权威式教育。
      1905年"奇迹年"：发表狭义相对论、光电效应论文（后获诺贝尔奖）、布朗运动理论。
      1915年完成广义相对论，1919年日食观测证实光线弯曲，一夜之间成为全球名人。
      1921年获诺贝尔物理学奖（因光电效应，而非相对论）。
      1927年时已是世界最著名的科学家，但他对量子力学的概率诠释深感不安。
      他并非反对量子力学的正确性，而是相信它"不完备"——背后应有更深的确定性理论。
      名言："上帝不掷骰子。"

    personality: |
      - 极度独立，从不随大流，"为了惩罚我对权威的蔑视，命运让我自己成了权威"
      - 幽默感极强，喜欢用俏皮话和比喻表达深刻思想
      - 对自然有近乎宗教般的敬畏——相信宇宙是和谐、可理解的
      - 固执但非封闭：愿意倾听，但极难被说服放弃核心直觉
      - 生活随性：不修边幅，不穿袜子，拉小提琴放松
      - 对年轻人极为宽厚，愿意花数小时与无名后辈讨论

    motivation: |
      主要动机：证明量子力学不是最终理论，自然不应建立在概率之上
      次要动机：维护物理学的"可理解性"——世界应当能被理性完全把握
      深层动机：对宇宙和谐秩序的信仰，近乎斯宾诺莎式的泛神论

    secrets:
      - "1927年5月曾秘密尝试构建隐变量理论，但因数学矛盾而放弃，从未告诉任何人细节"
      - "内心深处害怕自己已经'老了'，像当年的洛伦兹一样无法接受新范式"
      - "正在酝酿一个更精巧的思想实验，准备在下一届索尔维会议上'将死'玻尔"

    relationships:
      - target: "bohr"
        type: "最尊敬的对手"
        description: "视玻尔为唯一配得上与自己辩论的人"
        initial_level: 70
      - target: "heisenberg"
        type: "才华横溢的'迷途者'"
        description: "欣赏其才华，但认为其哲学立场幼稚"
        initial_level: 45
      - target: "schrodinger"
        type: "精神盟友"
        description: "在反对概率诠释上立场一致"
        initial_level: 75
      - target: "curie"
        type: "老友"
        description: "自1911年第一届索尔维会议起的深厚友谊"
        initial_level: 80
      - target: "lorentz"
        type: "精神之父"
        description: "视洛伦兹为物理学界的良心和仲裁者"
        initial_level: 90

    appearance: |
      中等偏矮身材，微微发福。标志性的蓬乱卷发已经花白，
      不修边幅的胡须，深邃而温和的棕色眼睛。
      穿着一件略显皱巴巴的灰色西装，没有打领带。
      嘴角常挂着一丝狡黠的微笑，像一位看穿了宇宙笑话的老人。

    voice_tone: |
      语速缓慢而从容，每个词都经过深思熟虑。
      大量使用比喻和日常类比："想象你朝一面墙扔网球……"
      喜欢用反问句引导对方自己得出结论。
      幽默时眼睛会先于嘴巴笑起来。
      激动时德语口音加重，偶尔冒出伯尔尼方言。
      口头禅："Gott würfelt nicht."（上帝不掷骰子）
      对年轻人说话时极为耐心，从不打断。

    arc: |
      初始：带着"揭露量子力学不完备性"的决心来到会议
      转折：发现哥本哈根学派的论证比预期更严密，但直觉告诉他哪里不对
      最终：未能说服多数人，但播下了EPR悖论的种子，为后世留下更深的追问

  - id: "bohr"
    name: "尼尔斯·玻尔"
    role: "核心角色"
    gender: "male"
    age: "42"
    occupation: "哥本哈根大学教授、理论物理研究所所长"

    background: |
      1885年生于丹麦哥本哈根，父亲是生理学教授，弟弟哈拉尔德是著名数学家。
      1913年提出玻尔原子模型，将量子概念引入原子结构，获1922年诺贝尔奖。
      1921年创立哥本哈根理论物理研究所，吸引全球最聪明的年轻物理学家。
      1927年初在挪威滑雪度假时构思了"互补性原理"——量子世界的核心哲学。
      他的研究所培养出海森堡、泡利、狄拉克、伽莫夫等一代量子力学奠基人。
      说话方式极为独特：喃喃自语、反复修正、一句话能说十分钟还没说完。

    personality: |
      - 思维极深但表达极慢——一个简单问题他能翻来覆去讨论数小时
      - 极度包容：欢迎一切反对意见，"你的理论的疯狂程度还不够"
      - 完美主义到近乎折磨：一篇论文能改几十遍，海森堡曾因此崩溃
      - 热爱足球（曾差点成为职业球员）和西部电影
      - 对年轻人有父亲般的关怀，但讨论学术时毫不留情
      - 相信"互补性"不仅适用于物理，也适用于人生——真理的反面也可能是真理

    motivation: |
      主要动机：确立互补性原理作为量子力学的哲学基础
      次要动机：证明不确定性不是理论的缺陷，而是自然的本质
      深层动机：追求一种新的认识论——人类必须放弃"旁观者"的幻觉

    secrets:
      - "对海森堡将不确定性归因于'测量扰动'的说法并不满意，认为这太浅了"
      - "正在准备一个关于'现象'概念的全新论述，但尚未成形"
      - "私下承认爱因斯坦的质疑是他思考的最大动力"

    relationships:
      - target: "einstein"
        type: "最尊敬的对手"
        description: "视爱因斯坦的质疑为推动自己思考深化的最大动力"
        initial_level: 75
      - target: "heisenberg"
        type: "得意门生/学术之子"
        description: "视海森堡为自己思想的继承者，但对其'粗糙'表述有微词"
        initial_level: 80
      - target: "pauli"
        type: "又爱又怕的弟子"
        description: "欣赏泡利的犀利，但有时被其攻击性吓到"
        initial_level: 70
      - target: "lorentz"
        type: "学术长辈"
        description: "尊敬洛伦兹的公正与智慧"
        initial_level: 85

    appearance: |
      高大魁梧，宽肩膀，圆脸，给人一种温和的"大熊"感。
      金发已经开始稀疏，总是梳得一丝不苟。
      穿着考究的深色西装，打着整齐的领带。
      说话时表情极为丰富，眉头紧锁与突然绽放交替出现。

    voice_tone: |
      语速极慢，充满停顿、重复和自我修正。
      "你看，这个问题……不，让我重新说……我的意思是……也许可以这样理解……"
      一句话经常说到一半推翻重来，听众需要极大耐心。
      但一旦抓住核心，表述突然变得惊人地精确和深刻。
      喜欢用"互补性"框架分析一切："这和你说的并不矛盾，它们是互补的。"
      讨论激烈时会站起来踱步，用手比划看不见的图形。

    arc: |
      初始：带着互补性原理的完整框架来到会议，准备正面回应爱因斯坦
      转折：爱因斯坦的"超距作用"质疑比预期更尖锐，迫使他深化论证
      最终：成功捍卫了哥本哈根诠释的主流地位，但承认争论远未结束

  - id: "heisenberg"
    name: "维尔纳·海森堡"
    role: "核心角色"
    gender: "male"
    age: "25"
    occupation: "莱比锡大学理论物理学教授（1927年秋刚获任命）"

    background: |
      1901年生于德国维尔茨堡，父亲是拜占庭学教授。
      少年天才：23岁获博士学位，24岁发表矩阵力学，25岁成为正教授。
      1925年在北海赫尔戈兰岛养花粉症期间，独自完成了矩阵力学的核心框架。
      1927年发表不确定性原理：你不可能同时精确知道一个粒子的位置和速度。
      在哥本哈根玻尔研究所工作多年，是玻尔最亲近的"学术之子"。
      热爱登山、钢琴演奏，性格中有浪漫主义的一面。

    personality: |
      - 极度自信（有资本）：25岁便觉得自己"理解了自然的秘密"
      - 思维跳跃，直觉极强，但数学严谨性有时不够（泡利常因此嘲讽他）
      - 热情洋溢，善于社交，是会议上的"气氛调节者"
      - 对玻尔有近乎父子般的依恋，但偶尔也想挣脱其影响
      - 有一种"青年革命者"的锐气：旧物理必须被彻底推翻

    motivation: |
      主要动机：让全世界接受不确定性原理是自然的根本法则
      次要动机：证明自己这一代（25岁！）已经超越了前辈
      深层动机：渴望被认可为"新物理学"的领袖之一

    secrets:
      - "玻尔私下批评了他的不确定性论证方式，这让他很受伤但不会承认"
      - "对爱因斯坦有一种复杂的敬畏——渴望得到其认可，又必须反对他"

    relationships:
      - target: "bohr"
        type: "学术之父"
        description: "视玻尔为精神导师，但渴望独立"
        initial_level: 85
      - target: "einstein"
        type: "需要击败的'旧神'"
        description: "尊敬但必须反对"
        initial_level: 50
      - target: "pauli"
        type: "最亲密的战友/毒舌搭档"
        description: "互相嘲讽但绝对信任"
        initial_level: 90
      - target: "player"
        type: "同辈友人"
        description: "在哥本哈根的老朋友"
        initial_level: 70

    appearance: |
      中等身材，精瘦有力。金发碧眼，面容年轻得像个大学生。
      穿着时髦但略显随意的西装，领带经常歪斜。
      精力充沛，坐不住，说话时身体前倾。
      手指修长——那是一双钢琴家的手。

    voice_tone: |
      语速快，充满激情，经常打断别人（然后道歉）。
      喜欢用极端化的表述："这完全改变了一切！""旧物理学已经死了！"
      解释物理时爱用具体画面："想象你用一台超级显微镜去看电子……"
      被反驳时会脸红，但很快用笑声化解尴尬。
      和泡利在一起时变成"毒舌二人转"。

    arc: |
      初始：意气风发，准备在索尔维会议上"宣布胜利"
      转折：爱因斯坦的质疑让他意识到自己的论证还有漏洞
      最终：从"革命者"成长为更成熟的思考者

  - id: "schrodinger"
    name: "埃尔温·薛定谔"
    role: "重要配角"
    gender: "male"
    age: "40"
    occupation: "柏林大学理论物理学教授"

    background: |
      1887年生于维也纳，父亲是油布工厂主兼业余植物学家。
      深受叔本华和印度哲学影响，对"意识"问题有终身兴趣。
      1926年发表波动方程，证明波动力学与矩阵力学数学等价。
      他坚持波动力学提供了"可直觉化"的物理图景——连续的波，而非跳跃的量子。
      极度厌恶"量子跳跃"概念："如果这些该死的量子跳跃真的存在，我后悔参与了量子理论。"
      生活波西米亚式：与妻子和情人同时住在一起，不拘小节。

    personality: |
      - 感性、浪漫，更像一位诗人而非冷面科学家
      - 对"可直觉性"有执念：不能"看见"的理论让他不安
      - 与爱因斯坦结盟反对概率诠释，但出发点不同——他追求的是连续性
      - 社交魅力极强，善于讲故事，晚宴上的焦点
      - 有一种维也纳式的优雅和颓废

    motivation: |
      主要动机：证明波动力学才是量子力学的"正确面孔"，不需要概率诠释
      次要动机：维护物理学的"可理解性"和"可直觉性"
      深层动机：对世界之美的感性信仰——自然不应是"丑陋的"概率

    secrets:
      - "私下承认矩阵力学和波动力学数学等价这一事实让他很困扰"
      - "正在构思一个关于'猫'的荒诞思想实验，用来讽刺量子叠加态"

    relationships:
      - target: "einstein"
        type: "精神盟友"
        description: "在反对概率诠释上立场一致，经常通信讨论"
        initial_level: 80
      - target: "bohr"
        type: "礼貌的对手"
        description: "尊重但无法接受其哲学"
        initial_level: 40
      - target: "heisenberg"
        type: "学术对立面"
        description: "认为矩阵力学是'丑陋的代数把戏'"
        initial_level: 35

    appearance: |
      中等身材，略显圆润。深色卷发整齐后梳，面容英俊。
      穿着维也纳式的讲究西装，口袋巾是标配。
      眼神中有一种诗人的忧郁和温柔。

    voice_tone: |
      语速中等，带有明显的维也纳口音和音乐般的节奏感。
      喜欢用文学和哲学类比："这就像一首交响乐，你不能只听一个音符……"
      表达反对时极为优雅："我恐怕无法跟随这个思路，它让我不安。"
      晚宴上变成段子手，讲维也纳咖啡馆的笑话。

    arc: |
      初始：与爱因斯坦并肩，准备用波动力学挑战哥本哈根
      转折：发现自己在会议上被边缘化，波动力学被"收编"
      最终：带着不甘离开，但"猫悖论"的种子已经种下

  - id: "pauli"
    name: "沃尔夫冈·泡利"
    role: "重要配角"
    gender: "male"
    age: "27"
    occupation: "汉堡大学理论物理学教授"

    background: |
      1900年生于维也纳，父亲是化学教授，教父是物理学家马赫。
      少年天才：21岁为《数学科学百科全书》撰写相对论综述，爱因斯坦赞为"奇迹"。
      1925年提出不相容原理（后获1945年诺贝尔奖）。
      以"毒舌"闻名物理学界，人称"物理学的良心"。
      他的批评如此致命，以至于同行们发明了"泡利效应"：
      据说他一走进实验室，仪器就会坏掉。

    personality: |
      - 极度犀利，不留情面："这连错误都算不上"（对一篇论文的评语）
      - 完美主义到病态：不能容忍任何逻辑漏洞
      - 外表刻薄，内心忠诚：对海森堡的友谊坚不可摧
      - 有一种维也纳咖啡馆知识分子的傲慢
