# 素材清单
# 定义剧本所需的视觉、音频和互动素材
# 各列表条目数量不限，按剧情需要自由增减

assets:
  # ============================================================
  # 视觉素材（数量不限）
  # ============================================================
  visual:
    - type: "角色立绘"
      description: "主要角色的全身/半身立绘，含多种表情变体"
      dimensions: "1024x1536（竖版）"
      style: "写实偏油画质感，1920年代欧洲风格，色调温暖而庄重"
      format: "PNG（透明背景）"
      quantity: "10个主要角色，每人4-6个表情变体"
      characters:
        - name: "爱因斯坦"
          variants: "6"
          expressions: "微笑/大笑/沉思/质疑/悲伤/随性（无领带）"
          outfits: "2（正式西装/睡衣+乱发）"
        - name: "玻尔"
          variants: "5"
          expressions: "沉思/踱步/微笑/严肃/突然兴奋"
          outfits: "1（深色西装+领带）"
        - name: "海森堡"
          variants: "5"
          expressions: "兴奋/脸红/苦笑/弹琴/大笑"
          outfits: "2（正式/随意+歪领带）"
        - name: "泡利"
          variants: "4"
          expressions: "嘲讽/平静/锐利/难得微笑"
          outfits: "1（保守西装）"
        - name: "薛定谔"
          variants: "4"
          expressions: "优雅/忧郁/讲故事/严肃"
          outfits: "1（维也纳式西装+口袋巾）"
        - name: "居里夫人"
          variants: "4"
          expressions: "沉静/微笑/严肃/温柔"
          outfits: "1（黑色连衣裙）"
        - name: "洛伦兹"
          variants: "5"
          expressions: "温和/微笑/感伤/庄重/沉思"
          outfits: "1（老式黑色礼服+金边眼镜）"
        - name: "德布罗意"
          variants: "4"
          expressions: "优雅/忧郁/窘迫/感激"
          outfits: "1（巴黎定制西装）"
        - name: "埃伦费斯特"
          variants: "4"
          expressions: "疲惫/苦笑/温柔/忧郁"
          outfits: "1（朴素西装+圆框眼镜）"
        - name: "狄拉克"
          variants: "3"
          expressions: "面无表情/微微点头/罕见惊讶"
          outfits: "1（朴素到寒酸的西装）"

    - type: "场景背景"
      description: "游戏中所有场景的背景图"
      dimensions: "1920x1080（横版宽屏）"
      style: "写实油画风格，1920年代布鲁塞尔，秋日色调（暖黄、深褐、灰蓝）"
      format: "PNG/JPG"
      scenes:
        - name: "布鲁塞尔火车站（秋雨暮色）"
          mood: "期待、紧张"
          details: "蒸汽火车、湿漉漉的石板路、煤气灯、雨雾中的城市轮廓"
        - name: "利奥波德公园酒店大堂"
          mood: "温暖、历史感"
          details: "深色木质家具、壁炉、公告板上的参会者名单、行李"
        - name: "索尔维研究所会议厅（夜晚）"
          mood: "静谧、私密"
          details: "月光透过高窗、钢琴、空椅子、地板上的光斑"
        - name: "研究所花园（月夜）"
          mood: "静谧、诗意"
          details: "月光如水、修剪整齐的灌木、碎石小径、远处会议厅灯光"
        - name: "索尔维研究所会议厅（白天）"
          mood: "庄严、紧张"
          details: "29把椅子、大黑板、讲台、水杯和粉笔、麦克斯韦方程铜版画"
        - name: "研究所走廊（茶歇）"
          mood: "松弛、暗流涌动"
          details: "咖啡桌、落地窗、三三两两的学者、秋日庭院景色"
        - name: "利奥波德公园湖畔（秋日午后）"
          mood: "宁静、诗意"
          details: "梧桐树、湖面波光、落叶小径、远处建筑轮廓"
        - name: "午餐室"
          mood: "日常、对比"
          details: "长桌、白色桌布、餐具、窗外秋光"
        - name: "爱因斯坦房间（深夜）"
          mood: "私密、激烈"
          details: "烟雾缭绕、桌上摊满论文、台灯、小提琴靠在墙角"
        - name: "索尔维研究所门前（合影）"
          mood: "庄重、历史感"
          details: "台阶、29人构图、摄影师和三脚架、秋日阳光"
        - name: "布鲁塞尔火车站（晨雾离别）"
          mood: "感伤、希望"
          details: "薄雾、站台、火车汽笛、远去的身影"
        - name: "火车车窗外（比利时田野）"
          mood: "离别、余韵"
          details: "后退的田野、电线杆、远处村庄、车窗玻璃上的雾气"

    - type: "UI元素"
      description: "游戏界面元素"
      dimensions: "多种尺寸"
      style: "1920年代学术风格：羊皮纸质感、手写体标题、钢笔墨水色调"
      format: "PNG"
      items:
        - "对话框：仿旧纸张质感，边缘有墨水渍"
        - "选项按钮：仿钢笔手写体，悬停时墨水晕开效果"
        - "笔记本界面：玩家的'会议记录'，含手写公式和涂鸦"
        - "好感度指示器：仿墨水瓶液位"
        - "章节标题卡：仿1920年代学术论文首页"
        - "成就徽章：仿诺贝尔奖章风格"

    - type: "插图"
      description: "关键剧情节点的全屏插图"
      dimensions: "1920x1080"
      style: "油画风格，戏剧性光影"
      format: "PNG"
      count: "8"
      items:
        - "爱因斯坦在会议厅举手发言（全场安静）"
        - "泡利站起来提问，德布罗意脸色苍白"
        - "海森堡深夜弹钢琴（月光）"
        - "爱因斯坦在烟雾中画'鬼魅超距作用'示意图"
        - "29人合影（全景）"
        - "爱因斯坦和洛伦兹的小提琴-大提琴二重奏"
        - "居里夫人在湖畔微笑（罕见）"
        - "火车车窗外的比利时田野（结局画面）"

  # ============================================================
  # 音频素材（数量不限）
  # ============================================================
  audio:
    - type: "背景音乐"
      description: "游戏配乐，以古典音乐和原创氛围音乐为主"
      tracks:
        - name: "布鲁塞尔的秋天"
          mood: "期待、宁静、微带忧伤"
          instruments: "弦乐四重奏、钢琴"
          tempo: "慢板（Adagio）"
          duration: "4:30"
        - name: "风暴前夕"
          mood: "紧张、庄严"
          instruments: "管弦乐团、定音鼓"
          tempo: "中板（Moderato）渐强"
          duration: "3:45"
        - name: "量子之舞"
          mood: "激烈、智识的激情"
          instruments: "钢琴独奏（巴赫风格赋格）"
          tempo: "快板（Allegro）"
          duration: "5:00"
        - name: "月光与钢琴"
          mood: "私密、温柔、忧伤"
          instruments: "钢琴独奏（舒曼《梦幻曲》风格）"
          tempo: "慢板"
          duration: "4:00"
        - name: "鬼魅般的超距作用"
          mood: "神秘、深邃、不安"
          instruments: "大提琴独奏、电子氛围音"
          tempo: "自由节奏"
          duration: "3:30"
        - name: "最后的合影"
          mood: "庄重、感伤、温暖"
          instruments: "弦乐四重奏（莫扎特风格）"
          tempo: "行板（Andante）"
          duration: "4:15"
        - name: "火车远去"
          mood: "离别、希望、余韵"
          instruments: "钢琴+弦乐"
          tempo: "慢板渐弱"
          duration: "5:00"

    - type: "音效"
      description: "环境音效和交互音效"
      effects:
        - name: "会议厅环境音"
          duration: "循环"
          description: "低语声、椅子移动声、粉笔在黑板上的声音、偶尔的咳嗽"
        - name: "秋雨"
          duration: "循环"
          description: "细雨打在窗户和石板路上的声音"
        - name: "火车汽笛"
          duration: "3秒"
          description: "1920年代蒸汽火车的汽笛声"
        - name: "快门声"
          duration: "1秒"
          description: "老式相机的快门声（咔嚓+闪光）"
        - name: "钢琴音"
          duration: "可变"
          description: "海森堡弹琴时的实际琴声（巴赫/舒曼片段）"
        - name: "翻书页"
          duration: "1秒"
          description: "翻开笔记本的纸张声"
        - name: "小提琴"
          duration: "可变"
          description: "爱因斯坦拉琴的片段（莫扎特）"

  # ============================================================
  # 互动素材（数量不限）
  # ============================================================
  interactive:
    - type: "选择系统"
      description: "玩家对话选择和剧情分支系统"
      features:
        - "对话选项：2-4个选项，部分选项需要好感度/属性解锁"
        - "隐藏选项：满足特定条件时出现（如直面爱因斯坦的恐惧）"
        - "沉默选项：允许玩家选择不说话（影响'独立性'属性）"
        - "限时选择：在激烈讨论中，玩家需要在10秒内决定是否举手发言"

    - type: "关系系统"
      description: "玩家与10个主要角色的好感度追踪"
      features:
        - "好感度范围：0-100"
        - "好感度影响：解锁特殊对话、隐藏选项、专属结局"
        - "关系可视化：仿'学术通信网络'图，节点大小代表亲疏"
        - "阵营倾向：哥本哈根/实在论/独立 三维属性"

    - type: "笔记本系统"
      description: "玩家的'会议记录'，作为游戏内知识库和收集系统"
      features:
        - "自动记录：每次对话中的关键物理概念自动记入"
        - "手写公式：玩家可以选择'在笔记本上画公式'来加深理解"
        - "人物速写：与每个角色深度交谈后解锁其'速写'和'名言'"
        - "思想实验图解：爱因斯坦的'半球屏幕'、'光子箱'等以手绘形式呈现"
        - "收集要素：集齐所有'思想实验'、'名言'、'人物速写'解锁隐藏成就"

    - type: "成就系统"
      description: "游戏成就和收集要素"
      features:
        - "'上帝不掷骰子'：全程支持爱因斯坦"
        - "'互补性'：同时获得玻尔和爱因斯坦好感度≥80"
        - "'泡利的认可'：让泡利说出'不错'（极难）"
        - "'狄拉克的长句'：让狄拉克说出超过20个字的句子"
        - "'居里夫人的微笑'：让居里夫人露出笑容"
        - "'第二十九个人'：出现在合影中"
        - "'最后的演奏'：与爱因斯坦和洛伦兹一起演奏"
        - "'导航波的复活'：在结局后看到玻姆1952年的论文"
        - "'空白的笔记本'：全程未深度参与（坏结局成就）"
        - "'全知者'：解锁所有8个结局"
