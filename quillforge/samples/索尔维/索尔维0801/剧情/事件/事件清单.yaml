# 事件清单
# 定义影响剧情流程但不分岔的普通事件
# 事件数量不限，按剧情需要自由增减，每个事件按以下结构填写

events:
  - id: "event_01"
    name: "狄拉克的沉默"
    type: "日常"
    description: "在茶歇时遇到狄拉克，尝试与他交谈"

    trigger_conditions:
      - type: "场景触发"
        value: "scene_03茶歇时间，选择走向狄拉克"
        probability: null

    location: "会议厅走廊"
    time: "1927年10月24日，茶歇"
    characters_involved:
      - "player"
      - "dirac"

    content: |
      你走到狄拉克身边，靠在墙上。他面无表情地看着对面墙壁上的一幅画。
      沉默持续了整整两分钟。你开始觉得尴尬。
      
      "狄拉克先生，您觉得今天的报告怎么样？"
      
      他转过头，看了你三秒钟："哪些报告？"
      
      "所有的。德布罗意的，海森堡的，玻尔的……"
      
      "它们都是对的。"他说。然后转回去继续看画。
      
      又过了三十秒。"但玻尔说话太慢了。"他补充道。
      这大概是他今天说的最长的一句话。

    choices:
      - id: "evt01_a"
        text: "微笑，不再说话，和他一起沉默地看画"
        consequences: "狄拉克好感+5。你获得了一种奇特的平静。"
      - id: "evt01_b"
        text: "'您说它们都是对的——那它们之间的矛盾呢？'"
        consequences: "狄拉克思考了五秒：'矛盾是表象。数学不矛盾。'然后不再说话。你获得线索：狄拉克相信数学形式高于物理解释。"

    rewards:
      - type: "信息"
        value: "了解狄拉克的哲学立场：数学形式比物理解释更根本"
      - type: "关系"
        value: "与狄拉克建立初步联系"

    repeatable: false
    cooldown: null

  - id: "event_02"
    name: "居里夫人的手"
    type: "探索"
    description: "注意到居里夫人手上的放射灼伤痕迹"

    trigger_conditions:
      - type: "场景触发"
        value: "scene_03茶歇时间，在会议厅休息区观察居里夫人"
        probability: null

    location: "研究所会议厅休息区"
    time: "1927年10月24日，茶歇"
    characters_involved:
      - "player"
      - "curie"

    content: |
      茶歇时，你注意到居里夫人独自站在窗边，
      摘下手套端起茶杯的瞬间——
      她的指尖有暗红色的灼伤痕迹，皮肤粗糙而干裂。
      那是近三十年与镭打交道的代价。
      
      她注意到你的目光，平静地把手收回口袋：
      "镭给我的礼物。它给了我两个诺贝尔奖，
      也拿走了我的一些东西。公平的交易。"
      
      她的语气中没有自怜，只有一种平静的接受。
      就像她接受放射性衰变的概率性一样——
      也许，她比任何理论家都更深刻地理解"不确定性"。

    choices:
      - id: "evt02_a"
        text: "'夫人，您后悔吗？'"
        consequences: "居里夫人微笑：'后悔？我选择了理解世界。代价是其中的一部分。'你获得情感共鸣+10。"
      - id: "evt02_b"
        text: "沉默地表示敬意，不再追问"
        consequences: "居里夫人对你点了点头——这是她最高形式的认可。好感+8。"

    rewards:
      - type: "情感"
        value: "理解科学家的牺牲与信念"
      - type: "线索"
        value: "居里夫人对'不确定性'有独特的直觉理解"

    repeatable: false
    cooldown: null

  - id: "event_03"
    name: "泡利的'效应'"
    type: "随机"
    description: "目睹传说中的'泡利效应'——他走进房间时仪器故障"

    trigger_conditions:
      - type: "随机触发"
        value: "scene_05或scene_06期间"
        probability: 0.4

    location: "研究所走廊/实验室"
    time: "会议期间随机时间"
    characters_involved:
      - "player"
      - "pauli"

    content: |
      你正经过研究所一楼的小实验室，突然听见里面"啪"的一声——
      一个真空管炸了。紧接着是泡利平静的声音：
      "啊，又来了。"
      
      你探头进去，看见泡利站在一堆冒烟的仪器前，面无表情。
      实验室助手几乎要哭了："泡利教授！这是第三个了！
      您能不能……能不能别进来？"
      
      泡利转向你，耸了耸肩："他们说是我的'效应'。
      我一走进实验室，仪器就坏。"他顿了顿，嘴角微微上扬：
      "当然，这从统计上来说是不可能的。但你看——"
      他指了指冒烟的真空管，"——量子力学告诉我们，
      不可能的事情也会发生。只要概率不为零。"

    choices:
      - id: "evt03_a"
        text: "大笑：'也许您就是那个让波函数坍缩的人？'"
        consequences: "泡利难得地笑了：'不错。这是我听过的最好的恭维。'好感+10。"
      - id: "evt03_b"
        text: "'从统计上来说……您确定这不是巧合？'"
        consequences: "泡利锐利地看你一眼：'你在质疑我的概率论？'然后他嘴角微动：'好吧，也许只是巧合。但你不觉得巧合本身比因果律更不可思议吗？'你获得线索：泡利对因果律的'必然性'持怀疑态度。"

    rewards:
      - type: "关系"
        value: "与泡利建立轻松的联系"
      - type: "信息"
        value: "了解'泡利效应'的传说——物理学界流传的趣闻"

    repeatable: false
    cooldown: null

  - id: "event_04"
    name: "埃伦费斯特的忧郁"
    type: "剧情"
    description: "在研究所走廊遇见疲惫的埃伦费斯特，他正在爱因斯坦和玻尔之间'传话'"

    trigger_conditions:
      - type: "场景触发"
        value: "scene_07开始前"
        probability: null

    location: "研究所二楼走廊"
    time: "1927年10月26日，晚间讨论结束后"
    characters_involved:
      - "player"
      - "ehrenfest"

    content: |
      你在走廊里遇见埃伦费斯特。他靠在墙上，摘下眼镜揉眼睛。
      "累了吗？"你问。
      
      "不是身体的累，"他说，"是……翻译的累。
      你知道吗，爱因斯坦今天对我说：'保罗，你去告诉玻尔，
      他的互补性是一团迷雾。'然后玻尔对我说：'保罗，你去告诉爱因斯坦，
      他的实在论是一种怀旧。'"
      
      他苦笑："我站在中间，两边都是我最尊敬的人。
      他们说的每句话我都懂。但他们为什么不能听懂对方？"
      
      他沉默了一会儿，然后说了一句让你心头一紧的话：
      "有时候我觉得，理解所有人的人，最终谁也不理解自己。"

    choices:
      - id: "evt04_a"
        text: "'您不是翻译者——您是桥梁。没有您，他们连对话都不会有。'"
        consequences: "埃伦费斯特愣了一下，然后真诚地笑了：'谢谢你，年轻人。'好感+12。他告诉你爱因斯坦想见你。"
      - id: "evt04_b"
        text: "'也许您不需要理解所有人。有时候，选择一边也是一种解脱。'"
        consequences: "埃伦费斯特摇头：'我不能。如果我选了，就没人替另一边说话了。'你感受到他内心深处的疲惫。好感+8。"

    rewards:
      - type: "情感"
        value: "理解'中间人'的痛苦与价值"
      - type: "线索"
        value: "埃伦费斯特的忧郁暗示了他未来的悲剧命运"

    repeatable: false
    cooldown: null

  - id: "event_05"
    name: "薛定谔的维也纳笑话"
    type: "日常"
    description: "研究所晚宴上薛定谔讲笑话，展现其维也纳式的魅力"

    trigger_conditions:
      - type: "随机触发"
        value: "scene_04或scene_06期间会议结束后的晚宴"
        probability: 0.5

    location: "研究所宴会厅"
    time: "会议期间某晚，晚宴"
    characters_involved:
      - "player"
      - "schrodinger"
      - "einstein"
      - "born"

    content: |
      晚宴上，薛定谔喝了两杯红酒后变得格外健谈。
      "你们知道维也纳咖啡馆里物理学家怎么点咖啡吗？"
      他环顾四周，确保所有人都在听。
      
      "他说：'我要一杯咖啡——但在您端上来之前，
      它同时是热的和冷的。只有当我喝第一口的时候，
      它才'决定'自己是热的。'"
      
      海森堡大笑。玻尔皱着眉头："埃尔温，这个比喻不精确……"
      "尼尔斯！"薛定谔举起手，"这是一个笑话！笑话不需要精确！"
      
      爱因斯坦在旁边安静地微笑，用叉子敲着杯子打节拍。
      玻恩笑着摇头。连泡利都嘴角动了一下——那大概是他最接近笑的表情。

    choices:
      - id: "evt05_a"
        text: "跟着大笑，举杯向薛定意致敬"
        consequences: "薛定谔对你眨眼：'年轻人，记住——如果量子力学让你不快乐，那说明你还没真正理解它。或者你理解得太好了。'好感+8。"
      - id: "evt05_b"
        text: "问薛定谔：'您真的觉得量子跳跃不存在吗？'"
        consequences: "薛定谔的表情突然严肃：'如果这些该死的跳跃真的存在，我后悔参与了量子理论。'然后他又笑了：'但这是明天的话题。今晚，让我们喝酒。'"

    rewards:
      - type: "情感"
        value: "感受科学家作为'人'的一面——幽默、脆弱、温暖"
      - type: "信息"
        value: "薛定谔对'量子跳跃'的厌恶是他反对哥本哈根的核心动机"

    repeatable: false
    cooldown: null

  - id: "event_06"
    name: "洛伦兹的钢琴"
    type: "剧情"
    description: "深夜在会议厅听到爱因斯坦拉小提琴、洛伦兹弹钢琴的即兴二重奏"

    trigger_conditions:
      - type: "随机触发"
        value: "scene_06或scene_07期间夜晚"
        probability: 0.35

    location: "研究所会议厅"
    time: "深夜"
    characters_involved:
      - "player"
      - "einstein"
      - "lorentz"

    content: |
      深夜，你路过会议厅时听见里面传来音乐声。
      门虚掩着——你看见爱因斯坦站在黑板前拉小提琴，
      洛伦兹坐在那架旧钢琴前伴奏。
      
      他们演奏的是莫扎特的一首奏鸣曲。
      爱因斯坦的琴技不算精湛，但充满感情；
      洛伦兹的琴声稳健而温柔，像一位父亲在托举孩子。
      
      曲终，洛伦兹说："阿尔伯特，你的节奏还是那么自由。"
      爱因斯坦笑："亨德里克，你的节奏还是那么精确。"
      两人相视而笑。
      
      你悄悄退后，不想打扰这一刻。
      你不知道的是，这是他们最后一次一起演奏。

    choices:
      - id: "evt06_a"
        text: "安静离开，让这一刻属于他们"
        consequences: "你获得了一种深刻的感动。对'黄金时代终将逝去'有了切肤之感。情感+15。"
      - id: "evt06_b"
        text: "轻轻推门进去，问能否加入（如果你会一种乐器）"
        consequences: "爱因斯坦惊喜地放下琴弓：'来来来！你会弹什么？'三人即兴演奏了一首舒伯特。洛伦兹笑着说：'这是本届索尔维会议最好的报告。'好感+10（爱因斯坦和洛伦兹）。"

    rewards:
      - type: "情感"
        value: "见证爱因斯坦和洛伦兹的深厚友谊"
      - type: "线索"
        value: "这是他们最后一次合奏——洛伦兹将在四个月后去世"

    repeatable: false
    cooldown: null
