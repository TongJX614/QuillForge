# 主线剧情
# 定义故事的主要脉络
# 各列表条目数量不限，按剧情需要自由增减

main_plot:
  # ============================================================
  # 剧情概要
  # ============================================================
  summary: |
    1927年10月，一位28岁的年轻物理学家受洛伦兹邀请，以记录员身份
    出席第五届索尔维会议。在这六天里，他/她将亲历爱因斯坦与玻尔之间
    关于量子力学本质的历史性论战，见证泡利击溃德布罗意的导航波理论，
    感受居里夫人的务实智慧和洛伦兹的温和公正。
    
    核心冲突：量子力学是对现实的完备描述（哥本哈根），还是一本不完整的
    概率账簿（爱因斯坦）？玩家必须在两种同样深刻的世界观之间找到自己的位置。
    
    最终，玩家将发现：这场争论没有简单的胜负。真正的收获不是"答案"，
    而是学会了与"不确定性"共处——这恰恰是量子力学教给人类的最深刻的一课。

  themes:
    - "确定性与不确定性——人类能否完全理解自然？"
    - "旧秩序与新范式——一代人如何面对自己无法理解的世界？"
    - "友谊与分歧——伟大的心灵如何在根本对立中保持尊重？"
    - "黄金时代的落幕——一切辉煌终将逝去，但思想永存"
    - "追问的价值——有时候，提出正确的问题比找到答案更重要"

  core_conflict: |
    冲突的两端：
    A) 哥本哈根诠释（玻尔、海森堡、玻恩）：量子力学是完备的，
       不确定性是自然的根本属性。我们必须放弃"旁观者"的幻觉，
       接受"观察行为本身参与创造现实"。
    B) 实在论（爱因斯坦、薛定谔）：物理世界独立于观察者存在，
       量子力学虽然正确但不完备。背后应有更深层的确定性理论。
       "上帝不掷骰子。"
    
    选择A意味着：接受一种全新的认识论，放弃经典直觉，
    拥抱概率和互补性作为世界的最终语言。
    选择B意味着：坚守理性主义的信念，相信宇宙是完全可理解的，
    即使这意味着与主流对抗。
    
    冲突在第五天（scene_07）达到顶点：爱因斯坦向玩家展示
    "鬼魅般的超距作用"思想实验，迫使玩家直面核心问题。

  # ============================================================
  # 剧情阶段（数量不限）
  # ============================================================
  stages:
    - stage_id: "stage_01"
      name: "序幕：抵达与预感"
      description: "玩家抵达布鲁塞尔，与海森堡重逢，在开幕前夜与洛伦兹深谈。建立身份、氛围和情感基调。"
      scenes:
        - "scene_01"
        - "scene_02"
      key_events:
        - "与海森堡重逢，了解会议的紧张氛围"
        - "洛伦兹透露'这是最后一次'，埋下感伤伏笔"
        - "玩家确认自己的'中间人'身份"
      emotional_arc: "期待 → 紧张 → 敬畏"

    - stage_id: "stage_02"
      name: "第一幕：风暴降临"
      description: "会议第一天，三种量子力学诠释正面碰撞。爱因斯坦提出'超距作用'难题，阵营分化显现。"
      scenes:
        - "scene_03"
        - "scene_04"
      key_events:
        - "德布罗意报告导航波理论"
        - "海森堡-玻恩报告量子力学与概率诠释"
        - "玻尔提出互补性原理"
        - "爱因斯坦的'半球屏幕'思想实验震动全场"
        - "茶歇时阵营分化，玩家第一次'选边'机会"
        - "与爱因斯坦和居里夫人的公园散步"
      emotional_arc: "震撼 → 困惑 → 思考"

    - stage_id: "stage_03"
      name: "第二幕：审判与裂痕"
      description: "泡利用非弹性散射问题击溃德布罗意的导航波理论。'第三条道路'崩塌，争论简化为两极对立。"
      scenes:
        - "scene_05"
        - "scene_06"
      key_events:
        - "德布罗意报告被泡利'处刑'"
        - "爱因斯坦试图帮助德布罗意但无力回天"
        - "海森堡深夜弹钢琴，坦露被玻尔批评的伤痛"
        - "玩家与海森堡的友谊深化"
      emotional_arc: "残酷 → 同情 → 温情"

    - stage_id: "stage_04"
      name: "第三幕：鬼魅与抉择"
      description: "爱因斯坦深夜向玩家展示'超距作用'思想实验（EPR雏形）。玩家被迫直面核心问题，做出最终立场选择。"
      scenes:
        - "scene_07"
      key_events:
        - "爱因斯坦的'鬼魅般的超距作用'论证"
        - "玩家与爱因斯坦的深度对话"
        - "玩家做出核心立场选择（或选择拒绝选择）"
      emotional_arc: "震撼 → 挣扎 → 决断（或接受无决断）"

    - stage_id: "stage_05"
      name: "尾声：合影与离别"
      description: "会议结束，29人合影。洛伦兹的告别，爱因斯坦的最后一句话。玩家带着改变离开布鲁塞尔。"
      scenes:
        - "scene_08"
        - "scene_09"
      key_events:
        - "洛伦兹的闭幕词：'我们是来理解彼此的'"
        - "历史性合影"
        - "洛伦兹对玩家的最后提问"
        - "爱因斯坦的告别：'上帝不掷骰子！'"
        - "触发结局"
      emotional_arc: "释然 → 感伤 → 希望"

  # ============================================================
  # 剧情节拍（数量不限）
  # ============================================================
  beats:
    - beat_id: "beat_01"
      name: "海森堡的热情"
      description: "海森堡在酒店大堂的兴奋出场，奠定'青年革命者'的基调"
      scene: "scene_01"
      purpose: "建立第一个NPC关系，引出会议核心议题"
    - beat_id: "beat_02"
      name: "洛伦兹的预感"
      description: "洛伦兹说'这是最后一次'，暗示一个时代的终结"
      scene: "scene_02"
      purpose: "埋下感伤伏笔，赋予会议'历史重量'"
    - beat_id: "beat_03"
      name: "爱因斯坦的举手"
      description: "爱因斯坦在玻尔报告后举手，全场安静——论战正式开始"
      scene: "scene_03"
      purpose: "核心冲突的正式引爆点"
    - beat_id: "beat_04"
      name: "月亮存在吗？"
      description: "爱因斯坦在公园问玩家：'月亮在你不看它时存在吗？'"
      scene: "scene_04"
      purpose: "将抽象哲学问题转化为直觉可感的追问"
    - beat_id: "beat_05"
      name: "泡利的一击"
      description: "泡利用一个问题击溃导航波理论，德布罗意当场失语"
      scene: "scene_05"
      purpose: "展现学术争论的残酷性，消灭'第三条道路'"
    - beat_id: "beat_06"
      name: "巴赫与困惑"
      description: "海森堡深夜弹钢琴，坦露被玻尔批评的伤痛"
      scene: "scene_06"
      purpose: "展现天才的脆弱面，深化玩家友谊"
    - beat_id: "beat_07"
      name: "鬼魅般的超距作用"
      description: "爱因斯坦深夜展示EPR雏形，迫使玩家直面核心问题"
      scene: "scene_07"
      purpose: "剧情高潮，玩家必须做出立场选择"
    - beat_id: "beat_08"
      name: "快门声"
      description: "29人合影，快门按下——历史定格"
      scene: "scene_08"
      purpose: "仪式感，将个人故事嵌入历史画卷"
    - beat_id: "beat_09"
      name: "最后一声呼唤"
      description: "爱因斯坦在站台喊：'记住——上帝不掷骰子！'"
      scene: "scene_09"
      purpose: "点题，余韵悠长"

  # ============================================================
  # 剧情钩子（数量不限）
  # ============================================================
  hooks:
    - hook_id: "hook_01"
      type: "悬念钩子"
      description: "洛伦兹说'这是最后一次'——为什么？他的健康出了什么问题？"
      scene: "scene_02"
    - hook_id: "hook_02"
      type: "转折钩子"
      description: "爱因斯坦在会议上'只'提出了质疑但没有给出替代方案——他在隐藏什么？"
      scene: "scene_03"
    - hook_id: "hook_03"
      type: "情感钩子"
      description: "德布罗意被击溃后独自坐在角落——爱因斯坦对他说了什么？"
      scene: "scene_05"
    - hook_id: "hook_04"
      type: "悬念钩子"
      description: "爱因斯坦深夜说'我有一个新想法'——这个想法将改变物理学史（EPR悖论）"
      scene: "scene_07"
    - hook_id: "hook_05"
      type: "结局钩子"
      description: "洛伦兹将在会后不到四个月去世——这张合影是他最后的公开影像之一"
      scene: "scene_08"
