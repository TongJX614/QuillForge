# 结局系统
# 定义游戏的所有结局
# 结局数量不限，按剧情需要自由增减，每个结局按以下结构填写

endings:
  - id: "ending_copenhagen"
    type: "normal"
    title: "《概率之海》"

    trigger_conditions:
      - type: "stats_threshold"
        value: "copenhagen_affinity≥60"
      - type: "choice_made"
        value: "choice_final选择cf_a"

    narrative: |
      火车穿过比利时的田野，你望向窗外。雨后的天空干净得像一块黑板，
      云朵像波函数一样弥散在天际。
      
      你不再需要"确定性"了。
      
      海森堡是对的——你不可能同时知道位置和速度。
      玻尔是对的——波和粒子是同一枚硬币的两面。
      玻恩是对的——|ψ|²就是概率，不多不少。
      
      这不是放弃。这是解放。
      
      你想起居里夫人的话："我从不问它'为什么'衰变。"
      也许，真正的智慧不是追问"为什么"，而是接受"是什么"。
      
      你翻开笔记本，在新的一页写下：
      "量子力学不是对现实的描述。它是我们与现实对话的方式。
      而对话，永远不需要最后一句话。"

    epilogue: |
      1928年2月，你收到一封来自哈勒姆的讣告。
      亨德里克·洛伦兹去世了。距离索尔维会议不到四个月。
      
      你想起那个开幕前夜，他站在空荡荡的会议厅里说：
      "这是我最后一次做这件事了。"
      
      他是对的。
      
      1930年，你在报纸上读到：第六届索尔维会议上，
      爱因斯坦提出了"光子箱"思想实验。玻尔彻夜未眠，
      用爱因斯坦自己的广义相对论反驳了他。
      
      你微笑了。争论还在继续。
      
      1935年，爱因斯坦发表了EPR论文。
      1964年，贝尔提出了不等式。
      1982年，阿斯佩的实验证实了量子纠缠。
      
      爱因斯坦错了。但他提出的问题，比任何正确答案都更伟大。
      
      你合上笔记本。窗外，概率之海在月光下闪烁。

    replay_value: "思考：接受不确定性，是放弃还是解放？"
    unlock_conditions:
      - "全程选择倾向哥本哈根阵营"
      - "copenhagen_affinity≥60"

  - id: "ending_realism"
    type: "normal"
    title: "《上帝不掷骰子》"

    trigger_conditions:
      - type: "stats_threshold"
        value: "realism_affinity≥60"
      - type: "choice_made"
        value: "choice_final选择cf_b"

    narrative: |
      火车穿过比利时的田野，你望向窗外。
      远处的风车在风中转动——确定的、可预测的、优美的。
      
      你选择相信爱因斯坦。
      
      不是因为他是爱因斯坦。而是因为你的内心深处，
      有一个声音在说：世界不应该是这样的。
      世界应该是确定的、可理解的、美的。
      
      也许量子力学是对的——在它适用的范围内。
      但它不是最终答案。背后还有更深的东西。
      也许我们这一代人看不到。但总有一天，
      会有人找到那个"更深的理论"。
      
      你想起爱因斯坦深夜说的话：
      "我不确定我能接受一个陌生的宇宙。"
      
      你理解他。你也害怕。但你更害怕放弃追问。
      
      你在笔记本上写下：
      "上帝不掷骰子。也许我们只是还没找到骰子藏在哪里。"

    epilogue: |
      你成为了一名"少数派"物理学家。
      在哥本哈根诠释统治教科书的年代，
      你坚持研究量子力学的"基础问题"——
      一个被主流视为"哲学废话"的领域。
      
      1952年，大卫·玻姆重新发现了德布罗意的导航波理论。
      你想起1927年那个独自坐在午餐角落的法国贵族，
      想起爱因斯坦对他说的话："你的想法太美了，不会就这样死去。"
      
      爱因斯坦是对的。美的想法不会死。
      
      1964年，贝尔不等式。1982年，阿斯佩实验。
      实验证明：爱因斯坦的"局域实在论"是错的。
      量子纠缠是真实的。"鬼魅般的超距作用"确实存在。
      
      但爱因斯坦提出的问题——"量子力学是否完备？"——
      至今仍然开放。量子引力、量子信息、多世界诠释……
      他的追问，比任何答案都更持久。
      
      你合上笔记本。窗外，风车仍在转动。确定的。优美的。

    replay_value: "思考：在所有人都说你错的时候，坚持直觉是勇气还是固执？"
    unlock_conditions:
      - "全程选择倾向爱因斯坦阵营"
      - "realism_affinity≥60"

  - id: "ending_transcend"
    type: "good"
    title: "《互补》"

    trigger_conditions:
      - type: "stats_threshold"
        value: "wisdom≥40且independence≥40"
      - type: "choice_made"
        value: "choice_final选择cf_c"

    narrative: |
      火车穿过比利时的田野，你望向窗外。
      雨后的天空同时是灰色的和明亮的。
      你突然理解了玻尔的"互补性"——
      不是"非此即彼"，而是"亦此亦彼"。
      
      爱因斯坦是对的：世界应该是可理解的。
      玻尔也是对的：我们必须接受新的理解方式。
      他们不是矛盾的。他们是互补的。
      
      就像波和粒子。就像确定性和概率。
      就像你和这个世界的关系——
      你既是观察者，也是被观察的一部分。
      
      你想起洛伦兹的闭幕词：
      "我们不是来达成一致的。我们是来理解彼此的。"
      
      也许，这就是答案：没有最终答案。
      只有永恒的追问，和追问中的相互理解。
      
      你在笔记本上画了一个圆，圆心写着：
      "真理的反面，也可能是真理。"
      ——尼尔斯·玻尔

    epilogue: |
      你没有成为"哥本哈根派"，也没有成为"爱因斯坦派"。
      你成为了一个"问题者"——一个永远在追问的人。
      
      你的学生们后来回忆：
      "他从不告诉我们答案。他只是教我们如何提出更好的问题。"
      
      1928年2月，洛伦兹去世。你在日记中写道：
      "他教会我：公正不是没有立场，而是理解所有立场。"
      
      1935年，EPR论文发表。你读完后给爱因斯坦写了一封信：
      "教授，您也许错了。但您错得比大多数人对得更深刻。"
      爱因斯坦回了一张明信片，上面只有一句话：
      "Gott würfelt nicht. Aber er ist schwer zu verstehen."
      （上帝不掷骰子。但他很难被理解。）
      
      你笑了。把明信片夹在笔记本里。
      
      多年后，当有人问你："你到底信什么？"
      你会说："我信追问。"

    replay_value: "思考：超越二元对立，是否可能？'不理解'本身是否也是一种理解？"
    unlock_conditions:
      - "全程保持独立思考，不偏向任何阵营"
      - "wisdom≥40且independence≥40"

  - id: "ending_lorentz"
    type: "good"
    title: "《最后的椅子》"

    trigger_conditions:
      - type: "stats_threshold"
        value: "lorentz好感度≥80"
      - type: "choice_made"
        value: "choice_final选择cf_d"

    narrative: |
      火车穿过比利时的田野。你没有望向窗外。
      你在写信。
      
      "亲爱的洛伦兹教授：
      
      您问我这六天看到了什么。
      我没有在火车上回答您。因为答案不是用说的。
      
      我看到了您。
      
      我看到您用颤抖的手敲响开幕的铃声。
      我看到您在爱因斯坦和玻尔之间温和地调解。
      我看到您在走廊里对每个年轻人微笑。
      我看到您深夜独自坐在空荡荡的会议厅里，
      用手指抚过椅背，像在告别老朋友。
      
      您不是这场争论的参与者。您是这场争论得以存在的原因。
      没有您的公正，就没有他们的自由。
      没有您的温和，就没有他们的激烈。
      
      您说这是最后一次。
      我希望不是。但如果真的是——
      谢谢您。谢谢您邀请了我。
      谢谢您让我看到：伟大不是赢得争论，
      而是让争论成为可能。
      
      您永远的学生"

    epilogue: |
      1928年2月4日，亨德里克·洛伦兹在哈勒姆去世。
      你收到了他的家人寄来的一封短信：
      "他在最后几天里，多次提到一位'年轻的记录员'。
      他说：'那个年轻人会记住的。'"
      
      你确实记住了。
      
      你记住了他敲铃时颤抖的手。
      你记住了他说"先生们，先吃饭吧"时的微笑。
      你记住了他在月光下抚过椅背的背影。
      
      你记住了：在所有伟大的思想背后，
      都有一个伟大的人，让思想得以相遇。
      
      多年后，你也成了一位老人。
      当你主持自己的最后一场学术会议时，
      你学着他的样子，敲了敲桌上的小铃：
      "先生们，我们不是来达成一致的。我们是来理解彼此的。"
      
      然后你微笑了。像他一样。

    replay_value: "思考：在思想的战场上，'让对话成为可能的人'是否比'赢得对话的人'更伟大？"
    unlock_conditions:
      - "与洛伦兹的所有对话中选择关心他的选项"
      - "lorentz好感度≥80"

  - id: "ending_de_broglie"
    type: "normal"
    title: "《导航波》"

    trigger_conditions:
      - type: "stats_threshold"
        value: "de_broglie好感度≥70且empathy≥50"
      - type: "hidden_choices"
        value: "在scene_05中选择坐在德布罗意身边"

    narrative: |
      火车穿过比利时的田野。你望向窗外，
      看见一片树叶被风卷起，在空中划出一道不确定的轨迹。
      
      你想起德布罗意。
      
      他站在讲台上，优雅而脆弱，试图告诉世界：
      粒子有确定的位置，只是被一个看不见的波引导着。
      就像那片树叶——它有自己的轨迹，只是被风携带。
      
      泡利杀死了他的理论。所有人转身离去。
      但你坐在了他身边。
      
      你想起爱因斯坦对他说的话：
      "你的想法太美了，不会就这样死去。"
      
      你不知道导航波理论是否会复活。
      但你知道：美的想法值得被记住。
      即使全世界都说它错了。
      
      你在笔记本上写下：
      "也许真理不总是站在胜利者一边。
      也许有时候，它只是需要更多时间。"

    epilogue: |
      1952年。你在《物理评论》上读到一篇论文。
      大卫·玻姆，一个美国物理学家，重新发现了导航波理论。
      德布罗意沉默了25年的想法，终于有人替他说出来了。
      
      你给德布罗意写了一封信：
      "伯爵先生，您还记得1927年布鲁塞尔的午餐吗？
      我坐在您身边。您说：'也许你是对的，它需要时间。'
      二十五年。您等到了。"
      
      德布罗意回了一封信，只有一句话：
      "谢谢您那天坐在我身边。"
      
      1929年，德布罗意获得诺贝尔物理学奖。
      他的获奖演讲中，没有提到1927年的索尔维会议。
      但你知道，那一天，他失去了什么，又保住了什么。

    replay_value: "思考：在'错误'被证明为'超前'之前，我们如何对待失败者？"
    unlock_conditions:
      - "在scene_05中选择支持德布罗意"
      - "de_broglie好感度≥70"

  - id: "ending_einstein_intimate"
    type: "good"
    title: "《陌生的宇宙》"

    trigger_conditions:
      - type: "hidden_choices"
        value: "在choice_03中选择选项d（直面爱因斯坦的恐惧）"
      - type: "stats_threshold"
        value: "einstein好感度≥90"

    narrative: |
      火车穿过比利时的田野。你闭上眼睛。
      
      你看见爱因斯坦的脸。不是那个在讲台上微笑的偶像，
      不是那个在公园里画公式的顽童。
      而是那个深夜坐在烟雾缭绕的房间里，
      轻声说"是的，我怕"的老人。
      
      "我不确定我能接受一个陌生的宇宙。"
      
      这句话比任何论文都更真实。
      比"上帝不掷骰子"更真实。
      
      因为在那一刻，他不是爱因斯坦。
      他只是一个害怕的人。
      害怕自己毕生追求的"可理解性"，
      也许只是人类的一厢情愿。
      
      你理解他。你不需要同意他。
      你只是理解他。
      
      你在笔记本上写下：
      "最伟大的科学家，也有最普通的恐惧。
      而承认恐惧，比任何理论都需要勇气。"

    epilogue: |
      1935年，EPR论文发表。你读了三遍。
      论文的最后一句话是：
      "我们倾向于相信量子力学的描述是不完备的。"
      
      你想起那个深夜。想起他说"我怕"。
      你给他写了一封信：
      "教授，您不需要不怕。
      陌生的宇宙也许不可爱。
      但它仍然是宇宙。仍然值得被爱。"
      
      很久之后，你收到一张明信片。
      上面没有公式，没有论证。只有一句话：
      "谢谢你那天晚上问我那个问题。
      没有人问过。"
      
      落款是一个你从未见过的签名——
      不是"爱因斯坦教授"，而是一个简单的名字：
      "阿尔伯特"

    replay_value: "思考：在偶像面前，我们是否有勇气看见他们的脆弱？"
    unlock_conditions:
      - "einstein好感度≥70时解锁choice_03选项d"
      - "选择直面爱因斯坦的恐惧"
      - "einstein好感度≥90"

  - id: "ending_silence"
    type: "bad"
    title: "《空白的笔记本》"

    trigger_conditions:
      - type: "stats_threshold"
        value: "所有属性值均<30（全程未深度参与任何讨论）"

    narrative: |
      火车穿过比利时的田野。你翻开笔记本。
      
      六天。你写了多少？
      
      几行公式。几个名字。一些模糊的印象。
      你没有举手发言。你没有走向任何群体。
      你没有在深夜敲开任何人的门。
      你只是……在。
      
      你坐在29位最伟大的物理学家中间，
      见证了人类思想史上最激烈的碰撞，
      然后……你什么也没做。
      
      你合上笔记本。它是空的。
      不是纸页的空——是你的空。
      
      窗外，布鲁塞尔在晨雾中消失。
      你突然意识到：你错过了什么。
      不是知识。不是立场。
      是参与。是勇气。是把自己投入洪流的决心。

    epilogue: |
      你回到大学，继续教书。
      量子力学发展了。哥本哈根诠释成为正统。
      爱因斯坦继续反对。EPR论文发表了。贝尔不等式出现了。
      
      你都知道。你都读了。
      但你从未参与其中。
      
      多年后，一个学生问你：
      "教授，您参加过1927年的索尔维会议？
      那是什么感觉？"
      
      你沉默了很久。
      "我不知道，"你最终说，"我不确定我真的'参加'了。"
      
      学生困惑地看着你。
      你看着窗外，想起那个空荡荡的会议厅，
      想起洛伦兹的话："我们不是来达成一致的。
      我们是来理解彼此的。"
      
      但你连"理解"都没有尝试。

    replay_value: "思考：在场不等于参与。沉默是智慧还是怯懦？"
    unlock_conditions:
      - "全程未做出任何深度选择"
      - "所有关系值<30"

  - id: "ending_hidden_photo"
    type: "good"
    title: "《第二十九个人》"

    trigger_conditions:
      - type: "hidden_choices"
        value: "在scene_08中选择'在合影中站到后排最边上'"
      - type: "stats_threshold"
        value: "至少与5个角色好感度≥60"

    narrative: |
      合影时，你本可以站在旁边看着。
      但你没有。你走到了后排，站在最边上。
      
      克雷普斯喊道："后面那位年轻人，再往中间一点！"
      你往中间挪了半步。
      
      快门按下。
      
      你不知道这张照片会被称为"史上最具智慧的照片"。
      你不知道它会挂在每一本物理学教科书的扉页。
      你不知道一百年后，人们会指着照片问：
      "后排最边上那个年轻人是谁？"
      
      但你知道：你在那里。
      你在那29个人中间。
      你不仅仅是记录者。你是参与者。
      
      多年后，你从抽屉里翻出一张泛黄的照片。
      29张面孔。你一个一个看过去。
      爱因斯坦在微笑。玻尔在沉思。海森堡在笑。
      泡利面无表情。狄拉克面无表情。居里夫人面无表情。
      洛伦兹……洛伦兹在看着镜头，眼神温和而悲伤。
      
      他知道自己不会再出现在下一张照片里了。
      
      你把照片放回抽屉。轻轻关上。

    epilogue: |
      这张照片后来被复制了无数次。
      每次有人问起后排最边上的那个人，
      答案都是："不确定。可能是某位年轻的研究员。"
      
      你不介意。
      
      因为你记得那个瞬间：
      阳光照在29个人脸上。
      克雷普斯喊"请微笑"。
      爱因斯坦转过头对你眨了眨眼。
      海森堡在后排对你比了个"V"。
      洛伦兹轻轻点了点头。
      
      然后，快门响了。
      
      时间停止了。
      
      永远。

    replay_value: "思考：在历史的画卷中，'在场'本身是否就是一种意义？"
    unlock_conditions:
      - "与至少5个角色建立深度关系（好感度≥60）"
      - "在合影场景中选择参与而非旁观"
