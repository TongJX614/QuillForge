        type: "结局"
        description: "最终的内心独白"
        prompt: "火车缓缓启动。布鲁塞尔在晨雾中渐渐远去。你翻开笔记本，看着这六天的记录。爱因斯坦的'超距作用'、玻尔的'互补性'、海森堡的'不确定性'、泡利的'致命一问'、居里夫人的'让数据说话'、洛伦兹的'理解彼此'……你合上笔记本，望向窗外。"
        options:
          - id: "opt_09_01a"
            text: "（根据玩家全程选择，触发对应结局）"
            description: "结局分支点"

    assets_needed:
