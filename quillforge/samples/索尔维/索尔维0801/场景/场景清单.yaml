# 场景清单
# 定义剧本中所有场景的详细设定
# 场景数量不限，按剧情需要自由增减，每个场景按以下结构填写

scenes:
  - id: "scene_01"
    name: "抵达布鲁塞尔"
    location: "布鲁塞尔中央火车站 → 利奥波德公园酒店"
    time: "1927年10月23日，傍晚"
    atmosphere: "秋雨初歇，暮色中的布鲁塞尔宁静而庄重；空气中弥漫着梧桐叶和咖啡的气息"

    description: |
      火车缓缓驶入布鲁塞尔中央站。你提着旧皮箱走出车厢，
      十月的冷风裹着细雨扑面而来。站台上，一位戴着圆帽的比利时绅士
      举着写有你名字的纸牌——那是索尔维研究所的接待员。
      
      马车沿着湿漉漉的石板路驶向利奥波德公园。透过雨雾，你看见
      公园深处那座新古典主义建筑的轮廓——国际索尔维物理学研究所。
      明天，29位物理学家将在这里聚集。而你，一个28岁的年轻人，
      将坐在他们中间。
      
      酒店大堂里，你看见一个熟悉的身影正在办理入住——
      维尔纳·海森堡，你在哥本哈根的老朋友，正用他那标志性的大嗓门
      和前台争论房间朝向问题。

    trigger_conditions:
      - type: "game_start"
        value: "游戏开始"

    characters_present:
      - "player"
      - "heisenberg"

    interactions:
      - id: "int_01_01"
        type: "对话"
        description: "与海森堡重逢"
        prompt: "海森堡看见你，眼睛一亮：'天哪！你也来了！快过来，我跟你讲，玻尔明天要做互补性原理的报告，我激动得在火车上根本没睡着！'"
        options:
          - id: "opt_01_01a"
            text: "热情回应：'维尔纳！我也一样兴奋。你准备好了吗？'"
            description: "表达对会议的热情和对海森堡的支持"
          - id: "opt_01_01b"
            text: "调侃：'你确定你是因为激动没睡着，而不是因为花粉症？'"
            description: "用幽默回应，展现老友间的默契"
          - id: "opt_01_01c"
            text: "坦诚：'说实话，我有点紧张。坐在那群人中间……'"
            description: "表达真实感受，展现谦逊"

      - id: "int_01_02"
        type: "探索"
        description: "查看酒店大堂的参会者名单"
        prompt: "大堂的公告板上贴着一份打印的参会者名单。29个名字，9个国家，17位诺贝尔奖得主。你的目光在名单上扫过……"
        options:
          - id: "opt_01_02a"
            text: "仔细阅读每个名字和所属机构"
            description: "了解所有参会者的背景"
          - id: "opt_01_02b"
            text: "直接去找自己的房间，明天再说"
            description: "休息优先，养精蓄锐"

    assets_needed:
      - "布鲁塞尔火车站（秋雨暮色）"
      - "利奥波德公园酒店大堂背景"
      - "海森堡立绘（兴奋表情）"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景目的：建立游戏氛围，介绍玩家身份，与第一个NPC建立联系。
      海森堡的出场要展现其热情、自信、略带浮躁的性格。
      通过他的口自然引出会议的核心议题（互补性原理、不确定性）。
      氛围营造：秋夜的布鲁塞尔，历史感，"暴风雨前的宁静"。

  - id: "scene_02"
    name: "开幕前夜"
    location: "索尔维研究所会议厅 + 研究所花园"
    time: "1927年10月23日，晚间"
    atmosphere: "会议厅静谧空旷，月光透过高窗；花园中月光如水"

    description: |
      晚饭后，你独自来到研究所。明天就是开幕日，但会议厅的门虚掩着。
      你推门进去——29把椅子已经摆好，月光透过高窗洒在地板上，
      讲台上放着一杯水和一盒粉笔。洛伦兹的名字牌放在主席位上。
      
      你正在想象明天这里的场景，身后传来一个低沉的声音：
      "年轻人，你也睡不着？"
      
      是亨德里克·洛伦兹。74岁的老人拄着手杖，微笑着看着你。
      "我每次会议前夜都会来看看这个房间，"他说，"确认一切就绪。
      这是我最后一次做这件事了。"

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_01"

    characters_present:
      - "player"
      - "lorentz"

    interactions:
      - id: "int_02_01"
        type: "对话"
        description: "与洛伦兹的深夜谈话"
        prompt: "洛伦兹缓步走到窗前，看着月光下的花园。'你知道为什么我邀请你来吗？'他转过身，'不是因为你的论文——虽然它很好。是因为你同时在哥廷根和哥本哈根学习过。你能听懂双方的语言。'"
        options:
          - id: "opt_02_01a"
            text: "'我会尽力做好记录，不辜负您的信任。'"
            description: "表达感激和责任感"
          - id: "opt_02_01b"
            text: "'您说这是最后一次……您的身体……'"
            description: "关心洛伦兹的健康"
          - id: "opt_02_01c"
            text: "'您觉得明天谁会赢？爱因斯坦，还是玻尔？'"
            description: "直接问出所有人想知道的问题"

      - id: "int_02_02"
        type: "探索"
        description: "观察会议厅的布置"
        prompt: "你环顾会议厅：前排9把椅子（年长者坐），中排9把，后排11把。黑板上方挂着一幅麦克斯韦方程组的铜版画。墙角有一架旧钢琴——那是给海森堡准备的。"
        options:
          - id: "opt_02_02a"
            text: "在笔记本上画下座位图，标注每个人的位置"
            description: "为明天的观察做准备"
          - id: "opt_02_02b"
            text: "走到钢琴前，轻轻按下一个键"
            description: "感受这个空间的历史重量"

    assets_needed:
      - "索尔维研究所会议厅（夜晚）"
      - "洛伦兹立绘（温和微笑/沉思）"
      - "研究所花园（月夜）"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景目的：引入洛伦兹，建立"最后时光"的情感暗线。
      洛伦兹的出场要展现其温和、智慧、略带感伤的气质。
      通过他的话暗示：这将是一个时代的落幕。
      为玩家的"中间人"身份赋予叙事意义。

  - id: "scene_03"
    name: "第一天：风暴降临"
    location: "索尔维研究所会议厅"
    time: "1927年10月24日，上午9:00-12:30"
    atmosphere: "庄严而紧张，空气中弥漫着粉笔灰和烟草味；29位物理学家齐聚一堂"

    description: |
      上午九点整，洛伦兹敲响桌上的小铃。"先生们，第五届索尔维物理学会议开幕。"
      他的法语平稳而庄重："我们的主题是'电子与光子'。但我相信，
      真正等待我们的，是关于量子力学灵魂的追问。"
      
      上午的报告由德布罗意开场——他用法语优雅地阐述导航波理论。
      你注意到爱因斯坦频频点头，而泡利的表情越来越阴沉。
      
      然后是海森堡和玻恩的联合报告：量子力学的数学形式与概率诠释。
      海森堡讲到不确定性原理时，声音因激动而微微发颤：
      "你不可能同时精确知道一个粒子的位置和速度。这不是仪器的限制——
      这是自然本身的法则！"
      
      玻尔最后发言。他站起来，开始了他那标志性的、充满停顿和自我修正的长篇论述：
      "你看……互补性……不，让我重新说……我的意思是……
      波动图景和粒子图景……它们是互补的……"
      
      然后，爱因斯坦举手了。全场安静。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_02"

    characters_present:
      - "player"
      - "einstein"
      - "bohr"
      - "heisenberg"
      - "pauli"
      - "de_broglie"
      - "born"
      - "schrodinger"
      - "lorentz"
      - "curie"
      - "ehrenfest"
      - "dirac"

    interactions:
      - id: "int_03_01"
        type: "对峙"
        description: "爱因斯坦的'超距作用'质疑"
        prompt: "爱因斯坦缓缓站起来，嘴角带着那标志性的微笑。'诸位，请想象一个实验：电子通过一个小孔，射向一面半球形的照相底片。量子力学说，波函数均匀分布在半球面上——但当我们观察时，电子只出现在一个点。那么，波函数在其他所有点同时'消失'了？这是一种什么样的超距作用？'他看向玻尔：'尼尔斯，你能解释吗？'"
        options:
          - id: "opt_03_01a"
            text: "屏息观察玻尔的回应"
            description: "作为旁观者见证这一历史时刻"
          - id: "opt_03_01b"
            text: "在笔记本上快速记录爱因斯坦的论证逻辑"
            description: "履行记录员职责"
          - id: "opt_03_01c"
            text: "举手：'爱因斯坦教授，如果允许我补充——这个问题是否类似于双缝实验中的情况？'"
            description: "大胆参与讨论，展现学术勇气"

      - id: "int_03_02"
        type: "对话"
        description: "茶歇时的阵营分化"
        prompt: "茶歇时间。你端着咖啡站在走廊里，看见两个明显的群体：一边是海森堡、泡利、玻恩围着玻尔激烈讨论；另一边是爱因斯坦、薛定谔、埃伦费斯特在窗边低声交谈。德布罗意独自站在角落，表情忧郁。狄拉克面无表情地靠在墙上，谁也不找。"
        options:
          - id: "opt_03_02a"
            text: "走向玻尔那一组"
            description: "加入哥本哈根阵营的讨论"
          - id: "opt_03_02b"
            text: "走向爱因斯坦那一组"
            description: "加入实在论者的讨论"
          - id: "opt_03_02c"
            text: "走向独自站着的德布罗意"
            description: "关心被孤立的'第三条道路'"
          - id: "opt_03_02d"
            text: "走向狄拉克，沉默地站在他旁边"
            description: "与最沉默的人共享沉默"

    assets_needed:
      - "索尔维研究所会议厅（白天）"
      - "爱因斯坦立绘（微笑/质疑）"
      - "玻尔立绘（沉思/踱步）"
      - "海森堡立绘（激动/脸红）"
      - "泡利立绘（嘲讽/锐利）"
      - "德布罗意立绘（忧郁/优雅）"
      - "研究所走廊（茶歇）"

    branching_point: true
    critical_choice: "choice_01"

    narrative_notes: |
      本场景目的：正式引入核心冲突——爱因斯坦vs玻尔。
      爱因斯坦的"半球屏幕"思想实验必须用通俗语言讲清楚。
      茶歇时的阵营分化是玩家第一次"选边"的机会（但不强制）。
      泡利对德布罗意的敌意要在此场景中埋下伏笔。
      狄拉克的沉默是一个幽默点。

  - id: "scene_04"
    name: "利奥波德公园的散步"
    location: "利奥波德公园湖畔小径"
    time: "1927年10月24日，午后"
    atmosphere: "雨后初晴，湖面波光粼粼；梧桐叶在脚下沙沙作响"

    description: |
      下午的自由讨论结束后，你沿着利奥波德公园的湖畔小径散步。
      秋天的阳光穿透云层，在湖面上投下碎金般的光斑。
      
      前方，两个身影并肩而行——爱因斯坦和居里夫人。
      爱因斯坦没穿外套，衬衫袖子卷到手肘，手里拿着一根树枝
      不时在地上画公式。居里夫人穿着她标志性的黑色连衣裙，
      安静地听着，偶尔说一句简短的话。
      
      他们看见了你。爱因斯坦招手："啊，年轻人！来，来！
      居里夫人刚告诉我一个关于镭的实验——比你们那些波函数有趣多了！"

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_03"

    characters_present:
      - "player"
      - "einstein"
      - "curie"

    interactions:
      - id: "int_04_01"
        type: "对话"
        description: "与爱因斯坦和居里夫人的散步谈话"
        prompt: "爱因斯坦用树枝在地上画了一个圆：'你看，居里夫人做实验时，她不需要问——镭原子什么时候衰变？她只是观察。但海森堡告诉我，在观察之前，这个问题没有答案！'他转向你：'年轻人，你觉得呢？月亮在你不看它的时候，还存在吗？'"
        options:
          - id: "opt_04_01a"
            text: "'我相信月亮存在——但也许问题本身问错了？'"
            description: "试图调和双方，展现独立思考"
          - id: "opt_04_01b"
            text: "'教授，如果月亮不存在，那您的广义相对论描述的时空又是什么？'"
            description: "用爱因斯坦自己的理论反问"
          - id: "opt_04_01c"
            text: "看向居里夫人：'夫人，您怎么看？'"
            description: "将话题引向实验物理学家的视角"

      - id: "int_04_02"
        type: "对话"
        description: "居里夫人的智慧"
        prompt: "居里夫人停下脚步，看着湖面。'先生们，'她的声音平静如水，'我花了三十年和镭打交道。我从不问它'为什么'衰变——我只问'怎样'衰变，衰变多少。也许你们理论家的问题太多了。'她微微一笑——这是你今天第一次看见她笑。"
        options:
          - id: "opt_04_02a"
            text: "'夫人说得对。但如果没有理论指导，实验该往哪里走？'"
            description: "尊重但提出不同看法"
          - id: "opt_04_02b"
            text: "沉默地点头，感受这句话的重量"
            description: "让居里夫人的智慧沉淀"

    assets_needed:
      - "利奥波德公园湖畔（秋日午后）"
      - "爱因斯坦立绘（随性/画公式）"
      - "居里夫人立绘（微笑/沉静）"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景目的：展现爱因斯坦的随性幽默和哲学深度；
      引入居里夫人作为"第三种声音"——实验物理学家的务实智慧。
      节奏放缓，从会议的紧张中呼吸。
      "月亮在你不看它时存在吗？"是爱因斯坦的名言，必须保留。

  - id: "scene_05"
    name: "第二天：泡利的审判"
    location: "索尔维研究所会议厅"
    time: "1927年10月25日，上午"
    atmosphere: "比第一天更紧张；空气中有一种'审判日'的肃杀感"

    description: |
      今天的议程是深入讨论。德布罗意被安排做导航波理论的详细报告。
      他站在讲台上，用法语优雅而谨慎地阐述：
      "粒子确实有确定的位置……它被一个'导波'引导……
      就像一片树叶被河流携带……"
      
      爱因斯坦在座位上频频点头。但泡利——
      泡利一直面无表情地坐着，手指轻轻敲着桌面。
      
      德布罗意刚说完"……因此，导航波理论可以解释干涉现象"，
      泡利举手了。全场屏息。
      
      "伯爵先生，"泡利的声音平静如手术刀，"您的理论很美。
      但请解释：当两个粒子发生非弹性碰撞时——
      碰撞后它们的能量分配是概率性的——
      您的导航波如何解释这种概率分布？"
      
      德布罗意的脸白了。他张了张嘴，没有说出话来。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_04"

    characters_present:
      - "player"
      - "de_broglie"
      - "pauli"
      - "einstein"
      - "bohr"
      - "heisenberg"
      - "lorentz"

    interactions:
      - id: "int_05_01"
        type: "对峙"
        description: "泡利击溃导航波理论"
        prompt: "沉默持续了整整十秒。德布罗意试图回答，但每个回答都被泡利轻描淡写地驳回。'不，这不能解释。''不，这恰恰是问题所在。''伯爵先生，您确定您理解了自己的理论吗？'爱因斯坦试图插话帮助德布罗意，但洛伦兹温和地制止了他：'阿尔伯特，让德布罗意先生自己回答。'最终，德布罗意低声说：'我……需要更多时间思考。'"
        options:
          - id: "opt_05_01a"
            text: "同情德布罗意，在笔记中记录他的理论要点"
            description: "对失败者表示尊重"
          - id: "opt_05_01b"
            text: "承认泡利的论证无懈可击"
            description: "尊重逻辑的力量"
          - id: "opt_05_01c"
            text: "举手：'泡利教授，如果给德布罗意更多时间呢？科学史上很多理论需要时间成熟。'"
            description: "为德布罗意辩护（需要勇气）"

      - id: "int_05_02"
        type: "对话"
        description: "午餐时的余波"
        prompt: "午餐时，海森堡兴奋地拉着你：'你看到了吗？泡利只用了一个问题！一个问题！导航波就完了！'他大笑着拍桌子。角落里，德布罗意独自坐着，面前的食物几乎没动。爱因斯坦走过去，在他身边坐下，低声说了几句话。德布罗意抬起头，勉强笑了笑。"
        options:
          - id: "opt_05_02a"
            text: "和海森堡一起庆祝'哥本哈根的胜利'"
            description: "站在胜利者一边"
          - id: "opt_05_02b"
            text: "端着盘子走向德布罗意，坐在他身边"
            description: "在失败者身边表示支持"
          - id: "opt_05_02c"
            text: "观察爱因斯坦对德布罗意说了什么"
            description: "关注爱因斯坦的反应"

    assets_needed:
      - "索尔维研究所会议厅（白天）"
      - "德布罗意立绘（窘迫/苍白）"
      - "泡利立绘（平静/锐利）"
      - "午餐室"

    branching_point: true
    critical_choice: "choice_02"

    narrative_notes: |
      本场景目的：展现泡利的致命犀利和德布罗意的悲剧性失败。
      这是历史上真实发生的事件——泡利确实用非弹性散射问题击溃了导航波。
      但要避免将泡利塑造为"恶人"——他真心认为这是逻辑问题。
      爱因斯坦对德布罗意的安慰展现其宽厚。
      玩家的选择影响与德布罗意/泡利双方的关系。

  - id: "scene_06"
    name: "深夜钢琴"
    location: "研究所会议厅（夜晚）"
    time: "1927年10月25日，深夜"
    atmosphere: "月光透过高窗洒在地板上；钢琴声在空旷的大厅中回荡"

    description: |
      凌晨一点，你被一阵钢琴声惊醒。循声来到会议厅——
      海森堡坐在钢琴前，弹着巴赫的平均律。
      他的手指在琴键上飞舞，但眉头紧锁。
      
      你推门进去时，他没有停。弹完一整首前奏曲与赋格后，
      他转过身："睡不着？我也是。玻尔今天批评了我的不确定性论证。
      他说我把不确定性归因于'测量扰动'太浅了。"
      
      海森堡苦笑："他是对的。但被自己最尊敬的人说'你错了'，
      感觉就像……就像巴赫弹错了一个音。"

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_05"

    characters_present:
      - "player"
      - "heisenberg"

    interactions:
      - id: "int_06_01"
        type: "对话"
        description: "海森堡的困惑与成长"
        prompt: "海森堡又弹了一段——这次是舒曼的《梦幻曲》。'你知道吗，'他一边弹一边说，'玻尔说，不确定性不是因为我们'扰动'了粒子。而是因为……波和粒子本来就是同一枚硬币的两面。你不能只看到一面。'他停下来：'他可能是对的。但我不喜欢他说话的方式。一句话能说十分钟还没说完！'"
        options:
          - id: "opt_06_01a"
            text: "'也许你们都是对的，只是从不同角度看同一个东西？'"
            description: "尝试调和玻尔和海森堡"
          - id: "opt_06_01b"
            text: "'你的直觉没有错。测量确实会扰动系统。'"
            description: "支持海森堡的原始论证"
          - id: "opt_06_01c"
            text: "'弹完这首再说。让音乐帮你想想。'"
            description: "用友谊而非学术回应"

    assets_needed:
      - "索尔维研究所会议厅（夜晚）"
      - "海森堡立绘（沉思/苦笑）"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景目的：展现海森堡脆弱的一面，深化玩家与他的友谊。
      引入玻尔和海森堡之间的真实分歧（历史上确实存在）。
      用音乐作为情感载体——海森堡是出色的钢琴家。
      节奏舒缓，是激烈辩论后的情感呼吸。

  - id: "scene_07"
    name: "爱因斯坦的深夜告白"
    location: "酒店走廊 → 爱因斯坦房间"
    time: "1927年10月26日，深夜"
    atmosphere: "走廊昏暗，只有爱因斯坦房间门缝透出灯光；空气中弥漫着烟草味"

    description: |
      第三天会议结束后的深夜。你在走廊里遇见埃伦费斯特，
      他看起来疲惫而忧郁。"爱因斯坦想见你，"他说，
      "他有一个新想法，想听听年轻人的意见。"
      
      你敲开爱因斯坦的房门。房间里烟雾缭绕，
      桌上摊满了写满公式的纸张。爱因斯坦穿着睡衣，
      头发比平时更乱，但眼睛异常明亮。
      
      "坐下，坐下，"他指着唯一一把没被论文占领的椅子，
      "我今天想到了一个东西。如果量子力学是对的——
      如果波函数真的'坍缩'——那么两个曾经相互作用的粒子，
      即使分开到宇宙两端，测量一个就会瞬间影响另一个。
      你不觉得这很荒谬吗？"

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_06"

    characters_present:
      - "player"
      - "einstein"
      - "ehrenfest"

    interactions:
      - id: "int_07_01"
        type: "对话"
        description: "爱因斯坦谈'鬼魅般的超距作用'"
        prompt: "爱因斯坦在纸上画了两个粒子：'想象一对双胞胎粒子，它们一起诞生，然后飞向相反方向。量子力学说，在你测量之前，它们的状态是'不确定'的。但当你测量其中一个——比如发现它'向上旋转'——另一个瞬间变成'向下旋转'。无论它们相距多远！'他放下笔：'我把这叫做spukhafte Fernwirkung——鬼魅般的超距作用。上帝不会这样做事。'"
        options:
          - id: "opt_07_01a"
            text: "'但如果实验证实了呢？您会接受吗？'"
            description: "挑战爱因斯坦的底线"
          - id: "opt_07_01b"
            text: "'也许'影响'这个词本身就不对——也许它们从未真正'分开'？'"
            description: "提出一个超越双方框架的想法"
          - id: "opt_07_01c"
            text: "'教授，您是不是害怕自己错了？'"
            description: "直面爱因斯坦的内心（需要极高好感度）"

    assets_needed:
      - "爱因斯坦房间（烟雾/论文/灯光）"
      - "爱因斯坦立绘（睡衣/兴奋/深邃）"
      - "埃伦费斯特立绘（疲惫/忧郁）"

    branching_point: true
    critical_choice: "choice_03"

    narrative_notes: |
      本场景目的：引出EPR悖论的雏形（历史上爱因斯坦1927年已有此思路）。
      展现爱因斯坦深夜工作的习惯和思维方式的独特。
      "鬼魅般的超距作用"是爱因斯坦的原话，必须保留。
      这是玩家与爱因斯坦关系深化的关键场景。
      选项c需要之前与爱因斯坦好感度达到70以上才解锁。

  - id: "scene_08"
    name: "最后一日：合影"
    location: "索尔维研究所门前台阶"
    time: "1927年10月29日，下午"
    atmosphere: "会议结束后的释然与感伤；秋日阳光难得灿烂"

    description: |
      六天的激烈讨论结束了。没有投票，没有决议——
      洛伦兹在闭幕词中说："我们不是来达成一致的。我们是来理解彼此的。"
      
      现在，29位物理学家聚集在研究所门前的台阶上。
      摄影师本杰明·克雷普斯架好了相机。
      "先生们，请坐好！前排的教授们，请坐椅子。中间的，坐台阶。后面的，站着。"
      
      爱因斯坦和居里夫人被安排在前排中央。洛伦兹坐在正中间。
      海森堡和泡利站在后排，还在互相低声说着什么——大概在嘲讽谁。
      狄拉克面无表情地站在最边上。
      
      克雷普斯喊道："请微笑！"
      
      快门按下。这一刻被永远定格。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_07"

    characters_present:
      - "player"
      - "einstein"
      - "bohr"
      - "heisenberg"
      - "pauli"
      - "curie"
      - "lorentz"
      - "schrodinger"
      - "de_broglie"
      - "ehrenfest"
      - "dirac"
      - "born"

    interactions:
      - id: "int_08_01"
        type: "对话"
        description: "合影后的告别"
        prompt: "合影结束后，人群三三两两散去。洛伦兹走到你身边，把手放在你肩上：'年轻人，这六天你看到了什么？'他的眼神温和而期待。远处，爱因斯坦和玻尔并肩走着，还在低声讨论——他们的争论显然不会因为会议结束而停止。"
        options:
          - id: "opt_08_01a"
            text: "'我看到了人类理性最壮丽的战斗。没有输赢。'"
            description: "超越阵营的总结"
          - id: "opt_08_01b"
            text: "'我看到了您——洛伦兹教授——是这场战斗的灵魂。'"
            description: "向洛伦兹致敬"
          - id: "opt_08_01c"
            text: "'我不确定我看到了什么。但我确定我变了。'"
            description: "诚实的困惑"

    assets_needed:
      - "索尔维研究所门前（合影）"
      - "29人合影构图参考"
      - "洛伦兹立绘（感伤/温和）"
      - "秋日阳光"

    branching_point: false
    critical_choice: null

    narrative_notes: |
      本场景目的：重现历史上著名的索尔维会议合影。
      营造"一个时代落幕"的感伤氛围。
      洛伦兹的提问是对玩家整个旅程的总结性反思。
      暗示：洛伦兹将在不到四个月后去世（但不明说）。

  - id: "scene_09"
    name: "离别与余响"
    location: "布鲁塞尔中央火车站"
    time: "1927年10月30日，清晨"
    atmosphere: "薄雾笼罩的站台，离别的感伤；火车汽笛声"

    description: |
      清晨的布鲁塞尔笼罩在薄雾中。你提着皮箱走向火车站，
      口袋里装着六天来写满的笔记本——公式、论点、对话、感悟。
      
      站台上，你看见几个熟悉的身影：
      海森堡和泡利在等去苏黎世的火车，还在争论什么；
      德布罗意独自站在角落，帽檐压得很低；
      爱因斯坦和埃伦费斯特在另一侧站台，爱因斯坦正在
      用树枝在地上画着什么——即使在告别时刻，他也在思考。
      
      他看见了你，远远地挥了挥手，喊了一句：
      "年轻人！记住——上帝不掷骰子！"
      
      然后他笑了，那笑容里有固执，有温柔，有一种你无法完全理解的悲伤。

    trigger_conditions:
      - type: "scene_completed"
        value: "scene_08"

    characters_present:
      - "player"
      - "einstein"
      - "heisenberg"
      - "pauli"
      - "de_broglie"
      - "ehrenfest"

    interactions:
