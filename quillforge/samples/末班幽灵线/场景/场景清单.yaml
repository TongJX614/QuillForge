scenes:
- id: scene_01
  name: 末班幽灵线·始发
  location: 城市边缘的末班公交车厢内
  time: 凌晨零点十七分
  atmosphere: 昏黄灯光下弥漫着潮湿的旧皮革味，引擎低鸣像某种缓慢的呼吸，窗外的路灯一盏盏向后退去，安静得过分。
  description: 凌晨零点十七分，你终于挤上了这趟没有编号的末班车。车厢里灯光昏黄，空气里混着旧座椅的皮革味和一股若有若无的潮湿气息。六七位乘客歪在座位上打盹，司机老周沉默地握着方向盘，报站声懒洋洋地响起——却报的是上一站的名字。你找了个靠窗的位置坐下，刚想松口气，余光扫到后排：靠窗的座位不知什么时候空了，玻璃上还留着一片人形的雾气痕迹，像是有人一直靠在那里，直到车开动才消失。你下意识攥紧了扶手，心想，逻辑上说不通——车没停过，人怎么会不见了？
  trigger_conditions:
    type: game_start
  characters_present:
  - char_01
  - char_02
  - char_03
  interactions: []
  assets_needed: []
  branching_point: false
  critical_choice: ''
  narrative_notes: 深夜的城市边缘公路，一辆老旧公交车行驶在昏黄路灯下，车窗外是稀疏的树影和远处模糊的楼群轮廓，路灯的光在潮湿的路面上拉出长长的倒影，夜空无星，只有一层低垂的雾。
