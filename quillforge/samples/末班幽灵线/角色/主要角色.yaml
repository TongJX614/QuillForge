characters:
- id: char_01
  name: 林默
  role: 主角
  species: human
  gender: male
  age: 28
  occupation: 加班到深夜的IT工程师
  appearance: 中等身高偏瘦，黑色短发因一天未打理而略显凌乱，戴一副细框眼镜，穿着深灰色连帽卫衣和皱巴巴的牛仔裤，背着一个黑色双肩包，手里紧握着手机，面容疲惫但眼神警觉。
  personality: 理性冷静、善于观察、内心有未愈合的创伤
  voice_tone: 说话简短直接，遇到紧张情况会下意识用技术术语比喻，口头禅是「逻辑上说不通」。
  motivation: 弄明白为什么乘客在消失，并活着下车。
  background: 连续加班一个月，今晚是项目上线前最后一夜，他只想赶上末班车回家睡觉。
  arc: 从用理性解释一切，到被迫接受无法解释的现实，并直面自己逃避多年的愧疚。
- id: char_02
  name: 老周
  role: 司机
  species: human
  gender: male
  age: 56
  occupation: 末班公交司机
  appearance: 矮胖身材，圆脸，两鬓花白，头顶微秃，穿着深蓝色公交制服，袖口磨得发白，右手无名指缺了一截，脖子上挂着一块褪色的工作牌，眼神总是盯着前方路面，从不看后视镜。
  personality: 沉默寡言、固执、对某些事讳莫如深
  voice_tone: 声音沙哑低沉，话极少，每次开口几乎都是重复同一句「别回头」，被追问时只会说「这条线我开了二十年」。
  motivation: 把车开到终点站，哪怕终点站已经不存在了。
  background: 二十年前这条线路发生过一起事故，从那以后他每晚都开末班车，像是在等什么人。
  arc: 从冷漠的旁观者，到最终说出二十年前的真相，完成自我救赎或彻底沉沦。
- id: char_03
  name: 小满
  role: 神秘乘客
  species: human
  gender: female
  age: 16
  occupation: 不明
  appearance: 瘦小的少女，扎着两条低马尾，发绳是褪色的红色，穿一件明显偏大的白色校服外套，校徽模糊看不清，脚上是一双沾满泥的帆布鞋，脸色苍白得不像活人，左手腕系着一根红绳。
  personality: 安静、似懂非懂、偶尔说出令人毛骨悚然的话
  voice_tone: 声音轻而飘，说话像在背书，会突然说「你也是坐过站的人吗」，对时间的概念很混乱。
  motivation: 找到二十年前没能下车的那个人。
  background: 二十年前那趟末班车上唯一没能下车的乘客，至今仍在车上徘徊，等待有人带她回家。
  arc: 从模糊的幽灵状态逐渐清晰，最终向主角揭示真相并做出选择。
