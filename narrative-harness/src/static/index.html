<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Harness — 通用文本生成引擎</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--accent:#3b82f6;--accent2:#8b5cf6;--text:#e2e8f0;--muted:#94a3b8;--danger:#ef4444;--success:#22c55e;--warn:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .meta{font-size:13px;color:var(--muted)}
.container{max-width:900px;margin:0 auto;padding:24px}

/* Upload Section */
.upload-section{margin-bottom:32px}
.upload-section h2{font-size:22px;margin-bottom:16px}
.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:40px;text-align:center;cursor:pointer;transition:all .3s;margin-bottom:20px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(59,130,246,.05)}
.upload-zone .icon{font-size:40px;margin-bottom:12px;opacity:.5}
.upload-zone p{color:var(--muted);font-size:14px}
.upload-zone .hint{font-size:12px;color:var(--muted);margin-top:8px;opacity:.6}
.file-input{display:none}

/* Sample Cards */
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.sample-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s}
.sample-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.sample-card.selected{border-color:var(--success);background:rgba(34,197,94,.08)}
.sample-card .title{font-size:15px;font-weight:600;margin-bottom:4px}
.sample-card .info{font-size:12px;color:var(--muted)}
.sample-card .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sample-card .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(139,92,246,.15);color:var(--accent2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{padding:8px 16px;font-size:13px}

/* Script Preview */
.preview{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.preview h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.preview .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview .item{font-size:13px}
.preview .item .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.preview .item .val{margin-top:2px}
.char-chips{display:flex;flex-wrap:wrap;gap:6px}
.char-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(59,130,246,.12);color:var(--accent)}

/* Progress */
.progress-section{margin-bottom:20px}
.progress-bar-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:16px}
.progress-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}
.progress-label{font-size:13px;color:var(--muted);white-space:nowrap}

/* Scene */
.scene-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.scene-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.scene-badge{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.scene-title{font-size:20px;font-weight:600}
.scene-location{font-size:13px;color:var(--muted);margin-left:auto}
.narration{font-size:15px;line-height:1.8;color:#cbd5e1;margin-bottom:24px;padding:16px;background:rgba(59,130,246,.05);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;white-space:pre-wrap}
.dialogue-list{margin-bottom:24px}
.dialogue-item{display:flex;gap:12px;margin-bottom:12px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dialogue-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.dialogue-bubble{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:10px 16px;flex:1}
.dialogue-name{font-size:13px;font-weight:600;margin-bottom:2px}
.dialogue-text{font-size:14px;line-height:1.6}
.dialogue-emotion{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

/* ═══ Galgame VN Stage ═══ */
.vn-stage{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.vn-bg{position:absolute;inset:0;/* 背景：默认占位色，生成后由 JS 设置 background-image */background-color:#000;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-color .5s}
.vn-sprites{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 1% 70px}
.vn-sprite{width:400px;height:720px;max-height:80vh;border-radius:16px 16px 0 0;transition:all .4s ease;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}
.vn-sprite .sprite-body{width:180px;height:500px;background:#34d399;border-radius:60px 60px 20px 20px;opacity:.85;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.vn-sprite .sprite-img{width:100%;height:100%;object-fit:contain;object-position:bottom;border-radius:16px 16px 0 0;box-shadow:0 8px 32px rgba(0,0,0,.25);-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 80%,transparent 100%)}
/* 素材预生成加载页 */
.asset-loading-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,80vw);text-align:center;z-index:5}
.asset-loading-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:18px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.asset-loading-bar{height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin-bottom:12px}
.asset-loading-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .4s ease}
.asset-loading-msg{font-size:13px;color:rgba(255,255,255,.85)}
.vn-sprite .sprite-label{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);font-size:13px;color:#fff;background:rgba(0,0,0,.55);padding:3px 14px;border-radius:12px;white-space:nowrap}
.vn-sprite.pos-left{order:1;margin-right:auto}
.vn-sprite.pos-right{order:3;margin-left:auto}
.vn-sprite.active{filter:brightness(1);transform:scale(1.03)}
.vn-sprite.dimmed{filter:brightness(.45) saturate(.5);transform:scale(.97)}
.vn-sprite.hidden{opacity:0;pointer-events:none}
.vn-dialogue-box{position:relative;z-index:10;margin:0 auto 24px;width:min(92%,860px);background:rgba(10,14,23,.88);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:20px 28px 18px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 -4px 40px rgba(0,0,0,.4);min-height:130px;max-height:46vh;display:flex;flex-direction:column;justify-content:center;transition:opacity .3s}
.vn-speaker-name{display:inline-block;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:3px 16px;border-radius:8px;margin-bottom:10px;letter-spacing:.5px;flex-shrink:0}
.vn-speaker-name.narrator{background:rgba(148,163,184,.3);color:var(--muted);font-style:italic}
/* 角色动作/心理旁白（abc组合：旁白形式+斜体弱化+角色名前缀） */
.vn-speaker-name.action{background:rgba(139,92,246,.22);color:#c4b5fd}
.vn-text.vn-action-text{font-style:italic;color:rgba(203,213,225,.9)}
.vn-text{font-size:16px;line-height:1.9;color:#f1f5f9;white-space:pre-wrap;min-height:48px;max-height:26vh;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.5) transparent}
.vn-text::-webkit-scrollbar{width:6px}
.vn-text::-webkit-scrollbar-track{background:transparent}
.vn-text::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:3px}
.vn-text::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.7)}
.vn-emotion{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
.vn-advance-hint{position:absolute;bottom:10px;right:20px;font-size:12px;color:rgba(255,255,255,.4);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.vn-advance-hint.waiting{color:rgba(251,191,36,.7);animation:none}
/* 章节开头旁白居中卡片弹窗 */
.vn-narration-popup{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
.vn-narration-card{max-width:min(760px,86%);max-height:82vh;background:rgba(15,20,32,.94);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:44px 52px 36px;box-shadow:0 20px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}
.vn-narration-text{font-size:19px;line-height:2;color:#e2e8f0;white-space:pre-wrap;text-align:center;flex:1;min-height:0;max-height:60vh;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.5) transparent}
.vn-narration-text::-webkit-scrollbar{width:6px}
.vn-narration-text::-webkit-scrollbar-track{background:transparent}
.vn-narration-text::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:3px}
.vn-narration-hint{margin-top:26px;text-align:center;font-size:13px;color:rgba(255,255,255,.45);animation:blink 1.2s ease-in-out infinite}
.vn-narration-hint.waiting{color:rgba(251,191,36,.7);animation:none}
.vn-scene-info{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(10,14,23,.7);padding:6px 20px;border-radius:20px;font-size:13px;color:var(--muted);backdrop-filter:blur(4px)}
.vn-progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:20;transition:width .3s}
.vn-choices-overlay{position:absolute;inset:0;z-index:30;background:rgba(10,14,23,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(4px)}
.vn-choices-overlay .choices-label{color:var(--warn);font-size:16px;font-weight:600;margin-bottom:12px}
.vn-choices-overlay .choice-btn{width:min(80%,500px);text-align:center;font-size:15px;padding:16px 24px}
.vn-top-bar{position:absolute;top:12px;right:16px;z-index:20;display:flex;gap:8px}
.vn-top-bar button{background:rgba(10,14,23,.6);border:1px solid rgba(255,255,255,.15);color:var(--muted);padding:5px 14px;border-radius:8px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px)}
.vn-top-bar button:hover{color:#fff;border-color:var(--accent)}
.vn-top-bar button.active{color:#fff;border-color:var(--accent);background:rgba(139,92,246,.28)}
.vn-streaming-hint{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.vn-streaming-hint .spinner{width:16px;height:16px;border-width:2px}

/* ═══ 结局画面（Galgame 风格） ═══ */
.vn-ending-overlay{position:absolute;inset:0;z-index:40;background:radial-gradient(ellipse at center,rgba(30,18,48,.88) 0%,rgba(10,14,23,.96) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity .5s;backdrop-filter:blur(6px)}
.ending-type{font-size:15px;font-weight:600;letter-spacing:3px;padding:6px 22px;border:1px solid;border-radius:20px;animation:endingFadeIn .9s ease both}
.ending-title{font-size:44px;font-weight:700;color:#f1f5f9;letter-spacing:6px;text-align:center;padding:0 24px;animation:endingFadeIn 1.1s ease .25s both;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.ending-hint{font-size:13px;color:rgba(255,255,255,.4);margin-top:28px;animation:blink 1.2s ease-in-out infinite}
@keyframes endingFadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.ending-final-card{background:rgba(10,14,23,.85);border:1px solid;border-radius:16px;padding:28px 44px;text-align:center;max-width:min(84%,540px);backdrop-filter:blur(8px);animation:endingFadeIn .8s ease both}
.ending-title-sm{font-size:24px;font-weight:700;color:#f1f5f9;margin:12px 0 4px;letter-spacing:2px}
.ending-replay{font-size:13px;color:var(--muted);font-style:italic;margin-top:14px;line-height:1.7}
/* 结局全屏顶端向下滚动叙事 */
.vn-ending-scroll{position:absolute;inset:0;z-index:35;overflow-y:auto;padding:12vh 6vw 18vh;cursor:pointer;background:linear-gradient(180deg,rgba(10,14,23,.35) 0%,rgba(10,14,23,.75) 100%);scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.5) transparent}
.vn-ending-scroll::-webkit-scrollbar{width:6px}
.vn-ending-scroll::-webkit-scrollbar-track{background:transparent}
.vn-ending-scroll::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:3px}
.vn-ending-scroll-text{font-size:20px;line-height:2.1;color:#e2e8f0;white-space:pre-wrap;text-align:center;max-width:min(760px,88%);margin:0 auto}
.vn-ending-scroll-hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.45);animation:blink 1.2s ease-in-out infinite;z-index:36}

/* Choices */
.choices-section{margin-top:8px}
.choices-label{font-size:14px;font-weight:600;color:var(--warn);margin-bottom:12px}
.choice-btn{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:8px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.3);border-radius:10px;color:var(--text);font-size:14px;cursor:pointer;transition:all .2s}
.choice-btn:hover{background:rgba(139,92,246,.15);border-color:var(--accent2);transform:translateX(4px)}
.choice-btn .effect{font-size:12px;color:var(--muted);margin-top:4px}
.choice-btn.selected{background:rgba(34,197,94,.15);border-color:var(--success)}
.waiting-msg{text-align:center;padding:20px;color:var(--success);font-size:14px;background:rgba(34,197,94,.08);border:1px dashed var(--success);border-radius:10px;margin-top:16px}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--muted)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* History */
.history-toggle{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;margin-top:16px}
.history-panel{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;max-height:400px;overflow-y:auto;display:none}
.history-panel.show{display:block}
.history-entry{padding:12px 0;border-bottom:1px solid var(--border)}
.history-entry:last-child{border-bottom:none}
.history-scene{font-size:13px;font-weight:600;color:var(--accent)}
.history-choice{font-size:12px;color:var(--success);margin-top:4px}
.history-narration{font-size:12px;color:var(--muted);font-style:italic;margin:6px 0 4px;line-height:1.7;white-space:pre-wrap}
.history-dialogue{font-size:12px;color:#cbd5e1;margin:3px 0;line-height:1.6}
.history-speaker{color:var(--accent);font-weight:600;margin-right:6px}

.end-screen{text-align:center;padding:60px 24px}
.end-screen h2{font-size:28px;margin-bottom:12px}
.end-screen p{color:var(--muted);margin-bottom:24px}
.section-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
</style>
</head>
<body>

<div class="header">
  <h1>Narrative Harness</h1>
  <div class="meta" id="headerMeta">通用文本生成引擎 v3.0</div>
</div>

<div class="container" id="app"></div>

<script>
const API = '';
let sessionId = null;
let sceneData = null;
let chosenIndex = -1;
let currentScript = null;  // {script_id, summary}
const app = document.getElementById('app');

// ─── Screens ─────────────────────────────────────

async function showHomeScreen() {
  app.innerHTML = '<div class="loading"><div class="spinner"></div>加载内置剧本...</div>';
  let samples = [];
  try {
    const res = await api('/api/samples');
    samples = res.samples || [];
  } catch(e) {
    // Server might not be running
    app.innerHTML = `
      <div class="start-screen" style="text-align:center;padding:80px 24px">
        <h2 style="font-size:24px;margin-bottom:12px">服务器未启动</h2>
        <p style="color:var(--muted);margin-bottom:24px">请先双击 start_server.bat 启动服务，然后再刷新此页面。</p>
        <p style="color:var(--muted);font-size:13px">服务地址: http://127.0.0.1:8765</p>
      </div>`;
    return;
  }

  const sampleCards = samples.map((s, idx) => `
    <div class="sample-card" data-idx="${idx}" data-path="${s.path}">
      <div class="title">${s.title || s.filename}</div>
      <div class="info">${s.worldline || ''} · ${s.total_scenes || 0} 个场景</div>
      <div class="tags">${(s.characters||[]).map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="upload-section">
      <h2>加载剧本</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px">
        输入本地文件夹路径、上传文件/文件夹，或选择内置示例。
      </p>

      <!-- 文件夹路径输入 -->
      <div class="preview" style="margin-bottom:16px">
        <h3>📁 从本地路径加载</h3>
        <div style="display:flex;gap:10px;margin-top:8px">
          <input type="text" id="folderPathInput" placeholder="输入剧本文件夹路径，如 C:\\Users\\...\\回魂公寓"
            style="flex:1;padding:10px 14px;background:#1a1a24;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none">
          <button class="btn btn-primary btn-sm" id="loadPathBtn" style="white-space:nowrap">加载</button>
        </div>
      </div>

      <!-- 上传区域 -->
      <div style="display:flex;gap:12px;margin-bottom:20px">
        <div class="upload-zone" id="dropZone" style="flex:1;padding:24px">
          <div class="icon">📄</div>
          <p>拖拽文件到这里，或点击上传</p>
          <p class="hint">支持 .yaml / .yml / .json</p>
        </div>
        <div class="upload-zone" id="dropFolderZone" style="flex:1;padding:24px">
          <div class="icon">📂</div>
          <p>点击选择文件夹上传</p>
          <p class="hint">保留子目录结构</p>
        </div>
      </div>
      <input type="file" id="fileInput" class="file-input" accept=".yaml,.yml,.json">
      <input type="file" id="folderInput" class="file-input" webkitdirectory multiple>
    </div>

    <div class="section-label">内置示例剧本</div>
    <div class="samples" id="samplesList">${sampleCards || '<p style="color:var(--muted)">暂无内置剧本</p>'}</div>

    <div id="previewArea"></div>
    <div id="startArea" style="text-align:center;margin-top:24px;display:none">
      <button class="btn btn-primary" id="startBtn">开始生成</button>
    </div>
  `;

  // Folder path input
  document.getElementById('loadPathBtn').addEventListener('click', () => loadFromPath());
  document.getElementById('folderPathInput').addEventListener('keydown', e => { if(e.key==='Enter') loadFromPath(); });

  // Event listeners
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  const dfz = document.getElementById('dropFolderZone');
  const folderIn = document.getElementById('folderInput');
  dz.addEventListener('click', () => fi.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); if(e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); });
  fi.addEventListener('change', e => { if(e.target.files[0]) uploadFile(e.target.files[0]); });
  dfz.addEventListener('click', () => folderIn.click());
  folderIn.addEventListener('change', e => { if(e.target.files.length > 0) uploadFolder(e.target.files); });

  // Sample card clicks — use event delegation
  document.getElementById('samplesList').addEventListener('click', e => {
    const card = e.target.closest('.sample-card');
    if (!card) return;
    document.querySelectorAll('.sample-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    fetchSample(card.dataset.path);
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
}

let vnState = { queue: [], idx: 0, charPositions: {}, choices: [], sessionState: '', meta: {}, progress: 0 };
let typewriterTimer = null;
let typewriterDone = true;
let vnStreamDone = true; // 流是否已结束
let vnStreamStarted = false; // 是否已开始显示内容
let vnNarrationStreaming = false; // 旁白是否正在逐字流式到达
let vnNarrationIdx = -1; // 流式旁白在队列中的下标
let vnIsEnding = false; // 是否处于结局画面

let vnEndingScrollActive = false; // 结局全屏滚动叙事是否激活
let vnEndingScrollTimer = null; // 结局滚动叙事打字机定时器
let vnEndingScrollDone = false; // 结局滚动叙事打字机是否完成
let vnPopupActive = false; // 章节开头旁白弹窗是否激活

// ─── 美术素材（预生成的角色立绘 + 场景背景） ───
// characters: 角色名 → 图片URL；scenes: scene_id/场景名 → 图片URL；enabled=false 时用占位图
let vnAssets = { characters: {}, scenes: {}, enabled: false };

// 游戏开始时一次性预生成全部素材（SSE 进度）；未配置生图 key 时立即返回用占位图
async function pregenerateAssets() {
  vnAssets = { characters: {}, scenes: {}, enabled: false };
  app.innerHTML = `
    <div class="vn-stage">
      <div class="vn-bg" style="background-color:#191026"></div>
      <div class="asset-loading-box">
        <div class="asset-loading-title">正在生成美术素材</div>
        <div class="asset-loading-bar"><div class="asset-loading-fill" id="assetFill"></div></div>
        <div class="asset-loading-msg" id="assetMsg">准备中...</div>
      </div>
    </div>`;
  const fillEl = () => document.getElementById('assetFill');
  const msgEl = () => document.getElementById('assetMsg');
  try {
    const res = await fetch(`/api/session/${sessionId}/assets-stream`);
    if (!res.ok) return; // 接口异常不阻塞，回退占位图
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch(e) { continue; }
        if (evt.event === 'assets_meta') {
          if (msgEl()) msgEl().textContent = evt.message || '正在生成美术素材';
        } else if (evt.event === 'asset_progress') {
          const pct = evt.total ? Math.round((evt.done / evt.total) * 100) : 0;
          if (fillEl()) fillEl().style.width = pct + '%';
          if (msgEl()) msgEl().textContent =
            evt.status === 'generating'
              ? `正在绘制「${evt.name}」（${evt.done + 1}/${evt.total}）`
              : `「${evt.name}」完成（${evt.done}/${evt.total}）`;
        } else if (evt.event === 'assets_done') {
          vnAssets = { characters: evt.characters || {}, scenes: evt.scenes || {}, enabled: !!evt.enabled };
          if (fillEl()) fillEl().style.width = '100%';
        }
      }
    }
  } catch(e) {
    // 生成失败不阻塞游戏：回退占位图
    vnAssets = { characters: {}, scenes: {}, enabled: false };
  }
}

// 根据当前场景 meta 应用背景图（有则用生成图，无则保留占位色）
function vnApplyBackground(meta) {
  const bgEl = document.getElementById('vnBg');
  if (!bgEl || !meta) return;
  const url = vnAssets.scenes[meta.scene_id] || vnAssets.scenes[meta.scene_name];
  if (url) bgEl.style.backgroundImage = `url(${url})`;
}

// ─── 立绘舞台（固定位置，与对话框姓名实时同步） ───
// 规则：立绘只放在最左/最右两端；每个角色首次登场时分配固定位置（第1人→左、第2人→右），
//       之后位置永不改变，不会左右乱跑；当前说话者高亮，其余在场角色淡显。
//       左右都被占用时（第 3 人登场），移除最久未发言者腾出其位置（台上最多 2 人）。
const VN_POS_POOL = ['left', 'right'];
let vnCharPos = {};        // 角色名 → 固定位置（left/right）
let vnSpeakerRecency = []; // 发言新旧序列（末尾为最新）

function vnResetSprites() {
  vnCharPos = {};
  vnSpeakerRecency = [];
}

function vnSyncSprites(speaker) {
  const spritesEl = document.getElementById('vnSprites');
  if (!spritesEl || !speaker) return;

  // 1) 更新发言新旧序列（该角色置为最新）
  vnSpeakerRecency = vnSpeakerRecency.filter(n => n !== speaker);
  vnSpeakerRecency.push(speaker);

  // 2) 首次登场：分配一个固定位置；左右都被占用时，移除最久未发言者回收其位置
  if (!(speaker in vnCharPos)) {
    let freePos = VN_POS_POOL.find(p => !Object.values(vnCharPos).includes(p));
    if (!freePos) {
      const evict = vnSpeakerRecency.filter(n => n !== speaker && (n in vnCharPos))[0];
      freePos = vnCharPos[evict];
      delete vnCharPos[evict];
      const oldEl = spritesEl.querySelector(`[data-char="${evict}"]`);
      if (oldEl) oldEl.remove();
    }
    vnCharPos[speaker] = freePos;
  }

  // 3) 为在场角色确保立绘元素（首次登场创建，位置一次定死不改动）
  Object.keys(vnCharPos).forEach(name => {
    if (!spritesEl.querySelector(`[data-char="${name}"]`)) {
      const div = document.createElement('div');
      div.className = `vn-sprite pos-${vnCharPos[name]} dimmed hidden`;
      div.dataset.char = name;
      const imgUrl = vnAssets.characters[name];
      div.innerHTML = imgUrl
        ? `<img class="sprite-img" src="${imgUrl}" alt="${name}"><div class="sprite-label">${name}</div>`
        : `<div class="sprite-body"></div><div class="sprite-label">${name}</div>`;
      spritesEl.appendChild(div);
      void div.offsetHeight; // 先以隐藏态布局一次，随后移除 hidden 才有淡入过渡
    }
  });

  // 4) 同步可见性与高亮（位置已固定，transition 负责淡入淡出）
  document.querySelectorAll('.vn-sprite').forEach(s => {
    const name = s.dataset.char;
    if (name in vnCharPos) {
      s.classList.remove('hidden');
      if (name === speaker) { s.classList.add('active'); s.classList.remove('dimmed'); }
      else { s.classList.add('dimmed'); s.classList.remove('active'); }
    } else {
      s.classList.add('hidden');
      s.classList.remove('active');
    }
  });
}

// ─── 流式生成入口 ───
async function generateSceneStream() {
  chosenIndex = -1;
  vnStreamDone = false;
  vnStreamStarted = false;
  clearInterval(typewriterTimer);

  // 立即渲染 VN 舞台（空对话框 + 加载提示）
  vnState = { queue: [], idx: -1, charPositions: {}, choices: [], sessionState: '', meta: {}, progress: 0 };
  vnNarrationStreaming = false;
  vnNarrationIdx = -1;
  vnIsEnding = false;
  vnEndingData = null;
  vnPopupActive = false;
  clearInterval(vnPopupTypewriterTimer);
  vnResetSprites();
  app.innerHTML = `
    <div class="vn-stage" id="vnStage">
      <div class="vn-progress" id="vnProgress" style="width:0%"></div>
      <div class="vn-bg" id="vnBg"></div>
      <div class="vn-scene-info" id="vnSceneInfo">生成中...</div>
      <div class="vn-top-bar">
        <button id="vnAutoBtn">自动</button>
        <button id="vnHistBtn">历史</button>
        <button id="vnHomeBtn">退出</button>
      </div>
      <div class="vn-sprites" id="vnSprites"></div>
      <div class="vn-dialogue-box" id="vnDialogueBox">
        <div id="vnSpeaker"></div>
        <div class="vn-text" id="vnText"><div class="vn-streaming-hint"><div class="spinner"></div><span id="vnStageMsg">正在连接...</span></div></div>
        <div class="vn-emotion" id="vnEmotion"></div>
        <div class="vn-advance-hint" id="vnHint" style="display:none">点击继续 ▶</div>
      </div>
      <div class="vn-choices-overlay" id="vnChoices" style="display:none"></div>
      <div class="vn-narration-popup" id="vnNarrationPopup" style="display:none">
        <div class="vn-narration-card">
          <div class="vn-narration-text" id="vnNarrationText"></div>
          <div class="vn-narration-hint" id="vnPopupHint">点击继续 ▶</div>
        </div>
      </div>
    </div>
    <div class="history-panel" id="historyPanel" style="position:fixed;top:60px;right:16px;z-index:1100;width:min(420px,86vw)"></div>`;

  document.getElementById('vnDialogueBox').addEventListener('click', vnAdvance);
  document.addEventListener('keydown', vnKeyHandler);
  document.getElementById('vnHistBtn').addEventListener('click', toggleHistory);
  document.getElementById('vnAutoBtn').addEventListener('click', vnToggleAutoPlay);
  vnSyncAutoBtn();
  document.getElementById('vnHomeBtn').addEventListener('click', () => {
    document.removeEventListener('keydown', vnKeyHandler);
    showHomeScreen();
  });

  // 用 fetch + ReadableStream 读取 SSE
  try {
    const res = await fetch(`/api/session/${sessionId}/generate-stream`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 解析 SSE 事件
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 保留未完成的行
      let eventType = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          eventType = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const dataStr = line.slice(6);
          try {
            const evt = JSON.parse(dataStr);
            handleStreamEvent(evt);
          } catch(e) { /* ignore parse errors */ }
          eventType = '';
        }
      }
    }
  } catch(e) {
    const textEl = document.getElementById('vnText');
    if (textEl) textEl.innerHTML = `<span style="color:var(--danger)">生成失败: ${e.message}</span>`;
    const hintEl = document.getElementById('vnHint');
    if (hintEl) { hintEl.style.display = 'block'; hintEl.textContent = '点击返回首页'; }
    // 点击返回
    document.getElementById('vnDialogueBox').onclick = () => showHomeScreen();
  }
}

function handleStreamEvent(evt) {
  const type = evt.event;
  const stageMsgEl = document.getElementById('vnStageMsg');
  const textEl = document.getElementById('vnText');
  const hintEl = document.getElementById('vnHint');

  switch(type) {
    case 'stage':
      if (stageMsgEl) stageMsgEl.textContent = evt.message || '生成中...';
      break;

    case 'narration_start':
      // 旁白开始逐字流式到达
      vnNarrationStreaming = true;
      vnNarrationIdx = -1;
      break;

    case 'narration_delta':
      // 首个增量：创建流式旁白队列项并开始显示
      if (vnNarrationIdx < 0) {
        vnState.queue.push({ type: 'narration', speaker: '', text: '', emotion: '', streaming: true });
        vnNarrationIdx = vnState.queue.length - 1;
        vnTryStartDisplay();
      }
      vnState.queue[vnNarrationIdx].text += (evt.delta || '');
      break;

    case 'narration':
      if (vnNarrationStreaming && vnNarrationIdx >= 0 && vnState.queue[vnNarrationIdx]) {
        // 流式旁白结束：用完整文本校对并标记完成
        const nItem = vnState.queue[vnNarrationIdx];
        nItem.text = evt.text;
        nItem.streaming = false;
        // 若该旁白正在显示且打字机已结束（被用户跳过），同步刷新为完整文本
        if (vnState.idx === vnNarrationIdx && typewriterDone) {
          const tEl = document.getElementById('vnText');
          if (tEl) { tEl.textContent = evt.text; tEl.scrollTop = tEl.scrollHeight; }
        }
      } else {
        // 非流式回退（旧后端）：直接入队完整旁白
        vnState.queue.push({ type: 'narration', speaker: '', text: evt.text, emotion: '', streaming: false });
        vnTryStartDisplay();
      }
      vnNarrationStreaming = false;
      vnNarrationIdx = -1;
      vnRefreshHint();
      break;

    case 'dialogue':
      vnState.queue.push({ type: 'dialogue', speaker: evt.speaker, text: evt.text, emotion: evt.emotion || '' });
      vnTryStartDisplay();
      vnRefreshHint();
      break;

    case 'action':
      // 角色动作/神态/心理旁白（穿插在对话之间，以旁白形式呈现）
      vnState.queue.push({ type: 'action', speaker: evt.subject || '', text: evt.text, emotion: '' });
      vnTryStartDisplay();
      vnRefreshHint();
      break;

    case 'choices':
      vnState.choices = evt.choices || [];
      break;

    case 'retry':
      // 验证失败重试，清空队列
      vnState.queue = [];
      vnState.idx = -1;
      vnStreamStarted = false;
      vnNarrationStreaming = false;
      vnNarrationIdx = -1;
      clearInterval(typewriterTimer);
      if (textEl) textEl.innerHTML = `<div class="vn-streaming-hint"><div class="spinner"></div><span id="vnStageMsg">重试中...</span></div>`;
      if (hintEl) hintEl.style.display = 'none';
      break;

    case 'meta':
      vnState.meta = evt.scene_meta || {};
      vnState.sessionState = evt.session_state || '';
      vnState.progress = evt.progress || 0;
      // 优先使用剧本选项
      if (evt.available_choices && evt.available_choices.length > 0) {
        vnState.choices = evt.available_choices;
      }
      // 更新场景信息
      const infoEl = document.getElementById('vnSceneInfo');
      const m = vnState.meta;
      if (infoEl) infoEl.textContent = `${m.scene_name || ''} ${m.location ? '· ' + m.location : ''} （场景 ${m.scene_index||'?'}/${m.total_scenes||'?'}）`;
      const bar = document.getElementById('vnProgress');
      if (bar) bar.style.width = `${(vnState.progress || 0) * 100}%`;
      // 应用预生成的场景背景图
      vnApplyBackground(m);
      break;

    case 'done':
      vnStreamDone = true;
      vnRefreshHint();
      break;

    case 'error':
      vnStreamDone = true;
      if (textEl) textEl.innerHTML = `<span style="color:var(--danger)">${evt.message}</span>`;
      if (hintEl) { hintEl.style.display = 'block'; hintEl.textContent = '点击返回'; }
      document.getElementById('vnDialogueBox').onclick = () => showHomeScreen();
      break;
  }
}

function vnTryStartDisplay() {
  // 如果还没开始显示，且队列有内容，开始显示第一条
  if (!vnStreamStarted && vnState.queue.length > 0) {
    vnStreamStarted = true;
    // 清除加载提示
    const speakerEl = document.getElementById('vnSpeaker');
    if (speakerEl) speakerEl.innerHTML = '';
    vnShowLine(0);
  }
}

// ─── 非流式兼容（保留原有 renderScene） ───
function renderScene(data, state) {
  const meta = data.scene_meta || {};
  const dialogues = data.data?.dialogues || [];
  const narration = data.data?.narration || '';
  const aiChoices = data.data?.nextChoices || [];

  const queue = [];
  if (narration) queue.push({ type: 'narration', speaker: '', text: narration, emotion: '' });
  dialogues.forEach(d => queue.push({ type: 'dialogue', speaker: d.speaker, text: d.text, emotion: d.emotion || '' }));
  if (queue.length === 0) queue.push({ type: 'narration', speaker: '', text: '……', emotion: '' });

  vnState = { queue, idx: 0, charPositions: {}, choices, sessionState: data.session_state, meta, progress };
  vnStreamDone = true;
  vnStreamStarted = true;
  vnPopupActive = false;
  clearInterval(vnPopupTypewriterTimer);
  vnResetSprites();

  app.innerHTML = `
    <div class="vn-stage" id="vnStage">
      <div class="vn-progress" id="vnProgress" style="width:${progress*100}%"></div>
      <div class="vn-bg" id="vnBg"></div>
      <div class="vn-scene-info">${meta.scene_name || ''} ${meta.location ? '· ' + meta.location : ''} （场景 ${meta.scene_index||'?'}/${meta.total_scenes||'?'}）</div>
      <div class="vn-top-bar">
        <button id="vnAutoBtn">自动</button>
        <button id="vnHistBtn">历史</button>
        <button id="vnHomeBtn">退出</button>
      </div>
      <div class="vn-sprites" id="vnSprites"></div>
      <div class="vn-dialogue-box" id="vnDialogueBox">
        <div id="vnSpeaker"></div>
        <div class="vn-text" id="vnText"></div>
        <div class="vn-emotion" id="vnEmotion"></div>
        <div class="vn-advance-hint" id="vnHint">点击继续 ▶</div>
      </div>
      <div class="vn-choices-overlay" id="vnChoices" style="display:none"></div>
      <div class="vn-narration-popup" id="vnNarrationPopup" style="display:none">
        <div class="vn-narration-card">
          <div class="vn-narration-text" id="vnNarrationText"></div>
          <div class="vn-narration-hint" id="vnPopupHint">点击继续 ▶</div>
        </div>
      </div>
    </div>
    <div class="history-panel" id="historyPanel" style="position:fixed;top:60px;right:16px;z-index:1100;width:min(420px,86vw)"></div>`;

  vnApplyBackground(meta);
  vnShowLine(0);
  document.getElementById('vnDialogueBox').addEventListener('click', vnAdvance);
  document.addEventListener('keydown', vnKeyHandler);
  document.getElementById('vnHistBtn').addEventListener('click', toggleHistory);
  document.getElementById('vnAutoBtn').addEventListener('click', vnToggleAutoPlay);
  vnSyncAutoBtn();
  document.getElementById('vnHomeBtn').addEventListener('click', () => {
    document.removeEventListener('keydown', vnKeyHandler);
    showHomeScreen();
  });
}

function vnKeyHandler(e) {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); vnAdvance(); }
}

// ─── 打字机效果 ───
function vnShowLine(idx) {
  const { queue } = vnState;
  if (idx >= queue.length) {
    if (vnIsEnding) { vnShowEndingFinal(); return; }
    if (vnStreamDone) vnShowChoices();
    else vnShowWaiting();
    return;
  }
  vnState.idx = idx;
  const line = queue[idx];

  // 场景开头第一条旁白 → 居中卡片弹窗展示（后续对话仍走底部对话框）
  if (idx === 0 && line.type === 'narration' && document.getElementById('vnNarrationPopup')) {
    vnShowNarrationPopup(line);
    return;
  }

  const speakerEl = document.getElementById('vnSpeaker');
  const textEl = document.getElementById('vnText');
  const emotionEl = document.getElementById('vnEmotion');
  const hintEl = document.getElementById('vnHint');

  if (line.type === 'narration') {
    speakerEl.innerHTML = '<span class="vn-speaker-name narrator">旁白</span>';
    document.querySelectorAll('.vn-sprite').forEach(s => { s.classList.add('dimmed'); s.classList.remove('active'); });
  } else if (line.type === 'action') {
    // 角色动作/神态/心理旁白：旁白形式 + 〔角色名〕前缀 + 斜体弱化
    const who = line.speaker ? `〔${line.speaker}〕` : '旁白';
    speakerEl.innerHTML = `<span class="vn-speaker-name narrator action">${who}</span>`;
    document.querySelectorAll('.vn-sprite').forEach(s => { s.classList.add('dimmed'); s.classList.remove('active'); });
  } else {
    speakerEl.innerHTML = `<span class="vn-speaker-name">${line.speaker}</span>`;
    vnSyncSprites(line.speaker);
  }
  // 斜体弱化样式仅用于动作旁白
  textEl.classList.toggle('vn-action-text', line.type === 'action');

  emotionEl.textContent = line.emotion ? `〔${line.emotion}〕` : '';
  if (hintEl) { hintEl.style.display = 'block'; hintEl.textContent = '点击继续 ▶'; hintEl.classList.remove('waiting'); }

  // 打字机效果（支持流式旁白：文本边生成边显示，追赶上则等待）
  typewriterDone = false;
  let charIdx = 0;
  textEl.textContent = '';
  clearInterval(typewriterTimer);
  typewriterTimer = setInterval(() => {
    const fullText = line.text; // 流式项的 text 会随 delta 增长
    charIdx += 2;
    if (charIdx > fullText.length) charIdx = fullText.length;
    textEl.textContent = fullText.slice(0, charIdx);
    // 自动滚动到底部，保证最新文字可见
    textEl.scrollTop = textEl.scrollHeight;
    if (charIdx >= fullText.length) {
      if (line.streaming) {
        // 已追赶上但仍在流式生成 → 保持等待，不结束
        return;
      }
      clearInterval(typewriterTimer);
      textEl.textContent = fullText;
      typewriterDone = true;
      vnRefreshHint();
    }
  }, 30);
}

function vnShowWaiting() {
  // 用户已看完当前队列但流未结束
  const textEl = document.getElementById('vnText');
  const hintEl = document.getElementById('vnHint');
  if (textEl) textEl.innerHTML = `<div class="vn-streaming-hint"><div class="spinner"></div><span>后续内容生成中...</span></div>`;
  if (hintEl) hintEl.style.display = 'none';
}

// 章节开头旁白居中卡片弹窗（流式打字机；点击/键盘经 vnAdvance 统一推进）
function vnShowNarrationPopup(line) {
  vnPopupActive = true;
  vnPopupTypewriterDone = false;
  const popup = document.getElementById('vnNarrationPopup');
  const textEl = document.getElementById('vnNarrationText');
  if (!popup || !textEl) { vnPopupActive = false; return; }
  popup.style.display = 'flex';
  popup.onclick = vnAdvance;
  // 弹窗显示时隐藏底部对话框提示，避免两个“点击继续”
  const boxHint = document.getElementById('vnHint');
  if (boxHint) boxHint.style.display = 'none';

  let charIdx = 0;
  textEl.textContent = '';
  clearInterval(vnPopupTypewriterTimer);
  vnPopupTypewriterTimer = setInterval(() => {
    const fullText = line.text; // 流式旁白 text 随 delta 增长
    charIdx += 2;
    if (charIdx > fullText.length) charIdx = fullText.length;
    textEl.textContent = fullText.slice(0, charIdx);
    textEl.scrollTop = textEl.scrollHeight; // 长旁白打字机自动滚到最新
    if (charIdx >= fullText.length) {
      if (line.streaming) return; // 追赶上但仍在流式生成 → 等待
      clearInterval(vnPopupTypewriterTimer);
      textEl.textContent = fullText;
      vnPopupTypewriterDone = true;
      vnRefreshHint();
    }
  }, 30);
  vnRefreshHint();
}

// 刷新推进提示：打字机已完成且到队列末尾且流未结束 → “后续内容生成中…”；否则 “点击继续 ▶”
function vnRefreshHint() {
  const twDone = vnPopupActive ? vnPopupTypewriterDone : typewriterDone;
  const waiting = twDone && !vnStreamDone && vnState.idx >= vnState.queue.length - 1;
  const hintId = vnPopupActive ? 'vnPopupHint' : 'vnHint';
  const h = document.getElementById(hintId);
  if (h) { h.textContent = waiting ? '后续内容生成中…' : '点击继续 ▶'; h.classList.toggle('waiting', waiting); }
  vnScheduleAutoAdvance();
}

// ─── 自动播放 ───
function vnSyncAutoBtn() {
  const btn = document.getElementById('vnAutoBtn');
  if (btn) { btn.textContent = vnAutoPlay ? '自动:开' : '自动'; btn.classList.toggle('active', vnAutoPlay); }
}
function vnToggleAutoPlay() {
  vnAutoPlay = !vnAutoPlay;
  vnSyncAutoBtn();
  if (vnAutoPlay) vnScheduleAutoAdvance();
  else clearTimeout(vnAutoPlayTimer);
}
// 打字机完成后按文本长度延时自动推进（vnAdvance 已处理弹窗/等待生成/选项等边界）
function vnScheduleAutoAdvance() {
  clearTimeout(vnAutoPlayTimer);
  if (!vnAutoPlay) return;
  const twDone = vnPopupActive ? vnPopupTypewriterDone : typewriterDone;
  if (!twDone) return; // 打字机未完成不自动推进
  const { idx, queue } = vnState;
  if (idx >= queue.length - 1 && !vnStreamDone) return; // 等待后续生成，不空转
  const len = (queue[idx] && queue[idx].text) ? queue[idx].text.length : 0;
  const delay = Math.min(6000, 700 + len * 45); // 按阅读速度估算停留
  vnAutoPlayTimer = setTimeout(() => vnAdvance(), delay);
}

function vnAdvance() {
  clearTimeout(vnAutoPlayTimer); // 手动推进时取消待定的自动推进
  // 结局全屏滚动叙事模式：从顶部向下打字机生成
  if (vnEndingScrollActive) {
    if (!vnEndingScrollDone) {
      // 未完成 → 跳过打字机，立即显示全文并滚到底部
      clearInterval(vnEndingScrollTimer);
      const textEl = document.getElementById('vnEndingScrollText');
      const scroll = document.getElementById('vnEndingScroll');
      if (textEl) textEl.textContent = vnState.queue.map(l => l.text).join('\n\n');
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
      vnEndingScrollDone = true;
      return;
    }
    // 已完成 → 关闭滚动叙事，展示结局卡片
    const scroll = document.getElementById('vnEndingScroll');
    if (scroll) scroll.style.display = 'none';
    vnEndingScrollActive = false;
    vnShowEndingFinal();
    return;
  }
  // 弹窗模式：章节开头旁白弹窗的推进
  if (vnPopupActive) {
    const line = vnState.queue[vnState.idx];
    if (!vnPopupTypewriterDone) {
      clearInterval(vnPopupTypewriterTimer);
      const ptEl = document.getElementById('vnNarrationText');
      if (ptEl && line) { ptEl.textContent = line.text; ptEl.scrollTop = 0; }
      if (line) line.streaming = false;
      vnPopupTypewriterDone = true;
      vnRefreshHint();
      return;
    }
    // 关闭弹窗，推进到下一条
    const popup = document.getElementById('vnNarrationPopup');
    if (popup) popup.style.display = 'none';
    vnPopupActive = false;
    const { idx, queue } = vnState;
    if (idx < queue.length - 1) vnShowLine(idx + 1);
    else if (vnStreamDone) vnShowChoices();
    else vnShowWaiting();
    return;
  }
  // 打字机未完成 → 跳过，立即显示全文
  if (!typewriterDone) {
    clearInterval(typewriterTimer);
    const textEl = document.getElementById('vnText');
    const line = vnState.queue[vnState.idx];
    if (textEl && line) {
      textEl.textContent = line.text;
      textEl.scrollTop = textEl.scrollHeight;
    }
    if (line) line.streaming = false; // 用户跳过：不再等待流式增量
    typewriterDone = true;
    return;
  }
  // 流未结束且已看完队列 → 不操作
  if (!vnStreamDone && vnState.idx >= vnState.queue.length - 1) return;
  // 推进到下一条
  const { idx, queue } = vnState;
  if (idx < queue.length - 1) {
    vnShowLine(idx + 1);
  } else if (vnStreamDone) {
    if (vnIsEnding) { vnShowEndingFinal(); return; }
    vnShowChoices();
  }
}

function vnShowChoices() {
  const { choices, sessionState } = vnState;
  const box = document.getElementById('vnDialogueBox');
  const overlay = document.getElementById('vnChoices');
  document.removeEventListener('keydown', vnKeyHandler);

  if (sessionState === 'generated' && choices.length > 0 && chosenIndex < 0) {
    // 显示选择项覆盖层
    box.style.opacity = '0';
    box.style.pointerEvents = 'none';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div class="choices-label">做出你的选择</div>
      ${choices.map((c, i) => `<button class="choice-btn" data-idx="${i}">
        <div>${c.text}</div><div class="effect">${c.effect || c.description || ''}</div></button>`).join('')}`;
    overlay.addEventListener('click', e => {
      const btn = e.target.closest('.choice-btn');
      if (!btn) return;
      const idx = parseInt(btn.dataset.idx);
      const text = choices[idx]?.text || '';
      overlay.querySelectorAll('.choice-btn').forEach((b, i) => {
        if (i === idx) b.classList.add('selected');
        b.style.pointerEvents = 'none';
      });
      makeChoice(idx, text);
    });
  } else if (chosenIndex >= 0) {
    // 已选择，显示继续按钮
    box.style.opacity = '0';
    box.style.pointerEvents = 'none';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div class="waiting-msg" style="margin-bottom:16px">选择已确认</div>
      <button class="btn btn-primary" id="vnNextBtn">继续下一段 →</button>`;
    document.getElementById('vnNextBtn').addEventListener('click', () => {
      document.removeEventListener('keydown', vnKeyHandler);
      generateSceneStream();
    });
  } else {
    // 无选择项，直接显示继续
    box.style.opacity = '0';
    box.style.pointerEvents = 'none';
    overlay.style.display = 'flex';
    overlay.innerHTML = `<button class="btn btn-primary" id="vnNextBtn2">继续下一段 →</button>`;
    document.getElementById('vnNextBtn2').addEventListener('click', () => {
      document.removeEventListener('keydown', vnKeyHandler);
      generateSceneStream();
    });
  }
}

async function makeChoice(index, text) {
  if (chosenIndex >= 0) return;
  chosenIndex = index;
  document.querySelectorAll('.choice-btn').forEach((btn,i) => {
    if(i===index) btn.classList.add('selected');
    btn.style.pointerEvents = 'none';
  });
  try {
    const res = await api(`/api/session/${sessionId}/choose`, {
      method:'POST', body: JSON.stringify({choice_text:text, choice_index:index})
    });
    if (res.session_state === 'finished') {
      setTimeout(() => renderEnd(res), 500);
    } else {
      // 选择后立即流式生成下一场景
      chosenIndex = -1;
      await generateSceneStream();
    }
  } catch(e) { alert('Error: '+e.message); chosenIndex = -1; }
}

function renderEnd(state) {
  document.removeEventListener('keydown', vnKeyHandler);
  clearInterval(typewriterTimer);
  const ending = state.ending || {};
  const matched = ending.matched_ending || {};
  const typeLabel = {bad: '💔 坏结局', normal: '🌗 普通结局', good: '🌟 好结局', true: '✨ 真结局'};
  const typeColor = {bad: '#ef4444', normal: '#f59e0b', good: '#22c55e', true: '#8b5cf6'};
  const eType = matched.type || '';
  const eColor = typeColor[eType] || '#8b5cf6';

  // 结局叙事队列：结局正文 + 尾声（以旁白形式逐条打字机展示）
  const endQueue = [];
  if (matched.narrative) endQueue.push({ type: 'narration', speaker: '', text: matched.narrative, emotion: '', streaming: false });
  if (matched.epilogue) endQueue.push({ type: 'narration', speaker: '', text: '【尾声】\n' + matched.epilogue, emotion: '', streaming: false });
  if (endQueue.length === 0) endQueue.push({ type: 'narration', speaker: '', text: '你已走完这条世界线的全部场景。', emotion: '', streaming: false });

  vnIsEnding = true;
  vnEndingData = { matched, eType, eColor, typeLabel };
  chosenIndex = -1;
  vnState = { queue: endQueue, idx: -1, charPositions: {}, choices: [], sessionState: 'finished', meta: {}, progress: 1 };
  vnStreamDone = true;
  vnStreamStarted = true;
  typewriterDone = true;
  vnResetSprites();

  app.innerHTML = `
    <div class="vn-stage" id="vnStage">
      <div class="vn-progress" id="vnProgress" style="width:100%"></div>
      <div class="vn-bg" id="vnBg" style="background:#191026"></div>
      <div class="vn-scene-info">故事结束</div>
      <div class="vn-top-bar"><button id="vnHomeBtn">退出</button></div>
      <div class="vn-sprites" id="vnSprites"></div>
      <div class="vn-dialogue-box" id="vnDialogueBox" style="opacity:0;pointer-events:none">
        <div id="vnSpeaker"></div>
        <div class="vn-text" id="vnText"></div>
        <div class="vn-emotion" id="vnEmotion"></div>
        <div class="vn-advance-hint" id="vnHint" style="display:none">点击继续 ▶</div>
      </div>
      <div class="vn-ending-scroll" id="vnEndingScroll" style="display:none">
        <div class="vn-ending-scroll-text" id="vnEndingScrollText"></div>
        <div class="vn-ending-scroll-hint" id="vnEndingScrollHint">点击继续 ▶</div>
      </div>
      <div class="vn-ending-overlay" id="vnEndingOverlay">
        <div class="ending-type" style="color:${eColor};border-color:${eColor}">${typeLabel[eType] || '结局'}</div>
        <div class="ending-title">${matched.title || '故事结束'}</div>
        <div class="ending-hint">点击继续</div>
      </div>
      <div class="vn-choices-overlay" id="vnChoices" style="display:none"></div>
    </div>`;

  // 标题卡点击 → 淡出并开始结局全屏滚动叙事（正文+尾声从顶部向下打字机生成）
  document.getElementById('vnEndingOverlay').addEventListener('click', () => {
    const ov = document.getElementById('vnEndingOverlay');
    ov.style.opacity = '0';
    setTimeout(() => { ov.style.display = 'none'; }, 500);
    document.addEventListener('keydown', vnKeyHandler);
    vnStartEndingScroll();
  });
  document.getElementById('vnHomeBtn').addEventListener('click', () => {
    document.removeEventListener('keydown', vnKeyHandler);
    vnIsEnding = false;
    showHomeScreen();
  });
}

// 结局全屏顶端向下滚动叙事：正文+尾声合并为一段，从顶部打字机逐字生成并自动向下滚动
function vnStartEndingScroll() {
  vnEndingScrollActive = true;
  vnEndingScrollDone = false;
  const scroll = document.getElementById('vnEndingScroll');
  const textEl = document.getElementById('vnEndingScrollText');
  const hint = document.getElementById('vnEndingScrollHint');
  if (!scroll || !textEl) { vnEndingScrollActive = false; vnShowEndingFinal(); return; }
  // 合并结局叙事队列（正文 + 尾声），段落间空行分隔
  const fullText = vnState.queue.map(l => l.text).join('\n\n');
  scroll.style.display = 'block';
  scroll.scrollTop = 0;
  scroll.onclick = vnAdvance;
  if (hint) { hint.textContent = '点击继续 ▶'; hint.classList.remove('waiting'); }
  let charIdx = 0;
  textEl.textContent = '';
  clearInterval(vnEndingScrollTimer);
  vnEndingScrollTimer = setInterval(() => {
    charIdx += 2;
    if (charIdx > fullText.length) charIdx = fullText.length;
    textEl.textContent = fullText.slice(0, charIdx);
    scroll.scrollTop = scroll.scrollHeight; // 自动向下滚动跟随最新文字
    if (charIdx >= fullText.length) {
      clearInterval(vnEndingScrollTimer);
      vnEndingScrollDone = true;
    }
  }, 30);
}

function vnShowEndingFinal() {
  // 结局叙事播完 → 展示结局卡片 + 返回首页
  const { matched, eColor, typeLabel, eType } = vnEndingData || {};
  const box = document.getElementById('vnDialogueBox');
  const overlay = document.getElementById('vnChoices');
  document.removeEventListener('keydown', vnKeyHandler);
  if (box) { box.style.opacity = '0'; box.style.pointerEvents = 'none'; }
  if (overlay) {
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div class="ending-final-card" style="border-color:${eColor}">
        <div class="ending-type" style="color:${eColor};border-color:${eColor}">${(typeLabel && typeLabel[eType]) || '结局'}</div>
        <div class="ending-title-sm">${(matched && matched.title) || '故事结束'}</div>
        ${matched && matched.replay_value ? `<div class="ending-replay">💭 ${matched.replay_value}</div>` : ''}
      </div>
      <button class="btn btn-primary" id="endHomeBtn" style="margin-top:8px">返回首页</button>`;
    document.getElementById('endHomeBtn').addEventListener('click', () => {
      vnIsEnding = false;
      showHomeScreen();
    });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadHistory() {
  const p = document.getElementById('historyPanel');
  if(!p) return;
  try {
    const d = await api(`/api/session/${sessionId}/history`);
    const list = d.history || [];
    if (!list.length) { p.innerHTML = '<p style="color:var(--muted)">暂无历史</p>'; return; }
    p.innerHTML = list.map((h, i) => {
      const narr = h.narration ? `<div class="history-narration">${escapeHtml(h.narration)}</div>` : '';
      const dlg = (h.dialogues || []).map(x =>
        `<div class="history-dialogue"><span class="history-speaker">${escapeHtml(x.speaker || '')}</span>${escapeHtml(x.text || '')}</div>`
      ).join('');
      return `<div class="history-entry">
        <div class="history-scene">场景 ${i+1}: ${escapeHtml(h.scene_name || '')}</div>
        ${narr}${dlg}
        <div class="history-choice">▸ 选择: ${escapeHtml(h.player_choice || '')}</div>
      </div>`;
    }).join('');
  } catch(e) { p.innerHTML = e.message; }
}

function toggleHistory() {
  const p = document.getElementById('historyPanel');
  if(p){p.classList.toggle('show'); if(p.classList.contains('show')) loadHistory();}
}

async function api(path, opts={}) {
  const res = await fetch(API+path, {headers:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${res.status}`);}
  return res.json();
}

showHomeScreen();
</script>
