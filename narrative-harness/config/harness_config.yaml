# Harness 运行参数配置
# 控制 Pipeline 各阶段的行为参数

harness:
  version: "1.0.0"
  name: "Narrative Generation Harness"

  # LLM 配置
  llm:
    # DeepSeek API（OpenAI 兼容格式）
    apiBase: "https://api.deepseek.com"
    model: "deepseek-chat"
    temperature: 0.8
    maxTokens: 2000
    timeout: 30000  # 毫秒

  # Pipeline 阶段配置
  stages:
    contextAssembly:
      # Stage 1 无 LLM 调用，纯数据处理
      enabled: true

    narrativeAnchoring:
      enabled: true
      promptTemplate: "prompts/scene_assembly.md"
      narrationLength:
        short: [50, 150]    # 字数范围
        medium: [100, 300]
        long: [200, 500]

    dialogueGeneration:
      enabled: true
      promptTemplate: "prompts/dialogue_generation.md"
      dialogueCount:
        min: 3
        max: 6
        default: 4

    choiceBranching:
      enabled: true
      promptTemplate: "prompts/choice_branching.md"
      choiceCount:
        min: 2
        max: 4
        default: 3

    validationGate:
      enabled: true
      maxRetries: 2
      # 验证阈值
      thresholds:
        personalityMatchScore: 0.7  # 性格匹配度最低分
        worldlineAdherenceScore: 0.8  # 主线符合度最低分

  # 续写配置
  continuation:
    maxHistoryRounds: 3  # 最多携带最近 N 轮历史上下文
    contextWindowStrategy: "sliding"  # sliding | summary

  # 日志
  logging:
    level: "info"  # debug | info | warn | error
    logPrompts: true  # 是否记录完整 prompt
    logResponses: true
