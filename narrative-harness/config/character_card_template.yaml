# 角色卡模板
# 用于标准化定义故事角色
# 使用方法：复制此模板，填入具体角色信息

characters:
  - name: "角色姓名"
    role: "身份/职业"
    personality: "性格关键词（2-4个，逗号分隔）"
    speakingStyle: "说话风格描述"
    background: |
      背景故事摘要（2-3句话）
    relationships:
      - target: "其他角色姓名"
        type: "关系类型（盟友/对手/师徒/恋人等）"
        description: "关系描述"
    speechExamples:
      - "示例对话1：展示角色说话风格"
      - "示例对话2：展示角色在压力下的反应"

# ============================================================
# 性格标签参考库（可复用）
# ============================================================
# 冷静理性型：逻辑优先，用数据说话，句式精准，不情绪化
# 果断务实型：决策快，短句，命令式，重结果轻过程
# 热血冲动型：行动先于思考，语气激烈，重感情
# 温柔体贴型：关注他人，说话委婉，善于调和
# 阴险狡诈型：话中有话，善于操纵，表面礼貌
# 幽默风趣型：善于缓解气氛，常用比喻和玩笑
# 沉默寡言型：话少但精准，行动代替言语
# 学究型：喜欢长篇大论，引经据典，容易跑题
# ============================================================
